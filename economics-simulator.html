   The accepted composition (pin c8c4dd89…, lean/Reactivegas/Composition.lean)
   classifies every economic constructor by its actual producer:
   electResponsabile / removeResponsabile / removeMember are BASE-ENACTED —
   produced by the faithful KelGroups proposal machine (propose/approve →
   Enactment at the (n+1)/2 majority of the pre-state) — while grant/deny/
   backdonate are APP-DECIDED by the required Vote machine above. Evidence
   for a base-enacted economic event is a real Enactment whose pending
   proposal is in the FAITHFUL vocabulary (changeRoles, removeMember;
   introduceMember is excluded by construction: addUser stays direct and no
   voted-admission path exists). The two evidence forms share no premise,
   and the bridge from either channel into the economic machine remains the
   local unproved join ('join-vote-econ'). α (the app fold) is fixed to a
   unit: the toy sends no app events on this channel. */

/* @@CORE:base-a@@ */
const bgEmpty = () => ({ members: [], pendingProposals: [] });
/* @@CORE:base-a:END@@ */
let bg = bgEmpty();
let bgSteps = [];        // kelgroups-base.trace applied steps of the live session
let bgCredits = [];      // faithful enactments not yet consumed by the bridge

/* @@CORE:base-b@@ */
/* State.lean (merged): counts, majority, membership */
const bgAdminCount = gs => gs.members.reduce((n, [, m]) => n + (vtHasAdmin(m.roles) ? 1 : 0), 0);
const bgMajority = gs => Math.floor((bgAdminCount(gs) + 1) / 2);   // KelGroups.majority
const bgIsAdmin = (k, gs) => { const m = vtLookup(k, gs.members); return !!m && vtHasAdmin(m.roles); };
const bgIsMember = (k, gs) => vtLookup(k, gs.members) !== null;
const bgBootstrap = gs => bgAdminCount(gs) === 0;                  // authMode = .bootstrap

/* a Proposal is exactly one of the three Lean constructors */
const bgPropKind = p => 'introduceMember' in p ? 'introduceMember'
  : ('removeMember' in p ? 'removeMember' : 'changeRoles');

/* Composition.baseProposalFaithful (at the pin): only changeRoles and
   removeMember enactments carry base-enacted economic evidence */
const bgProposalFaithful = p => bgPropKind(p) !== 'introduceMember';

/* digest is a machine PARAMETER (Proposal → ProposalId); the toy picks a
   readable deterministic digest. Re-proposing the same digest replaces the
   pending entry (assocInsert), exactly as Fold.lean does. */
const bgDigest = p => {
  const k = bgPropKind(p);
  if (k === 'introduceMember') return 'entra:' + p.introduceMember.key;
  if (k === 'removeMember') return 'esce:' + p.removeMember.key;
  return 'ruoli:' + p.changeRoles.key + ':' +
    (p.changeRoles.roles.some(r => 'adminRole' in r) ? 'admin' : 'app');
};

/* KelGroups.enact */
const bgEnact = (gs, p) => {
  const k = bgPropKind(p);
  if (k === 'introduceMember') {
    const { key, email, roles } = p.introduceMember;
    return { ...gs, members: vtInsert(key, { key, email, roles }, gs.members) };
  }
  if (k === 'removeMember')
    return { ...gs, members: vtErase(p.removeMember.key, gs.members) };
  const { key, roles } = p.changeRoles;
  return { ...gs, members: vtAdjust(key, m => ({ ...m, roles }), gs.members) };
};

/* KelGroups.tryEnactDetailed: majority is read on the state that already
   contains the pending proposal, members unchanged by the pending entry */
function bgTryEnactDetailed(gs, pid) {
  const pending = vtLookup(pid, gs.pendingProposals);
  if (!pending) return { state: gs, enactment: null };
  if (pending.approvals.length >= bgMajority(gs)) {
    const enacted = bgEnact(gs, pending.proposal);
    return {
      state: { ...enacted, pendingProposals: vtErase(pid, enacted.pendingProposals) },
      enactment: { proposalId: pid, pending, preState: gs },
    };
  }
  return { state: gs, enactment: null };
}

/* KelGroups.applyEventDetailed, base events only (the toy's α is unit):
   propose inserts the pending with the proposer already approving and tries
   the enactment at once; approve setInserts and tries again */
function bgApply(gs, signer, ev) {
  if ('propose' in ev) {
    const pid = bgDigest(ev.propose.proposal);
    const pending = { proposal: ev.propose.proposal, proposer: signer, approvals: [signer] };
    const proposed = { ...gs, pendingProposals: vtInsert(pid, pending, gs.pendingProposals) };
    return bgTryEnactDetailed(proposed, pid);
  }
  const pid = ev.approve.proposalId;
  const pending = vtLookup(pid, gs.pendingProposals);
  if (!pending) return { state: gs, enactment: null };
  const approved = { ...pending, approvals: vtSetInsert(signer, pending.approvals) };
  const updated = { ...gs, pendingProposals: vtInsert(pid, approved, gs.pendingProposals) };
  return bgTryEnactDetailed(updated, pid);
}

/* KelGroups.validateEvent (base), with the toy's parameters: validKey = ⊤
   and an empty GroupConfig (no app-role preconditions, so the changeRoles
   role checks are vacuously ok — exactly the Lean code with roleDefs []).
   Returns null or the Lean ValidationError constructor name. */
function bgValidate(gs, signer, ev) {
  if ('propose' in ev) {
    const p = ev.propose.proposal;
    if (bgBootstrap(gs)) {
      if (bgPropKind(p) === 'introduceMember')
        return p.introduceMember.roles.some(r => 'adminRole' in r) ? null : 'bootstrapRequiresAdmin';
      return 'bootstrapRequiresAdmin';
    }
    if (!bgIsAdmin(signer, gs)) return 'notAnAdmin';
    const k = bgPropKind(p);
    if (k === 'introduceMember')
      return bgIsMember(p.introduceMember.key, gs) ? 'memberAlreadyExists' : null;
    if (k === 'removeMember')
      return bgIsMember(p.removeMember.key, gs) ? null : 'memberNotFound';
    return bgIsMember(p.changeRoles.key, gs) ? null : 'memberNotFound';
  }
  if (!bgIsAdmin(signer, gs)) return 'notAnAdmin';
  const pending = vtLookup(ev.approve.proposalId, gs.pendingProposals);
  if (!pending) return 'proposalNotFound';
  return pending.approvals.includes(signer) ? 'alreadyApproved' : null;
}

const bgCanonProposal = p => {
  const k = bgPropKind(p);
  if (k === 'introduceMember') return { introduceMember: {
    key: p.introduceMember.key, email: p.introduceMember.email,
    roles: p.introduceMember.roles.map(vtCanonRole) } };
  if (k === 'removeMember') return { removeMember: { key: p.removeMember.key } };
  return { changeRoles: { key: p.changeRoles.key,
    roles: p.changeRoles.roles.map(vtCanonRole) } };
};
const canonBaseState = gs => JSON.stringify({
  members: gs.members.map(([k, m]) => [k,
    { key: m.key, email: m.email, roles: m.roles.map(vtCanonRole) }]),
  pendingProposals: gs.pendingProposals.map(([pid, pp]) => [pid,
    { proposal: bgCanonProposal(pp.proposal), proposer: pp.proposer,
      approvals: pp.approvals.slice() }]) });

/* Crude-drift net for the base channel: approvals_nodup and
   proposer_mem_approvals, transcribed and asserted after every applied
   event. A violation means this transcription diverged from Fold.lean. */
/* @@CORE:base-b:END@@ */
let bgLawBreaches = [];
/* @@CORE:base-c@@ */
function bgLawViolations(gs) {
  const out = [];
  for (const [pid, pp] of gs.pendingProposals) {
    if (new Set(pp.approvals).size !== pp.approvals.length)
      out.push(`approvals_nodup: «${pid}»`);
    if (!pp.approvals.includes(pp.proposer))
      out.push(`proposer_mem_approvals: «${pid}»`);
  }
  return out;
}

/* v1 consumer for the base stream (local schema kelgroups-base.trace):
   replay + verify each stored step against this transcription. */
function verifyBaseTraceV1(env, opts) {
  opts = opts || {};
  const fail = m => { throw new Error('base: ' + m); };
  if (!env || typeof env !== 'object') fail('non è un oggetto');
  if (env.schema !== 'kelgroups-base.trace') fail('schema sconosciuto');
  if (env.version !== 1) fail('versione non supportata');
  if (!env.initial || !Array.isArray(env.steps)) fail('forma non valida');
  let s = env.initial;
  if (canonBaseState(s) !== canonBaseState(bgEmpty()))
    fail('stato iniziale non vuoto');
  const states = [JSON.parse(canonBaseState(s))];
  env.steps.forEach((st, i) => {
    if (!st || !st.input || !st.event || !st.result || !st.signer)
      fail(`passo ${i}: forma non valida`);
    if (canonBaseState(st.input) !== canonBaseState(s))
      fail(`passo ${i}: input discontinuo`);
    const verr = bgValidate(s, st.signer, st.event);
    if (st.result.tag === 'applied') {
      if (verr) fail(`passo ${i}: registrato applicato, la validazione rifiuta (${verr})`);
      const det = bgApply(s, st.signer, st.event);
      if (canonBaseState(det.state) !== canonBaseState(st.result.state))
        fail(`passo ${i}: post-stato divergente`);
      if (!!st.result.enacted !== !!det.enactment)
        fail(`passo ${i}: presenza enactment divergente`);
      s = det.state;
    } else if (st.result.tag === 'refused') {
      if (opts.appliedOnly) fail(`passo ${i}: rifiuto in un log di sessione`);
      if (!verr) fail(`passo ${i}: registrato rifiutato, la validazione applica`);
      if (st.result.error !== verr)
        fail(`passo ${i}: errore divergente — atteso=${st.result.error} osservato=${verr}`);
    } else fail(`passo ${i}: result.tag sconosciuto`);
    states.push(JSON.parse(canonBaseState(s)));
  });
  return { steps: env.steps.length, states };
}

/* --- Composition routing (accepted pin) -----------------------------------
   The 18-constructor route table of Composition.lean at the accepted pin.
   The committed claim gate re-derives this table by parsing the pinned
   source fresh on every run and REDs on any divergence (route-list drift),
   so this literal cannot silently drift from the accepted classifier.
   removeMember remains unexecuted (retired-by-#62 / R62-08). */
const EVENT_ROUTES = {
  addUser: 'direct', electResponsabile: 'baseEnacted',
  removeResponsabile: 'baseEnacted', removeMember: 'baseEnacted',
  openPurchase: 'direct', grantPermission: 'appDecided',
  denyPermission: 'appDecided', deposit: 'direct', withdraw: 'direct',
  transferCassa: 'direct', donate: 'direct', backdonate: 'appDecided',
  pledge: 'direct', acceptPledge: 'direct', refusePledge: 'direct',
  correctPledge: 'direct', closePurchase: 'direct', failPurchase: 'direct',
};

/* Temporary dated exemption: #62 / R62-08 will delete these four Event
   constructors. Coverage subtracts exactly these keys and must not treat
   the exemption as permission to implement them now. */
const EVENT_RETIREMENTS = {
  addUser: { status: 'retired-by-#62', issue: '#62',
    requirement: 'R62-08', declared: '2026-08-30' },
  electResponsabile: { status: 'retired-by-#62', issue: '#62',
    requirement: 'R62-08', declared: '2026-08-30' },
  removeMember: { status: 'retired-by-#62', issue: '#62',
    requirement: 'R62-08', declared: '2026-08-30' },
  removeResponsabile: { status: 'retired-by-#62', issue: '#62',
    requirement: 'R62-08', declared: '2026-08-30' },
};

const voteDerivedTag = tag => EVENT_ROUTES[tag] !== undefined && EVENT_ROUTES[tag] !== 'direct';

/* --- Governance credits: the model-level rejection ------------------------
   A vote-derived economic event is applied ONLY against route-appropriate
   evidence: a faithful base Enactment (baseEnacted) or a closed vote
   verdict (appDecided). Base credits are consumable exactly once; app
   evidence is the closure record itself (a question id can close at most
   once, so existence is exactly-once by construction). Without evidence the
   toy REFUSES the event before the machine ever sees it — electing four
   responsabili without one vote is no longer expressible. */

/* the economic event a faithful enactment authorizes, or null */
function bgCreditOf(enactment) {
  const p = enactment.pending.proposal;
  if (!bgProposalFaithful(p)) return null;
  if (bgPropKind(p) === 'removeMember')
    return { kind: 'removeMember', key: p.removeMember.key, pid: enactment.proposalId };
  const admin = p.changeRoles.roles.some(r => 'adminRole' in r);
  return { kind: admin ? 'electResponsabile' : 'removeResponsabile',
    key: p.changeRoles.key, pid: enactment.proposalId };
}

/* toy-side name↔key mapping shared by the governance walk: user ids map to
   the fixed decoration pool; keys are the lowercase names */
const kgKey = u => nm(u).toLowerCase();
const kgName = key => { const i = NAMES.findIndex(n => n.toLowerCase() === key);
  return i >= 0 ? NAMES[i] : key; };
const kgUid = key => { const i = NAMES.findIndex(n => n.toLowerCase() === key);
  return i >= 0 ? i : null; };
const permQid = c => 'permesso:' + c;

/* Governance over the combined seq (model-level, also on import/restore):
   walk the three verified streams in order, minting base credits from
   faithful enactments and requiring route-appropriate evidence before any
   vote-derived economic event. Throws on the first violation, so a log in
   which four responsabili were elected without one vote is REFUSED. */
function verifyGovernedSeq(n) {
  let bgs = bgEmpty(), kgs = vtEmpty();
  const credits = [];
  let ei = 0, ki = 0, bi = 0;
  for (const m of n.seq) {
    if (m === 'b') {
      const st = n.baseEnv.steps[bi++];
      const det = bgApply(bgs, st.signer, st.event);
      bgs = det.state;
      if (det.enactment) {
        const cr = bgCreditOf(det.enactment);
        if (cr) credits.push(cr);
      }
    } else if (m === 'k') {
      const st = n.kelEnv.steps[ki++];
      kgs = vtApply(kgs, st.signer, st.event).state;
    } else {
      const st = n.env.steps[ei++];
      const e = leanEventOf(st.event);
      if (!voteDerivedTag(e.tag)) continue;
      if (EVENT_ROUTES[e.tag] === 'baseEnacted') {
        const key = kgKey(e.target);
        const i = credits.findIndex(cr => cr.kind === e.tag && cr.key === key);
        if (i < 0)
          throw new Error(`governo: ${e.tag} senza enactment fedele del canale base`);
        credits.splice(i, 1);
      } else if (e.tag === 'grantPermission' || e.tag === 'denyPermission') {
        const want = e.tag === 'grantPermission' ? 'positive' : 'negative';
        const rec = kgs.closed.find(r => r.questionId === permQid(e.c));
        if (!rec || rec.verdict !== want)
          throw new Error(`governo: ${e.tag} senza verdetto ${want === 'positive' ? 'positivo' : 'negativo'} chiuso`);
      } else if (e.tag === 'backdonate') {
        throw new Error('governo: backdonate senza ponte evento-voto provato (NON PROVATO)');
      } else {
        throw new Error(`governo: ${e.tag} appDecided senza evidenza di canale`);
      }
    }
  }
}

/* @@CORE:base-c:END@@ */
function bgTakeCredit(tag, targetKey) {
  const i = bgCredits.findIndex(cr => cr.kind === tag && cr.key === targetKey);
  if (i < 0) return null;
  return bgCredits.splice(i, 1)[0];
}

/* --- Vote journey (toy-side wiring of the required Vote machine) ----------
   Names/keys and question phrasing are decoration; the machine sees keys,
   question ids, kinds and ballots. The permesso question for an acquisto is
   the collective question id 'permesso:<CollId>'. The economic↔vote JOIN is
   NOT proved: every bridge point carries claim 'join-vote-econ'. */

const vtVerdictFor = c => {
  const rec = kg.closed.find(r => r.questionId === permQid(c));
  return rec ? rec.verdict : (vtLookup(permQid(c), kg.openQuestions) ? 'pending' : null);
};
/* the LOCAL unproved bridges: positive verdict → grant, negative → deny */
const bridgeReady = col => vtVerdictFor(col.id) === 'positive';
const bridgeDenyReady = col => vtVerdictFor(col.id) === 'negative';

function descrVote(signer, ev, closedNow) {
  const who = kgName(signer);
  let base;
  if ('openQuestion' in ev) {
    const { questionId, kind } = ev.openQuestion;
    const perm = vtPermKind(kind);
    base = `${who} apre la domanda «${questionId}»` +
      (perm ? ` (per-persona: ${kgName(perm.designee)})` : '');
  } else if ('cast' in ev) {
    base = `${who} vota ${ev.cast.ballot === 'assent' ? 'sì' : 'no'} su «${ev.cast.questionId}»`;
  } else if ('renounce' in ev) {
    base = `${who} rinuncia a «${ev.renounce.questionId}» (no-op in slice A)`;
  } else if ('admitMember' in ev) {
    base = `${kgName(ev.admitMember.key)} entra nel voto (evento semplice, non una domanda)`;
  } else if ('removeMember' in ev) {
    base = `${kgName(ev.removeMember.key)} esce dal voto`;
  } else {
    base = `nuovi ruoli di voto a ${kgName(ev.setRoles.key)}`;
  }
  return base + (closedNow ? ' — CHIUSA una domanda' : '');
}

const VOTE_TAG_CLAIMS = {
  openQuestion: ['vote-open-empty', 'vote-validate'],
  cast: ['vote-place', 'vote-verdict', 'vote-sweep'],
  renounce: ['vote-validate'],
  member: ['vote-admit-plain', 'vote-sweep'],
};

function voteEvKind(ev) {
  return 'openQuestion' in ev ? 'openQuestion' : 'cast' in ev ? 'cast'
    : 'renounce' in ev ? 'renounce' : 'member';
}

function recordKelApplied(signer, ev, det) {
  teachOffClick = false;
  kg = det.state;
  const viol = kgLawViolations(kg);
  if (viol.length) kgLawAlarm(viol, descrVote(signer, ev, false));
  const kind = voteEvKind(ev);
  const closedNow = det.closedDelta > 0;
  const claims = [...VOTE_TAG_CLAIMS[kind],
    ...(closedNow ? ['vote-nostale', 'vote-partition', 'vote-threshold-exhibit'] : [])];
  const lastClosed = closedNow ? kg.closed[kg.closed.length - 1] : null;
  const flow = closedNow
    ? `chiusa «${lastClosed.questionId}»: ${lastClosed.verdict === 'positive' ? 'POSITIVA' : 'NEGATIVA'}` +
      ` (causa: ${lastClosed.cause === 'tally' ? 'soglia' : 'cambio di elettorato'})` +
      ` · sì ${lastClosed.question.assents.length} / no ${lastClosed.question.dissents.length}` +
      ` · soglia ${vtTheta(vtFranchiseSize(kg))}`
    : (kind === 'cast'
      ? `una posizione per persona: cambiare voto sposta, ripetere non conta doppio`
      : (kind === 'openQuestion'
        ? 'aperta con conteggi VUOTI: chi propone non è contato come sì'
        : 'elettorato aggiornato — lo sweep ricontrolla ogni domanda aperta'));
  history.unshift({ kind: 'acc', mk: 'kel', tag: kind,
    descr: descrVote(signer, ev, closedNow), flow, claims,
    enacted: closedNow, inv: invSnapshot() });
  invNote = `dopo voto: ${kind} ✓`;
}

/* one attempted vote event through validate + apply, with durable logging */
function runVoteEvent(signer, ev) {
  const verr = vtValidate(kg, signer, ev);
  if (verr) {
    history.unshift({ kind: 'rej', mk: 'kel', tag: 'voto',
      descr: descrVote(signer, ev, false),
      failed: [{ code: 'KelGroups.Vote.validateVoteEvent = .error .' + verr,
        why: 'validazione del voto: ' + verr, law: null }],
      ext: false, inv: invSnapshot() });
    invNote = 'dopo voto ✗ — stato invariato';
    return { ok: false, error: verr };
  }
  const pre = JSON.parse(canonVoteState(kg));
  const det = vtApply(kg, signer, ev);
  recordKelApplied(signer, ev, det);
  kelSteps.push({ input: pre, signer, event: ev,
    result: { tag: 'applied', state: JSON.parse(canonVoteState(kg)),
      closedCount: kg.closed.length } });
  sessionSeq.push('k');
  persistSession();
  teachLearn('benvenuto');
  return { ok: true, closedDelta: det.closedDelta };
}

/* --- Base journey (toy-side wiring of the base proposal channel) --------- */

const BG_ADMIN_ROLES = [{ adminRole: { admin: 'publicAdmin' } }];
const BG_APP_ROLES = [{ appRole: { name: 'user' } }];

function descrBase(signer, ev, enacted) {
  let base;
  if ('propose' in ev) {
    const p = ev.propose.proposal, k = bgPropKind(p);
    if (k === 'introduceMember')
      base = `${kgName(signer)} propone: ${kgName(p.introduceMember.key)} entra nel canale base` +
        (p.introduceMember.roles.some(r => 'adminRole' in r) ? ' (admin)' : '');
    else if (k === 'removeMember')
      base = `${kgName(signer)} propone: ${kgName(p.removeMember.key)} esce dal canale base`;
    else
      base = `${kgName(signer)} propone: ruoli ${p.changeRoles.roles.some(r => 'adminRole' in r)
        ? 'admin (elezione)' : 'non-admin (revoca)'} a ${kgName(p.changeRoles.key)}`;
  } else {
    base = `${kgName(signer)} approva «${ev.approve.proposalId}»`;
  }
  return base + (enacted ? ' — DELIBERATA' : '');
}

const BG_TAG_CLAIMS = {
  propose: ['kg-apply', 'kg-proposer', 'kg-validate'],
  approve: ['kg-approve-guard', 'kg-nodup'],
};

function recordBaseApplied(signer, ev, det) {
  teachOffClick = false;
  bg = det.state;
  const viol = bgLawViolations(bg);
  if (viol.length) {
    bgLawBreaches.push({ viol, what: descrBase(signer, ev, false) });
    toast(`<b>⚠ RETE CANALE BASE</b> <span class="tiny">${esc(viol.join(' · '))} —
      trascrizione divergente da Fold.lean</span>`, innerWidth / 2, 80);
  }
  const kind = 'propose' in ev ? 'propose' : 'approve';
  const enacted = !!det.enactment;
  const claims = [...BG_TAG_CLAIMS[kind],
    ...(enacted ? ['kg-threshold', 'kg-enact-effect', 'comp-base-threshold'] : [])];
  const flow = enacted
    ? `DELIBERATA «${det.enactment.proposalId}»: assensi ${det.enactment.pending.approvals.length}` +
      ` ≥ maggioranza ${bgMajority(det.enactment.preState)} dello stato precedente` +
      (bgProposalFaithful(det.enactment.pending.proposal)
        ? ' · proposta nel vocabolario fedele → evidenza economica'
        : ' · introduceMember: MAI evidenza economica (esclusa per costruzione)')
    : (kind === 'propose'
      ? 'proposta pendente: chi propone è già fra gli assensi'
      : 'assenso registrato: mai contato doppio');
  history.unshift({ kind: 'acc', mk: 'bg', tag: kind,
    descr: descrBase(signer, ev, enacted), flow, claims,
    enacted, inv: invSnapshot() });
  invNote = `dopo canale base: ${kind} ✓`;
}

/* one attempted base event through validate + apply, with durable logging;
   a faithful enactment mints the credit and the bridge spends it at once */
function runBaseEvent(signer, ev) {
  const verr = bgValidate(bg, signer, ev);
  if (verr) {
    history.unshift({ kind: 'rej', mk: 'bg', tag: 'base',
      descr: descrBase(signer, ev, false),
      failed: [{ code: 'KelGroups.validateEvent = .error .' + verr,
        why: 'validazione del canale base: ' + verr, law: null }],
      ext: false, inv: invSnapshot() });
    invNote = 'dopo proposta ✗ — stato invariato';
    return { ok: false, error: verr };
  }
  const pre = JSON.parse(canonBaseState(bg));
  const det = bgApply(bg, signer, ev);
  recordBaseApplied(signer, ev, det);
  bgSteps.push({ input: pre, signer, event: ev,
    result: { tag: 'applied', state: JSON.parse(canonBaseState(bg)),
      enacted: !!det.enactment } });
  sessionSeq.push('b');
  persistSession();
  if (det.enactment) {
    const cr = bgCreditOf(det.enactment);
    if (cr) { bgCredits.push(cr); bridgeBaseCredit(cr); }
  }
  teachLearn('benvenuto');
  return { ok: true, enacted: !!det.enactment };
}

/* the ONE bridge from a faithful base enactment into the economic machine:
   spends the credit through the governed runAttempt (join NON PROVATO) */
function bridgeBaseCredit(cr) {
  const uid = kgUid(cr.key);
  if (uid === null || !state.responsabili.length) return;
  if (cr.kind === 'electResponsabile' && state.users.includes(uid) && !resp(uid))
    runAttempt('electResponsabile', { author: state.responsabili[0], target: uid });
  else if (cr.kind === 'removeResponsabile' && resp(uid))
    runAttempt('removeResponsabile', { author: state.responsabili[0], target: uid });
  // removeMember: routed baseEnacted at the pin but absent from this
  // machine snapshot — the credit stays visible and unconsumed
}

/* the base-side admin key that signs toy-initiated proposals */
function bgSignerFor(author) {
  const k = kgKey(author);
  if (bgIsAdmin(k, bg)) return k;
  const admins = bg.members.filter(([, m]) => vtHasAdmin(m.roles)).map(([k2]) => k2);
  return admins.length ? admins[0] : k;
}

/* the elect/remove task chain: bootstrap → membership → faithful proposal.
   Every step is a REAL base event in the durable log; when the group has
   three or more admins the faithful proposal stays pending and the gov
   card's approve buttons carry it to the threshold. */
function startBaseGovChain(tag, args) {
  const targetKey = kgKey(args.target);
  if (bgBootstrap(bg)) {
    const founder = kgKey(args.author);
    runBaseEvent(founder, { propose: { proposal: { introduceMember:
      { key: founder, email: founder + '@toy.example', roles: BG_ADMIN_ROLES } } } });
  }
  if (tag === 'electResponsabile' && !bgIsMember(targetKey, bg)) {
    const r = runBaseEvent(bgSignerFor(args.author), { propose: { proposal: { introduceMember:
      { key: targetKey, email: targetKey + '@toy.example', roles: BG_APP_ROLES } } } });
    if (!r.ok || !bgIsMember(targetKey, bg)) return r;   // pending or refused: approvals first
  }
  if (tag === 'removeResponsabile' && !bgIsMember(targetKey, bg))
    return { ok: false, error: 'memberNotFound' };
  return runBaseEvent(bgSignerFor(args.author), { propose: { proposal: { changeRoles:
    { key: targetKey, roles: tag === 'electResponsabile' ? BG_ADMIN_ROLES : BG_APP_ROLES } } } });
}


/* --- Session log (persist the LOG, not the state) -------------------------
   The durable artifact is the sequence of applied Lean-shaped events in the
   frozen v1 trace envelope; state is derived by replay and verified step by
   step. Everything stays in this browser's localStorage — no server, no
   network. Export/share/presentation all consume the same envelope the
   conformance corpus uses. */

const LOG_KEY_BASE = 'rg-sim-log-v1';
const TEACH_KEY_BASE = 'rg-teach-v1';
const storeNS = () => window.__RG_NS || '';
const logKey = () => LOG_KEY_BASE + storeNS();
const teachKey = () => TEACH_KEY_BASE + storeNS();

let sessionSteps = [];   // frozen-v1 applied economic steps of the live session
let kelSteps = [];       // kelgroups-vote.trace applied steps of the live session
let sessionSeq = [];     // toy-side chronological interleaving: 'e' | 'k' markers
                         // (ordering metadata only — the two envelopes stay
                         // pure; no shared proved schema is claimed)

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

function sessionEnvelope() {
  return { schema: 'reactivegas.trace', version: 1,
    initial: JSON.parse(canonState(initState(FOUNDER))),
    steps: sessionSteps };
}
function kelEnvelope() {
  return { schema: 'kelgroups-vote.trace', version: 1,
    threshold: VT_THRESHOLD_NAME,
    initial: JSON.parse(canonKelState(kgEmptyState())),
    steps: kelSteps };
}
function baseEnvelope() {
  return { schema: 'kelgroups-base.trace', version: 1,
    initial: JSON.parse(canonBaseState(bgEmpty())),
    steps: bgSteps };
}
function buildExport() {
  return JSON.stringify({ format: 'reactivegas-sim-session', v: 2,
    labels: { ...colLabels }, trace: sessionEnvelope(), kel: kelEnvelope(),
    base: baseEnvelope(), seq: sessionSeq.join('') });
}
function persistSession() { lsSet(logKey(), buildExport()); }

/* rebuild toy-side decoration + history from verified applied-only traces,
   walking the chronological seq across both machines */
function adoptSession(env, kelEnv, baseEnv, seq, labels) {
  state = initState(FOUNDER);
  kg = kgEmptyState();
  bg = bgEmpty(); bgCredits = [];
  history = []; completed = []; collSeq = 1; colLabels = { ...(labels || {}) };
  let ei = 0, ki = 0, bi = 0;
  for (const m of seq) {
    if (m === 'e') {
      const st = env.steps[ei++];
      const e = leanEventOf(st.event);
      const { tag, ...args } = e;
      if (tag === 'openPurchase' && colLabels[args.c] === undefined) {
        const used = new Set(Object.values(colLabels));
        colLabels[args.c] = PRESETS.find(p => !used.has(p)) || ('acquisto ' + collSeq);
      }
      // consume the governance credit the verified walk already required
      if (voteDerivedTag(tag) && EVENT_ROUTES[tag] === 'baseEnacted')
        bgTakeCredit(tag, kgKey(args.target));
      recordApplied(tag, args, attempt(state, e));
    } else if (m === 'b') {
      const st = baseEnv.steps[bi++];
      const det = bgApply(bg, st.signer, st.event);
      recordBaseApplied(st.signer, st.event, det);
      if (det.enactment) {
        const cr = bgCreditOf(det.enactment);
        if (cr) bgCredits.push(cr);
      }
    } else {
      const st = kelEnv.steps[ki++];
      const det = kgApplyDetailed(kg, st.signer, st.event);
      recordKelApplied(st.signer, st.event, det);
    }
  }
  sessionSteps = env.steps.slice();
  kelSteps = kelEnv.steps.slice();
  bgSteps = baseEnv.steps.slice();
  sessionSeq = seq.slice();
  invNote = `sessione ripristinata: ${seq.length} eventi (${env.steps.length} economia, ${kelEnv.steps.length} voto, ${baseEnv.steps.length} base)`;
}

/* normalize any accepted import/storage shape into {env, kelEnv, baseEnv, seq, labels} */
function normalizeWrap(wrap) {
  const env = wrap && wrap.format === 'reactivegas-sim-session' ? wrap.trace : wrap;
  const kelEnv = (wrap && wrap.format === 'reactivegas-sim-session' && wrap.kel)
    ? wrap.kel
    : { schema: 'kelgroups-vote.trace', version: 1, threshold: VT_THRESHOLD_NAME,
        initial: JSON.parse(canonKelState(kgEmptyState())), steps: [] };
  const baseEnv = (wrap && wrap.format === 'reactivegas-sim-session' && wrap.base)
    ? wrap.base
    : { schema: 'kelgroups-base.trace', version: 1,
        initial: JSON.parse(canonBaseState(bgEmpty())), steps: [] };
  let seq;
  if (wrap && wrap.format === 'reactivegas-sim-session' && typeof wrap.seq === 'string')
    seq = wrap.seq.split('');
  else seq = env.steps.map(() => 'e');
  return { env, kelEnv, baseEnv, seq, labels: (wrap && wrap.labels) || {} };
}

function verifySessionShape(n) {
  const eCount = n.seq.filter(m => m === 'e').length;
  const kCount = n.seq.filter(m => m === 'k').length;
  const bCount = n.seq.filter(m => m === 'b').length;
  if (eCount !== n.env.steps.length || kCount !== n.kelEnv.steps.length ||
      bCount !== n.baseEnv.steps.length ||
      eCount + kCount + bCount !== n.seq.length)
    throw new Error('seq incoerente con i tre flussi');
  verifyTraceV1(n.env, { appliedOnly: true });
  verifyKelTraceV1(n.kelEnv, { appliedOnly: true });
  verifyBaseTraceV1(n.baseEnv, { appliedOnly: true });
  verifyGovernedSeq(n);
}

/* boot-time restore: never trust the stored final state — replay and verify */
function restoreSession() {
  const raw = lsGet(logKey());
  if (!raw) return null;
  let wrap;
  try { wrap = JSON.parse(raw); } catch (e) { return quarantineLog('log locale illeggibile'); }
  const n = normalizeWrap(wrap);
  try { verifySessionShape(n); }
  catch (e) { return quarantineLog(e.message); }
  adoptSession(n.env, n.kelEnv, n.baseEnv, n.seq, n.labels);
  return n.seq.length;
}

function quarantineLog(reason) {
  const raw = lsGet(logKey());
  if (raw) lsSet(logKey() + '-corrotto', raw);
  lsDel(logKey());
  toast(`<b>log locale rifiutato</b> <span class="tiny">${esc(reason)} — nuova sessione; il log rifiutato è conservato</span>`,
    innerWidth / 2, 80);
  return null;
}

function newSession() {
  lsDel(logKey());
  state = initState(FOUNDER);
  kg = kgEmptyState();
  bg = bgEmpty(); bgCredits = [];
  history = []; completed = []; collSeq = 1; colLabels = {};
  sessionSteps = []; kelSteps = []; bgSteps = []; sessionSeq = [];
  invNote = 'nuova sessione → State.init 0';
  navStack = [{ view: 'group' }];
  cancelFlow();
  renderAll();
}

/* --- Presentation mode: replay a trace one applied event at a time -------- */

let pres = null;   // combined three-machine presentation over the toy seq

function enterPresentation(n) {
  // n = { env, kelEnv, baseEnv, seq, labels } — every envelope verified
  // independently, then the governance walk over the combined seq
  const ver = verifyTraceV1(n.env);
  const kver = verifyKelTraceV1(n.kelEnv);
  const bver = verifyBaseTraceV1(n.baseEnv);
  const eCount = n.seq.filter(m => m === 'e').length;
  const bCount = n.seq.filter(m => m === 'b').length;
  if (eCount !== n.env.steps.length || bCount !== n.baseEnv.steps.length ||
      n.seq.length - eCount - bCount !== n.kelEnv.steps.length)
    throw new Error('seq incoerente con i tre flussi');
  verifyGovernedSeq(n);
  pres = { n, eco: ver.states, kel: kver.states, base: bver.states, idx: 0,
    saved: { state, kg, bg, nav: navStack, labels: colLabels, note: invNote,
      hist: history, comp: completed, seq: collSeq } };
  colLabels = { ...(n.labels || {}) };
  n.env.steps.forEach(st => {
    const e = leanEventOf(st.event);
    if (e.tag === 'openPurchase' && colLabels[e.c] === undefined) {
      const used = new Set(Object.values(colLabels));
      colLabels[e.c] = PRESETS.find(p => !used.has(p)) || ('acquisto ' + e.c);
    }
  });
  navStack = [{ view: 'group' }];
  closePop();
  presSet(0);
}

function presSet(i) {
  pres.idx = Math.max(0, Math.min(pres.n.seq.length, i));
  let ei = 0, ki = 0, bi = 0;
  for (let j = 0; j < pres.idx; j++)
    (pres.n.seq[j] === 'e' ? ei++ : pres.n.seq[j] === 'b' ? bi++ : ki++);
  state = JSON.parse(JSON.stringify(pres.eco[ei]));
  kg = JSON.parse(JSON.stringify(pres.kel[ki]));
  bg = JSON.parse(JSON.stringify(pres.base[bi]));
  renderAll();
}

function exitPresentation() {
  const s = pres.saved;
  pres = null;
  state = s.state; kg = s.kg; bg = s.bg; navStack = s.nav; colLabels = s.labels; invNote = s.note;
  history = s.hist; completed = s.comp; collSeq = s.seq;
  renderAll();
}

function presWhat() {
  const i = pres.idx;
  if (i === 0) return 'stato iniziale';
  let ei = 0, ki = 0, bi = 0;
  for (let j = 0; j < i - 1; j++)
    (pres.n.seq[j] === 'e' ? ei++ : pres.n.seq[j] === 'b' ? bi++ : ki++);
  if (pres.n.seq[i - 1] === 'e') {
    const d = leanEventOf(pres.n.env.steps[ei].event);
    return descr(d.tag, d);
  }
  if (pres.n.seq[i - 1] === 'b') {
    const st = pres.n.baseEnv.steps[bi];
    return descrBase(st.signer, st.event,
      !!(st.result && st.result.tag === 'applied' && st.result.enacted));
  }
  const st = pres.n.kelEnv.steps[ki];
  return descrVote(st.signer, st.event,
    !!(st.result && st.result.tag === 'applied' &&
       st.result.state.closed.length > st.input.closed.length));
}

function renderPresBar() {
  const bar = $('presbar');
  if (!pres) { bar.hidden = true; bar.innerHTML = ''; return; }
  const n = pres.n.seq.length;
  const i = pres.idx;
  const what = presWhat();
  bar.hidden = false;
  bar.innerHTML = `<b>presentazione</b> <span>${i}/${n}</span>
    <span style="opacity:.85">${esc(what)}</span>
    <span style="margin-left:auto;display:flex;gap:6px">
    <button type="button" id="pres-restart" ${i === 0 ? 'disabled' : ''}>⏮</button>
    <button type="button" id="pres-prev" ${i === 0 ? 'disabled' : ''}>‹ prec</button>
    <button type="button" id="pres-next" ${i >= n ? 'disabled' : ''}>succ ›</button>
    <button type="button" id="pres-exit">✕ esci</button></span>`;
  $('pres-restart').addEventListener('click', () => presSet(0));
  $('pres-prev').addEventListener('click', () => presSet(pres.idx - 1));
  $('pres-next').addEventListener('click', () => presSet(pres.idx + 1));
  $('pres-exit').addEventListener('click', exitPresentation);
}

/* --- Teaching that recedes (NOTE-032 + NOTE-033) --------------------------
   Each strip's surface sentence is written for Giuseppe, the buyer: it says
   what just happened in his world or what he can do now — never machine
   mechanics, which stay complete behind the ⊢ glyph (claims unchanged).
   Visibility is driven by the strip's REAL CONDITION, computed from live
   session state on every render — never by which tab is open. Leaving the
   condition hides the strip without marking it understood; returning shows
   it again; only the explicit ✕ dismisses it permanently (persisted).
   The ONE exception is `benvenuto`: it applies only on arrival, so it is
   view-triggered and retires automatically at the first meaningful use
   (first applied event of any machine). No other strip auto-retires. */

// set when Giuseppe meets a spent (off) affordance — the page's refusal
// surface, which refuses BEFORE the machine; cleared by any applied event
let teachOffClick = false;

const TEACH_ITEMS = {
  benvenuto: {
    text: "Benvenuto! Questo è un gruppo d'acquisto da provare: clicca una persona, un saldo o un acquisto e fai qualche mossa. Il segno ⊢ accanto alle frasi apre il dettaglio, se ti incuriosisce il perché.",
    claims: ['js-transcription'],
    cond: () => true,   // arrival exception: gated only by the learned flag
  },
  impegno: {
    text: 'Hai dei soldi da parte per un acquisto: sono già usciti dal conto e restano lì finché il referente decide. Se l’impegno viene rifiutato o l’acquisto non va in porto, tornano sul conto.',
    claims: ['impegno-escrow'],
    cond: () => state.collections.some(c => escrowOf(c) > 0),
  },
  guardie: {
    text: 'Quell’azione per ora non si può fare, e infatti non è successo niente: conti e acquisti sono come prima. Accanto all’azione c’è scritto cosa manca: sistemalo e riprova.',
    claims: ['auth', 'covered'],
    cond: () => teachOffClick || (history.length > 0 && history[0].kind === 'rej'),
  },
  cassa: {
    text: () => {
      const neg = state.casse.filter(([, v]) => v < 0).map(([u]) => nm(u));
      return `La cassa di ${neg.join(' e ') || '—'} è sotto zero perché ha pagato il fornitore: non è un errore. Si riequilibra con i prossimi versamenti e giri di cassa.`;
    },
    claims: ['cassa-negativa', 'close-payout'],
    cond: () => state.casse.some(([, v]) => v < 0),
  },
  chiusa: {
    text: 'L’acquisto si è concluso e non è più tra quelli aperti. Se è andato in porto lo trovi tra i completati; se no, i soldi impegnati sono tornati sui conti.',
    claims: ['close-gone'],
    cond: () => {
      const e = history.find(en => en.kind === 'acc' && !en.mk);
      return !!e && ['closePurchase', 'failPurchase', 'denyPurchase', 'denyPermission'].includes(e.tag);
    },
  },
  voto: {
    text: 'C’è una domanda aperta nel gruppo: puoi rispondere sì oppure no, e cambiare risposta finché resta aperta. Si chiude da sola quando una delle due risposte ha abbastanza voti.',
    claims: ['vote-threshold-exhibit', 'vote-verdict', 'vote-open-empty', 'vote-place'],
    cond: () => kg.openQuestions.length > 0,
  },
};

function loadTeach() {
  try { return JSON.parse(lsGet(teachKey())) || {}; } catch (e) { return {}; }
}
let teach = loadTeach();
function saveTeach() { lsSet(teachKey(), JSON.stringify(teach)); }
/* the explicit ✕: the ONLY permanent retirement for condition strips */
function teachDismiss(id) {
  if (!TEACH_ITEMS[id] || teach[id]) return;
  teach[id] = true; saveTeach();
}
/* automatic retirement is allowed ONLY for the benvenuto arrival exception */
function teachLearn(id) {
  if (id !== 'benvenuto') return;
  teachDismiss(id);
}
/* the condition — not the view — decides what is on screen */
function teachBarHtml() {
  if (pres) return '';
  return Object.entries(TEACH_ITEMS).map(([id, t]) => {
    if (teach[id] || !t.cond()) return '';
    const tx = typeof t.text === 'function' ? t.text() : t.text;
    return `<div class="teach" data-teach="${id}">${esc(tx)} ${pkGlyph(t.claims)}
      <button type="button" class="tx" data-teachx="${id}" title="ho capito">✕</button></div>`;
  }).join('');
}
function teachReplay() { teach = {}; saveTeach(); renderAll(); }

/* --- Attempt driver ------------------------------------------------------ */

function invSnapshot() {
  const sc = sumBal(state.casse), sn = sumBal(state.conti), se = escrowSum(state.collections);
  return { sc, sn, se, v: sc - sn - se };
}

/* apply an accepted result to toy-side state; shared by live attempts and
   verified-log adoption so replay rebuilds exactly what the session showed */
function recordApplied(tag, args, res) {
  teachOffClick = false;
  // toy-side snapshot of a successful close, taken from the pre-state
  if (tag === 'closePurchase') {
    const [col] = pullCollection(args.c, state.collections);
    completed.unshift({ label: lbl(col.id), referente: col.referente,
      contributors: col.accepted.map(p => ({ user: p.user, amount: p.amount })),
      total: sumPledges(col.accepted) });
  }
  state = res.state;
  if (tag === 'openPurchase') collSeq = Math.max(collSeq, args.c + 1);
  const viol = lawViolations(state);
  if (viol.length) lawAlarm(viol, tag);
  history.unshift({ kind: 'acc', tag, args, descr: descr(tag, args), flow: res.flow,
    ext: !!EV[tag].external, inv: invSnapshot() });
  invNote = `dopo .${tag} ✓`;
}

function runAttempt(tag, args, toyLabel) {
  // Composition gate (accepted pin c8c4dd89…): a vote-derived economic
  // event is applied ONLY against its route-appropriate evidence — a
  // faithful base Enactment or a closed vote verdict. The refusal happens
  // BEFORE the economic machine is consulted: the machine itself has no
  // such guard (that absence is exactly the unproved join), so the model
  // boundary enforces it and says so honestly.
  let evid = null;
  if (voteDerivedTag(tag)) {
    const route = EVENT_ROUTES[tag];
    if (route === 'baseEnacted') {
      evid = bgTakeCredit(tag, kgKey(args.target));
      if (!evid) {
        const failed = [{ code: 'Composition.route = .baseEnacted',
          why: 'composizione: evento vote-derived senza enactment fedele del canale base',
          law: null }];
        history.unshift({ kind: 'rej', tag, args, descr: descr(tag, args),
          governance: true, failed, ext: false, inv: invSnapshot() });
        invNote = `dopo .${tag} ✗ — composizione: senza delibera`;
        return { ok: false, governance: true, failed };
      }
    } else {
      const want = tag === 'grantPermission' ? 'positive' : 'negative';
      if (vtVerdictFor(args.c) !== want) {
        const failed = [{ code: 'Composition.route = .appDecided',
          why: `composizione: evento vote-derived senza verdetto ${want === 'positive' ? 'positivo' : 'negativo'} chiuso`,
          law: null }];
        history.unshift({ kind: 'rej', tag, args, descr: descr(tag, args),
          governance: true, failed, ext: false, inv: invSnapshot() });
        invNote = `dopo .${tag} ✗ — composizione: senza verdetto`;
        return { ok: false, governance: true, failed };
      }
      evid = { kind: tag, qid: permQid(args.c) };
    }
  }
  if (tag === 'openPurchase' && toyLabel) colLabels[args.c] = toyLabel;
  const preCanon = JSON.parse(canonState(state));
  const res = attempt(state, { tag, ...args });
  if (!res.ok && evid && EVENT_ROUTES[tag] === 'baseEnacted')
    bgCredits.push(evid);   // machine refused: the enactment stays spendable
  if (res.ok) {
    recordApplied(tag, args, res);
    if (evid) {
      history[0].route = EVENT_ROUTES[tag];
      history[0].evid = evid.pid || evid.qid;
    }
    // the durable artifact is the applied-event log, in the frozen v1 shape
    sessionSteps.push({ input: preCanon, event: leanEventJson({ tag, ...args }),
      result: { tag: 'applied', state: JSON.parse(canonState(state)) } });
    sessionSeq.push('e');
    persistSession();
    // teaching recedes as the machine is used
    teachLearn('benvenuto');
  } else {
    if (tag === 'openPurchase') delete colLabels[args.c];
    history.unshift({ kind: 'rej', tag, args, descr: descr(tag, args), failed: res.failed,
      ext: !!EV[tag].external, inv: invSnapshot() });
    invNote = `dopo .${tag} ✗ — stato invariato`;
  }
  return res;
}

/* --- Toy-side helpers ----------------------------------------------------- */

const resp = u => isResponsabile(state, u);
const refCols = u => state.collections.filter(c => c.referente === u);
const inCol = (c, u) => c.accepted.some(p => p.user === u) || c.pending.some(p => p.user === u);
const candidates = () => {
  const out = [];
  for (let i = 0; i < NAMES.length && out.length < 3; i++)
    if (!state.users.includes(i)) out.push(i);
  return out;
};
const pledgesOf = u => {
  const out = [];
  for (const c of state.collections) {
    for (const p of c.pending) if (p.user === u) out.push({ c: c.id, amount: p.amount, st: 'pendente' });
    for (const p of c.accepted) if (p.user === u) out.push({ c: c.id, amount: p.amount, st: 'accettato' });
  }
  return out;
};
const B = (badge, note, claims) => ({ badge, note: note || '', claims: claims || null });

/* Task availability: guards as affordances, computed from live state. */
function taskDis(tag, ctx) {
  ctx = ctx || {};
  const cols = state.collections;
  switch (tag) {
    case 'addUser':
      if (!state.responsabili.length) return B('AUTH', 'nessun responsabile');
      return candidates().length ? null : B('—', 'nessun candidato');
    case 'electResponsabile':
      if (!state.responsabili.length) return B('AUTH', 'nessun responsabile');
      return state.users.some(u => !resp(u)) ? null : B('—', 'tutti già ★');
    case 'removeResponsabile':
      return state.responsabili.length ? null : B('AUTH', 'nessun responsabile');
    case 'openPurchase':
      if (ctx.author !== undefined && !resp(ctx.author)) return B('AUTH', 'non è responsabile');
      return state.responsabili.length ? null : B('AUTH', 'nessun responsabile');
    case 'deposit': case 'withdraw': {
      if (ctx.user !== undefined)
        return state.responsabili.some(r => r !== ctx.user) ? null : B('AUTH', 'serve un cassiere diverso');
      if (ctx.author !== undefined)
        return state.users.some(u => u !== ctx.author) ? null : B('—', 'serve un’altra persona');
      return null;
    }
    case 'transferCassa':
      return state.responsabili.some(r => r !== ctx.author) ? null : B('—', 'nessun’altra cassa');
    case 'pledge': {
      if (!cols.length) return B('—', 'nessun acquisto aperto');
      if (!state.responsabili.length) return B('AUTH', 'nessun responsabile');
      if (ctx.user !== undefined) {
        if (bal(state.conti, ctx.user) < 1) return B('COVERED (L7)', 'conto insufficiente');
        if (!cols.some(c => !inCol(c, ctx.user))) return B('L8', 'già in ogni acquisto');
        return null;
      }
      if (ctx.c !== undefined) {
        const col = cols.find(x => x.id === ctx.c);
        const cand = state.users.filter(u => !inCol(col, u));
        if (!cand.length) return B('L8', 'tutti hanno già un impegno');
        if (!cand.some(u => bal(state.conti, u) >= 1)) return B('COVERED (L7)', 'nessun conto capiente');
        return null;
      }
      return null;
    }
    case 'closePurchase': {
      const col = cols.find(x => x.id === ctx.c);
      if (!col.permitted) return B('PERMITTED (L2)', 'serve il permesso del gruppo');
      if (col.pending.length) return B('NO-PENDING (L4)', 'impegni pendenti da risolvere');
      return null;
    }
    case 'failPurchase': {
      const col = cols.find(x => x.id === ctx.c);
      return col.pending.length ? B('NO-PENDING (L4)', 'impegni pendenti da risolvere') : null;
    }
    case 'grantPermission': {
      // the direct one-officer grant path is gone: the economic permission is
      // reachable only through an ENACTED vote question, and even then the
      // machine-to-machine bridge is an unproved local join
      if (!state.responsabili.length) return B('AUTH', 'nessun responsabile');
      const col = cols.find(x => x.id === ctx.c);
      if (col.permitted) return B('—', 'già permesso');
      if (!bridgeReady(col))
        return B('SENZA DELIBERA', 'serve un verdetto positivo del gruppo di voto',
          ['join-vote-econ', 'vote-verdict']);
      return null;
    }
    case 'denyPermission': {
      // symmetric to the grant: the economic denial is reachable only through
      // a NEGATIVE verdict of the vote machine (dissent is modeled now), and
      // the machine-to-machine bridge stays an unproved local join
      if (!state.responsabili.length) return B('AUTH', 'nessun responsabile');
      const col = cols.find(x => x.id === ctx.c);
      if (!bridgeDenyReady(col))
        return B('SENZA DELIBERA', 'serve un verdetto negativo del gruppo di voto',
          ['join-vote-econ', 'vote-verdict']);
      return null;
    }
  }
  return null;
}

/* Chip candidates for one task step: only existing objects; ineligible
   entries stay visible but disabled with the guard named (affordance). */
function chipsFor(role) {
  const tag = flow.tag, p = flow.params;
  const col = p.c !== undefined ? state.collections.find(x => x.id === p.c) : null;
  const person = u => ({ id: u, label: `${resp(u) ? '★ ' : ''}${nm(u)}` });
  switch (role) {
    case 'author': {
      const refOps = ['acceptPledge', 'refusePledge', 'correctPledge', 'closePurchase', 'failPurchase'];
      return state.users.map(u => {
        const ch = person(u);
        if ((tag === 'deposit' || tag === 'withdraw') && p.user === u) ch.dis = 'a ≠ u';
        else if (tag === 'transferCassa' && p.from_ === u) ch.dis = 'a ≠ f';
        else if (!resp(u)) ch.dis = 'AUTH';
        else if (refOps.includes(tag) && col && col.referente !== u) ch.dis = 'REFERENTE';
        return ch;
      });
    }
    case 'user': return state.users.map(u => {
      const ch = person(u);
      if (p.author === u) ch.dis = 'a ≠ u';
      else if (tag === 'pledge') {
        if (col && inCol(col, u)) ch.dis = 'L8';
        else if (bal(state.conti, u) < 1) ch.dis = 'COVERED (L7)';
      }
      return ch;
    });
    case 'targetGhost': return candidates().map(person);
    case 'targetMember': return state.users.map(u => {
      const ch = person(u); if (resp(u)) ch.dis = 'già ★'; return ch;
    });
    case 'targetResp': return state.responsabili.map(person);
    case 'from': return state.responsabili.map(u => {
      const ch = { id: u, label: `★ ${nm(u)} · cassa ${bal(state.casse, u)}` };
      if (p.author === u) ch.dis = 'a ≠ f';
      return ch;
    });
    case 'coll': return state.collections.map(c => {
      const ch = { id: c.id, label: `«${lbl(c.id)}» · ${escrowOf(c)}` };
      if (tag === 'pledge' && p.user !== undefined && inCol(c, p.user)) ch.dis = 'L8';
      return ch;
    });
    case 'pendUser': return (col ? col.pending : []).map(q => person(q.user));
    case 'accUser': return (col ? col.accepted : []).map(q => person(q.user));
  }
  return [];
}

/* --- Amount bounds (values constrained by live sources) ------------------ */

const TOYMAX = 500;   // toy-side cap for unbounded-above amounts

function amountSpec(tag, p) {
  switch (tag) {
    case 'deposit':
      return { min: 0, max: TOYMAX, val: 50, what: `accredito: ${nm(p.user)} versa a ${nm(p.author)}` };
    case 'withdraw': {
      const b = Math.max(0, bal(state.conti, p.user));
      return { min: 0, max: b, val: Math.min(b, 20), what: `prelievo di ${nm(p.user)} (conto ${b})` };
    }
    case 'transferCassa':
      return { min: 1, max: TOYMAX, val: 50, what: `cassa ${nm(p.from_)} → cassa ${nm(p.author)}` };
    case 'pledge': {
      const b = bal(state.conti, p.user);
      return { min: 1, max: b, val: Math.min(b, 20), what: `impegno di ${nm(p.user)} su «${lbl(p.c)}» (conto ${b})` };
    }
    case 'correctPledge': {
      const col = state.collections.find(x => x.id === p.c);
      const cur = (col.accepted.find(q => q.user === p.user) || { amount: 0 }).amount;
      const mx = cur + Math.max(0, bal(state.conti, p.user));
      return { min: 0, max: mx, val: cur, what: `impegno di ${nm(p.user)}: ora ${cur}` };
    }
  }
  return null;
}

function go(desc) { navStack.push(desc); closePop(); renderAll(); }
function goPledge(c, pu) {
  if (nav().view !== 'collection' || nav().c !== c) navStack.push({ view: 'collection', c });
  navStack.push({ view: 'pledge', c, pu });

function backNav() { if (navStack.length > 1) { navStack.pop(); closePop(); renderAll(); } }
function goCrumb(i) { navStack = navStack.slice(0, i + 1); closePop(); renderAll(); }

// drop views whose object no longer exists (closed collections, gone pledges)
function pruneNav() {
  for (let i = 1; i < navStack.length; i++) {
    const d = navStack[i];
    let ok = true;
    if (d.view === 'person') ok = state.users.includes(d.u);
    if (d.view === 'collection') ok = state.collections.some(x => x.id === d.c);
    if (d.view === 'pledge') {
      const col = state.collections.find(x => x.id === d.c);
      ok = !!col && (col.pending.some(p => p.user === d.pu) || col.accepted.some(p => p.user === d.pu));
    }
    if (!ok) { navStack = navStack.slice(0, i); break; }
  }
  const top = nav();
  if (top.view === 'person' && top.hat === 'cassiere' && !resp(top.u)) top.hat = 'member';

function crumbLabel(d) {
  if (d.view === 'group') return 'Gruppo';
  if (d.view === 'person') return nm(d.u);
  if (d.view === 'collection') return `«${lbl(d.c)}»`;
  if (d.view === 'pledge') return `impegno di ${nm(d.pu)}`;

function renderCrumbs() {
  $('nav-back').disabled = navStack.length <= 1;
  $('crumbs').innerHTML = navStack.map((d, i) => {

  }).join('');

/* --- Task flow machinery -------------------------------------------------- */

function startTask(tag, preset, x, y) {
  flow = { tag, params: { ...preset }, xy: [x || innerWidth / 2, y || 160],
    steps: EV[tag].roles.filter(r => flow === null || true).filter(r => ({ ...preset })[ROLEKEY[r]] === undefined) };
  flow.steps = EV[tag].roles.filter(r => flow.params[ROLEKEY[r]] === undefined);
  nextStep();
}

function nextStep() {
  if (!flow) return;
  const role = flow.steps[0];
  if (role === 'label') { openLabelPop(); return; }
  if (role) { openChipPop(role); return; }
  if (EV[flow.tag].external) { openExternalConfirm(); return; }
  if (EV[flow.tag].amount) { openAmountPop(); return; }
  commitFlow();
}

function cancelFlow() { flow = null; closePop(); }

function openChipPop(role) {
  const ask = ASK_BY_EV[flow.tag + '.' + role] || ASK[role];
  const chips = chipsFor(role);
  const html = `<div class="pt">${esc(EV[flow.tag].it)}
      <span class="mono" style="font-size:.68rem">.${flow.tag}</span>
      <button type="button" class="xbtn2" data-x="1">✕</button></div>
    <div class="tiny">${esc(ask)}</div>
    <div class="chips">` +
    (chips.length ? chips.map(ch => ch.dis
      ? `<button type="button" class="chip" disabled title="${esc(ch.dis)}">${esc(ch.label)}
           <span class="gb">${esc(ch.dis)}</span></button>`
      : `<button type="button" class="chip" data-id="${ch.id}">${esc(ch.label)}</button>`).join('')
      : '<span class="empty">niente da scegliere</span>') +
    '</div>';
  popAt(flow.xy[0], flow.xy[1], html);
  $('pop').querySelectorAll('.chip[data-id]').forEach(b => b.addEventListener('click', ev => {
    flow.params[ROLEKEY[role]] = Number(b.dataset.id);
    flow.steps = flow.steps.slice(1);
    flow.xy = [ev.clientX, ev.clientY];
    nextStep();
  }));
  const xb = $('pop').querySelector('[data-x]');
  if (xb) xb.addEventListener('click', cancelFlow);
}

function openLabelPop() {
  const open = new Set(state.collections.map(c => lbl(c.id)));
  let opts = PRESETS.filter(p => !open.has(p));
  if (!opts.length) opts = PRESETS;
  const html = `<div class="pt">${esc(EV[flow.tag].it)}
      <span class="mono" style="font-size:.68rem">.${flow.tag}</span>
      <button type="button" class="xbtn2" data-x="1">✕</button></div>
    <div class="tiny">${esc(ASK.label)}</div>
    <div class="chips">` +
    opts.map(p => `<button type="button" class="chip" data-l="${esc(p)}">${esc(p)}</button>`).join('') +
    `</div><div class="tiny">etichetta toy — il CollId Lean resta un Nat interno ${pkGlyph(['names'])}</div>`;
  popAt(flow.xy[0], flow.xy[1], html);
  $('pop').querySelectorAll('[data-l]').forEach(b => b.addEventListener('click', ev => {
    flow.params._label = b.dataset.l;
    flow.params.c = collSeq;
    flow.steps = flow.steps.filter(r => r !== 'label');
    flow.xy = [ev.clientX, ev.clientY];
    nextStep();
  }));
  const xb = $('pop').querySelector('[data-x]');
  if (xb) xb.addEventListener('click', cancelFlow);
}

function openAmountPop() {
  const sp = amountSpec(flow.tag, flow.params);
  const html = `<div class="pt">${esc(EV[flow.tag].it)} — importo
      <button type="button" class="xbtn2" data-x="1">✕</button></div>
    <div class="tiny">${esc(sp.what)}</div>
    ${sp.max === TOYMAX ? `<div class="tiny">massimo del toy, non della macchina
      <span class="npvbadge" data-claims="toy-cap">NON PROVATO</span></div>` : ''}
    <div class="ar"><span class="mono">${sp.min}</span>
      <input id="am-r" type="range" min="${sp.min}" max="${sp.max}" step="1" value="${sp.val}">
      <span class="mono">${sp.max}</span></div>
    <div class="ar2"><input id="am-n" type="number" min="${sp.min}" max="${sp.max}" step="1"
        inputmode="numeric" value="${sp.val}">
      <button type="button" class="primary" id="am-ok">OK</button></div>`;
  popAt(flow.xy[0], flow.xy[1], html);
  const r = $('am-r'), n = $('am-n'), ok = $('am-ok');
  const valid = () => {
    const v = Number(n.value);
    return Number.isInteger(v) && v >= sp.min && v <= sp.max;
  };
  const sync = () => { ok.disabled = !valid(); n.classList.toggle('badv', !valid()); };
  r.addEventListener('input', () => { n.value = r.value; sync(); });
  n.addEventListener('input', () => { if (valid()) r.value = n.value; sync(); });
  n.addEventListener('change', () => {
    let v = Math.round(Number(n.value));
    if (!Number.isFinite(v)) v = sp.min;
    n.value = String(Math.max(sp.min, Math.min(sp.max, v)));
    r.value = n.value; sync();
  });
  ok.addEventListener('click', () => {
    if (!valid()) return;
    flow.params.v = Number(n.value);
    commitFlow();
  });
  const xb = $('pop').querySelector('[data-x]');
  if (xb) xb.addEventListener('click', cancelFlow);
  sync();
  n.focus();
}

// Interface outcome: the vote happened in the OTHER proved machine
// (KelGroups.Vote). No economic member is asked to authorize it here; the
// Step.lean responsabile carrier stays internal, and the machine-to-machine
// bridge is the unproved local join the badge names.
function openExternalConfirm() {
  const isGrant = flow.tag === 'grantPermission';
  const html = `<div class="pt">ponte voto → economia
      <span class="npvbadge" data-claims="join-vote-econ">NON PROVATO</span>
      <button type="button" class="xbtn2" data-x="1">✕</button></div>
    <div class="tiny">${esc(EV[flow.tag].it)} per «${esc(lbl(flow.params.c))}»</div>
    <div class="tiny">La domanda è stata DELIBERATA nel gruppo di voto: verdetto
      ${isGrant ? 'POSITIVO' : 'NEGATIVO'} deciso da
      <span class="mono">KelGroups.Vote.verdictOf</span> ${pkGlyph(['vote-verdict'])}.
      L'applicazione al ${isGrant ? 'permesso' : 'diniego'} economico è un ponte
      locale NON PROVATO fra le due macchine (#54 slice 2 / #48).</div>
    <div class="ar2"><button type="button" class="primary" id="ext-apply">applica esito</button></div>`;
  popAt(flow.xy[0], flow.xy[1], html);
  $('ext-apply').addEventListener('click', () => {
    flow.params.author = state.responsabili[0];   // machine adapter carrier only
    commitFlow();
  });
  const xb = $('pop').querySelector('[data-x]');
  if (xb) xb.addEventListener('click', cancelFlow);
}

function commitFlow() {
  closePop();
  const { tag, params, xy } = flow;
  flow = null;
  const args = {};
  for (const role of EV[tag].roles) {
    const k = ROLEKEY[role];
    if (k !== '_label') args[k] = params[k];
  }
  if (tag === 'openPurchase') args.c = params.c;
  if (EV[tag].amount) args.v = params.v;
  if (EV[tag].external) args.author = params.author;
  // base-enacted route (accepted pin): the task runs the REAL proposal
  // machine; the economic event applies only from a faithful enactment
  // through the bridge — never directly from this click
  if (EVENT_ROUTES[tag] === 'baseEnacted') {
    const preResp = JSON.stringify(state.responsabili);
    const r = startBaseGovChain(tag, args);
    renderAll();
    if (r.ok && JSON.stringify(state.responsabili) !== preResp)
      toast(`<b>🗳 DELIBERATA e applicata</b>
        <span class="tiny">enactment fedele del canale base · ponte economico NON PROVATO</span>`, xy[0], xy[1], 'ext');
    else if (r.ok)
      toast(`<b>🗳 proposta registrata</b>
        <span class="tiny">in attesa di approvazioni nel canale base (soglia ${bgMajority(bg)})</span>`, xy[0], xy[1], 'ext');
    else
      toast(`<b>✗ canale base</b> <span class="tiny">validazione: ${esc(r.error)} · stato invariato</span>`, xy[0], xy[1]);
    return;
  }
  const preState = state;
  const preLayout = { ...layout };
  const res = runAttempt(tag, args, params._label);
  renderAll();
  if (res.ok) {
    if (nav().view === 'group') playFx(tag, args, preState, preLayout);
    if (EV[tag].external)
      toast(`<b>⇣ esito esterno applicato</b>
        <span class="tiny">verdetto modellato nel voto; ponte verso l'economia NON PROVATO</span>`, xy[0], xy[1], 'ext');
  } else {
    toast(`<b>✗ ${esc(EV[tag].it)}</b> ` +
      res.failed.map(guardChip).join(' ') +
      (refusalProven(tag) ? '' :
        ' <span class="npvbadge" data-claims="refusal-unproved">NON PROVATO</span>') +
      ` <span class="tiny">stato invariato</span>`, xy[0], xy[1]);
  }
}

/* direct actions with every parameter already known (referente queue) */
function directAct(tag, args, x, y) {
  flow = { tag, params: { ...args }, steps: [], xy: [x, y] };
  nextStep();
}

function taskBtn(tag, ctx, extra) {
  const dis = taskDis(tag, ctx);
  const it = (extra && extra.label) || EV[tag].it;
  const ext = EV[tag].external;
  if (dis) {
    // a spent affordance stays clickable: the click opens the guard's proof
    // (or its honest NON PROVATO refusal status) instead of starting the task
    const claims = dis.claims ? dis.claims.slice() : [];
    if (!dis.claims) {
      if (GUARD_CLAIMS[dis.badge]) claims.push(GUARD_CLAIMS[dis.badge]);
      claims.push(...refusalClaims(tag));
    }
    return `<button type="button" class="task off${ext ? ' ext' : ''}" aria-disabled="true"
      data-task="${tag}" data-off-claims="${claims.join(',')}" title="${esc(dis.note)}">${esc(it)}
      <span class="${ext ? 'gbx' : (dis.badge === '—' ? 'gb dim' : 'gb')}">${esc(dis.badge === '—' ? dis.note || '—' : dis.badge)}</span></button>`;
  }
  const extBadge = ' <span class="npvbadge" data-claims="join-vote-econ">PONTE NON PROVATO</span>';
  return `<button type="button" class="task${ext ? ' ext' : ''}" data-task="${tag}"
    title=".${tag}">${esc(it)}${ext ? extBadge : ''}</button>`;
}

function recentFor(u) {
  const name = nm(u);
  const rel = history.filter(en =>
    (en.args && Object.values(en.args).includes(u)) ||
    (en.flow && en.flow.includes(name))).slice(0, 4);
  if (!rel.length) return '<p class="empty">nessun movimento</p>';
  return `<div class="rows">${rel.map(en =>
    `<div class="row" style="cursor:default">${en.kind === 'acc' ? (en.ext ? '⇣' : '✓') : '✗'}
      <span>${esc(en.descr)}</span></div>`).join('')}</div>`;
}

/* per-franchise-member cast buttons for one open question; the voter's
   CURRENT position is spent (affordance), the other stays live: switching is
   always possible and repeating never double-counts (placeBallot) */
function castButtonsHtml(qid, q) {
  return vtFranchise(kg).map(k => {
    const inA = q.assents.includes(k), inD = q.dissents.includes(k);
    return `<span class="linkchip" style="cursor:default;background:#fff">${esc(kgName(k))}
      <button type="button" class="mini" data-kgcast="${esc(qid)}" data-kgsigner="${esc(k)}"
        data-kgballot="assent" title=".cast .assent"${inA ? ' disabled' : ''}>sì</button>
      <button type="button" class="mini no" data-kgcast="${esc(qid)}" data-kgsigner="${esc(k)}"
        data-kgballot="dissent" title=".cast .dissent"${inD ? ' disabled' : ''}>no</button></span>`;
  }).join('');
}

function questionHtml(qid, q, titleTx) {
  const th = vtTheta(vtFranchiseSize(kg));
  const kindTx = vtPermKind(q.kind)
    ? `per-persona: decide solo ${esc(kgName(vtPermKind(q.kind).designee))} ${pkGlyph(['vote-permission-kind'])}`
    : `collettiva · soglia ${th} su ${vtFranchiseSize(kg)} ${pkGlyph(['vote-threshold-exhibit', 'kg-majority', 'kg-tie'])}`;
  return `<div class="vq"><div class="qh">🗳 ${titleTx}
      <span class="qs">sì ${q.assents.length} · no ${q.dissents.length}</span></div>
    <div class="tiny">${kindTx} · aperta con conteggi vuoti ${pkGlyph(['vote-open-empty'])}
      · il primo lato a soglia chiude ${pkGlyph(['vote-verdict', 'vote-sweep'])}</div>
    <div class="tasks" style="margin-top:4px">${castButtonsHtml(qid, q)}</div>
  </div>`;
}

/* the per-acquisto vote question: open → cast → verdict → unproved bridge */
function collGovHtml(col) {
  const label = lbl(col.id);
  const qid = permQid(col.id);
  if (col.permitted)
    return `<div class="tiny">permesso già applicato ⇣</div>`;
  const v = vtVerdictFor(col.id);
  if (v === 'positive')
    return `<div class="vq"><div class="qh">🗳 «${esc(qid)}» — CHIUSA POSITIVA
      ${pkGlyph(['vote-nostale', 'vote-partition'])}</div>
      <div class="tiny">la delibera è della macchina di voto; il ponte economico qui sotto resta
        <span class="npvbadge" data-claims="join-vote-econ">NON PROVATO</span></div></div>`;
  if (v === 'negative')
    return `<div class="vq"><div class="qh">🗳 «${esc(qid)}» — CHIUSA NEGATIVA
      ${pkGlyph(['vote-verdict', 'vote-partition'])}</div>
      <div class="tiny">il dissenso ha raggiunto la soglia; l'esito economico negativo qui sotto è un ponte
        <span class="npvbadge" data-claims="join-vote-econ">NON PROVATO</span></div></div>`;
  if (v === 'pending') {
    const q = vtLookup(qid, kg.openQuestions);
    return questionHtml(qid, q, `domanda in votazione: «permesso per ${esc(label)}»`);
  }
  const ready = vtFranchiseSize(kg) > 0;
  return `<div class="vq"><div class="qh">🗳 nessuna domanda di assenso per «${esc(label)}»</div>
    ${ready
      ? `<div class="tasks" style="margin-top:4px">
          <button type="button" class="linkchip" data-kgpropose="${col.id}" title=".openQuestion">
            apri la domanda: permesso per «${esc(label)}»</button></div>
         <div class="tiny">domanda reale: <span class="mono">.openQuestion ${esc(qid)} .collective</span>
           — il legame con questo acquisto è decorazione del toy
           <span class="npvbadge" data-claims="join-vote-econ">NON PROVATO</span></div>`
      : `<div class="tiny">ammetti prima dei responsabili al gruppo di voto (vista Gruppo)</div>`}
  </div>`;
}

/* group-view governance card: the second machine, observable and usable */
function govCardHtml() {
  const fr = vtFranchise(kg);
  const th = vtTheta(fr.length);
  const candidates2 = state.users.filter(u => !vtLookup(kgKey(u), kg.members));
  const removable = kg.members.map(([k]) => k);
  const qs = kg.openQuestions.map(([qid, q]) =>
    questionHtml(qid, q, `«${esc(qid)}» (aperta da ${esc(kgName(q.proposer))})`)).join('');
  const closedTail = kg.closed.slice(-3).map(r =>
    `<div class="tiny">🗳 «${esc(r.questionId)}» — ${r.verdict === 'positive' ? 'POSITIVA' : 'NEGATIVA'}
      (${r.cause === 'tally' ? 'soglia' : 'cambio di elettorato'})
      · sì ${r.question.assents.length} / no ${r.question.dissents.length}</div>`).join('');
  const body = `<div class="tiny">elettorato (responsabili del voto): ${fr.length
      ? fr.map(k => esc(kgName(k))).join(', ') : '<i>nessuno</i>'}
      · soglia (n+1)/2 = <b>${th}</b> ${pkGlyph(['vote-threshold-exhibit', 'kg-majority', 'kg-tie'])}
      — parametro esplicito, esibizione legacy ${pkGlyph(['vote-policyfree'])}</div>
    <div class="tasks" style="margin-top:5px">
      ${candidates2.length ? `<button type="button" class="linkchip" data-kgadmit="1"
        title=".admitMember">ammetti al voto… ${pkGlyph(['vote-admit-plain'])}</button>` : ''}
      ${removable.length ? `<button type="button" class="linkchip" data-kgremove="1"
        title=".removeMember">rimuovi dal voto…</button>` : ''}
    </div>
    ${qs || '<p class="empty">nessuna domanda in votazione</p>'}
    ${closedTail}`;
  // base channel: members with roles, pending proposals with approvals,
  // and any minted-but-unconsumed faithful credits
  const bgAdmins = bg.members.filter(([, m]) => vtHasAdmin(m.roles)).map(([k]) => k);
  const bgPend = bg.pendingProposals.map(([pid, pp]) => {
    const missing = bgAdmins.filter(k => !pp.approvals.includes(k));
    return `<div class="vq"><div class="qh">⚖ «${esc(pid)}»
        <span class="qs">assensi ${pp.approvals.length} / soglia ${bgMajority(bg)}</span></div>
      <div class="tiny">proposta di ${esc(kgName(pp.proposer))} — chi propone è già fra gli assensi
        ${pkGlyph(['kg-proposer', 'kg-nodup'])}</div>
      <div class="tasks" style="margin-top:4px">${missing.map(k =>
        `<button type="button" class="mini" data-bgapprove="${esc(pid)}"
          data-bgsigner="${esc(k)}" title=".approve">approva: ${esc(kgName(k))}</button>`).join('')
        || '<span class="tiny">nessun altro admin può approvare</span>'}</div>
    </div>`;
  }).join('');
  const bgCreditTx = bgCredits.length
    ? `<div class="tiny">enactment fedeli non ancora consumati: ${bgCredits.map(cr =>
        `<span class="mono">«${esc(cr.pid)}»</span>`).join(' ')}
        <span class="npvbadge" data-claims="join-vote-econ">PONTE NON PROVATO</span></div>` : '';
  const baseBody = `<div class="sect" style="margin-top:8px">canale base — proposte
      <span class="mono">KelGroups (fedele: changeRoles, removeMember)</span></div>
    <div class="tiny">membri: ${bg.members.length
      ? bg.members.map(([k, m]) => esc(kgName(k)) + (vtHasAdmin(m.roles) ? ' ★' : '')).join(', ')
      : '<i>vuoto — la prima elezione fonda il canale (bootstrap)</i>'}
      · maggioranza (n+1)/2 = <b>${bgMajority(bg)}</b> ${pkGlyph(['kg-majority-def', 'kg-threshold'])}</div>
    <div class="tiny">eleggere o revocare un responsabile passa SOLO di qui: proposta fedele →
      assensi a maggioranza → enactment → ponte economico
      ${pkGlyph(['comp-routing', 'comp-base-threshold'])}
      <span class="npvbadge" data-claims="join-vote-econ">PONTE NON PROVATO</span></div>
    ${bgPend}${bgCreditTx}`;
  return `<div class="card" id="govcard">
    <h2>Gruppo di voto <small class="mono">KelGroups.Vote — modello richiesto (#54)</small></h2>
    ${body}
    ${baseBody}
    <div class="tiny" id="gov-status" style="margin-top:6px">verdetti sì/no/aperta, dissenso e
      permessi per-persona sono MODELLATI; le prove del modello sono
      <b>enunciate, non dimostrate</b>
      <span class="npvbadge" data-claims="vote-model-status">stato</span> ·
      composizione accettata al pin: instradamento totale dei 18 costruttori
      ${pkGlyph(['comp-routing', 'comp-app-verdict', 'comp-witness'])} ·
      il ponte con l'economia resta
      <span class="npvbadge" data-claims="join-vote-econ">NON PROVATO</span></div>
  </div>`;
}

function kgChipPop(title, chips, x, y, cb) {
  const html = `<div class="pt">${esc(title)}
      <button type="button" class="xbtn2" data-x="1">✕</button></div>
    <div class="chips">` + (chips.length
      ? chips.map(ch => `<button type="button" class="chip" data-id="${esc(ch.id)}">${esc(ch.label)}</button>`).join('')
      : '<span class="empty">niente da scegliere</span>') + '</div>';
  popAt(x, y, html);
  $('pop').querySelectorAll('.chip[data-id]').forEach(b =>
    b.addEventListener('click', ev => { closePop(); cb(b.dataset.id, ev.clientX, ev.clientY); }));
  const xb = $('pop').querySelector('[data-x]');
  if (xb) xb.addEventListener('click', closePop);
}

/* --- FX (group scene only) ------------------------------------------------ */

const SVGNS = 'http://www.w3.org/2000/svg';

function fxLayer() { const s = $('scene'); return s ? s.querySelector('#fx') : null; }

function fly(fk, tk, txt, delay, pre) {
  delay = delay || 0;
  const f = layout[fk] || (pre && pre[fk]) || layout.world;
  const t = layout[tk] || (pre && pre[tk]) || layout.world;
  const gEl = document.createElementNS(SVGNS, 'g');
  const c = document.createElementNS(SVGNS, 'circle');
  c.setAttribute('class', 'coin'); c.setAttribute('r', '8');
  const tx = document.createElementNS(SVGNS, 'text');
  tx.setAttribute('class', 'cointx'); tx.setAttribute('y', '-13');
  tx.textContent = txt;
  gEl.appendChild(c); gEl.appendChild(tx);
  const start = performance.now() + delay;
  const dur = 700;
  function frame(now) {
    const layer = fxLayer();
    if (!layer) return;
    if (!gEl.parentNode && now >= start - 20) layer.appendChild(gEl);
    const u = Math.min(1, Math.max(0, (now - start) / dur));
    const e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    const x = f.x + (t.x - f.x) * e;
    const y = f.y + (t.y - f.y) * e - 46 * Math.sin(Math.PI * u);
    gEl.setAttribute('transform', `translate(${x},${y})`);
    if (u < 1) requestAnimationFrame(frame);
    else gEl.remove();
  }
  requestAnimationFrame(frame);
}

function floatTx(k, txt, color, delay, pre) {
  const p = layout[k] || (pre && pre[k]);
  if (!p) return;
  const tx = document.createElementNS(SVGNS, 'text');
  tx.setAttribute('class', 'floattx');
  tx.setAttribute('fill', color || '#1c7c43');
  tx.textContent = txt;
  const start = performance.now() + (delay || 0);
  const dur = 1000;
  function frame(now) {
    const layer = fxLayer();
    if (!layer) return;
    if (!tx.parentNode && now >= start - 20) layer.appendChild(tx);
    const u = Math.min(1, Math.max(0, (now - start) / dur));
    tx.setAttribute('x', p.x); tx.setAttribute('y', p.y - 20 - 26 * u);
    tx.setAttribute('opacity', String(1 - u * u));
    if (u < 1) requestAnimationFrame(frame);
    else tx.remove();
  }
  requestAnimationFrame(frame);
}

function flashKeys(keys) {
  const s = $('scene');
  if (!s) return;
  for (const k of keys) {
    const el = s.querySelector(`[data-key="${k}"]`);
    if (el) el.classList.add('nflash');
  }
}

function playFx(tag, a, preState, pre) {
  const preCol = c => preState.collections.find(x => x.id === c);
  switch (tag) {
    case 'addUser': flashKeys([`member:${a.target}`, `conto:${a.target}`]); break;
    case 'electResponsabile':
      floatTx(`member:${a.target}`, '★', '#b98a1c'); flashKeys([`cassa:${a.target}`]); break;
    case 'removeResponsabile': {
      floatTx(`member:${a.target}`, '★✕', '#b3261e', 0, pre);
      const [, ps] = stripCollections(a.target, preState.collections);
      ps.forEach((p, i) => floatTx(`conto:${p.user}`, `+${p.amount}`, '#1c7c43', 150 + i * 130, pre));
      break;
    }
    case 'openPurchase': flashKeys([`pile:${a.c}`]); break;
    case 'grantPermission': floatTx(`pile:${a.c}`, '⇣ L2 ✓ esito esterno', '#5b3e96'); break;
    case 'denyPermission': {
      const col = preCol(a.c);
      [...col.accepted, ...col.pending].forEach((p, i) =>
        fly(`pile:${a.c}`, `conto:${p.user}`, `+${p.amount}`, i * 140, pre));
      break;
    }
    case 'deposit':
      fly(`member:${a.user}`, `cassa:${a.author}`, String(a.v));
      floatTx(`conto:${a.user}`, `+${a.v}`, '#1c7c43', 250);
      flashKeys([`conto:${a.user}`, `cassa:${a.author}`]);
      break;
    case 'withdraw':
      fly(`cassa:${a.author}`, `member:${a.user}`, String(a.v));
      floatTx(`conto:${a.user}`, `−${a.v}`, '#b3261e', 250);
      flashKeys([`conto:${a.user}`, `cassa:${a.author}`]);
      break;
    case 'transferCassa':
      fly(`cassa:${a.from_}`, `cassa:${a.author}`, String(a.v));
      flashKeys([`cassa:${a.from_}`, `cassa:${a.author}`]);
      break;
    case 'pledge':
      fly(`conto:${a.user}`, `pile:${a.c}`, String(a.v));
      flashKeys([`conto:${a.user}`, `pile:${a.c}`]);
      break;
    case 'acceptPledge':
      floatTx(`pile:${a.c}`, `✓ ${nm(a.user)}`, '#1c7c43'); flashKeys([`pile:${a.c}`]); break;
    case 'refusePledge': {
      const sp = splitUser(a.user, preCol(a.c).pending);
      fly(`pile:${a.c}`, `conto:${a.user}`, `+${sp ? sp[0] : ''}`, 0, pre);
      break;
    }
    case 'correctPledge': {
      const sp = splitUser(a.user, preCol(a.c).accepted);
      const d = (sp ? sp[0] : 0) - a.v;
      if (d > 0) fly(`pile:${a.c}`, `conto:${a.user}`, `+${d}`, 0, pre);
      else if (d < 0) fly(`conto:${a.user}`, `pile:${a.c}`, String(-d), 0, pre);
      else floatTx(`pile:${a.c}`, '=', '#5b6b7b', 0, pre);
      break;
    }
    case 'closePurchase': {
      const tot = sumPledges(preCol(a.c).accepted);
      fly(`pile:${a.c}`, 'world', String(tot), 0, pre);
      fly(`cassa:${preCol(a.c).referente}`, 'world', String(tot), 160, pre);
      flashKeys([`cassa:${preCol(a.c).referente}`]);
      break;
    }
    case 'failPurchase': {
      const col = preCol(a.c);
      [...col.accepted, ...col.pending].forEach((p, i) =>
        fly(`pile:${a.c}`, `conto:${p.user}`, `+${p.amount}`, i * 140, pre));
      break;
    }
  }
}

function toast(html, x, y, cls) {
  const t = document.createElement('div');
  t.className = 'toast' + (cls ? ' ' + cls : '');
  t.innerHTML = html;
  document.body.appendChild(t);
  const w = t.offsetWidth, h = t.offsetHeight;
  t.style.left = Math.max(6, Math.min(x - w / 2, innerWidth - w - 6)) + 'px';
  t.style.top = Math.max(6, Math.min(y - h - 16, innerHeight - h - 6)) + 'px';
  setTimeout(() => t.remove(), 3600);
}

/* --- Popover plumbing ------------------------------------------------------ */

function popAt(x, y, html) {
  const pop = $('pop');
  pop.hidden = false;
  pop.innerHTML = `<div class="pbox">${html}</div>`;
  pop.style.left = '0px'; pop.style.top = '0px';
  const box = pop.firstElementChild;
  const w = box.offsetWidth, h = box.offsetHeight;
  pop.style.left = Math.max(6, Math.min(x + 10, innerWidth - w - 8)) + 'px';
  pop.style.top = Math.max(6, Math.min(y + 10, innerHeight - h - 8)) + 'px';
}

function closePop() { const p = $('pop'); p.hidden = true; p.innerHTML = ''; }

      runVoteEvent(kgEl.dataset.kgsigner, { cast:
        { questionId: kgEl.dataset.kgcast, ballot: kgEl.dataset.kgballot } });
      renderAll();
    }
    return;

  if (pres && t.closest('[data-task],[data-act]')) {
    toast('<b>presentazione</b> <span class="tiny">sola lettura — esci per agire</span>',
      ev.clientX, ev.clientY, 'ext');
    return;

  const offEl = t.closest('.task.off[data-off-claims]');
  if (offEl) {
