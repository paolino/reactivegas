  #inv-chip.pulse { animation: chippulse .7s ease-out; }

  #nav-back {

<body>
<header>
  <h1>Reactivegas <small class="mono">Types.lean · Step.lean — 15 eventi</small></h1>
  <div class="hbtns">
    <button type="button" id="inv-chip" class="ok" title="Σ casse − Σ conti − Σ escrow — clicca per dettaglio e contro-fattuale">⚖ <b>0 ✓</b></button>
    <button type="button" class="ghost danger" id="btn-reset" title="State.init 0">Reset</button>
  </div>
</header>

<div id="crumbbar">
  <button type="button" id="nav-back" title="torna indietro">←</button>
  <nav id="crumbs" aria-label="percorso"></nav>
</div>

<main>
  <section id="view"></section>
  <aside id="side">
    <div class="card" id="done-card">
      <h2>Acquisti completati <small>solo <span class="mono">closePurchase</span></small></h2>
      <div id="done-body"><p class="empty">nessuno</p></div>
    </div>
    <div class="card" id="history-card">
      <h2>Storia <small>✓ accettati · ✗ respinti · ⇣ esiti esterni</small></h2>
      <div id="log"><p class="empty">nessun tentativo</p></div>
    </div>
  </aside>
</main>

<div id="pop" hidden></div>

<script>
'use strict';
/* =====================================================================
   Machine core: faithful transcription of
   lean/Reactivegas/{Types,State,Step}.lean.
   State: { users:[Nat], responsabili:[Nat],
            conti:[[u,v]], casse:[[u,v]],
            collections:[{id, referente, permitted, accepted:[{user,amount}],
                          pending:[{user,amount}]}] }
   Toy-side decoration (names, purchase labels, snapshots, navigation,
   hats, tasks) never enters machine state or events; UserId/CollId stay
   numeric inside.
   ===================================================================== */

const FOUNDER = 0;

/* --- Toy-side fixed name/label pools (decoration, outside the machine) -- */

const NAMES = ['Anna', 'Bruno', 'Elena', 'Carlo', 'Dora', 'Enzo',
               'Febe', 'Gaia', 'Hugo', 'Irma', 'Luca', 'Mara'];
const nm = u => NAMES[u] !== undefined ? NAMES[u] : '?';
const PRESETS = ['Olio', 'Vino', 'Farina', 'Caffè', 'Miele', 'Pasta', 'Riso', 'Sale'];
let colLabels = {};                       // CollId -> toy label
const lbl = c => colLabels[c] !== undefined ? colLabels[c] : '?';

/* --- State.lean helpers ------------------------------------------------ */

// State.init r := ⟨[r], [r], [], [], []⟩
function initState(r) {
  return { users: [r], responsabili: [r], conti: [], casse: [], collections: [] };
}

// bal: first matching entry, absent means zero
function bal(m, u) {
  for (const [k, v] of m) if (k === u) return v;
  return 0;
}

// bump: add d to the first entry of u, appending a fresh entry when absent
function bump(m, u, d) {
  const out = [];
  let done = false;
  for (const [k, v] of m) {
    if (!done && k === u) { out.push([k, v + d]); done = true; }
    else out.push([k, v]);
  }
  if (!done) out.push([u, d]);
  return out;
}

function sumBal(m) { return m.reduce((a, [, v]) => a + v, 0); }
function sumPledges(l) { return l.reduce((a, p) => a + p.amount, 0); }
function escrowOf(c) { return sumPledges(c.accepted) + sumPledges(c.pending); }
function escrowSum(cols) { return cols.reduce((a, c) => a + escrowOf(c), 0); }

// splitUser: first pledge of u, and the list without it; null when absent
function splitUser(u, l) {
  const i = l.findIndex(p => p.user === u);
  if (i < 0) return null;
  return [l[i].amount, l.slice(0, i).concat(l.slice(i + 1))];
}

// refundAll: foldl bump
function refundAll(m, l) {
  return l.reduce((acc, p) => bump(acc, p.user, p.amount), m);
}

// pullCollection: the collection with id c, and the list without it
function pullCollection(c, cols) {
  const i = cols.findIndex(x => x.id === c);
  if (i < 0) return null;
  return [cols[i], cols.slice(0, i).concat(cols.slice(i + 1))];
}

// stripCollections: remove collections whose referente is r; collect their
// pledges (accepted ++ pending, in list order) for refunding
function stripCollections(r, cols) {
  const rest = [], ps = [];
  for (const c of cols) {
    if (c.referente === r) { ps.push(...c.accepted, ...c.pending); }
    else rest.push(c);
  }
  return [rest, ps];
}

function isResponsabile(s, u) { return s.responsabili.includes(u); }

/* --- Guard labels (canonical Lean code + toy-side why text) ------------ */

const g = (code, why, law) => ({ code, why, law: law || null });
const AUTH = a => g('isResponsabile s a', `${nm(a)} non è responsabile`, 'AUTH');
const PULL = c => g('pullCollection c = none', `nessun acquisto aperto «${lbl(c)}»`);

/* --- Step.lean: the rejecting transition, with named guards ------------
   attempt(s,e) → {ok:true, state, flow} | {ok:false, failed:[guard]}
   The accept/reject decision is exactly the Lean conjunction; `failed`
   lists every failing guard that is evaluable (guards depending on a
   failed pullCollection/splitUser cannot be evaluated and are skipped). */

function attempt(s, e) {
  const fails = [];
  const need = (cond, guard) => { if (!cond) fails.push(guard); return cond; };
  const rej = () => ({ ok: false, failed: fails });

  switch (e.tag) {

    case 'addUser': {
      need(isResponsabile(s, e.author), AUTH(e.author));
      need(!s.users.includes(e.target),
        g('!s.users.contains u', `${nm(e.target)} è già nel gruppo`));
      if (fails.length) return rej();
      return { ok: true, flow: `${nm(e.target)} entra nel gruppo`,
        state: { ...s, users: [...s.users, e.target] } };
    }

    case 'electResponsabile': {
      need(isResponsabile(s, e.author), AUTH(e.author));
      need(s.users.includes(e.target),
        g('s.users.contains u', `${nm(e.target)} non è nel gruppo`));
      need(!isResponsabile(s, e.target),
        g('!isResponsabile s u', `${nm(e.target)} è già responsabile`));
      if (fails.length) return rej();
      return { ok: true, flow: `★ ${nm(e.target)} è responsabile`,
        state: { ...s, responsabili: [e.target, ...s.responsabili] } };
    }

    case 'removeResponsabile': {
      need(isResponsabile(s, e.author), AUTH(e.author));
      need(isResponsabile(s, e.target),
        g('isResponsabile s u', `${nm(e.target)} non è responsabile`));
      if (fails.length) return rej();
      const [rest, ps] = stripCollections(e.target, s.collections);
      const i = s.responsabili.indexOf(e.target);
      const resps = s.responsabili.slice(0, i).concat(s.responsabili.slice(i + 1));
      const flow = ps.length
        ? `★✕ ${nm(e.target)} · suoi acquisti chiusi, rimborsi: ` +
          ps.map(p => `conto ${nm(p.user)} +${p.amount}`).join(', ')
        : `★✕ ${nm(e.target)} · nessuna colletta da chiudere`;
      return { ok: true, flow,
        state: { ...s, responsabili: resps, conti: refundAll(s.conti, ps), collections: rest } };
    }

    case 'openPurchase': {
      need(isResponsabile(s, e.author), AUTH(e.author));
      need(!s.collections.some(x => x.id === e.c),
        g('!(s.collections.any (x.id == c))', `acquisto «${lbl(e.c)}» già aperto`));
      if (fails.length) return rej();
      return { ok: true,
        flow: `apre l'acquisto «${lbl(e.c)}» — referente ${nm(e.author)}, permesso: no, impegni 0`,
        state: { ...s, collections:
          [{ id: e.c, referente: e.author, permitted: false, accepted: [], pending: [] },
           ...s.collections] } };
    }

    case 'grantPermission': {
      const pulled = pullCollection(e.c, s.collections);
      need(pulled !== null, PULL(e.c));
      need(isResponsabile(s, e.author), AUTH(e.author));
      if (fails.length) return rej();
      const [col, rest] = pulled;
      return { ok: true, flow: `«${lbl(e.c)}»: assenso del gruppo — permesso di chiusura concesso (L2 ✓)`,
        state: { ...s, collections: [{ ...col, permitted: true }, ...rest] } };
    }

    case 'denyPermission': {
      const pulled = pullCollection(e.c, s.collections);
      need(pulled !== null, PULL(e.c));
      need(isResponsabile(s, e.author), AUTH(e.author));
      if (fails.length) return rej();
      const [col, rest] = pulled;
      const ps = [...col.accepted, ...col.pending];
      return { ok: true,
        flow: `acquisto «${lbl(e.c)}» negato e chiuso · rimborsi: ` +
          (ps.length ? ps.map(p => `conto ${nm(p.user)} +${p.amount}`).join(', ') : 'nessuno'),
        state: { ...s, conti: refundAll(s.conti, ps), collections: rest } };
    }

    case 'deposit': {
      need(isResponsabile(s, e.author), AUTH(e.author));
      need(s.users.includes(e.user),
        g('s.users.contains u', `${nm(e.user)} non è nel gruppo`));
      need(e.author !== e.user,
        g('a != u', 'autore e utente devono essere diversi'));
      need(0 <= e.v, g('0 ≤ v', `importo negativo (${e.v})`));
      if (fails.length) return rej();
      return { ok: true, flow: `accredito: conto ${nm(e.user)} +${e.v} · cassa ${nm(e.author)} +${e.v}`,
        state: { ...s, conti: bump(s.conti, e.user, e.v), casse: bump(s.casse, e.author, e.v) } };
    }

    case 'withdraw': {
      need(isResponsabile(s, e.author), AUTH(e.author));
      need(s.users.includes(e.user),
        g('s.users.contains u', `${nm(e.user)} non è nel gruppo`));
      need(e.author !== e.user,
        g('a != u', 'autore e utente devono essere diversi'));
      need(bal(s.conti, e.user) >= e.v,
        g('bal s.conti u ≥ v',
          `credito insufficiente: conto ${nm(e.user)} = ${bal(s.conti, e.user)} < ${e.v}`,
          'COVERED (L7)'));
      if (fails.length) return rej();
      return { ok: true, flow: `prelievo: conto ${nm(e.user)} −${e.v} · cassa ${nm(e.author)} −${e.v}`,
        state: { ...s, conti: bump(s.conti, e.user, -e.v), casse: bump(s.casse, e.author, -e.v) } };
    }

    case 'transferCassa': {
      need(isResponsabile(s, e.author), AUTH(e.author));
      need(isResponsabile(s, e.from_),
        g('isResponsabile s f', `${nm(e.from_)} non è responsabile`, 'AUTH'));
      need(e.author !== e.from_,
        g('a != f', 'autore e mittente devono essere diversi'));
      need(e.v > 0, g('v > 0', `l'importo deve essere positivo (${e.v})`));
      if (fails.length) return rej();
      return { ok: true, flow: `cassa ${nm(e.from_)} −${e.v} → cassa ${nm(e.author)} +${e.v}`,
        state: { ...s, casse: bump(bump(s.casse, e.from_, -e.v), e.author, e.v) } };
    }

    case 'pledge': {
      const pulled = pullCollection(e.c, s.collections);
      need(pulled !== null, PULL(e.c));
      need(isResponsabile(s, e.author), AUTH(e.author));
      need(s.users.includes(e.user),
        g('s.users.contains u', `${nm(e.user)} non è nel gruppo`));
      if (pulled) {
        const [col] = pulled;
        need(!col.accepted.some(p => p.user === e.user),
          g('!(col.accepted.any (p.user == u))',
            `${nm(e.user)} ha già un impegno accettato in «${lbl(e.c)}»`, 'L8'));
        need(!col.pending.some(p => p.user === e.user),
          g('!(col.pending.any (p.user == u))',
            `${nm(e.user)} ha già un impegno pendente in «${lbl(e.c)}»`, 'L8'));
      }
      need(0 < e.v, g('0 < v', `l'impegno deve essere positivo (${e.v})`, 'COVERED (L7)'));
      need(bal(s.conti, e.user) >= e.v,
        g('bal s.conti u ≥ v',
          `credito insufficiente: conto ${nm(e.user)} = ${bal(s.conti, e.user)} < ${e.v}`,
          'COVERED (L7)'));
      if (fails.length) return rej();
      const [col, rest] = pulled;
      return { ok: true,
        flow: `impegno: conto ${nm(e.user)} −${e.v} → impegni di «${lbl(e.c)}» (pendente)`,
        state: { ...s, conti: bump(s.conti, e.user, -e.v),
          collections: [{ ...col, pending: [{ user: e.user, amount: e.v }, ...col.pending] },
                        ...rest] } };
    }

    case 'acceptPledge': {
      const pulled = pullCollection(e.c, s.collections);
      need(pulled !== null, PULL(e.c));
      let split = null;
      if (pulled) {
        split = splitUser(e.user, pulled[0].pending);
        need(split !== null,
          g('splitUser u col.pending = none',
            `${nm(e.user)} non ha un impegno pendente in «${lbl(e.c)}»`));
        need(pulled[0].referente === e.author,
          g('col.referente == a',
            `solo il referente (${nm(pulled[0].referente)}) può accettare`, 'REFERENTE'));
      }
      need(isResponsabile(s, e.author), AUTH(e.author));
      if (fails.length) return rej();
      const [col, rest] = pulled;
      const [v, pend2] = split;
      return { ok: true,
        flow: `«${lbl(e.c)}»: impegno di ${nm(e.user)} (${v}) pendente → accettato`,
        state: { ...s, collections:
          [{ ...col, pending: pend2, accepted: [{ user: e.user, amount: v }, ...col.accepted] },
           ...rest] } };
    }

    case 'refusePledge': {
      const pulled = pullCollection(e.c, s.collections);
      need(pulled !== null, PULL(e.c));
      let split = null;
      if (pulled) {
        split = splitUser(e.user, pulled[0].pending);
        need(split !== null,
          g('splitUser u col.pending = none',
            `${nm(e.user)} non ha un impegno pendente in «${lbl(e.c)}»`));
        need(pulled[0].referente === e.author,
          g('col.referente == a',
            `solo il referente (${nm(pulled[0].referente)}) può rifiutare`, 'REFERENTE'));
      }
      need(isResponsabile(s, e.author), AUTH(e.author));
      if (fails.length) return rej();
      const [col, rest] = pulled;
      const [v, pend2] = split;
      return { ok: true,
        flow: `rimborso: impegni di «${lbl(e.c)}» −${v} → conto ${nm(e.user)} +${v}`,
        state: { ...s, conti: bump(s.conti, e.user, v),
          collections: [{ ...col, pending: pend2 }, ...rest] } };
    }

    case 'correctPledge': {
      const pulled = pullCollection(e.c, s.collections);
      need(pulled !== null, PULL(e.c));
      let split = null;
      if (pulled) {
        split = splitUser(e.user, pulled[0].accepted);
        need(split !== null,
          g('splitUser u col.accepted = none',
            `${nm(e.user)} non ha un impegno accettato in «${lbl(e.c)}»`));
        need(pulled[0].referente === e.author,
          g('col.referente == a',
            `solo il referente (${nm(pulled[0].referente)}) può correggere`, 'REFERENTE'));
      }
      need(isResponsabile(s, e.author), AUTH(e.author));
      need(0 <= e.v, g("0 ≤ v'", `il nuovo importo non può essere negativo (${e.v})`, 'COVERED (L7)'));
      if (split) {
        const v = split[0];
        need(bal(s.conti, e.user) + (v - e.v) >= 0,
          g("bal s.conti u + (v − v') ≥ 0",
            `il conguaglio manderebbe conto ${nm(e.user)} a ${bal(s.conti, e.user) + (v - e.v)} < 0`,
            'COVERED (L7)'));
      }
      if (fails.length) return rej();
      const [col, rest] = pulled;
      const [v, acc2] = split;
      const d = v - e.v;
      return { ok: true,
        flow: `impegno di ${nm(e.user)}: ${v} → ${e.v} · conto ${nm(e.user)} ` +
          (d >= 0 ? `+${d}` : `${d}`),
        state: { ...s, conti: bump(s.conti, e.user, d),
          collections: [{ ...col, accepted: [{ user: e.user, amount: e.v }, ...acc2] },
                        ...rest] } };
    }

    case 'closePurchase': {
      const pulled = pullCollection(e.c, s.collections);
      need(pulled !== null, PULL(e.c));
      need(isResponsabile(s, e.author), AUTH(e.author));
      if (pulled) {
        const [col] = pulled;
        need(col.referente === e.author,
          g('col.referente == a',
            `solo il referente (${nm(col.referente)}) può chiudere`, 'REFERENTE'));
        need(col.permitted,
          g('col.permitted', 'il gruppo non ha concesso il permesso di chiusura', 'PERMITTED (L2)'));
        need(col.pending.length === 0,
          g('col.pending.isEmpty',
            `restano ${col.pending.length} impegni pendenti`, 'NO-PENDING (L4)'));
      }
      if (fails.length) return rej();
      const [col, rest] = pulled;
      const tot = sumPledges(col.accepted);
      return { ok: true,
        flow: `acquisto «${lbl(e.c)}» chiuso: cassa ${nm(col.referente)} −${tot} · impegni −${tot} (spesi)`,
        state: { ...s, casse: bump(s.casse, col.referente, -tot), collections: rest } };
    }

    case 'failPurchase': {
      const pulled = pullCollection(e.c, s.collections);
      need(pulled !== null, PULL(e.c));
      need(isResponsabile(s, e.author), AUTH(e.author));
      if (pulled) {
        const [col] = pulled;
        need(col.referente === e.author,
          g('col.referente == a',
            `solo il referente (${nm(col.referente)}) può farla fallire`, 'REFERENTE'));
        need(col.pending.length === 0,
          g('col.pending.isEmpty',
            `restano ${col.pending.length} impegni pendenti`, 'NO-PENDING (L4)'));
      }
      if (fails.length) return rej();
      const [col, rest] = pulled;
      const ps = [...col.accepted, ...col.pending];
      return { ok: true,
        flow: `acquisto «${lbl(e.c)}» fallito · rimborsi: ` +
          (ps.length ? ps.map(p => `conto ${nm(p.user)} +${p.amount}`).join(', ') : 'nessuno'),
        state: { ...s, conti: refundAll(s.conti, ps), collections: rest } };
    }
  }
  throw new Error('unknown event tag: ' + e.tag);
}

/* --- Crude-drift net: lean/Reactivegas/Predicates.lean, transcribed ------
   The state invariants of the law predicates, asserted after every applied
   event: conservation (L6), solvent (L7, both conjuncts), allUniquePledges
   (L8, exactly the Lean predicate: p.user = q.user → p = q). The relational
   predicates (permissionToClose, escrowHeld, doubleEntry, authorizedStep,
   governanceEnacts) are per-event properties, not state invariants, and the
   trace-conformance net covers them. A violation here means the JS
   transcription diverged from Step.lean: surfaced loudly, never cleared. */

let lawBreaches = [];   // toy-side alarm record; selftest asserts it stays empty

function lawViolations(s) {
  const out = [];
  // conservation: sumBal casse − sumBal conti − escrowSum collections = 0
  if (sumBal(s.casse) - sumBal(s.conti) - escrowSum(s.collections) !== 0)
    out.push('conservation (L6)');
  // solvent, first conjunct: ∀ u, bal conti u ≥ 0 (absent entries are 0)
  if (s.conti.some(([, v]) => v < 0)) out.push('solvent (L7): conto negativo');
  for (const col of s.collections) {
    const all = [...col.accepted, ...col.pending];
    // solvent, second conjunct: every pledged amount non-negative
    if (all.some(p => p.amount < 0)) out.push(`solvent (L7): impegno negativo in «${lbl(col.id)}»`);
    // uniquePledges: p.user = q.user → p = q
    outer:
    for (let i = 0; i < all.length; i++)
      for (let j = i + 1; j < all.length; j++)
        if (all[i].user === all[j].user && all[i].amount !== all[j].amount) {
          out.push(`uniquePledges (L8) in «${lbl(col.id)}»`);
          break outer;
        }
  }
  return out;
}

function lawAlarm(viol, tag) {
  lawBreaches.push({ tag, viol });
  const b = document.createElement('div');
  b.className = 'lawbanner';
  b.textContent = `⚠ INVARIANTE LEAN VIOLATO dopo .${tag}: ${viol.join(' · ')} — trascrizione divergente da Predicates.lean`;
  document.body.appendChild(b);
}

function traceConformance() {
  let steps = 0;
  for (const name of Object.keys(LEAN_TRACES)) {
    let s = initState(FOUNDER);
    LEAN_TRACES[name].forEach((st, i) => {
      const res = attempt(s, st.e);
      if (!res.ok)
        throw new Error(`trace ${name} passo ${i} (.${st.e.tag}): respinto dal JS, accettato dal Lean`);
      s = res.state;
      if (canonState(s) !== canonState(st.s))
        throw new Error(`trace ${name} passo ${i} (.${st.e.tag}): stato divergente dal Lean`);
      const viol = lawViolations(s);
      if (viol.length)
        throw new Error(`trace ${name} passo ${i}: ${viol.join(' · ')}`);
      steps++;

function invSnapshot() {

        total: sumPledges(col.accepted) });
    }
    state = res.state;

    const viol = lawViolations(state);

    history.unshift({ kind: 'acc', tag, args, descr: d, flow: res.flow,
      ext: !!EV[tag].external, inv: invSnapshot() });

    case 'removeResponsabile':
      return state.responsabili.length ? null : B('AUTH', 'nessun responsabile');
    case 'openPurchase':
      if (ctx.author !== undefined && !resp(ctx.author)) return B('AUTH', 'non è responsabile');
      return state.responsabili.length ? null : B('AUTH', 'nessun responsabile');
    case 'deposit': case 'withdraw': {
      if (ctx.user !== undefined)
        return state.responsabili.some(r => r !== ctx.user) ? null : B('AUTH', 'serve un cassiere diverso');
      if (ctx.author !== undefined)
        return state.users.some(u => u !== ctx.author) ? null : B('—', 'serve un’altra persona');
      return null;
    }
    case 'transferCassa':
      return state.responsabili.some(r => r !== ctx.author) ? null : B('—', 'nessun’altra cassa');
    case 'pledge': {
      if (!cols.length) return B('—', 'nessun acquisto aperto');
      if (!state.responsabili.length) return B('AUTH', 'nessun responsabile');
      if (ctx.user !== undefined) {
        if (bal(state.conti, ctx.user) < 1) return B('COVERED (L7)', 'conto insufficiente');
        if (!cols.some(c => !inCol(c, ctx.user))) return B('L8', 'già in ogni acquisto');
        return null;
      }
      if (ctx.c !== undefined) {
        const col = cols.find(x => x.id === ctx.c);
        const cand = state.users.filter(u => !inCol(col, u));
        if (!cand.length) return B('L8', 'tutti hanno già un pledge');
        if (!cand.some(u => bal(state.conti, u) >= 1)) return B('COVERED (L7)', 'nessun conto capiente');
        return null;
      }
      return null;
    }
    case 'closePurchase': {
      const col = cols.find(x => x.id === ctx.c);
      if (!col.permitted) return B('PERMITTED (L2)', 'serve il permesso del gruppo');
      if (col.pending.length) return B('NO-PENDING (L4)', 'pledge pendenti da risolvere');
      return null;
    }
    case 'failPurchase': {
      const col = cols.find(x => x.id === ctx.c);

    }

/* Chip candidates for one task step: only existing objects; ineligible

function chipsFor(role) {
  const tag = flow.tag, p = flow.params;
  const col = p.c !== undefined ? state.collections.find(x => x.id === p.c) : null;
  const person = u => ({ id: u, label: `${resp(u) ? '★ ' : ''}${nm(u)}` });
  switch (role) {
    case 'author': {
      const refOps = ['acceptPledge', 'refusePledge', 'correctPledge', 'closePurchase', 'failPurchase'];
      return state.users.map(u => {
        const ch = person(u);
        if ((tag === 'deposit' || tag === 'withdraw') && p.user === u) ch.dis = 'a ≠ u';
        else if (tag === 'transferCassa' && p.from_ === u) ch.dis = 'a ≠ f';
        else if (!resp(u)) ch.dis = 'AUTH';
        else if (refOps.includes(tag) && col && col.referente !== u) ch.dis = 'REFERENTE';
        return ch;
      });
    }
    case 'user': return state.users.map(u => {
      const ch = person(u);
      if (p.author === u) ch.dis = 'a ≠ u';
      else if (tag === 'pledge') {
        if (col && inCol(col, u)) ch.dis = 'L8';
        else if (bal(state.conti, u) < 1) ch.dis = 'COVERED (L7)';
      }
      return ch;
    });
    case 'targetGhost': return candidates().map(person);
    case 'targetMember': return state.users.map(u => {
      const ch = person(u); if (resp(u)) ch.dis = 'già ★'; return ch;
    });
    case 'targetResp': return state.responsabili.map(person);
    case 'from': return state.responsabili.map(u => {
      const ch = { id: u, label: `★ ${nm(u)} · cassa ${bal(state.casse, u)}` };
      if (p.author === u) ch.dis = 'a ≠ f';
      return ch;
    });
    case 'coll': return state.collections.map(c => {
      const ch = { id: c.id, label: `«${lbl(c.id)}» · ${escrowOf(c)}` };
      if (tag === 'pledge' && p.user !== undefined && inCol(c, p.user)) ch.dis = 'L8';
      return ch;
    });
    case 'pendUser': return (col ? col.pending : []).map(q => person(q.user));
    case 'accUser': return (col ? col.accepted : []).map(q => person(q.user));
  }
  return [];
}

/* --- Amount bounds (values constrained by live sources) ------------------ */

const TOYMAX = 500;   // toy-side cap for unbounded-above amounts

function amountSpec(tag, p) {
  switch (tag) {
    case 'deposit':
      return { min: 0, max: TOYMAX, val: 50, what: `accredito: ${nm(p.user)} versa a ${nm(p.author)}` };
    case 'withdraw': {
      const b = Math.max(0, bal(state.conti, p.user));
      return { min: 0, max: b, val: Math.min(b, 20), what: `prelievo di ${nm(p.user)} (conto ${b})` };
    }
    case 'transferCassa':
      return { min: 1, max: TOYMAX, val: 50, what: `cassa ${nm(p.from_)} → cassa ${nm(p.author)}` };
    case 'pledge': {
      const b = bal(state.conti, p.user);
      return { min: 1, max: b, val: Math.min(b, 20), what: `impegno di ${nm(p.user)} su «${lbl(p.c)}» (conto ${b})` };
    }
    case 'correctPledge': {
      const col = state.collections.find(x => x.id === p.c);
      const cur = (col.accepted.find(q => q.user === p.user) || { amount: 0 }).amount;
      const mx = cur + Math.max(0, bal(state.conti, p.user));
      return { min: 0, max: mx, val: cur, what: `impegno di ${nm(p.user)}: ora ${cur}` };
    }
  }
  return null;
}

  for (let i = 1; i < navStack.length; i++) {
    const d = navStack[i];
    let ok = true;
    if (d.view === 'person') ok = state.users.includes(d.u);
    if (d.view === 'collection') ok = state.collections.some(x => x.id === d.c);
    if (d.view === 'pledge') {
      const col = state.collections.find(x => x.id === d.c);
      ok = !!col && (col.pending.some(p => p.user === d.pu) || col.accepted.some(p => p.user === d.pu));
    }
    if (!ok) { navStack = navStack.slice(0, i); break; }

function crumbLabel(d) {
  if (d.view === 'group') return 'Gruppo';
  if (d.view === 'person') return nm(d.u);
  if (d.view === 'collection') return `«${lbl(d.c)}»`;
  if (d.view === 'pledge') return `impegno di ${nm(d.pu)}`;

function renderCrumbs() {
  $('nav-back').disabled = navStack.length <= 1;
  $('crumbs').innerHTML = navStack.map((d, i) => {
    const here = i === navStack.length - 1;
    return (i ? '<span class="sep">›</span>' : '') +
      `<button type="button" class="cr${here ? ' here' : ''}" data-crumb="${i}"${here ? ' disabled' : ''}>${esc(crumbLabel(d))}</button>`;
  }).join('');
}

/* --- Task flow machinery -------------------------------------------------- */

function startTask(tag, preset, x, y) {
  flow = { tag, params: { ...preset }, xy: [x || innerWidth / 2, y || 160],
    steps: EV[tag].roles.filter(r => flow === null || true).filter(r => ({ ...preset })[ROLEKEY[r]] === undefined) };

function nextStep() {
  if (!flow) return;

  if (role === 'label') { openLabelPop(); return; }
  if (role) { openChipPop(role); return; }

  if (EV[flow.tag].amount) { openAmountPop(); return; }
  commitFlow();
}

        inputmode="numeric" value="${sp.val}">
      <button type="button" class="primary" id="am-ok">OK</button></div>`;
  popAt(flow.xy[0], flow.xy[1], html);
  const r = $('am-r'), n = $('am-n'), ok = $('am-ok');
  const valid = () => {
    const v = Number(n.value);
    return Number.isInteger(v) && v >= sp.min && v <= sp.max;
  };
  const sync = () => { ok.disabled = !valid(); n.classList.toggle('badv', !valid()); };
  r.addEventListener('input', () => { n.value = r.value; sync(); });
  n.addEventListener('input', () => { if (valid()) r.value = n.value; sync(); });
  n.addEventListener('change', () => {
    let v = Math.round(Number(n.value));
    if (!Number.isFinite(v)) v = sp.min;
    n.value = String(Math.max(sp.min, Math.min(sp.max, v)));
    r.value = n.value; sync();
  });
  ok.addEventListener('click', () => {
    if (!valid()) return;
    flow.params.v = Number(n.value);
    commitFlow();
  });
  const xb = $('pop').querySelector('[data-x]');
  if (xb) xb.addEventListener('click', cancelFlow);
  sync();
  n.focus();
}

// Interface outcome: the vote happened outside this machine. No member is
// asked to authorize it; the Step.lean responsabile carrier stays internal.
function openExternalConfirm() {
  const html = `<div class="pt">esito esterno <span class="gbx">VOTO NON MODELLATO</span>
      <button type="button" class="xbtn2" data-x="1">✕</button></div>
    <div class="tiny">${esc(EV[flow.tag].it)} per «${esc(lbl(flow.params.c))}»</div>
    <div class="tiny">Nel sistema reale è l'esito di un voto di maggioranza del gruppo (kelgroups).<br>
      Questa macchina economica non modella né verifica quel voto.</div>
    <div class="ar2"><button type="button" class="primary" id="ext-apply">applica esito</button></div>`;
  popAt(flow.xy[0], flow.xy[1], html);
  $('ext-apply').addEventListener('click', () => {
    flow.params.author = state.responsabili[0];   // machine adapter carrier only
    commitFlow();
  });
  const xb = $('pop').querySelector('[data-x]');
  if (xb) xb.addEventListener('click', cancelFlow);
}

function commitFlow() {
  closePop();
  const { tag, params, xy } = flow;
  flow = null;
  const args = {};
  for (const role of EV[tag].roles) {
    const k = ROLEKEY[role];
    if (k !== '_label') args[k] = params[k];
  }
  if (tag === 'openPurchase') args.c = params.c;
  if (EV[tag].amount) args.v = params.v;
  if (EV[tag].external) args.author = params.author;
  const preState = state;
  const preLayout = { ...layout };
  const res = runAttempt(tag, args, params._label);
  renderAll();
  if (res.ok) {
    if (nav().view === 'group') playFx(tag, args, preState, preLayout);
    if (EV[tag].external)
      toast(`<b>⇣ esito esterno applicato</b>
        <span class="tiny">voto di maggioranza non modellato né verificato qui</span>`, xy[0], xy[1], 'ext');
  } else {
    toast(`<b>✗ ${esc(EV[tag].it)}</b> ` +
      res.failed.map(guardChip).join(' ') +
      ` <span class="tiny">stato invariato</span>`, xy[0], xy[1]);
  }
}

/* direct actions with every parameter already known (referente queue) */
function directAct(tag, args, x, y) {
  flow = { tag, params: { ...args }, steps: [], xy: [x, y] };
  nextStep();
}

function taskBtn(tag, ctx, extra) {
  const dis = taskDis(tag, ctx);
  const it = (extra && extra.label) || EV[tag].it;
  const ext = EV[tag].external;
  if (dis) {
    return `<button type="button" class="task${ext ? ' ext' : ''}" disabled
      data-task="${tag}" title="${esc(dis.note)}">${esc(it)}
      <span class="${ext ? 'gbx' : (dis.badge === '—' ? 'gb dim' : 'gb')}">${esc(dis.badge === '—' ? dis.note || '—' : dis.badge)}</span></button>`;
  }
  return `<button type="button" class="task${ext ? ' ext' : ''}" data-task="${tag}"
    title=".${tag}">${esc(it)}${ext ? ' <span class="gbx">VOTO NON MODELLATO</span>' : ''}</button>`;
}

    parts.push(`<g class="ghostn" data-obj="ghost" data-id="${gid}" data-key="ghost:${gid}"

    layout['conto:' + u] = { x, y: y + 58 };
    if (resp(u)) layout['cassa:' + u] = { x, y: y + 84 };
  });

  const k = state.collections.length;
  state.collections.forEach((c, i) => {
    let x = CX, y = CY - 8;
    if (k > 1) {
      const ang = -Math.PI / 2 + i * 2 * Math.PI / k;
      x = CX + 78 * Math.cos(ang); y = CY - 8 + 78 * Math.sin(ang);
    }
    layout['pile:' + c.id] = { x, y };
    const rp = memberPos[c.referente];
    if (rp) parts.push(`<path class="reflink" d="M ${x} ${y} L ${rp.x} ${rp.y}"/>`);
  });

    const { x, y } = layout['pile:' + c.id];

    parts.push(`<g class="pileg" data-obj="pile" data-id="${c.id}" data-key="pile:${c.id}"

    </g>`);
  });
  if (!k) parts.push(`<text class="hintc" x="${CX}" y="${CY - 4}">nessun acquisto aperto</text>`);

  state.users.forEach(u => {
    const { x, y } = memberPos[u];
    parts.push(`<g class="${resp(u) ? 'noderesp' : ''}" data-obj="member" data-id="${u}"
      data-key="member:${u}" role="button" tabindex="0"

    const cv = bal(state.conti, u);

      <rect x="-36" y="-11" width="72" height="22" rx="6"/>

    </g>`);
    if (resp(u)) {
      const kv = bal(state.casse, u);
      parts.push(`<g class="cassag" data-obj="cassa" data-id="${u}" data-key="cassa:${u}"

    <div class="tiny">fuori macchina · nessun costruttore di <span class="mono">Event</span> lo produce · stato reale intatto</div>`;
  popAt(x, y, html);
  const r = $('cf-r'), n = $('cf-n');
  const upd = () => {
    const d = Math.max(-100, Math.min(100, Math.round(Number(n.value) || 0)));
    let { sc, sn, se } = invSnapshot();
    if (kind === 'conto') sn += d;
    else if (kind === 'cassa') sc += d;
    else se += d;
    const inv = sc - sn - se;
    $('cf-line').innerHTML = `<span class="mono">${sc} − ${sn} − ${se} =</span>
      <span class="${inv === 0 ? 'z' : 'nz'}">${inv}${inv === 0 ? ' ✓' : ' ✗'}</span>`;
  };
  r.addEventListener('input', () => { n.value = r.value; upd(); });
  n.addEventListener('input', () => { r.value = n.value; upd(); });
  const xb = $('pop').querySelector('[data-x]');
  if (xb) xb.addEventListener('click', closePop);
  upd();
}

/* --- FX (group scene only) ------------------------------------------------ */

const SVGNS = 'http://www.w3.org/2000/svg';

function fxLayer() { const s = $('scene'); return s ? s.querySelector('#fx') : null; }

function fly(fk, tk, txt, delay, pre) {
  delay = delay || 0;
  const f = layout[fk] || (pre && pre[fk]) || layout.world;
  const t = layout[tk] || (pre && pre[tk]) || layout.world;
  const gEl = document.createElementNS(SVGNS, 'g');
  const c = document.createElementNS(SVGNS, 'circle');
  c.setAttribute('class', 'coin'); c.setAttribute('r', '8');
  const tx = document.createElementNS(SVGNS, 'text');
  tx.setAttribute('class', 'cointx'); tx.setAttribute('y', '-13');
  tx.textContent = txt;
  gEl.appendChild(c); gEl.appendChild(tx);
  const start = performance.now() + delay;
  const dur = 700;
  function frame(now) {
    const layer = fxLayer();
    if (!layer) return;
    if (!gEl.parentNode && now >= start - 20) layer.appendChild(gEl);
    const u = Math.min(1, Math.max(0, (now - start) / dur));
    const e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    const x = f.x + (t.x - f.x) * e;
    const y = f.y + (t.y - f.y) * e - 46 * Math.sin(Math.PI * u);
    gEl.setAttribute('transform', `translate(${x},${y})`);
    if (u < 1) requestAnimationFrame(frame);
    else gEl.remove();
  }
  requestAnimationFrame(frame);
}

function floatTx(k, txt, color, delay, pre) {
  const p = layout[k] || (pre && pre[k]);
  if (!p) return;
  const tx = document.createElementNS(SVGNS, 'text');
  tx.setAttribute('class', 'floattx');
  tx.setAttribute('fill', color || '#1c7c43');
  tx.textContent = txt;
  const start = performance.now() + (delay || 0);
  const dur = 1000;
  function frame(now) {
    const layer = fxLayer();
    if (!layer) return;
    if (!tx.parentNode && now >= start - 20) layer.appendChild(tx);
    const u = Math.min(1, Math.max(0, (now - start) / dur));
    tx.setAttribute('x', p.x); tx.setAttribute('y', p.y - 20 - 26 * u);
    tx.setAttribute('opacity', String(1 - u * u));
    if (u < 1) requestAnimationFrame(frame);
    else tx.remove();
  }
  requestAnimationFrame(frame);
}

function flashKeys(keys) {
  const s = $('scene');
  if (!s) return;
  for (const k of keys) {
    const el = s.querySelector(`[data-key="${k}"]`);
    if (el) el.classList.add('nflash');
  }
}

function playFx(tag, a, preState, pre) {
  const preCol = c => preState.collections.find(x => x.id === c);
  switch (tag) {
    case 'addUser': flashKeys([`member:${a.target}`, `conto:${a.target}`]); break;
    case 'electResponsabile':
      floatTx(`member:${a.target}`, '★', '#b98a1c'); flashKeys([`cassa:${a.target}`]); break;
    case 'removeResponsabile': {
      floatTx(`member:${a.target}`, '★✕', '#b3261e', 0, pre);
      const [, ps] = stripCollections(a.target, preState.collections);
      ps.forEach((p, i) => floatTx(`conto:${p.user}`, `+${p.amount}`, '#1c7c43', 150 + i * 130, pre));
      break;
    }
    case 'openPurchase': flashKeys([`pile:${a.c}`]); break;
    case 'grantPermission': floatTx(`pile:${a.c}`, '⇣ L2 ✓ esito esterno', '#5b3e96'); break;
    case 'denyPermission': {
      const col = preCol(a.c);
      [...col.accepted, ...col.pending].forEach((p, i) =>
        fly(`pile:${a.c}`, `conto:${p.user}`, `+${p.amount}`, i * 140, pre));
      break;
    }
    case 'deposit':
      fly(`member:${a.user}`, `cassa:${a.author}`, String(a.v));
      floatTx(`conto:${a.user}`, `+${a.v}`, '#1c7c43', 250);
      flashKeys([`conto:${a.user}`, `cassa:${a.author}`]);
      break;
    case 'withdraw':
      fly(`cassa:${a.author}`, `member:${a.user}`, String(a.v));
      floatTx(`conto:${a.user}`, `−${a.v}`, '#b3261e', 250);
      flashKeys([`conto:${a.user}`, `cassa:${a.author}`]);
      break;
    case 'transferCassa':
      fly(`cassa:${a.from_}`, `cassa:${a.author}`, String(a.v));
      flashKeys([`cassa:${a.from_}`, `cassa:${a.author}`]);
      break;
    case 'pledge':
      fly(`conto:${a.user}`, `pile:${a.c}`, String(a.v));
      flashKeys([`conto:${a.user}`, `pile:${a.c}`]);
      break;
    case 'acceptPledge':
      floatTx(`pile:${a.c}`, `✓ ${nm(a.user)}`, '#1c7c43'); flashKeys([`pile:${a.c}`]); break;
    case 'refusePledge': {
      const sp = splitUser(a.user, preCol(a.c).pending);
      fly(`pile:${a.c}`, `conto:${a.user}`, `+${sp ? sp[0] : ''}`, 0, pre);
      break;
    }
    case 'correctPledge': {
      const sp = splitUser(a.user, preCol(a.c).accepted);
      const d = (sp ? sp[0] : 0) - a.v;
      if (d > 0) fly(`pile:${a.c}`, `conto:${a.user}`, `+${d}`, 0, pre);
      else if (d < 0) fly(`conto:${a.user}`, `pile:${a.c}`, String(-d), 0, pre);
      else floatTx(`pile:${a.c}`, '=', '#5b6b7b', 0, pre);
      break;
    }
    case 'closePurchase': {
      const tot = sumPledges(preCol(a.c).accepted);
      fly(`pile:${a.c}`, 'world', String(tot), 0, pre);
      fly(`cassa:${preCol(a.c).referente}`, 'world', String(tot), 160, pre);
      flashKeys([`cassa:${preCol(a.c).referente}`]);
      break;
    }
    case 'failPurchase': {
      const col = preCol(a.c);
      [...col.accepted, ...col.pending].forEach((p, i) =>
        fly(`pile:${a.c}`, `conto:${p.user}`, `+${p.amount}`, i * 140, pre));
      break;
    }
  }
}

function toast(html, x, y, cls) {
  const t = document.createElement('div');
  t.className = 'toast' + (cls ? ' ' + cls : '');
  t.innerHTML = html;
  document.body.appendChild(t);
  const w = t.offsetWidth, h = t.offsetHeight;
  t.style.left = Math.max(6, Math.min(x - w / 2, innerWidth - w - 6)) + 'px';
  t.style.top = Math.max(6, Math.min(y - h - 16, innerHeight - h - 6)) + 'px';
  setTimeout(() => t.remove(), 3600);
}

/* --- Popover plumbing ------------------------------------------------------ */

function popAt(x, y, html) {
  const pop = $('pop');
  pop.hidden = false;
  pop.innerHTML = `<div class="pbox">${html}</div>`;
  pop.style.left = '0px'; pop.style.top = '0px';
  const box = pop.firstElementChild;
  const w = box.offsetWidth, h = box.offsetHeight;
  pop.style.left = Math.max(6, Math.min(x + 10, innerWidth - w - 8)) + 'px';
  pop.style.top = Math.max(6, Math.min(y + 10, innerHeight - h - 8)) + 'px';
}

function closePop() { const p = $('pop'); p.hidden = true; p.innerHTML = ''; }

/* --- Wiring ---------------------------------------------------------------- */

$('view').addEventListener('click', ev => {
  const t = ev.target;
  const taskEl = t.closest('[data-task]');
  if (taskEl && !taskEl.disabled) {
    const tag = taskEl.dataset.task;
    const preset = {};
    const d = nav();
    if (d.view === 'person') {
      if (d.hat === 'cassiere') preset.author = d.u;
      else if (tag === 'deposit' || tag === 'withdraw' || tag === 'pledge') preset.user = d.u;
    }
    if (d.view === 'collection') {
      preset.c = d.c;
      // the referente hat is the collection context: closing/failing is the
      // referente's task, exactly as the Lean guard demands
      if (tag === 'closePurchase' || tag === 'failPurchase') {
        const col = state.collections.find(x => x.id === d.c);
        preset.author = col.referente;
      }
    }
    startTask(tag, preset, ev.clientX, ev.clientY);
    return;
  }
  const act = t.closest('[data-act]');
  if (act) {
    const d = nav();
    const c = d.c, u = Number(act.dataset.u);
    const col = state.collections.find(x => x.id === c);
    const author = col.referente;             // the hat is the context
    if (act.dataset.act === 'accept') directAct('acceptPledge', { author, user: u, c }, ev.clientX, ev.clientY);
    else if (act.dataset.act === 'refuse') directAct('refusePledge', { author, user: u, c }, ev.clientX, ev.clientY);
    else directAct('correctPledge', { author, user: u, c }, ev.clientX, ev.clientY);
    return;
  }
  const hat = t.closest('[data-hat]');
  if (hat && !hat.disabled) { nav().hat = hat.dataset.hat; renderAll(); return; }
  const gc = t.closest('[data-goto-coll]');
  if (gc) { go({ view: 'collection', c: Number(gc.dataset.gotoColl) }); return; }
  const gp = t.closest('[data-goto-person]');
  if (gp) { go({ view: 'person', u: Number(gp.dataset.gotoPerson), hat: 'member' }); return; }
  const pr = t.closest('[data-pledge-c]');
  if (pr) { goPledge(Number(pr.dataset.pledgeC), Number(pr.dataset.pledgeU)); return; }
  const obj = t.closest('[data-obj]');
  if (obj) {
    const kind = obj.dataset.obj, id = Number(obj.dataset.id);
    if (kind === 'member' || kind === 'conto') go({ view: 'person', u: id, hat: 'member' });
    else if (kind === 'cassa') go({ view: 'person', u: id, hat: 'cassiere' });
    else if (kind === 'pile') go({ view: 'collection', c: id });
    else if (kind === 'ghost') startTask('addUser', { target: id }, ev.clientX, ev.clientY);
  }
});

$('crumbs').addEventListener('click', ev => {

/* --- ?selftest=1: drives the real visible controls, verdict in title ------ */

async function selftest() {
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const expect = (cond, what) => { if (!cond) throw new Error(what); };
  const click = async sel => {
    const el = document.querySelector(sel);
    expect(el, 'elemento mancante: ' + sel);
    const r = el.getBoundingClientRect();
    el.dispatchEvent(new MouseEvent('click', { bubbles: true,
      clientX: r.x + r.width / 2, clientY: r.y + r.height / 2 }));
    await sleep(40);
  };
  const amount = async (v, expMax) => {
    const n = document.getElementById('am-n'), r = document.getElementById('am-r');
    expect(n && r, 'controllo importo assente');
    expect(r.min !== '' && r.max !== '', 'importo senza limiti visibili');
    if (expMax !== undefined)
      expect(Number(r.max) === expMax, `max importo atteso ${expMax}, trovato ${r.max}`);
    n.value = String(v);
    n.dispatchEvent(new Event('input', { bubbles: true }));
    await click('#am-ok');
  };
  const invOk = () => {
    const { v } = { v: sumBal(state.casse) - sumBal(state.conti) - escrowSum(state.collections) };
    expect(v === 0, 'invariante non 0');
    expect(document.getElementById('inv-chip').textContent.includes('✓'), 'chip bilancio non ✓');
  };
  const here = () => nav().view;
  const crumbText = () => document.getElementById('crumbs').innerText.replace(/\n/g, ' ');
  const lastEntry = () => document.querySelector('#log .entry');

  // group view: task-shaped entry points, not the event list
  expect(here() === 'group', 'vista iniziale non è il gruppo');
  expect(document.querySelectorAll('#gtasks [data-task]').length === 4,
    'compiti di gruppo assenti');

  // task: far entrare Bruno ed Elena (candidato → registrante ★)
  for (const gid of [1, 2]) {
    await click(`[data-key="ghost:${gid}"]`);
    await click(`#pop .chip[data-id="0"]`);
    expect(document.querySelector(`[data-key="member:${gid}"]`), 'membro non entrato');
  }
  // task: eleggi Bruno dalla barra dei compiti
  await click('#gtasks [data-task="electResponsabile"]');
  await click('#pop .chip[data-id="1"]');
  await click('#pop .chip[data-id="0"]');
  expect(document.querySelector('[data-key="member:1"]').classList.contains('noderesp'),
    'Bruno non eletto');
  invOk();

  // navigation: person view + hats
  await click('[data-key="member:0"]');
  expect(here() === 'person', 'click sul membro non apre la persona');
  expect(document.getElementById('hat-member'), 'cappello membro non attivo');
  expect(document.getElementById('card-conto'), 'conto assente nel cappello membro');
  expect(crumbText().includes('Gruppo') && crumbText().includes('Anna'), 'briciole errate');
  // referente controls must NOT exist at person level
  expect(!document.querySelector('#view [data-act]') && !document.getElementById('refpanel'),
    'controlli referente fuori dal contesto colletta');
  await click('[data-hat="cassiere"]');
  expect(document.getElementById('hat-cassiere'), 'cappello cassiere non attivo');
  expect(document.getElementById('card-cassa'), 'cassa assente nel cappello cassiere');

  // cassiere task: incassa 100 da Bruno (bounded 0..500)
  await click('#hat-cassiere [data-task="deposit"]');
  await click('#pop .chip[data-id="1"]');
  await amount(100, 500);
  expect(document.getElementById('card-cassa').innerText.includes('100'),
    'cassa non aggiornata');
  invOk();

  // back to group, then Bruno opens «Olio» from his cassiere hat
  await click('#crumbs [data-crumb="0"]');
  expect(here() === 'group', 'briciola Gruppo non torna al gruppo');
  await click('[data-key="cassa:1"]');
  expect(here() === 'person' && nav().hat === 'cassiere', 'click sulla cassa non apre il cassiere');
  await click('#hat-cassiere [data-task="openPurchase"]');
  await click('#pop [data-l="Olio"]');
  expect(document.querySelector('[data-goto-coll]'), 'sezione referente-di assente');

  // Bruno-as-member joins his own purchase? no — member hat: pledge 30 (bounded by conto 100)
  await click('[data-hat="member"]');
  expect(document.getElementById('hat-member'), 'ritorno al cappello membro fallito');
  await click('#hat-member [data-task="pledge"]');
  await click('#pop .chip[data-id]');            // the only collection «Olio»
  await click('#pop .chip[data-id="0"]');        // registered by Anna ★
  await amount(30, 100);
  expect(document.querySelector('#hat-member [data-pledge-c]'), 'pledge non elencato');
  invOk();

  // depth: person → pledge (through collection) and all the way back
  await click('#hat-member [data-pledge-c]');
  expect(here() === 'pledge', 'vista pledge non aperta');
  expect(crumbText().includes('«Olio»') && crumbText().includes('impegno di Bruno'),
    'briciole senza profondità gruppo→persona→acquisto→impegno');
  await click('#nav-back');
  expect(here() === 'collection', 'indietro non torna alla colletta');
  expect(document.getElementById('refpanel'), 'cappello referente assente nella colletta');
  await click('#nav-back');
  expect(here() === 'person', 'indietro non torna alla persona');
  await click('#nav-back');
  expect(here() === 'group', 'indietro non torna al gruppo');

  // guard affordance: Elena (conto 0) cannot pledge — COVERED (L7) on the task
  await click('[data-key="member:2"]');
  const pledgeBtn = document.querySelector('#hat-member [data-task="pledge"]');
  expect(pledgeBtn && pledgeBtn.disabled, 'task pledge non disabilitato');
  expect(pledgeBtn.innerText.includes('COVERED (L7)'), 'badge COVERED (L7) assente');
  await click('#crumbs [data-crumb="0"]');

  // collection flow: referente queue exists only here; accept Bruno's pledge
  await click('[data-key="pile:1"]');
  expect(here() === 'collection', 'click sulla colletta non la apre');
  expect(document.getElementById('refpanel'), 'coda referente assente');
  await click('#refpanel [data-act="accept"]');
  expect(lastEntry().innerText.includes("accetta l'impegno di Bruno"), 'accettazione non registrata');
  invOk();

  // external outcome kept: marked before, disclosed during, marked after
  expect(document.querySelector('#view .msec'), 'sezione esito esterno assente');
  const grantBtn = document.querySelector('#view [data-task="grantPermission"]');
  expect(grantBtn && grantBtn.innerText.includes('VOTO NON MODELLATO'),
    'marcatura VOTO NON MODELLATO assente prima dell’applicazione');
  await click('#view [data-task="grantPermission"]');
  const conf = document.querySelector('#pop .pbox');
  expect(conf && conf.innerText.includes('non modella'), 'avviso di provenienza assente');
  await click('#ext-apply');
  const ge = lastEntry();
  expect(ge.className.includes('ext') && ge.innerText.includes('non modellato'),
    'esito esterno non marcato nel risultato');
  expect(!/Anna|Bruno|Elena|Carlo/.test(ge.querySelector('.eh').innerText),
    'esito attribuito a un officer');
  invOk();

  // close from the referente panel; nav recovers to a still-existing view
  await click('#refpanel [data-task="closePurchase"]');
  expect(document.getElementById('done-body').innerText.includes('Olio'),
    'acquisto completato assente dopo la chiusura');
  expect(here() !== 'collection' && here() !== 'pledge', 'vista su colletta chiusa non rientrata');
  invOk();

  // no invented vote state or event; machine surface unchanged
  const TAGS = ['addUser', 'electResponsabile', 'removeResponsabile', 'openPurchase',
    'grantPermission', 'denyPermission', 'deposit', 'withdraw', 'transferCassa',
    'pledge', 'acceptPledge', 'refusePledge', 'correctPledge', 'closePurchase',
    'failPurchase'];
  expect(Object.keys(EV).length === 15 && TAGS.every(t => EV[t]),
    'vocabolario eventi alterato');
  expect(JSON.stringify(Object.keys(state).sort()) ===
    JSON.stringify(['casse', 'collections', 'conti', 'responsabili', 'users']),
    'stato macchina esteso oltre Lean');

  // presentation vocabulary: legacy gruppo words in visible copy, never the
  // invented ones; machine identifiers stay only as .mono provenance
  const copy = (() => {
    const c = document.body.cloneNode(true);
    c.querySelectorAll('.mono, script, #pop, .toast').forEach(el => el.remove());
    return c.innerText;
  })();
  expect(!/colletta/i.test(copy), 'vocabolario: «colletta» nel copy visibile');
  expect(!/\bpledge\b/i.test(copy), 'vocabolario: «pledge» nel copy visibile');
  expect(/impegn/i.test(copy) && /acquist/i.test(copy),
    'vocabolario legacy (impegno/acquisto) assente dal copy');
  expect(ge.querySelector('.mono') &&
    ge.querySelector('.mono').textContent.trim().startsWith('.grantPermission'),
    'provenienza macchina assente dalla storia');

  // fidelity nets: crude net silent all session, Lean traces replay clean
  expect(lawBreaches.length === 0, 'rete invarianti Lean scattata in sessione');
  const tc = traceConformance();
  expect(tc.steps === 29, 'copertura tracce Lean inattesa: ' + tc.steps);
}
