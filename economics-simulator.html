  return `<div class="card" id="govcard">
    <h2>Il gruppo <small>una sola membership</small></h2>

function logMsg(m) { const el = $('log-msg'); if (el) el.innerHTML = `<span style="color:var(--bad)">${esc(m)}</span>`; }

function importText(t) {
  let wrap;
  try { wrap = JSON.parse(t); } catch (e) { return logMsg('JSON non valido'); }
  try { enterPresentation(normalizeWrap(wrap)); }
  catch (e) { return logMsg('traccia rifiutata — ' + e.message); }
}

  const n = sessionSteps.length;
  const html = `<div class="pt">log della sessione
      <button type="button" class="xbtn2" data-x="1">✕</button></div>
    <div class="tiny">${n} eventi applicati · salvati solo in questo browser (localStorage) —

    <div class="tasks" style="margin:6px 0">
      <button type="button" class="linkchip" id="log-show">mostra JSON</button>
      <button type="button" class="linkchip" id="log-dl">scarica file</button>
      <button type="button" class="linkchip" id="log-copy">copia</button>
      <button type="button" class="linkchip" id="log-pres"${n ? '' : ' disabled'}>presenta</button>
      <button type="button" class="linkchip" id="log-new">nuova sessione</button>
    </div>
    <textarea id="log-ta" class="logta" placeholder="incolla qui una traccia JSON da importare…"></textarea>
    <div class="ar2"><button type="button" class="primary" id="log-import">importa e presenta</button>
      <input type="file" id="log-file" accept="application/json,.json" style="font-size:.7rem"></div>
    <div class="tiny" id="log-msg"></div>`;
  popAt(x, y, html);
  $('log-show').addEventListener('click', () => { $('log-ta').value = buildExport(); });
  $('log-dl').addEventListener('click', () => {
    const blob = new Blob([buildExport()], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'reactivegas-sessione.trace.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
  $('log-copy').addEventListener('click', () => {
    const data = buildExport();
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(data).then(
        () => logMsg('copiato negli appunti'),
        () => { $('log-ta').value = data; logMsg('copia manualmente dal riquadro'); });
    else { $('log-ta').value = data; logMsg('copia manualmente dal riquadro'); }
  });
  $('log-pres').addEventListener('click', () => {
    if (!sessionSteps.length) return;
    enterPresentation({ env: sessionEnvelope(), labels: colLabels,
      names: { ...userLabels }, piles: dumpPiles() });
  });
  $('log-new').addEventListener('click', () => { closePop(); newSession(); });
  $('log-import').addEventListener('click', () => importText($('log-ta').value));
  $('log-file').addEventListener('change', ev => {
    const f = ev.target.files && ev.target.files[0];
    if (!f) return;
    const r = new FileReader();
    r.onload = () => importText(String(r.result));
    r.readAsText(f);
  });
  const xb = $('pop').querySelector('[data-x]');
  if (xb) xb.addEventListener('click', closePop);
}

      inputmode="numeric" value="10"></div>

    <div class="tiny">fuori macchina · nessun costruttore di <span class="mono">Event</span> lo produce · stato reale intatto</div>`;
  popAt(x, y, html);
  const r = $('cf-r'), n = $('cf-n');

    const d = Math.max(-100, Math.min(100, Math.round(Number(n.value) || 0)));

    if (kind === 'conto') sn += d;

  n.addEventListener('input', () => { r.value = n.value; upd(); });
  const xb = $('pop').querySelector('[data-x]');
  if (xb) xb.addEventListener('click', closePop);
  upd();

/* --- FX (group scene only) ------------------------------------------------ */

const SVGNS = 'http://www.w3.org/2000/svg';

function fxLayer() { const s = $('scene'); return s ? s.querySelector('#fx') : null; }

function fly(fk, tk, txt, delay, pre) {
  delay = delay || 0;
  const f = layout[fk] || (pre && pre[fk]) || layout.world;
  const t = layout[tk] || (pre && pre[tk]) || layout.world;
  const gEl = document.createElementNS(SVGNS, 'g');
  const c = document.createElementNS(SVGNS, 'circle');
  c.setAttribute('class', 'coin'); c.setAttribute('r', '8');
  const tx = document.createElementNS(SVGNS, 'text');
  tx.setAttribute('class', 'cointx'); tx.setAttribute('y', '-13');
  tx.textContent = txt;
  gEl.appendChild(c); gEl.appendChild(tx);
  const start = performance.now() + delay;
  const dur = 700;
  function frame(now) {
    const layer = fxLayer();
    if (!layer) return;
    if (!gEl.parentNode && now >= start - 20) layer.appendChild(gEl);
    const u = Math.min(1, Math.max(0, (now - start) / dur));
    const e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    const x = f.x + (t.x - f.x) * e;
    const y = f.y + (t.y - f.y) * e - 46 * Math.sin(Math.PI * u);
    gEl.setAttribute('transform', `translate(${x},${y})`);
    if (u < 1) requestAnimationFrame(frame);
    else gEl.remove();
  }
  requestAnimationFrame(frame);
}

function floatTx(k, txt, color, delay, pre) {
  const p = layout[k] || (pre && pre[k]);
  if (!p) return;
  const tx = document.createElementNS(SVGNS, 'text');
  tx.setAttribute('class', 'floattx');
  tx.setAttribute('fill', color || '#1c7c43');
  tx.textContent = txt;
  const start = performance.now() + (delay || 0);
  const dur = 1000;
  function frame(now) {
    const layer = fxLayer();
    if (!layer) return;
    if (!tx.parentNode && now >= start - 20) layer.appendChild(tx);
    const u = Math.min(1, Math.max(0, (now - start) / dur));
    tx.setAttribute('x', p.x); tx.setAttribute('y', p.y - 20 - 26 * u);
    tx.setAttribute('opacity', String(1 - u * u));
    if (u < 1) requestAnimationFrame(frame);
    else tx.remove();
  }
  requestAnimationFrame(frame);
}

function flashKeys(keys) {
  const s = $('scene');
  if (!s) return;
  for (const k of keys) {
    const el = s.querySelector(`[data-key="${k}"]`);
    if (el) el.classList.add('nflash');
  }
}

function playFx(tag, a, preState, pre) {
  const preCol = c => preState.collections.find(x => x.id === c);
  switch (tag) {
    case 'admitMember': flashKeys([`member:${a.target}`, `conto:${a.target}`]); break;
    case 'elect':
      floatTx(`member:${a.target}`, '★', '#b98a1c'); flashKeys([`cassa:${a.target}`]); break;
    case 'revoke': {
      floatTx(`member:${a.target}`, '★✕', '#b3261e', 0, pre);
      const [, ps] = stripCollections(a.target, preState.collections);
      ps.forEach((p, i) => floatTx(`conto:${p.user}`, signedEur(p.amount), '#1c7c43', 150 + i * 130, pre));
      break;
    }
    case 'departure': {
      floatTx(`member:${a.target}`, '⇢ comune', '#1d5fbf', 0, pre);
      flashKeys([`member:${a.target}`, `conto:${a.target}`]);
      break;
    }
    case 'openPurchase': flashKeys([`pile:${a.c}`]); break;
    case 'grantPermission': floatTx(`pile:${a.c}`, '⇣ L2 ✓ esito esterno', '#5b3e96'); break;
    case 'denyPermission': {
      const col = preCol(a.c);
      [...col.accepted, ...col.pending].forEach((p, i) =>
        fly(`pile:${a.c}`, `conto:${p.user}`, signedEur(p.amount), i * 140, pre));
      break;
    }
    case 'deposit':
      fly(`member:${a.user}`, `cassa:${a.author}`, eur(a.v));
      floatTx(`conto:${a.user}`, signedEur(a.v), '#1c7c43', 250);
      flashKeys([`conto:${a.user}`, `cassa:${a.author}`]);
      break;
    case 'withdraw':
      fly(`cassa:${a.author}`, `member:${a.user}`, eur(a.v));
      floatTx(`conto:${a.user}`, signedEur(-a.v), '#b3261e', 250);
      flashKeys([`conto:${a.user}`, `cassa:${a.author}`]);
      break;
    case 'transferCassa':
      fly(`cassa:${a.from_}`, `cassa:${a.author}`, eur(a.v));
      flashKeys([`cassa:${a.from_}`, `cassa:${a.author}`]);
      break;
    case 'pledge':
      fly(`conto:${a.user}`, `pile:${a.c}`, eur(a.v));
      flashKeys([`conto:${a.user}`, `pile:${a.c}`]);
      break;
    case 'acceptPledge':
      floatTx(`pile:${a.c}`, `✓ ${nm(a.user)}`, '#1c7c43'); flashKeys([`pile:${a.c}`]); break;
    case 'refusePledge': {
      const sp = splitUser(a.user, preCol(a.c).pending);
      fly(`pile:${a.c}`, `conto:${a.user}`, sp ? signedEur(sp[0]) : '', 0, pre);
      break;
    }
    case 'correctPledge': {
      const sp = splitUser(a.user, preCol(a.c).accepted);
      const d = (sp ? sp[0] : 0) - a.v;
      if (d > 0) fly(`pile:${a.c}`, `conto:${a.user}`, signedEur(d), 0, pre);
      else if (d < 0) fly(`conto:${a.user}`, `pile:${a.c}`, eur(-d), 0, pre);
      else floatTx(`pile:${a.c}`, '=', '#5b6b7b', 0, pre);
      break;
    }
    case 'closePurchase': {
      const tot = sumPledges(preCol(a.c).accepted);
      fly(`pile:${a.c}`, 'world', eur(tot), 0, pre);
      fly(`cassa:${preCol(a.c).referente}`, 'world', eur(tot), 160, pre);
      flashKeys([`cassa:${preCol(a.c).referente}`]);
      break;
    }
    case 'failPurchase': {
      const col = preCol(a.c);
      [...col.accepted, ...col.pending].forEach((p, i) =>
        fly(`pile:${a.c}`, `conto:${p.user}`, signedEur(p.amount), i * 140, pre));
      break;
    }
  }
}

function toast(html, x, y, cls) {
  const t = document.createElement('div');
  t.className = 'toast' + (cls ? ' ' + cls : '');
  t.innerHTML = html;
  document.body.appendChild(t);
  const w = t.offsetWidth, h = t.offsetHeight;
  t.style.left = Math.max(6, Math.min(x - w / 2, innerWidth - w - 6)) + 'px';
  t.style.top = Math.max(6, Math.min(y - h - 16, innerHeight - h - 6)) + 'px';
  setTimeout(() => t.remove(), 3600);
}

function sceneClientToUser(svg, clientX, clientY) {
  if (!svg || !svg.createSVGPoint) return null;
  const pt = svg.createSVGPoint();
  pt.x = clientX; pt.y = clientY;
  const ctm = svg.getScreenCTM();
  if (!ctm) return null;
  return pt.matrixTransform(ctm.inverse());
}
function raisePileZ(id) {
  let z = 0;
  for (const p of Object.values(pilePose))
    if (p && Number.isFinite(p.z) && p.z > z) z = p.z;
  const cur = pilePose[id] || {};
  const ang = Number.isFinite(cur.angle)
    ? cur.angle
    : (layout['pile:' + id] && layout['pile:' + id].angle);
  pilePose[id] = { angle: ang, z: z + 1 };
}
function raisePileNode(el) {
  const svg = el && el.ownerSVGElement;
  if (!svg) return;
  const member = svg.querySelector('[data-obj="member"]');
  if (member) svg.insertBefore(el, member);
  else svg.appendChild(el);
}
function movePileOnRing(id, el, clientX, clientY) {
  const svg = $('scene');
  const pt = sceneClientToUser(svg, clientX, clientY);
  if (!pt) return;
  const CX = 380, CY = 350;
  const slot = layout['pile:' + id] || {};
  const r = Number.isFinite(slot.radius) ? slot.radius : 132;
  const angle = Math.atan2(pt.y - CY, pt.x - CX);
  const x = CX + r * Math.cos(angle), y = CY + r * Math.sin(angle);
  layout['pile:' + id] = { x, y, angle, radius: r };
  const z = (pilePose[id] && pilePose[id].z) || 0;
  pilePose[id] = { angle, z };
  if (el) el.setAttribute('transform', `translate(${x},${y})`);
  const link = svg && svg.querySelector(`[data-reflink="${id}"]`);
  const col = state.collections.find(c => c.id === id);
  const rp = col && layout['member:' + col.referente];
  if (link && rp) link.setAttribute('d', `M ${x} ${y} L ${rp.x} ${rp.y}`);
}

$('view').addEventListener('pointerdown', ev => {

  const pile = ev.target.closest && ev.target.closest('[data-obj="pile"]');
  if (!pile || !pile.closest('#scene')) return;
  const id = Number(pile.dataset.id);
  if (!Number.isFinite(id)) return;
  pileDrag = { id, el: pile, moved: false, x: ev.clientX, y: ev.clientY,
    pointerId: ev.pointerId };
  try { pile.setPointerCapture(ev.pointerId); } catch (e) {}
});
document.addEventListener('pointermove', ev => {
  if (!pileDrag || ev.pointerId !== pileDrag.pointerId) return;
  const dx = ev.clientX - pileDrag.x, dy = ev.clientY - pileDrag.y;
  if (!pileDrag.moved && dx * dx + dy * dy < 64) return;
  if (!pileDrag.moved) {
    pileDrag.moved = true;
    pileDrag.el.classList.add('dragging');
    raisePileZ(pileDrag.id);
    raisePileNode(pileDrag.el);
  }
  ev.preventDefault();
  movePileOnRing(pileDrag.id, pileDrag.el, ev.clientX, ev.clientY);
}, { capture: true, passive: false });

  if (!pileDrag || (ev && ev.pointerId !== pileDrag.pointerId)) return;

/* Diagnostic-vocabulary lint: scans the ENTIRE selftest source (and its own)
   line by line, so no invented term can return in any diagnostic message —
   including branches a session never renders. Machine identifiers are allowed
   only in their known code shapes; lines that must mention the banned
   patterns themselves carry a DIAGLINT-ALLOW marker. */
function diagVocabLint() {
  const banned = /colletta|\bpledge\b/i;                                   // DIAGLINT-ALLOW
  // token-precise: strip the allowed machine-identifier shapes from each
  // line FIRST, then test what remains — prose sharing a line with a legal
  // identifier is still caught
  const stripAllowed = l => l
    .replace(/data-pledge[-a-z]*/g, '')      // row selector attributes       DIAGLINT-ALLOW
    .replace(/data-task="pledge"/g, '')      // task selector (machine tag)   DIAGLINT-ALLOW
    .replace(/'pledge'|"pledge"/g, '')       // exact view/tag token compare  DIAGLINT-ALLOW
    .replace(/\.pledge\b/g, '');             // dotted machine provenance     DIAGLINT-ALLOW
  return (selftest.toString() + '\n' + diagVocabLint.toString())
    .split('\n')
    .filter(l => !/DIAGLINT-ALLOW/.test(l) && !/^\s*\/\//.test(l))
    .filter(l => banned.test(stripAllowed(l)));
}

          `anello k=${k}: fuori dalla tavola`);
      }
      if (k > 1) expect(minC >= 92 - 0.5, `anello k=${k}: separazione ${minC} sotto 91.5`);
      for (const u of gusers) {
        const d = Math.hypot(g.memberPos[u].x - 380, g.memberPos[u].y - 350);
        expect(d - 38 >= maxP + 42, `anello k=${k}: membro dentro l'anello acquisti`);
      }
    }
    // angle stability: same membership, different purchase counts
    const angOf = (us, cols) => {
      const g = purchaseRingLayout(us, cols, null);
      const out = {};
      for (const u of us) out[u] = Math.atan2(g.memberPos[u].y - 350, g.memberPos[u].x - 380);
      return out;
    };
    const a3 = angOf(gusers, mkCols(3));
    const a40 = angOf(gusers, mkCols(40));
    for (const u of gusers)
      expect(Math.abs(a3[u] - a40[u]) < 1e-9, `anello: angolo membro instabile con le numerosità`);
    // ambient DOM: every open purchase rendered together, readable, reachable
    const exNow = purchaseRingLayout(members(), state.collections, null).extent;
    const piles = [...document.querySelectorAll('#scene [data-key^="pile:"]')];
    expect(piles.length === state.collections.length, 'anello: acquisti non tutti insieme');
    for (const el of piles) {
      const rc = el.querySelector('circle');
      expect(rc && Number(rc.getAttribute('r')) === 42, 'anello: glifo illeggibile');
      const m = /translate\(([-\d.eE+]+),([-\d.eE+]+)\)/.exec(el.getAttribute('transform') || '');
      expect(m !== null, 'anello: posizione illeggibile');
      expect(Math.abs(Number(m[1]) - exNow.cx) <= exNow.halfW &&
        Math.abs(Number(m[2]) - exNow.cy) <= exNow.halfH,
        'anello: controllo fuori dalla tavola pannabile');
    }
  }

  // fidelity nets: crude net silent all session, Lean traces replay clean
  expect(lawBreaches.length === 0, 'rete invarianti Lean scattata in sessione');
  const tc = traceConformance();
  expect(tc.steps === 35, 'copertura tracce Lean inattesa: ' + tc.steps);

  // claim manifest: audit clean, derived inversion inventory coherent
  const ca = claimAudit();
  expect(ca.length === 0, 'manifesto invalido: ' + ca.join('; '));
  const inv2 = refusalInventory();
  expect(inv2.proven.length + inv2.missing.length === inv2.events.length
    && inv2.events.length === Object.keys(EV).length
    && inv2.proven.every(t => refusalProven(t)) && inv2.missing.every(t => !refusalProven(t)),
    'inventario inversioni incoerente');
  const looseGb = [...document.querySelectorAll('.gb')].filter(b =>
    GUARD_CLAIMS[b.textContent.trim()] && !b.dataset.claims && !b.closest('[data-off-claims]'));
  expect(looseGb.length === 0, 'badge guardia senza associazione al manifesto: ' + looseGb.length);
  expect(document.querySelector('#done-card [data-claims="done-list"]'),
    'elenco completati senza marcatura NON PROVATO');

  // vote machine nets: Lean corpus replayed clean, laws silent, labels honest
  const ktc = kelTraceConformance();
  expect(ktc.steps === 15 && ktc.corpus === 'seme-locale-vote-richiesto',
    'copertura tracce voto inattesa: ' + ktc.steps);
  expect(kgLawBreaches.length === 0, 'rete invarianti del voto scattata in sessione');

  // three DERIVED proof states: at the merged pin EVERY citation is
  // sorry-free (the vote invariants were discharged by #48/#65), so all
  // rows derive provato — a sorry-backed citation can still never render
  // as proved, and NON PROVATO rows stay marked where the user meets them
  const enunNow = Object.values(CHECK_RECEIPT.axioms).filter(s => s === 'enunciato');
  expect(enunNow.length === 0,
    'citazioni con sorry al pin merged: ' + enunNow.join(','));
  expect(CHECK_RECEIPT.axioms['KelGroups.Vote.ballots_nodup_disjoint'] === 'provato',
    'invariante del voto non classificata provato dopo lo scarico');
  expect(CHECK_RECEIPT.axioms['conservation_preserved'] === 'provato',
    'teorema economico non classificato provato');
  for (const cid of Object.keys(CLAIMS)) {
    const row2 = claimRowHtml(cid);
    if (proofState(cid) === 'enun')
      expect(row2.includes('enunciato, non dimostrato') && !row2.includes('— provato'),
        'citazione con sorry resa come provata: ' + cid);
    if (proofState(cid) === 'ok')
      expect(row2.includes('— provato') && !row2.includes('enunciato'),
        'citazione provata resa in modo ambiguo: ' + cid);
  }
  expect(pkGlyph(['vote-clean']).includes('⊢') && !pkGlyph(['vote-clean']).includes('◇'),
    'glifo dello stato provato assente dopo lo scarico');
  expect(pkGlyph(['conservation']).includes('⊢') && !pkGlyph(['conservation']).includes('enun'),
    'glifo provato contaminato dallo stato intermedio');
  expect(pkGlyph(['vote-clean', 'join-vote-econ']).includes('npv'),
    'NON PROVATO non prevale sugli altri stati nel glifo composto');

  // composition citations: pinned-commit rows render their pin and derived
  // state; the route table covers exactly the accepted 18 constructors
  expect(Object.keys(EVENT_ROUTES).length === 14, 'instradamento non copre i 14 costruttori');
  const compRow = claimRowHtml('comp-routing');
  expect(compRow.includes('@ pin 934de7a8df') && compRow.includes('— provato'),
    'riga della composizione senza pin o senza stato derivato');
  expect(claimRowHtml('comp-witness').includes('zeroThreshold'),
    'riga del testimone senza avvertenza zeroThreshold');
  expect(pkGlyph(['comp-routing']).includes('⊢'),
    'glifo del teorema di instradamento non provato');

  // session log: persisted after every event, ONE integrated stream, applied-only
  const applied = sessionSteps.length;
  expect(applied >= 20, 'log sessione troppo corto: ' + applied);
  const rawLog = lsGet(logKey());
  expect(rawLog, 'log non persistito');
  const wrap = JSON.parse(rawLog);
  expect(wrap.format === 'reactivegas-sim-session' && wrap.v === 3
    && wrap.integrated.schema === 'reactivegas-integrated.trace'
    && wrap.integrated.version === 1
    && wrap.integrated.steps.length === applied
    && !('trace' in wrap) && !('kel' in wrap) && !('base' in wrap) && !('seq' in wrap),
    'involucro log v3 non conforme');
  expect(wrap.integrated.steps.every(st => st.result.tag === 'applied'),
    'log di sessione con passi non applicati');
  const lastAgg = wrap.integrated.steps[applied - 1].result.aggregate;
  const lastPay = lastAgg.appFold !== undefined ? lastAgg.appFold : lastAgg.payload;
  // the whole aggregate round-trips: membership, pending base and payload
  expect(canonAggregate(curAggregate()) === canonAggregate(lastAgg),
    'stato vivo diverso dal log');
  expect(canonVoteState(state.votes) === canonVoteState(lastPay.votes),
    'stato del voto diverso dal log');
  expect(canonBaseState(bg) ===
    canonBaseState({ members: lastAgg.members, pendingBase: lastAgg.pendingBase }),
    'stato del canale base diverso dal log');

  // restore: replay from the founded aggregate with per-step verification,
  // never trust the tail — the whole aggregate must come back identical
  const liveAgg = canonAggregate(curAggregate());
  const liveHistoryLen = history.length;
  expect(restoreSession() === applied, 'ripristino non riuscito');
  expect(canonAggregate(curAggregate()) === liveAgg, 'replay diverge dallo stato vivo');
  // every integrated step journals exactly ONE history entry: a committed
  // base change carries its sealed hook inside the same entry, no second row
  expect(history.length === applied, 'storia non ricostruita dal replay');
  expect(liveHistoryLen >= applied, 'storia viva più corta del log');

  // corruption: replay refused, log quarantined, then good log restores
  expect(rawLog.includes('"amount":30'), 'sonda del log integrato assente');
  lsSet(logKey(), rawLog.replace('"amount":30', '"amount":31'));
  expect(restoreSession() === null, 'log corrotto accettato');
  expect(!lsGet(logKey()) && lsGet(logKey() + '-corrotto'), 'quarantena assente');
  lsSet(logKey(), rawLog);
  expect(restoreSession() === applied && canonAggregate(curAggregate()) === liveAgg,
    'ripristino del log valido fallito');
  // corruption inside the vote fold is caught the same way
  expect(rawLog.includes('"assents":["anna"]'), 'sonda del voto nel log assente');
  lsSet(logKey(), rawLog.replace('"assents":["anna"]', '"assents":["anna","anna"]'));
  expect(restoreSession() === null, 'log voto corrotto accettato');
  lsSet(logKey(), rawLog);
  expect(restoreSession() === applied, 'ripristino post-corruzione voto fallito');
  // corruption inside the pending base is caught the same way
  expect(rawLog.includes('"approvals":["anna"]'), 'sonda della base nel log assente');
  lsSet(logKey(), rawLog.replace('"approvals":["anna"]', '"approvals":["anna","anna"]'));
  expect(restoreSession() === null, 'log base corrotto accettato');
  lsSet(logKey(), rawLog);
  expect(restoreSession() === applied, 'ripristino post-corruzione base fallito');
  // GOVERNANCE on import: an integrated log whose grantPermission carries no
  // closed verdict replays clean but is REFUSED by the governance walk — the
  // join stays NON PROVATO and the walk enforces its honest limit
  {
    const founded = bootAggregate();
    const gst = [];
    let ggs = founded;
    const gpush = (signer, event) => {
      const det = applyIntegrated(JSON.parse(JSON.stringify(ggs)), signer, event);
      if (det.refused) throw new Error('sonda governo mal costruita: ' + det.refused);
      const agg = JSON.parse(JSON.stringify(det.gs));
      gst.push({ input: JSON.parse(JSON.stringify(ggs)), signer, event,
        result: { tag: 'applied', aggregate: agg,
          change: det.change === undefined ? null : det.change } });
      ggs = det.gs;
    };
    gpush('anna', { direct: { admitMember: { key: 'bruno', email: 'bruno@toy.example',
      roles: [{ appRole: { name: 'socio' } }] } } });
    gpush('anna', { app: { openPurchase: { c: 900 } } });
    gpush('anna', { app: { grantPermission: { c: 900 } } });
    const govEnv = { schema: 'reactivegas-integrated.trace', version: 1,
      initial: founded, steps: gst };
    // positive half: the verdict-less log replays — the refusal below comes
    // from governance, never from shape or continuity
    verifyIntegratedV1(govEnv);
    const govWrap = { format: 'reactivegas-sim-session', v: 3,
      labels: {}, names: {}, piles: {}, integrated: govEnv };
    lsSet(logKey(), JSON.stringify(govWrap));
    expect(restoreSession() === null, 'log con permessi senza verdetto accettato');
    lsSet(logKey(), rawLog);
    expect(restoreSession() === applied, 'ripristino post-sonda governo fallito');
  }

  // frozen-contract rejection matrix, on the real consumer
  const goodEnv = wrap.integrated;
  const tamper = (fn, expectMsg, what) => {
    const cp = JSON.parse(JSON.stringify(goodEnv));
    fn(cp);
    let msg = null;
    try { verifyTraceV1(cp); } catch (e) { msg = e.message; }
    expect(msg && msg.includes(expectMsg), `matrice v1 (${what}): ${msg}`);
  };
  tamper(c => { c.version = 2; }, 'versione non supportata', 'versione');
  tamper(c => { c.schema = 'x'; }, 'schema sconosciuto', 'schema');
  tamper(c => { c.steps[0].input.members.push(['zz',
    { key: 'zz', email: 'zz@toy.example', roles: [] }]); }, 'discontinuo', 'input discontinuo');
  tamper(c => { delete c.steps[0].input; }, 'forma non valida', 'input omesso');
  tamper(c => { c.steps[0].result.aggregate.members = []; }, 'divergente', 'post-aggregato mutato');
  tamper(c => { c.steps[0].result = { tag: 'refused' }; },
    'soli applicati', 'applicato→rifiutato');
  // a standalone hook effect is not an event: forged, omitted, duplicated
  // or reordered consequences refuse before adoption
  tamper(c => {
    const last = c.steps[c.steps.length - 1].result.aggregate;
    c.steps.push({ input: JSON.parse(JSON.stringify(last)), signer: 'anna',
      event: { baseChange: { memberRemoved: 'bruno' } },
      result: { tag: 'applied', aggregate: JSON.parse(JSON.stringify(last)), change: null } });
  }, 'un effetto del gancio non è un evento', 'effetto orfano');
  // two constructors in one event refuse
  tamper(c => {
    c.steps[0].event = { ...c.steps[0].event, app: { deposit: { user: 'anna', v: 1 } } };
  }, 'più di un costruttore', 'doppio costruttore');
  expect(tc.corpus === 'seme-locale-solo-applicati',
    'etichetta del corpus seme assente');

  // export → import round trip and presentation stepping, on real controls
  await click('#btn-log');
  await click('#log-show');
  const exported = document.getElementById('log-ta').value;
  expect(JSON.parse(exported).integrated.steps.length === applied, 'export non conforme');
  await click('#log-import');
  expect(pres && pres.n.env.steps.length === applied, 'import non entrato in presentazione');
  expect(!document.getElementById('presbar').hidden, 'barra di presentazione assente');
  expect(pres.idx === 0, 'presentazione non a passo 0');
  await click('#pres-next'); await click('#pres-next');
  expect(pres.idx === 2, 'passo successivo non avanza');
  expect(document.querySelectorAll('[data-key^="member:"]').length === RG.bg.members.length,
    'vista di presentazione incoerente con lo stato del passo');
  // step onto the first VOTE event and check the vote state follows
  const firstK = pres.n.env.steps.findIndex(st => 'app' in st.event &&
    Object.keys(st.event.app).length === 1 &&
    (st.event.app.openQuestion || st.event.app.cast || st.event.app.renounce));
  expect(firstK >= 0, 'nessun passo di voto nella presentazione');
  presSet(firstK + 1);
  expect(RG.state.votes.openQuestions.length === 1, 'presentazione non mostra lo stato del voto al passo');
  expect(document.getElementById('presbar').innerText.includes('apre la domanda'),
    'descrizione del passo di voto assente');
  await click('#pres-prev');
  expect(pres.idx === firstK, 'passo precedente non torna');
  await click('#pres-exit');
  expect(!pres, 'uscita dalla presentazione fallita');
  expect(canonAggregate(curAggregate()) === liveAgg, 'stato vivo mutato dalla presentazione');
  expect(lsGet(logKey()) === rawLog, 'log mutato dalla presentazione');

  // corrupt import: clear local rejection through the real control
  await click('#btn-log');
  document.getElementById('log-ta').value = exported.replace('"tag":"applied"', '"tag":"refused"');
  await click('#log-import');
  expect(document.getElementById('log-msg').innerText.includes('rifiutata'),
    'import corrotto non rifiutato');
  expect(!pres, 'import corrotto entrato in presentazione');
  await click('#pop .xbtn2');

  // teaching persisted, replayable for demos, and dismissable by hand
  expect(JSON.parse(lsGet(teachKey()) || '{}').benvenuto === true,
    'apprendimento non persistito');
  await click('#crumbs [data-crumb="0"]');
  await click('#btn-teach');
  expect(document.querySelector('[data-teach="benvenuto"]'), 'spiegazioni non ripristinate');
  await click('#view [data-teachx="benvenuto"]');
  expect(!document.querySelector('[data-teach="benvenuto"]'), 'spiegazione non congedabile');
}

if (IS_SELFTEST) {
  selftest()
    .then(() => { document.title = 'SELFTEST PASS — Reactivegas'; })
    .catch(e => { window.__rgFail = (e.stack || e.message).split('\n').slice(0, 4).join(' | '); document.title = ('SELFTEST FAIL — ' + e.message + ' @ ' + (e.stack || '').split('\n')[1]).slice(0, 300); })
    .finally(() => { lsDel(logKey()); lsDel(logKey() + '-corrotto'); lsDel(teachKey()); });
}
</script>
