<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reactivegas — simulatore economico</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --ink: #1c2733;
    --muted: #5b6b7b;
    --line: #dde4ea;
    --accent: #1d5fbf;
    --ok: #1c7c43;
    --ok-bg: #e8f6ee;
    --bad: #b3261e;
    --bad-bg: #fdecea;
    --gold: #b98a1c;
    --chip: #e7eef8;
    --viola: #5b3e96;
    --viola-bg: #f3edfb;
    --viola-line: #d9c8ef;
    font-size: 15px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.35;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92em; }

  header {
    position: sticky; top: 0; z-index: 20; background: var(--card);
    border-bottom: 1px solid var(--line); padding: 7px 12px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px;
  }
  header h1 { margin: 0; font-size: .98rem; }
  header h1 small { color: var(--muted); font-weight: 400; font-size: .68rem; }
  .hbtns { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  #inv-chip {
    border: 1px solid var(--line); background: var(--bg); border-radius: 999px;
    font: inherit; font-size: .78rem; padding: 2px 10px; cursor: pointer; color: var(--muted);
  }
  #inv-chip.ok b { color: var(--ok); }
  #inv-chip.bad { background: var(--bad-bg); border-color: #e6b8b4; }
  #inv-chip.bad b { color: var(--bad); }
  @keyframes chippulse { 0% { box-shadow: 0 0 0 4px #dcebff; } 100% { box-shadow: none; } }
  #inv-chip.pulse { animation: chippulse .7s ease-out; }

  #crumbbar {
    max-width: 1400px; margin: 0 auto; padding: 7px 14px 0;
    display: flex; align-items: center; gap: 8px; font-size: .86rem; min-height: 1.9em;
  }
  #nav-back {
    border: 1px solid var(--line); background: #fff; border-radius: 7px;
    font: inherit; font-size: .8rem; padding: 1px 9px; cursor: pointer; color: var(--accent);
  }
  #nav-back:disabled { color: #b3bfca; cursor: default; }
  #crumbs { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; min-width: 0; }
  #crumbs .cr {
    border: none; background: none; font: inherit; font-size: .86rem;
    color: var(--accent); cursor: pointer; padding: 0 1px;
  }
  #crumbs .cr.here { color: var(--ink); font-weight: 700; cursor: default; }
  #crumbs .sep { color: var(--muted); }

  main {
    display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
    gap: 12px; padding: 8px 12px 30px; max-width: 1400px; margin: 0 auto;
  }
  @media (max-width: 940px) {
    main { grid-template-columns: 1fr; padding: 6px 6px 30px; }
    #crumbbar { padding: 6px 8px 0; }
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; min-width: 0;
  }
  .card h2 { margin: 0 0 6px; font-size: .88rem; }
  .card h2 small { color: var(--muted); font-weight: 400; font-size: .72rem; }
  .empty { color: var(--muted); font-size: .82rem; font-style: italic; margin: 2px 0; }
  #side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  #view { min-width: 0; display: flex; flex-direction: column; gap: 10px; }

  /* task buttons */
  .tasks { display: flex; flex-wrap: wrap; gap: 7px; }
  button.task {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid #c9d8ee; background: var(--chip); border-radius: 9px;
    padding: 6px 12px; font: inherit; font-size: .86rem; cursor: pointer;
  }
  button.task:not(:disabled):hover { background: var(--accent); color: #fff; }
  button.task:disabled { background: var(--bg); border-color: var(--line); color: #9aa7b4; cursor: default; }
  button.task.off { background: var(--bg); border-color: var(--line); color: #9aa7b4; cursor: help; }
  button.task.off:hover { background: var(--bg); color: #9aa7b4; }
  button.task.ext { background: var(--viola-bg); border-color: var(--viola-line); }
  button.task.ext:not(:disabled):hover { background: var(--viola); color: #fff; }
  .gb {
    border: 1px solid #e6b8b4; background: var(--bad-bg); color: var(--bad);
    border-radius: 5px; font-size: .64rem; font-weight: 700; padding: 1px 5px; white-space: nowrap;
  }
  .gb.dim { border-color: var(--line); background: var(--bg); color: var(--muted); }
  .gbx {
    border: 1px solid var(--viola-line); background: var(--viola-bg); color: var(--viola);
    border-radius: 5px; font-size: .62rem; font-weight: 700; padding: 1px 5px; white-space: nowrap;
  }
  .msec {
    margin-top: 4px; padding-top: 6px; border-top: 1px dashed var(--viola-line);
    font-size: .66rem; font-weight: 700; color: var(--viola); letter-spacing: .03em;
  }

  /* group scene */
  #scene-card { padding: 4px; }
  svg#scene { display: block; width: 100%; height: auto; user-select: none; }
  svg text { user-select: none; pointer-events: none; }
  [data-obj] { cursor: pointer; }
  .avatar { fill: #fff; stroke: #8aa3c0; stroke-width: 2; }
  .noderesp .avatar { stroke: var(--gold); stroke-width: 3; fill: #fffaf0; }
  .ghostn .avatar { stroke-dasharray: 4 3; fill: #f7f9fb; stroke: #a9b8c6; }
  .init { font-size: 19px; font-weight: 700; text-anchor: middle; fill: #31465e; }
  .ghostn .init { fill: #93a5b6; }
  .nm { font-size: 14px; text-anchor: middle; fill: var(--ink); font-weight: 600; }
  .ghostn .nm { fill: var(--muted); font-weight: 500; }
  .star { font-size: 15px; text-anchor: middle; }
  .chipg rect { fill: #eaf3ec; stroke: #bcd8c3; }
  .cassag rect { fill: #fdf3dd; stroke: #e3cf9a; }
  .chipg text, .cassag text {
    font-size: 12.5px; text-anchor: middle; fill: var(--ink);
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .pileg .pc { fill: var(--viola-bg); stroke: #b599dd; stroke-width: 2.5; }
  .plbl { font-size: 13px; text-anchor: middle; font-weight: 700; fill: #4a3175; }
  .pamt { font-size: 15px; text-anchor: middle; font-family: ui-monospace, Menlo, Consolas, monospace; fill: var(--ink); }
  .pmeta { font-size: 10px; text-anchor: middle; fill: var(--muted); }
  .reflink { stroke: #b599dd; stroke-width: 1.5; stroke-dasharray: 3 4; fill: none; opacity: .6; }
  .ringc { fill: none; stroke: #e3e9ef; stroke-width: 2; }
  .hintc { font-size: 13px; text-anchor: middle; fill: var(--muted); font-style: italic; }
  @keyframes nodeflash { 0% { opacity: .15; } 100% { opacity: 1; } }
  .nflash { animation: nodeflash .9s ease-out; }
  .coin { fill: #ffd766; stroke: var(--gold); stroke-width: 1.5; }
  .cointx { font-size: 12px; font-weight: 700; fill: #6b4d05; text-anchor: middle; }
  .floattx { font-size: 13px; font-weight: 700; text-anchor: middle; }

  /* person / collection / pledge views */
  .vhead { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .bigav {
    width: 46px; height: 46px; border-radius: 50%; border: 2px solid #8aa3c0;
    background: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 21px; font-weight: 700; color: #31465e; flex: none;
  }
  .bigav.resp { border-color: var(--gold); border-width: 3px; background: #fffaf0; }
  .vhead .who { font-size: 1.05rem; font-weight: 700; }
  .vhead .sub { color: var(--muted); font-size: .78rem; }
  .tabs { display: flex; gap: 6px; }
  button.tab {
    border: 1px solid var(--line); background: #fff; border-radius: 8px 8px 0 0;
    border-bottom: none; padding: 5px 14px; font: inherit; font-size: .86rem; cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px;
  }
  button.tab.on { background: var(--chip); border-color: #c9d8ee; font-weight: 700; }
  button.tab:disabled { color: #9aa7b4; cursor: default; }
  .hatbox { border: 1px solid #c9d8ee; border-radius: 0 10px 10px 10px; background: var(--card); padding: 10px 12px; }
  .money {
    display: inline-flex; align-items: baseline; gap: 8px;
    border: 1px solid #bcd8c3; background: #eaf3ec; border-radius: 9px; padding: 6px 14px;
  }
  .money.cassa { border-color: #e3cf9a; background: #fdf3dd; }
  .money .k { font-size: .74rem; color: var(--muted); }
  .money .v { font-size: 1.25rem; font-weight: 700; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .rows { display: flex; flex-direction: column; gap: 4px; margin-top: 6px; }
  button.row {
    display: flex; align-items: center; gap: 10px; width: 100%; text-align: left;
    border: 1px solid var(--line); background: #fafbfc; border-radius: 8px;
    padding: 6px 10px; font: inherit; font-size: .86rem; cursor: pointer;
  }
  button.row:hover { background: var(--chip); border-color: #c9d8ee; }
  .row .amt { margin-left: auto; font-family: ui-monospace, Menlo, Consolas, monospace; font-weight: 700; }
  .stag {
    border-radius: 999px; padding: 1px 8px; font-size: .68rem; font-weight: 700;
  }
  .stag.pend { background: #fff4dc; color: #8a5b00; }
  .stag.acc { background: var(--ok-bg); color: var(--ok); }
  .stag.perm { background: var(--viola-bg); color: var(--viola); }
  .stag.noperm { background: var(--bg); color: var(--muted); }
  .linkchip {
    display: inline-flex; align-items: center; gap: 6px;
    border: 1px solid #c9d8ee; background: var(--chip); border-radius: 8px;
    padding: 3px 10px; font: inherit; font-size: .82rem; cursor: pointer;
  }
  .linkchip:hover { background: var(--accent); color: #fff; }
  #refpanel { border: 1px solid var(--gold); border-radius: 10px; background: #fffdf6; padding: 9px 11px; }
  #refpanel h3 { margin: 0 0 6px; font-size: .8rem; color: #7a5c10; display: flex; gap: 8px; align-items: center; }
  .inline-acts { margin-left: auto; display: flex; gap: 5px; }
  button.mini {
    border: 1px solid #c9d8ee; background: #fff; border-radius: 6px;
    font: inherit; font-size: .74rem; padding: 2px 8px; cursor: pointer; color: var(--accent);
  }
  button.mini:hover { background: var(--accent); color: #fff; }
  button.mini.no { color: var(--bad); border-color: #e6b8b4; }
  button.mini.no:hover { background: var(--bad); color: #fff; }
  .sect { font-size: .74rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin: 8px 0 2px; }

  /* popover */
  #pop { position: fixed; z-index: 50; }
  .pbox {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 6px 24px rgba(20,40,60,.18); padding: 8px; max-width: min(330px, 92vw);
  }
  .pt { font-size: .82rem; font-weight: 700; margin: 0 2px 6px; display: flex; gap: 8px; align-items: center; }
  .pt .xbtn2 { margin-left: auto; border: none; background: none; cursor: pointer; color: var(--muted); font-size: .95rem; padding: 0 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px; max-height: 46vh; overflow-y: auto; }
  button.chip {
    display: inline-flex; align-items: center; gap: 7px;
    border: 1px solid #c9d8ee; background: var(--chip); border-radius: 8px;
    padding: 4px 10px; font: inherit; font-size: .86rem; cursor: pointer;
  }
  button.chip:not(:disabled):hover { background: var(--accent); color: #fff; }
  button.chip:disabled { background: var(--bg); border-color: var(--line); color: #9aa7b4; cursor: default; }
  .ar { display: flex; align-items: center; gap: 8px; padding: 4px 2px; }
  .ar input[type=range] { flex: 1; min-width: 120px; }
  .ar2 { display: flex; align-items: center; gap: 8px; padding: 4px 2px; }
  .ar2 input[type=number] {
    width: 90px; font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px;
  }
  .ar2 input.badv { border-color: var(--bad); background: var(--bad-bg); }
  button.primary {
    background: var(--accent); color: #fff; border: none; border-radius: 7px;
    padding: 5px 14px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.primary:disabled { background: #9db4d6; cursor: default; }
  button.ghost {
    background: #fff; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 7px; padding: 4px 10px; font: inherit; font-size: .84rem; cursor: pointer;
  }
  button.ghost:hover { background: var(--chip); }
  button.danger { color: var(--bad); border-color: var(--bad); }
  button.danger:hover { background: var(--bad-bg); }
  .tiny { font-size: .7rem; color: var(--muted); margin: 3px 2px 0; }
  .cfline { font-size: .85rem; margin: 4px 2px; }
  .cfline .nz { color: var(--bad); font-weight: 700; }
  .cfline .z { color: var(--ok); font-weight: 700; }

  .toast {
    position: fixed; z-index: 60; background: var(--bad-bg); border: 1px solid #e6b8b4;
    border-radius: 9px; padding: 6px 10px; font-size: .84rem; box-shadow: 0 4px 16px rgba(20,40,60,.18);
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px; max-width: min(340px, 92vw);
    animation: toastin .18s ease-out;
  }
  .toast.ext { background: var(--viola-bg); border-color: var(--viola-line); }
  @keyframes toastin { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; } }

  /* history + done */
  #log { display: flex; flex-direction: column; gap: 6px; max-height: 420px; overflow-y: auto; }
  .entry { border-left: 4px solid var(--line); border-radius: 4px; padding: 5px 9px; background: #fafbfc; font-size: .84rem; }
  .entry.acc { border-left-color: var(--ok); background: var(--ok-bg); }
  .entry.rej { border-left-color: var(--bad); background: var(--bad-bg); }
  .entry.ext { border-left-color: #8a63c9; background: #f7f3fc; }
  .entry .eh { font-weight: 600; }
  .entry .eh .mono { font-weight: 400; color: var(--muted); font-size: .74rem; }
  .entry .efl { font-size: .8rem; margin-top: 1px; }
  .entry ul.egs { margin: 3px 0 0; padding: 0; list-style: none; }
  .entry ul.egs li { font-size: .78rem; margin: 2px 0; display: flex; gap: 6px; align-items: baseline; }
  .entry .einv { font-size: .72rem; color: var(--muted); margin-top: 2px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .eprov { font-size: .72rem; color: var(--viola); margin-top: 2px; }
  .done { border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; margin-top: 6px; font-size: .84rem; }
  .done .dh { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; font-weight: 600; }
  .done .dh .tot { margin-left: auto; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .done ul { margin: 2px 0 0; padding-left: 0; list-style: none; font-size: .8rem; }

  .lawbanner {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    background: var(--bad); color: #fff; font-weight: 700; font-size: .9rem;
    padding: 8px 14px; box-shadow: 0 3px 14px rgba(0,0,0,.3);
  }

  /* proof provenance */
  .pk {
    display: inline-flex; align-items: center; border: 1px solid #b9cbe2;
    background: #eef4fb; color: #23538f; border-radius: 5px; cursor: pointer;
    font-size: .66rem; font-weight: 700; padding: 0 5px; margin-left: 4px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .pk:hover { background: #23538f; color: #fff; }
  .pk.npv { border-color: #e0b4b0; background: #fdf1f0; color: var(--bad); }
  .pk.npv:hover { background: var(--bad); color: #fff; }
  .gb[data-claim], .gbx[data-claim] { cursor: pointer; }
  .prow { display: flex; gap: 7px; align-items: baseline; padding: 4px 2px; font-size: .82rem; }
  .prow .pkind { flex: none; font-size: .64rem; font-weight: 700; border-radius: 5px; padding: 1px 6px; }
  .prow .pkind.thm { background: #eef4fb; color: #23538f; border: 1px solid #b9cbe2; }
  .prow .pkind.def { background: var(--ok-bg); color: var(--ok); border: 1px solid #bcd8c3; }
  .prow .pkind.npv { background: #fdf1f0; color: var(--bad); border: 1px solid #e0b4b0; }
  .prow .pdecl { display: block; font-size: .72rem; color: var(--muted); }
  .npvbadge {
    border: 1px solid #e0b4b0; background: #fdf1f0; color: var(--bad);
    border-radius: 5px; font-size: .62rem; font-weight: 700; padding: 1px 5px;
    white-space: nowrap; cursor: pointer;
  }

  /* teaching that recedes */
  .teach {
    border: 1px solid #b9cbe2; border-left: 4px solid #23538f; background: #eef4fb;
    border-radius: 8px; padding: 6px 10px; font-size: .82rem; margin-bottom: 4px;
    display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  }
  .teach .tx { border: none; background: none; cursor: pointer; color: var(--muted);
    margin-left: auto; font-size: .8rem; padding: 0 2px; }

  /* session log + presentation */
  #presbar {
    position: fixed; bottom: 0; left: 0; right: 0; z-index: 90;
    background: #23538f; color: #fff; padding: 7px 12px; font-size: .88rem;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  #presbar button {
    border: 1px solid #fff; background: none; color: #fff; border-radius: 6px;
    font: inherit; font-size: .82rem; padding: 2px 10px; cursor: pointer;
  }
  #presbar button:hover { background: rgba(255,255,255,.2); }
  #presbar button:disabled { opacity: .4; cursor: default; }
  .logta {
    width: 100%; min-height: 90px; font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: .7rem; border: 1px solid var(--line); border-radius: 6px; padding: 5px;
  }
</style>
</head>
<body>
<header>
  <h1>Reactivegas <small class="mono">Types.lean · Step.lean — 15 eventi</small></h1>
  <div class="hbtns">
    <button type="button" id="inv-chip" class="ok" title="bilancio della macchina — dettaglio, prove e contro-fattuale">⚖ <b>0 ✓</b></button>
    <button type="button" class="ghost" id="btn-log" title="log della sessione: esporta, importa, presenta — dati solo locali">Log</button>
    <button type="button" class="ghost" id="btn-teach" title="rivedi le spiegazioni">?</button>
    <button type="button" class="ghost danger" id="btn-reset" title="nuova sessione → State.init 0">Reset</button>
  </div>
</header>

<div id="crumbbar">
  <button type="button" id="nav-back" title="torna indietro">←</button>
  <nav id="crumbs" aria-label="percorso"></nav>
</div>

<main>
  <section id="view"></section>
  <aside id="side">
    <div class="card" id="done-card">
      <h2>Acquisti completati <small>solo <span class="mono">closePurchase</span></small>
        <span class="npvbadge" data-claims="done-list">NON PROVATO</span></h2>
      <div id="done-body"><p class="empty">nessuno</p></div>
    </div>
    <div class="card" id="history-card">
      <h2>Storia <small>✓ accettati · ✗ respinti · ⇣ esiti esterni</small></h2>
      <div id="log"><p class="empty">nessun tentativo</p></div>
    </div>
  </aside>
</main>

<div id="presbar" hidden></div>
<div id="pop" hidden></div>

<script>
'use strict';

/* selftest namespacing must precede any storage access: the selftest works
   on temporary keys and never touches a visitor's real saved session */
const IS_SELFTEST = /[?&]selftest=1/.test(location.search);
if (IS_SELFTEST) window.__RG_NS = '-selftest';

/* =====================================================================
   Machine core: faithful transcription of
   lean/Reactivegas/{Types,State,Step}.lean.
   State: { users:[Nat], responsabili:[Nat],
            conti:[[u,v]], casse:[[u,v]],
            collections:[{id, referente, permitted, accepted:[{user,amount}],
                          pending:[{user,amount}]}] }
   Toy-side decoration (names, purchase labels, snapshots, navigation,
   hats, tasks) never enters machine state or events; UserId/CollId stay
   numeric inside.
   ===================================================================== */

const FOUNDER = 0;

/* --- Toy-side fixed name/label pools (decoration, outside the machine) -- */

const NAMES = ['Anna', 'Bruno', 'Elena', 'Carlo', 'Dora', 'Enzo',
               'Febe', 'Gaia', 'Hugo', 'Irma', 'Luca', 'Mara'];
const nm = u => NAMES[u] !== undefined ? NAMES[u] : '?';
const PRESETS = ['Olio', 'Vino', 'Farina', 'Caffè', 'Miele', 'Pasta', 'Riso', 'Sale'];
let colLabels = {};                       // CollId -> toy label
const lbl = c => colLabels[c] !== undefined ? colLabels[c] : '?';

/* --- State.lean helpers ------------------------------------------------ */

// State.init r := ⟨[r], [r], [], [], []⟩
function initState(r) {
  return { users: [r], responsabili: [r], conti: [], casse: [], collections: [] };
}

// bal: first matching entry, absent means zero
function bal(m, u) {
  for (const [k, v] of m) if (k === u) return v;
  return 0;
}

// bump: add d to the first entry of u, appending a fresh entry when absent
function bump(m, u, d) {
  const out = [];
  let done = false;
  for (const [k, v] of m) {
    if (!done && k === u) { out.push([k, v + d]); done = true; }
    else out.push([k, v]);
  }
  if (!done) out.push([u, d]);
  return out;
}

function sumBal(m) { return m.reduce((a, [, v]) => a + v, 0); }
function sumPledges(l) { return l.reduce((a, p) => a + p.amount, 0); }
function escrowOf(c) { return sumPledges(c.accepted) + sumPledges(c.pending); }
function escrowSum(cols) { return cols.reduce((a, c) => a + escrowOf(c), 0); }

// splitUser: first pledge of u, and the list without it; null when absent
function splitUser(u, l) {
  const i = l.findIndex(p => p.user === u);
  if (i < 0) return null;
  return [l[i].amount, l.slice(0, i).concat(l.slice(i + 1))];
}

// refundAll: foldl bump
function refundAll(m, l) {
  return l.reduce((acc, p) => bump(acc, p.user, p.amount), m);
}

// pullCollection: the collection with id c, and the list without it
function pullCollection(c, cols) {
  const i = cols.findIndex(x => x.id === c);
  if (i < 0) return null;
  return [cols[i], cols.slice(0, i).concat(cols.slice(i + 1))];
}

// stripCollections: remove collections whose referente is r; collect their
// pledges (accepted ++ pending, in list order) for refunding
function stripCollections(r, cols) {
  const rest = [], ps = [];
  for (const c of cols) {
    if (c.referente === r) { ps.push(...c.accepted, ...c.pending); }
    else rest.push(c);
  }
  return [rest, ps];
}

function isResponsabile(s, u) { return s.responsabili.includes(u); }

/* --- Guard labels (canonical Lean code + toy-side why text) ------------ */

const g = (code, why, law) => ({ code, why, law: law || null });
const AUTH = a => g('isResponsabile s a', `${nm(a)} non è responsabile`, 'AUTH');
const PULL = c => g('pullCollection c = none', `nessun acquisto aperto «${lbl(c)}»`);

/* --- Step.lean: the rejecting transition, with named guards ------------
   attempt(s,e) → {ok:true, state, flow} | {ok:false, failed:[guard]}
   The accept/reject decision is exactly the Lean conjunction; `failed`
   lists every failing guard that is evaluable (guards depending on a
   failed pullCollection/splitUser cannot be evaluated and are skipped). */

function attempt(s, e) {
  const fails = [];
  const need = (cond, guard) => { if (!cond) fails.push(guard); return cond; };
  const rej = () => ({ ok: false, failed: fails });

  switch (e.tag) {

    case 'addUser': {
      need(isResponsabile(s, e.author), AUTH(e.author));
      need(!s.users.includes(e.target),
        g('!s.users.contains u', `${nm(e.target)} è già nel gruppo`));
      if (fails.length) return rej();
      return { ok: true, flow: `${nm(e.target)} entra nel gruppo`,
        state: { ...s, users: [...s.users, e.target] } };
    }

    case 'electResponsabile': {
      need(isResponsabile(s, e.author), AUTH(e.author));
      need(s.users.includes(e.target),
        g('s.users.contains u', `${nm(e.target)} non è nel gruppo`));
      need(!isResponsabile(s, e.target),
        g('!isResponsabile s u', `${nm(e.target)} è già responsabile`));
      if (fails.length) return rej();
      return { ok: true, flow: `★ ${nm(e.target)} è responsabile`,
        state: { ...s, responsabili: [e.target, ...s.responsabili] } };
    }

    case 'removeResponsabile': {
      need(isResponsabile(s, e.author), AUTH(e.author));
      need(isResponsabile(s, e.target),
        g('isResponsabile s u', `${nm(e.target)} non è responsabile`));
      if (fails.length) return rej();
      const [rest, ps] = stripCollections(e.target, s.collections);
      const i = s.responsabili.indexOf(e.target);
      const resps = s.responsabili.slice(0, i).concat(s.responsabili.slice(i + 1));
      const flow = ps.length
        ? `★✕ ${nm(e.target)} · suoi acquisti chiusi, rimborsi: ` +
          ps.map(p => `conto ${nm(p.user)} +${p.amount}`).join(', ')
        : `★✕ ${nm(e.target)} · nessun acquisto da chiudere`;
      return { ok: true, flow,
        state: { ...s, responsabili: resps, conti: refundAll(s.conti, ps), collections: rest } };
    }

    case 'openPurchase': {
      need(isResponsabile(s, e.author), AUTH(e.author));
      need(!s.collections.some(x => x.id === e.c),
        g('!(s.collections.any (x.id == c))', `acquisto «${lbl(e.c)}» già aperto`));
      if (fails.length) return rej();
      return { ok: true,
        flow: `apre l'acquisto «${lbl(e.c)}» — referente ${nm(e.author)}, permesso: no, impegni 0`,
        state: { ...s, collections:
          [{ id: e.c, referente: e.author, permitted: false, accepted: [], pending: [] },
           ...s.collections] } };
    }

    case 'grantPermission': {
      const pulled = pullCollection(e.c, s.collections);
      need(pulled !== null, PULL(e.c));
      need(isResponsabile(s, e.author), AUTH(e.author));
      if (fails.length) return rej();
      const [col, rest] = pulled;
      return { ok: true, flow: `«${lbl(e.c)}»: assenso del gruppo — permesso di chiusura concesso (L2 ✓)`,
        state: { ...s, collections: [{ ...col, permitted: true }, ...rest] } };
    }

    case 'denyPermission': {
      const pulled = pullCollection(e.c, s.collections);
      need(pulled !== null, PULL(e.c));
      need(isResponsabile(s, e.author), AUTH(e.author));
      if (fails.length) return rej();
      const [col, rest] = pulled;
      const ps = [...col.accepted, ...col.pending];
      return { ok: true,
        flow: `acquisto «${lbl(e.c)}» negato e chiuso · rimborsi: ` +
          (ps.length ? ps.map(p => `conto ${nm(p.user)} +${p.amount}`).join(', ') : 'nessuno'),
        state: { ...s, conti: refundAll(s.conti, ps), collections: rest } };
    }

    case 'deposit': {
      need(isResponsabile(s, e.author), AUTH(e.author));
      need(s.users.includes(e.user),
        g('s.users.contains u', `${nm(e.user)} non è nel gruppo`));
      need(e.author !== e.user,
        g('a != u', 'autore e utente devono essere diversi'));
      need(0 <= e.v, g('0 ≤ v', `importo negativo (${e.v})`));
      if (fails.length) return rej();
      return { ok: true, flow: `accredito: conto ${nm(e.user)} +${e.v} · cassa ${nm(e.author)} +${e.v}`,
        state: { ...s, conti: bump(s.conti, e.user, e.v), casse: bump(s.casse, e.author, e.v) } };
    }

    case 'withdraw': {
      need(isResponsabile(s, e.author), AUTH(e.author));
      need(s.users.includes(e.user),
        g('s.users.contains u', `${nm(e.user)} non è nel gruppo`));
      need(e.author !== e.user,
        g('a != u', 'autore e utente devono essere diversi'));
      need(bal(s.conti, e.user) >= e.v,
        g('bal s.conti u ≥ v',
          `credito insufficiente: conto ${nm(e.user)} = ${bal(s.conti, e.user)} < ${e.v}`,
          'COVERED (L7)'));
      if (fails.length) return rej();
      return { ok: true, flow: `prelievo: conto ${nm(e.user)} −${e.v} · cassa ${nm(e.author)} −${e.v}`,
        state: { ...s, conti: bump(s.conti, e.user, -e.v), casse: bump(s.casse, e.author, -e.v) } };
    }

    case 'transferCassa': {
      need(isResponsabile(s, e.author), AUTH(e.author));
      need(isResponsabile(s, e.from_),
        g('isResponsabile s f', `${nm(e.from_)} non è responsabile`, 'AUTH'));
      need(e.author !== e.from_,
        g('a != f', 'autore e mittente devono essere diversi'));
      need(e.v > 0, g('v > 0', `l'importo deve essere positivo (${e.v})`));
      if (fails.length) return rej();
      return { ok: true, flow: `cassa ${nm(e.from_)} −${e.v} → cassa ${nm(e.author)} +${e.v}`,
        state: { ...s, casse: bump(bump(s.casse, e.from_, -e.v), e.author, e.v) } };
    }

    case 'pledge': {
      const pulled = pullCollection(e.c, s.collections);
      need(pulled !== null, PULL(e.c));
      need(isResponsabile(s, e.author), AUTH(e.author));
      need(s.users.includes(e.user),
        g('s.users.contains u', `${nm(e.user)} non è nel gruppo`));
      if (pulled) {
        const [col] = pulled;
        need(!col.accepted.some(p => p.user === e.user),
          g('!(col.accepted.any (p.user == u))',
            `${nm(e.user)} ha già un impegno accettato in «${lbl(e.c)}»`, 'L8'));
        need(!col.pending.some(p => p.user === e.user),
          g('!(col.pending.any (p.user == u))',
            `${nm(e.user)} ha già un impegno pendente in «${lbl(e.c)}»`, 'L8'));
      }
      need(0 < e.v, g('0 < v', `l'impegno deve essere positivo (${e.v})`, 'COVERED (L7)'));
      need(bal(s.conti, e.user) >= e.v,
        g('bal s.conti u ≥ v',
          `credito insufficiente: conto ${nm(e.user)} = ${bal(s.conti, e.user)} < ${e.v}`,
          'COVERED (L7)'));
      if (fails.length) return rej();
      const [col, rest] = pulled;
      return { ok: true,
        flow: `impegno: conto ${nm(e.user)} −${e.v} → impegni di «${lbl(e.c)}» (pendente)`,
        state: { ...s, conti: bump(s.conti, e.user, -e.v),
          collections: [{ ...col, pending: [{ user: e.user, amount: e.v }, ...col.pending] },
                        ...rest] } };
    }

    case 'acceptPledge': {
      const pulled = pullCollection(e.c, s.collections);
      need(pulled !== null, PULL(e.c));
      let split = null;
      if (pulled) {
        split = splitUser(e.user, pulled[0].pending);
        need(split !== null,
          g('splitUser u col.pending = none',
            `${nm(e.user)} non ha un impegno pendente in «${lbl(e.c)}»`));
        need(pulled[0].referente === e.author,
          g('col.referente == a',
            `solo il referente (${nm(pulled[0].referente)}) può accettare`, 'REFERENTE'));
      }
      need(isResponsabile(s, e.author), AUTH(e.author));
      if (fails.length) return rej();
      const [col, rest] = pulled;
      const [v, pend2] = split;
      return { ok: true,
        flow: `«${lbl(e.c)}»: impegno di ${nm(e.user)} (${v}) pendente → accettato`,
        state: { ...s, collections:
          [{ ...col, pending: pend2, accepted: [{ user: e.user, amount: v }, ...col.accepted] },
           ...rest] } };
    }

    case 'refusePledge': {
      const pulled = pullCollection(e.c, s.collections);
      need(pulled !== null, PULL(e.c));
      let split = null;
      if (pulled) {
        split = splitUser(e.user, pulled[0].pending);
        need(split !== null,
          g('splitUser u col.pending = none',
            `${nm(e.user)} non ha un impegno pendente in «${lbl(e.c)}»`));
        need(pulled[0].referente === e.author,
          g('col.referente == a',
            `solo il referente (${nm(pulled[0].referente)}) può rifiutare`, 'REFERENTE'));
      }
      need(isResponsabile(s, e.author), AUTH(e.author));
      if (fails.length) return rej();
      const [col, rest] = pulled;
      const [v, pend2] = split;
      return { ok: true,
        flow: `rimborso: impegni di «${lbl(e.c)}» −${v} → conto ${nm(e.user)} +${v}`,
        state: { ...s, conti: bump(s.conti, e.user, v),
          collections: [{ ...col, pending: pend2 }, ...rest] } };
    }

    case 'correctPledge': {
      const pulled = pullCollection(e.c, s.collections);
      need(pulled !== null, PULL(e.c));
      let split = null;
      if (pulled) {
        split = splitUser(e.user, pulled[0].accepted);
        need(split !== null,
          g('splitUser u col.accepted = none',
            `${nm(e.user)} non ha un impegno accettato in «${lbl(e.c)}»`));
        need(pulled[0].referente === e.author,
          g('col.referente == a',
            `solo il referente (${nm(pulled[0].referente)}) può correggere`, 'REFERENTE'));
      }
      need(isResponsabile(s, e.author), AUTH(e.author));
      need(0 <= e.v, g("0 ≤ v'", `il nuovo importo non può essere negativo (${e.v})`, 'COVERED (L7)'));
      if (split) {
        const v = split[0];
        need(bal(s.conti, e.user) + (v - e.v) >= 0,
          g("bal s.conti u + (v − v') ≥ 0",
            `il conguaglio manderebbe conto ${nm(e.user)} a ${bal(s.conti, e.user) + (v - e.v)} < 0`,
            'COVERED (L7)'));
      }
      if (fails.length) return rej();
      const [col, rest] = pulled;
      const [v, acc2] = split;
      const d = v - e.v;
      return { ok: true,
        flow: `impegno di ${nm(e.user)}: ${v} → ${e.v} · conto ${nm(e.user)} ` +
          (d >= 0 ? `+${d}` : `${d}`),
        state: { ...s, conti: bump(s.conti, e.user, d),
          collections: [{ ...col, accepted: [{ user: e.user, amount: e.v }, ...acc2] },
                        ...rest] } };
    }

    case 'closePurchase': {
      const pulled = pullCollection(e.c, s.collections);
      need(pulled !== null, PULL(e.c));
      need(isResponsabile(s, e.author), AUTH(e.author));
      if (pulled) {
        const [col] = pulled;
        need(col.referente === e.author,
          g('col.referente == a',
            `solo il referente (${nm(col.referente)}) può chiudere`, 'REFERENTE'));
        need(col.permitted,
          g('col.permitted', 'il gruppo non ha concesso il permesso di chiusura', 'PERMITTED (L2)'));
        need(col.pending.length === 0,
          g('col.pending.isEmpty',
            `restano ${col.pending.length} impegni pendenti`, 'NO-PENDING (L4)'));
      }
      if (fails.length) return rej();
      const [col, rest] = pulled;
      const tot = sumPledges(col.accepted);
      return { ok: true,
        flow: `acquisto «${lbl(e.c)}» chiuso: cassa ${nm(col.referente)} −${tot} · impegni −${tot} (spesi)`,
        state: { ...s, casse: bump(s.casse, col.referente, -tot), collections: rest } };
    }

    case 'failPurchase': {
      const pulled = pullCollection(e.c, s.collections);
      need(pulled !== null, PULL(e.c));
      need(isResponsabile(s, e.author), AUTH(e.author));
      if (pulled) {
        const [col] = pulled;
        need(col.referente === e.author,
          g('col.referente == a',
            `solo il referente (${nm(col.referente)}) può farla fallire`, 'REFERENTE'));
        need(col.pending.length === 0,
          g('col.pending.isEmpty',
            `restano ${col.pending.length} impegni pendenti`, 'NO-PENDING (L4)'));
      }
      if (fails.length) return rej();
      const [col, rest] = pulled;
      const ps = [...col.accepted, ...col.pending];
      return { ok: true,
        flow: `acquisto «${lbl(e.c)}» fallito · rimborsi: ` +
          (ps.length ? ps.map(p => `conto ${nm(p.user)} +${p.amount}`).join(', ') : 'nessuno'),
        state: { ...s, conti: refundAll(s.conti, ps), collections: rest } };
    }
  }
  throw new Error('unknown event tag: ' + e.tag);
}

/* selftest gate: the manifest cannot be fictional or unmarked */
function claimAudit() {
  const bad = [];
  const KINDS = ['teorema', 'definizione', 'NON PROVATO'];
  for (const [id, r] of Object.entries(CLAIMS)) {
    if (!r.c || !KINDS.includes(r.k)) { bad.push(id + ': forma non valida'); continue; }
    if (r.k === 'NON PROVATO') {
      if (r.d !== null) bad.push(id + ': NON PROVATO con dichiarazione');
    } else {
      if (!r.d || !CHECK_RECEIPT.decls.includes(r.d))
        bad.push(id + ': dichiarazione senza ricevuta di verifica');
      if (!r.f || !Number.isInteger(r.l) || r.l <= 0 || !CHECK_RECEIPT.sources[r.f])
        bad.push(id + ': sorgente/riga non validi');
    }
  }
  for (const g of Object.values(GUARD_CLAIMS))
    if (!CLAIMS[g]) bad.push('guardia senza riga: ' + g);
  for (const ids of Object.values(TAG_CLAIMS))
    for (const i of ids) if (!CLAIMS[i]) bad.push('tag senza riga: ' + i);
  // derived refusal coverage: a binding without a verified inversion theorem
  // is a claim about Lean that Lean was not asked to confirm
  for (const [tag, rowId] of Object.entries(REFUSAL_PROOFS)) {
    const row = CLAIMS[rowId];
    if (!EV[tag]) bad.push('inversione per evento inesistente: ' + tag);
    if (!row || row.k !== 'teorema' || !row.d || !CHECK_RECEIPT.decls.includes(row.d))
      bad.push('inversione non verificata per: ' + tag);
  }
  const inv = refusalInventory();
  if (inv.proven.length + inv.missing.length !== inv.events.length)
    bad.push('inventario inversioni incoerente');
  return bad;
}

/* --- Crude-drift net: lean/Reactivegas/Predicates.lean, transcribed ------
   The state invariants of the law predicates, asserted after every applied
   event: conservation (L6), solvent (L7, both conjuncts), allUniquePledges
   (L8, exactly the Lean predicate: p.user = q.user → p = q). The relational
   predicates (permissionToClose, escrowHeld, doubleEntry, authorizedStep,
   governanceEnacts) are per-event properties, not state invariants, and the
   trace-conformance net covers them. A violation here means the JS
   transcription diverged from Step.lean: surfaced loudly, never cleared. */

let lawBreaches = [];   // toy-side alarm record; selftest asserts it stays empty

function lawViolations(s) {
  const out = [];
  // conservation: sumBal casse − sumBal conti − escrowSum collections = 0
  if (sumBal(s.casse) - sumBal(s.conti) - escrowSum(s.collections) !== 0)
    out.push('conservation (L6)');
  // solvent, first conjunct: ∀ u, bal conti u ≥ 0 (absent entries are 0)
  if (s.conti.some(([, v]) => v < 0)) out.push('solvent (L7): conto negativo');
  for (const col of s.collections) {
    const all = [...col.accepted, ...col.pending];
    // solvent, second conjunct: every pledged amount non-negative
    if (all.some(p => p.amount < 0)) out.push(`solvent (L7): impegno negativo in «${lbl(col.id)}»`);
    // uniquePledges: p.user = q.user → p = q
    outer:
    for (let i = 0; i < all.length; i++)
      for (let j = i + 1; j < all.length; j++)
        if (all[i].user === all[j].user && all[i].amount !== all[j].amount) {
          out.push(`uniquePledges (L8) in «${lbl(col.id)}»`);
          break outer;
        }
  }
  return out;
}

function lawAlarm(viol, tag) {
  lawBreaches.push({ tag, viol });
  const b = document.createElement('div');
  b.className = 'lawbanner';
  b.textContent = `⚠ INVARIANTE LEAN VIOLATO dopo .${tag}: ${viol.join(' · ')} — trascrizione divergente da Predicates.lean`;
  document.body.appendChild(b);
}

/* Lean ToJson event shape {"tag":{...fields}} ↔ machine event {tag, ...} */
const leanEventOf = ej => {
  const tag = Object.keys(ej)[0];
  return { tag, ...ej[tag] };
};
const leanEventJson = e => {
  const { tag, ...fields } = e;
  return { [tag]: fields };
};

const canonState = s => JSON.stringify({
  users: s.users, responsabili: s.responsabili, conti: s.conti, casse: s.casse,
  collections: s.collections.map(c => ({ id: c.id, referente: c.referente,
    permitted: c.permitted,
    accepted: c.accepted.map(p => ({ user: p.user, amount: p.amount })),
    pending: c.pending.map(p => ({ user: p.user, amount: p.amount })) })) });

/* Refusal explanations: DERIVED coverage, never a frozen list. An event's
   refusal is proved iff its entry below binds a manifest row of kind
   'teorema' whose declaration is mechanically verified in the Lean source
   snapshot (CHECK_RECEIPT). Every event without such a verified binding
   renders NON PROVATO locally — including any constructor a future Lean
   amendment adds (#48's accepted surface carries events this snapshot does
   not; they are discovered by inventory, not by a copied list). Never assume
   future proof names. */
const REFUSAL_PROOFS = {
  pledge: 'inv-pledge', acceptPledge: 'inv-accept', refusePledge: 'inv-refuse',
  correctPledge: 'correct-conguaglio', closePurchase: 'nopending',
  failPurchase: 'nopending-fail', grantPermission: 'inv-grant',
  denyPermission: 'inv-deny',
};

/* is this event's refusal explanation bound to a verified inversion theorem? */
function refusalProven(tag) {
  const row = CLAIMS[REFUSAL_PROOFS[tag]];
  return !!(row && row.k === 'teorema' && row.d && CHECK_RECEIPT.decls.includes(row.d));
}
/* claim ids to show for a refusal/guard encounter on this event */
function refusalClaims(tag) {
  return refusalProven(tag) ? [REFUSAL_PROOFS[tag]] : ['refusal-unproved'];
}
/* live inventory: event constructors vs verified inversion bindings */
function refusalInventory() {
  const events = Object.keys(EV);
  const proven = events.filter(refusalProven);
  const missing = events.filter(t => !refusalProven(t));
  return { events, proven, missing };
}

/* v1 consumer: validate + replay one envelope through the JS transcription.
   Enforces every frozen-contract rejection: schema, version, shape,
   input continuity from `initial` (stored inputs are never authority),
   outcome match, post-state match, and refusal-guard validity. Returns
   { steps, states } or throws with a precise reason. */
function verifyTraceV1(env, opts) {
  opts = opts || {};
  const short = x => { const j = typeof x === 'string' ? x : JSON.stringify(x);
    return j.length > 220 ? j.slice(0, 220) + '…' : j; };
  const fail = m => { throw new Error('trace: ' + m); };
  if (!env || typeof env !== 'object') fail('non è un oggetto');
  if (env.schema !== 'reactivegas.trace') fail('schema sconosciuto');
  if (env.version !== 1) fail('versione non supportata: ' + env.version);
  if (!env.initial || !Array.isArray(env.steps)) fail('forma non valida');
  let s = env.initial;
  if (canonState(s) !== canonState(initState(FOUNDER)))
    fail('stato iniziale non è State.init 0 — atteso=' + short(canonState(initState(FOUNDER))) +
      ' osservato=' + short(canonState(s)));
  const states = [JSON.parse(canonState(s))];
  const refusedNotes = [];
  env.steps.forEach((st, i) => {
    if (!st || !st.input || !st.event || !st.result) fail(`passo ${i}: forma non valida`);
    if (canonState(st.input) !== canonState(s))
      fail(`passo ${i}: input discontinuo — derivato=${short(canonState(s))} memorizzato=${short(canonState(st.input))}`);
    const e = leanEventOf(st.event);
    if (!EV[e.tag]) fail(`passo ${i}: evento sconosciuto ${short(st.event)}`);
    const res = attempt(JSON.parse(canonState(s)), e);
    if (st.result.tag === 'applied') {
      if (!res.ok)
        fail(`passo ${i} (.${e.tag}): registrato applicato, la macchina rifiuta — guardie: ` +
          short(res.failed.map(g => g.code).join(' ∧ ')));
      if (canonState(res.state) !== canonState(st.result.state))
        fail(`passo ${i} (.${e.tag}): post-stato divergente — atteso=${short(canonState(st.result.state))} osservato=${short(canonState(res.state))}`);
      const viol = lawViolations(res.state);
      if (viol.length) fail(`passo ${i}: ${viol.join(' · ')}`);
      s = res.state;
    } else if (st.result.tag === 'refused') {
      if (opts.appliedOnly) fail(`passo ${i}: rifiuto in un log di sessione`);
      if (res.ok) fail(`passo ${i} (.${e.tag}): registrato rifiutato, la macchina applica`);
      const gu = st.result.guard;
      if (!gu || typeof gu.id !== 'string') fail(`passo ${i}: guard mancante`);
      if (refusalProven(e.tag) && gu.declaration !== CLAIMS[REFUSAL_PROOFS[e.tag]].d)
        fail(`passo ${i}: GuardId/dichiarazione senza teorema di inversione accettato — ` +
          `dichiarata=${short(gu.declaration)} attesa=${CLAIMS[REFUSAL_PROOFS[e.tag]].d}`);
      // «entrambi rifiutati» non è conformità: senza il valutatore diagnostico
      // provato di #48 non esiste un guard-id autorevole da confrontare, quindi
      // la verifica del motivo resta dichiaratamente NON PROVATA, mai silenziosa
      refusedNotes.push(`passo ${i} (.${e.tag}): guard-id «${gu.id}» non verificabile in questo snapshot (NON PROVATO, #48)`);
    } else fail(`passo ${i}: result.tag sconosciuto «${short(st.result.tag)}»`);
    states.push(JSON.parse(canonState(s)));
  });
  return { steps: env.steps.length, states,
    refusedUnverified: refusedNotes.length, refusedNotes };
}

/* Subtle-drift net: replay the Lean seed envelopes through the JS `attempt`
   and compare every post-state. Fails loudly on any divergence — and on an
   EMPTY corpus: a conformance check that passes because it found no traces
   is the failure this goal exists to prevent. The corpus below is the LOCAL
   applied-only seed generated from this checkout's Step.lean; it is not the
   forthcoming accepted #48 emitter corpus, and refused-step guard-id
   verification stays NON PROVATO until that lands. */
function traceConformance() {
  const names = Object.keys(LEAN_TRACES_V1);
  let steps = 0, refusedUnverified = 0;
  for (const name of names) {
    try {
      const r = verifyTraceV1(LEAN_TRACES_V1[name]);
      steps += r.steps;
      refusedUnverified += r.refusedUnverified;
    } catch (e) {
      throw new Error(name + ' — ' + e.message);
    }
  }
  if (!names.length || steps === 0)
    throw new Error('corpus di conformità vuoto: nessuna traccia, nessuna prova');
  return { steps, refusedUnverified, corpus: 'seme-locale-solo-applicati' };
}

/* --- Session log (persist the LOG, not the state) -------------------------
   The durable artifact is the sequence of applied Lean-shaped events in the
   frozen v1 trace envelope; state is derived by replay and verified step by
   step. Everything stays in this browser's localStorage — no server, no
   network. Export/share/presentation all consume the same envelope the
   conformance corpus uses. */

const LOG_KEY_BASE = 'rg-sim-log-v1';
const TEACH_KEY_BASE = 'rg-teach-v1';
const storeNS = () => window.__RG_NS || '';
const logKey = () => LOG_KEY_BASE + storeNS();
const teachKey = () => TEACH_KEY_BASE + storeNS();

let sessionSteps = [];   // v1 applied steps of the live session

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

function sessionEnvelope() {
  return { schema: 'reactivegas.trace', version: 1,
    initial: JSON.parse(canonState(initState(FOUNDER))),
    steps: sessionSteps };
}
function buildExport() {
  return JSON.stringify({ format: 'reactivegas-sim-session', v: 1,
    labels: { ...colLabels }, trace: sessionEnvelope() });
}
function persistSession() { lsSet(logKey(), buildExport()); }

/* rebuild toy-side decoration + history from a verified applied-only trace */
function adoptTrace(env, labels) {
  state = initState(FOUNDER);
  history = []; completed = []; collSeq = 1; colLabels = { ...(labels || {}) };
  for (const st of env.steps) {
    const e = leanEventOf(st.event);
    const { tag, ...args } = e;
    if (tag === 'openPurchase' && colLabels[args.c] === undefined) {
      const used = new Set(Object.values(colLabels));
      colLabels[args.c] = PRESETS.find(p => !used.has(p)) || ('acquisto ' + collSeq);
    }
    recordApplied(tag, args, attempt(state, e));
  }
  sessionSteps = env.steps.slice();
  invNote = `sessione ripristinata: ${env.steps.length} eventi`;
}

/* boot-time restore: never trust the stored final state — replay and verify */
function restoreSession() {
  const raw = lsGet(logKey());
  if (!raw) return null;
  let wrap;
  try { wrap = JSON.parse(raw); } catch (e) { return quarantineLog('log locale illeggibile'); }
  const env = wrap && wrap.format === 'reactivegas-sim-session' ? wrap.trace : wrap;
  try { verifyTraceV1(env, { appliedOnly: true }); }
  catch (e) { return quarantineLog(e.message); }
  adoptTrace(env, wrap && wrap.labels);
  return env.steps.length;
}

function quarantineLog(reason) {
  const raw = lsGet(logKey());
  if (raw) lsSet(logKey() + '-corrotto', raw);
  lsDel(logKey());
  toast(`<b>log locale rifiutato</b> <span class="tiny">${esc(reason)} — nuova sessione; il log rifiutato è conservato</span>`,
    innerWidth / 2, 80);
  return null;
}

function newSession() {
  lsDel(logKey());
  state = initState(FOUNDER);
  history = []; completed = []; collSeq = 1; colLabels = {}; sessionSteps = [];
  invNote = 'nuova sessione → State.init 0';
  navStack = [{ view: 'group' }];
  cancelFlow();
  renderAll();
}

/* --- Presentation mode: replay a trace one applied event at a time -------- */

let pres = null;   // { env, labels, states, idx, saved:{state,nav,labels,note} }

function enterPresentation(env, labels) {
  const ver = verifyTraceV1(env);           // continuity + post-states, throws on bad
  pres = { env, states: ver.states, idx: 0,
    saved: { state, nav: navStack, labels: colLabels, note: invNote,
      hist: history, comp: completed, seq: collSeq } };
  colLabels = { ...(labels || {}) };
  // derive labels for unlabelled acquisti (toy decoration only)
  env.steps.forEach(st => {
    const e = leanEventOf(st.event);
    if (e.tag === 'openPurchase' && colLabels[e.c] === undefined) {
      const used = new Set(Object.values(colLabels));
      colLabels[e.c] = PRESETS.find(p => !used.has(p)) || ('acquisto ' + e.c);
    }
  });
  navStack = [{ view: 'group' }];
  closePop();
  presSet(0);
}

function presSet(i) {
  pres.idx = Math.max(0, Math.min(pres.env.steps.length, i));
  state = JSON.parse(JSON.stringify(pres.states[pres.idx]));
  renderAll();
}

function exitPresentation() {
  const s = pres.saved;
  pres = null;
  state = s.state; navStack = s.nav; colLabels = s.labels; invNote = s.note;
  history = s.hist; completed = s.comp; collSeq = s.seq;
  renderAll();
}

function renderPresBar() {
  const bar = $('presbar');
  if (!pres) { bar.hidden = true; bar.innerHTML = ''; return; }
  const n = pres.env.steps.length;
  const i = pres.idx;
  const what = i === 0 ? 'stato iniziale'
    : descr(...(d => [d.tag, d])(leanEventOf(pres.env.steps[i - 1].event)));
  bar.hidden = false;
  bar.innerHTML = `<b>presentazione</b> <span>${i}/${n}</span>
    <span style="opacity:.85">${esc(what)}</span>
    <span style="margin-left:auto;display:flex;gap:6px">
    <button type="button" id="pres-restart" ${i === 0 ? 'disabled' : ''}>⏮</button>
    <button type="button" id="pres-prev" ${i === 0 ? 'disabled' : ''}>‹ prec</button>
    <button type="button" id="pres-next" ${i >= n ? 'disabled' : ''}>succ ›</button>
    <button type="button" id="pres-exit">✕ esci</button></span>`;
  $('pres-restart').addEventListener('click', () => presSet(0));
  $('pres-prev').addEventListener('click', () => presSet(pres.idx - 1));
  $('pres-next').addEventListener('click', () => presSet(pres.idx + 1));
  $('pres-exit').addEventListener('click', exitPresentation);
}

/* --- Teaching that recedes ------------------------------------------------ */

const TEACH_ITEMS = {
  benvenuto: { text: 'Clicca una persona, un saldo o un acquisto: ogni azione è un evento della macchina Lean, e ⊢ apre la prova di ogni affermazione.', claims: ['js-transcription'] },
  impegno: { text: "L'impegno sposta subito il denaro dal conto negli impegni dell'acquisto: escrow reale, non una promessa.", claims: ['impegno-escrow'] },
  guardie: { text: "Un'azione rifiutata nomina tutte le sue guardie; un compito spento mostra il motivo prima ancora di provare — cliccalo per la prova.", claims: ['auth', 'covered'] },
  cassa: { text: 'La cassa del referente può andare sotto zero: ha pagato il fornitore. Non è un errore.', claims: ['cassa-negativa', 'close-payout'] },
  chiusa: { text: "L'acquisto chiuso sparisce dallo stato: la storia resta solo nel log degli eventi.", claims: ['close-gone'] },
};

function loadTeach() {
  try { return JSON.parse(lsGet(teachKey())) || {}; } catch (e) { return {}; }
}
let teach = loadTeach();
function saveTeach() { lsSet(teachKey(), JSON.stringify(teach)); }
function teachLearn(id) {
  if (!TEACH_ITEMS[id] || teach[id]) return;
  teach[id] = true; saveTeach();
}
function teachStrip(id) {
  if (teach[id] || pres) return '';
  const t = TEACH_ITEMS[id];
  return `<div class="teach" data-teach="${id}">${esc(t.text)} ${pkGlyph(t.claims)}
    <button type="button" class="tx" data-teachx="${id}" title="ho capito">✕</button></div>`;
}
function teachReplay() { teach = {}; saveTeach(); renderAll(); }

/* --- Attempt driver ------------------------------------------------------ */

function invSnapshot() {
  const sc = sumBal(state.casse), sn = sumBal(state.conti), se = escrowSum(state.collections);
  return { sc, sn, se, v: sc - sn - se };
}

/* apply an accepted result to toy-side state; shared by live attempts and
   verified-log adoption so replay rebuilds exactly what the session showed */
function recordApplied(tag, args, res) {
  // toy-side snapshot of a successful close, taken from the pre-state
  if (tag === 'closePurchase') {
    const [col] = pullCollection(args.c, state.collections);
    completed.unshift({ label: lbl(col.id), referente: col.referente,
      contributors: col.accepted.map(p => ({ user: p.user, amount: p.amount })),
      total: sumPledges(col.accepted) });
  }
  state = res.state;
  if (tag === 'openPurchase') collSeq = Math.max(collSeq, args.c + 1);
  const viol = lawViolations(state);
  if (viol.length) lawAlarm(viol, tag);
  history.unshift({ kind: 'acc', tag, args, descr: descr(tag, args), flow: res.flow,
    ext: !!EV[tag].external, inv: invSnapshot() });
  invNote = `dopo .${tag} ✓`;
}

function runAttempt(tag, args, toyLabel) {
  if (tag === 'openPurchase' && toyLabel) colLabels[args.c] = toyLabel;
  const preCanon = JSON.parse(canonState(state));
  const res = attempt(state, { tag, ...args });
  if (res.ok) {
    recordApplied(tag, args, res);
    // the durable artifact is the applied-event log, in the frozen v1 shape
    sessionSteps.push({ input: preCanon, event: leanEventJson({ tag, ...args }),
      result: { tag: 'applied', state: JSON.parse(canonState(state)) } });
    persistSession();
    // teaching recedes as the machine is used
    teachLearn('benvenuto');
    if (tag === 'pledge') teachLearn('impegno');
    if (tag === 'closePurchase') { teachLearn('cassa'); teachLearn('chiusa'); }
    if (tag === 'denyPermission' || tag === 'failPurchase') teachLearn('chiusa');
  } else {
    if (tag === 'openPurchase') delete colLabels[args.c];
    history.unshift({ kind: 'rej', tag, args, descr: descr(tag, args), failed: res.failed,
      ext: !!EV[tag].external, inv: invSnapshot() });
    invNote = `dopo .${tag} ✗ — stato invariato`;
    teachLearn('guardie');
  }
  return res;
}

/* --- Toy-side helpers ----------------------------------------------------- */

const resp = u => isResponsabile(state, u);
const refCols = u => state.collections.filter(c => c.referente === u);
const inCol = (c, u) => c.accepted.some(p => p.user === u) || c.pending.some(p => p.user === u);
const candidates = () => {
  const out = [];
  for (let i = 0; i < NAMES.length && out.length < 3; i++)
    if (!state.users.includes(i)) out.push(i);
  return out;
};
const pledgesOf = u => {
  const out = [];
  for (const c of state.collections) {
    for (const p of c.pending) if (p.user === u) out.push({ c: c.id, amount: p.amount, st: 'pendente' });
    for (const p of c.accepted) if (p.user === u) out.push({ c: c.id, amount: p.amount, st: 'accettato' });
  }
  return out;
};
const B = (badge, note) => ({ badge, note: note || '' });

/* Task availability: guards as affordances, computed from live state. */
function taskDis(tag, ctx) {
  ctx = ctx || {};
  const cols = state.collections;
  switch (tag) {
    case 'addUser':
      if (!state.responsabili.length) return B('AUTH', 'nessun responsabile');
      return candidates().length ? null : B('—', 'nessun candidato');
    case 'electResponsabile':
      if (!state.responsabili.length) return B('AUTH', 'nessun responsabile');
      return state.users.some(u => !resp(u)) ? null : B('—', 'tutti già ★');
    case 'removeResponsabile':
      return state.responsabili.length ? null : B('AUTH', 'nessun responsabile');
    case 'openPurchase':
      if (ctx.author !== undefined && !resp(ctx.author)) return B('AUTH', 'non è responsabile');
      return state.responsabili.length ? null : B('AUTH', 'nessun responsabile');
    case 'deposit': case 'withdraw': {
      if (ctx.user !== undefined)
        return state.responsabili.some(r => r !== ctx.user) ? null : B('AUTH', 'serve un cassiere diverso');
      if (ctx.author !== undefined)
        return state.users.some(u => u !== ctx.author) ? null : B('—', 'serve un’altra persona');
      return null;
    }
    case 'transferCassa':
      return state.responsabili.some(r => r !== ctx.author) ? null : B('—', 'nessun’altra cassa');
    case 'pledge': {
      if (!cols.length) return B('—', 'nessun acquisto aperto');
      if (!state.responsabili.length) return B('AUTH', 'nessun responsabile');
      if (ctx.user !== undefined) {
        if (bal(state.conti, ctx.user) < 1) return B('COVERED (L7)', 'conto insufficiente');
        if (!cols.some(c => !inCol(c, ctx.user))) return B('L8', 'già in ogni acquisto');
        return null;
      }
      if (ctx.c !== undefined) {
        const col = cols.find(x => x.id === ctx.c);
        const cand = state.users.filter(u => !inCol(col, u));
        if (!cand.length) return B('L8', 'tutti hanno già un impegno');
        if (!cand.some(u => bal(state.conti, u) >= 1)) return B('COVERED (L7)', 'nessun conto capiente');
        return null;
      }
      return null;
    }
    case 'closePurchase': {
      const col = cols.find(x => x.id === ctx.c);
      if (!col.permitted) return B('PERMITTED (L2)', 'serve il permesso del gruppo');
      if (col.pending.length) return B('NO-PENDING (L4)', 'impegni pendenti da risolvere');
      return null;
    }
    case 'failPurchase': {
      const col = cols.find(x => x.id === ctx.c);
      return col.pending.length ? B('NO-PENDING (L4)', 'impegni pendenti da risolvere') : null;
    }
    case 'grantPermission': {
      if (!state.responsabili.length) return B('AUTH', 'nessun responsabile');
      const col = cols.find(x => x.id === ctx.c);
      return col.permitted ? B('—', 'già permesso') : null;
    }
    case 'denyPermission':
      return state.responsabili.length ? null : B('AUTH', 'nessun responsabile');
  }
  return null;
}

/* Chip candidates for one task step: only existing objects; ineligible
   entries stay visible but disabled with the guard named (affordance). */
function chipsFor(role) {
  const tag = flow.tag, p = flow.params;
  const col = p.c !== undefined ? state.collections.find(x => x.id === p.c) : null;
  const person = u => ({ id: u, label: `${resp(u) ? '★ ' : ''}${nm(u)}` });
  switch (role) {
    case 'author': {
      const refOps = ['acceptPledge', 'refusePledge', 'correctPledge', 'closePurchase', 'failPurchase'];
      return state.users.map(u => {
        const ch = person(u);
        if ((tag === 'deposit' || tag === 'withdraw') && p.user === u) ch.dis = 'a ≠ u';
        else if (tag === 'transferCassa' && p.from_ === u) ch.dis = 'a ≠ f';
        else if (!resp(u)) ch.dis = 'AUTH';
        else if (refOps.includes(tag) && col && col.referente !== u) ch.dis = 'REFERENTE';
        return ch;
      });
    }
    case 'user': return state.users.map(u => {
      const ch = person(u);
      if (p.author === u) ch.dis = 'a ≠ u';
      else if (tag === 'pledge') {
        if (col && inCol(col, u)) ch.dis = 'L8';
        else if (bal(state.conti, u) < 1) ch.dis = 'COVERED (L7)';
      }
      return ch;
    });
    case 'targetGhost': return candidates().map(person);
    case 'targetMember': return state.users.map(u => {
      const ch = person(u); if (resp(u)) ch.dis = 'già ★'; return ch;
    });
    case 'targetResp': return state.responsabili.map(person);
    case 'from': return state.responsabili.map(u => {
      const ch = { id: u, label: `★ ${nm(u)} · cassa ${bal(state.casse, u)}` };
      if (p.author === u) ch.dis = 'a ≠ f';
      return ch;
    });
    case 'coll': return state.collections.map(c => {
      const ch = { id: c.id, label: `«${lbl(c.id)}» · ${escrowOf(c)}` };
      if (tag === 'pledge' && p.user !== undefined && inCol(c, p.user)) ch.dis = 'L8';
      return ch;
    });
    case 'pendUser': return (col ? col.pending : []).map(q => person(q.user));
    case 'accUser': return (col ? col.accepted : []).map(q => person(q.user));
  }
  return [];
}

/* --- Amount bounds (values constrained by live sources) ------------------ */

const TOYMAX = 500;   // toy-side cap for unbounded-above amounts

function amountSpec(tag, p) {
  switch (tag) {
    case 'deposit':
      return { min: 0, max: TOYMAX, val: 50, what: `accredito: ${nm(p.user)} versa a ${nm(p.author)}` };
    case 'withdraw': {
      const b = Math.max(0, bal(state.conti, p.user));
      return { min: 0, max: b, val: Math.min(b, 20), what: `prelievo di ${nm(p.user)} (conto ${b})` };
    }
    case 'transferCassa':
      return { min: 1, max: TOYMAX, val: 50, what: `cassa ${nm(p.from_)} → cassa ${nm(p.author)}` };
    case 'pledge': {
      const b = bal(state.conti, p.user);
      return { min: 1, max: b, val: Math.min(b, 20), what: `impegno di ${nm(p.user)} su «${lbl(p.c)}» (conto ${b})` };
    }
    case 'correctPledge': {
      const col = state.collections.find(x => x.id === p.c);
      const cur = (col.accepted.find(q => q.user === p.user) || { amount: 0 }).amount;
      const mx = cur + Math.max(0, bal(state.conti, p.user));
      return { min: 0, max: mx, val: cur, what: `impegno di ${nm(p.user)}: ora ${cur}` };
    }
  }
  return null;
}

/* --- Navigation ----------------------------------------------------------- */

function go(desc) { navStack.push(desc); closePop(); renderAll(); }
function goPledge(c, pu) {
  if (nav().view !== 'collection' || nav().c !== c) navStack.push({ view: 'collection', c });
  navStack.push({ view: 'pledge', c, pu });
  closePop(); renderAll();
}
function backNav() { if (navStack.length > 1) { navStack.pop(); closePop(); renderAll(); } }
function goCrumb(i) { navStack = navStack.slice(0, i + 1); closePop(); renderAll(); }

// drop views whose object no longer exists (closed collections, gone pledges)
function pruneNav() {
  for (let i = 1; i < navStack.length; i++) {
    const d = navStack[i];
    let ok = true;
    if (d.view === 'person') ok = state.users.includes(d.u);
    if (d.view === 'collection') ok = state.collections.some(x => x.id === d.c);
    if (d.view === 'pledge') {
      const col = state.collections.find(x => x.id === d.c);
      ok = !!col && (col.pending.some(p => p.user === d.pu) || col.accepted.some(p => p.user === d.pu));
    }
    if (!ok) { navStack = navStack.slice(0, i); break; }
  }
  const top = nav();
  if (top.view === 'person' && top.hat === 'cassiere' && !resp(top.u)) top.hat = 'member';
}

function crumbLabel(d) {
  if (d.view === 'group') return 'Gruppo';
  if (d.view === 'person') return nm(d.u);
  if (d.view === 'collection') return `«${lbl(d.c)}»`;
  if (d.view === 'pledge') return `impegno di ${nm(d.pu)}`;
  return '?';
}

function renderCrumbs() {
  $('nav-back').disabled = navStack.length <= 1;
  $('crumbs').innerHTML = navStack.map((d, i) => {
    const here = i === navStack.length - 1;
    return (i ? '<span class="sep">›</span>' : '') +
      `<button type="button" class="cr${here ? ' here' : ''}" data-crumb="${i}"${here ? ' disabled' : ''}>${esc(crumbLabel(d))}</button>`;
  }).join('');
}

/* --- Task flow machinery -------------------------------------------------- */

function startTask(tag, preset, x, y) {
  flow = { tag, params: { ...preset }, xy: [x || innerWidth / 2, y || 160],
    steps: EV[tag].roles.filter(r => flow === null || true).filter(r => ({ ...preset })[ROLEKEY[r]] === undefined) };
  flow.steps = EV[tag].roles.filter(r => flow.params[ROLEKEY[r]] === undefined);
  nextStep();
}

function nextStep() {
  if (!flow) return;
  const role = flow.steps[0];
  if (role === 'label') { openLabelPop(); return; }
  if (role) { openChipPop(role); return; }
  if (EV[flow.tag].external) { openExternalConfirm(); return; }
  if (EV[flow.tag].amount) { openAmountPop(); return; }
  commitFlow();
}

function cancelFlow() { flow = null; closePop(); }

function openChipPop(role) {
  const ask = ASK_BY_EV[flow.tag + '.' + role] || ASK[role];
  const chips = chipsFor(role);
  const html = `<div class="pt">${esc(EV[flow.tag].it)}
      <span class="mono" style="font-size:.68rem">.${flow.tag}</span>
      <button type="button" class="xbtn2" data-x="1">✕</button></div>
    <div class="tiny">${esc(ask)}</div>
    <div class="chips">` +
    (chips.length ? chips.map(ch => ch.dis
      ? `<button type="button" class="chip" disabled title="${esc(ch.dis)}">${esc(ch.label)}
           <span class="gb">${esc(ch.dis)}</span></button>`
      : `<button type="button" class="chip" data-id="${ch.id}">${esc(ch.label)}</button>`).join('')
      : '<span class="empty">niente da scegliere</span>') +
    '</div>';
  popAt(flow.xy[0], flow.xy[1], html);
  $('pop').querySelectorAll('.chip[data-id]').forEach(b => b.addEventListener('click', ev => {
    flow.params[ROLEKEY[role]] = Number(b.dataset.id);
    flow.steps = flow.steps.slice(1);
    flow.xy = [ev.clientX, ev.clientY];
    nextStep();
  }));
  const xb = $('pop').querySelector('[data-x]');
  if (xb) xb.addEventListener('click', cancelFlow);
}

function openLabelPop() {
  const open = new Set(state.collections.map(c => lbl(c.id)));
  let opts = PRESETS.filter(p => !open.has(p));
  if (!opts.length) opts = PRESETS;
  const html = `<div class="pt">${esc(EV[flow.tag].it)}
      <span class="mono" style="font-size:.68rem">.${flow.tag}</span>
      <button type="button" class="xbtn2" data-x="1">✕</button></div>
    <div class="tiny">${esc(ASK.label)}</div>
    <div class="chips">` +
    opts.map(p => `<button type="button" class="chip" data-l="${esc(p)}">${esc(p)}</button>`).join('') +
    `</div><div class="tiny">etichetta toy — il CollId Lean resta un Nat interno ${pkGlyph(['names'])}</div>`;
  popAt(flow.xy[0], flow.xy[1], html);
  $('pop').querySelectorAll('[data-l]').forEach(b => b.addEventListener('click', ev => {
    flow.params._label = b.dataset.l;
    flow.params.c = collSeq;
    flow.steps = flow.steps.filter(r => r !== 'label');
    flow.xy = [ev.clientX, ev.clientY];
    nextStep();
  }));
  const xb = $('pop').querySelector('[data-x]');
  if (xb) xb.addEventListener('click', cancelFlow);
}

function openAmountPop() {
  const sp = amountSpec(flow.tag, flow.params);
  const html = `<div class="pt">${esc(EV[flow.tag].it)} — importo
      <button type="button" class="xbtn2" data-x="1">✕</button></div>
    <div class="tiny">${esc(sp.what)}</div>
    ${sp.max === TOYMAX ? `<div class="tiny">massimo del toy, non della macchina
      <span class="npvbadge" data-claims="toy-cap">NON PROVATO</span></div>` : ''}
    <div class="ar"><span class="mono">${sp.min}</span>
      <input id="am-r" type="range" min="${sp.min}" max="${sp.max}" step="1" value="${sp.val}">
      <span class="mono">${sp.max}</span></div>
    <div class="ar2"><input id="am-n" type="number" min="${sp.min}" max="${sp.max}" step="1"
        inputmode="numeric" value="${sp.val}">
      <button type="button" class="primary" id="am-ok">OK</button></div>`;
  popAt(flow.xy[0], flow.xy[1], html);
  const r = $('am-r'), n = $('am-n'), ok = $('am-ok');
  const valid = () => {
    const v = Number(n.value);
    return Number.isInteger(v) && v >= sp.min && v <= sp.max;
  };
  const sync = () => { ok.disabled = !valid(); n.classList.toggle('badv', !valid()); };
  r.addEventListener('input', () => { n.value = r.value; sync(); });
  n.addEventListener('input', () => { if (valid()) r.value = n.value; sync(); });
  n.addEventListener('change', () => {
    let v = Math.round(Number(n.value));
    if (!Number.isFinite(v)) v = sp.min;
    n.value = String(Math.max(sp.min, Math.min(sp.max, v)));
    r.value = n.value; sync();
  });
  ok.addEventListener('click', () => {
    if (!valid()) return;
    flow.params.v = Number(n.value);
    commitFlow();
  });
  const xb = $('pop').querySelector('[data-x]');
  if (xb) xb.addEventListener('click', cancelFlow);
  sync();
  n.focus();
}

// Interface outcome: the vote happened outside this machine. No member is
// asked to authorize it; the Step.lean responsabile carrier stays internal.
function openExternalConfirm() {
  const html = `<div class="pt">esito esterno <span class="gbx">VOTO NON MODELLATO</span>
      <span class="npvbadge" data-claims="vote">NON PROVATO</span>
      <button type="button" class="xbtn2" data-x="1">✕</button></div>
    <div class="tiny">${esc(EV[flow.tag].it)} per «${esc(lbl(flow.params.c))}»</div>
    <div class="tiny">Nel sistema reale è l'esito di un voto di maggioranza del gruppo (kelgroups).<br>
      Questa macchina economica non modella né verifica quel voto.</div>
    <div class="ar2"><button type="button" class="primary" id="ext-apply">applica esito</button></div>`;
  popAt(flow.xy[0], flow.xy[1], html);
  $('ext-apply').addEventListener('click', () => {
    flow.params.author = state.responsabili[0];   // machine adapter carrier only
    commitFlow();
  });
  const xb = $('pop').querySelector('[data-x]');
  if (xb) xb.addEventListener('click', cancelFlow);
}

function commitFlow() {
  closePop();
  const { tag, params, xy } = flow;
  flow = null;
  const args = {};
  for (const role of EV[tag].roles) {
    const k = ROLEKEY[role];
    if (k !== '_label') args[k] = params[k];
  }
  if (tag === 'openPurchase') args.c = params.c;
  if (EV[tag].amount) args.v = params.v;
  if (EV[tag].external) args.author = params.author;
  const preState = state;
  const preLayout = { ...layout };
  const res = runAttempt(tag, args, params._label);
  renderAll();
  if (res.ok) {
    if (nav().view === 'group') playFx(tag, args, preState, preLayout);
    if (EV[tag].external)
      toast(`<b>⇣ esito esterno applicato</b>
        <span class="tiny">voto di maggioranza non modellato né verificato qui</span>`, xy[0], xy[1], 'ext');
  } else {
    toast(`<b>✗ ${esc(EV[tag].it)}</b> ` +
      res.failed.map(guardChip).join(' ') +
      (refusalProven(tag) ? '' :
        ' <span class="npvbadge" data-claims="refusal-unproved">NON PROVATO</span>') +
      ` <span class="tiny">stato invariato</span>`, xy[0], xy[1]);
  }
}

/* direct actions with every parameter already known (referente queue) */
function directAct(tag, args, x, y) {
  flow = { tag, params: { ...args }, steps: [], xy: [x, y] };
  nextStep();
}

/* --- View renderers -------------------------------------------------------- */

function taskBtn(tag, ctx, extra) {
  const dis = taskDis(tag, ctx);
  const it = (extra && extra.label) || EV[tag].it;
  const ext = EV[tag].external;
  if (dis) {
    // a spent affordance stays clickable: the click opens the guard's proof
    // (or its honest NON PROVATO refusal status) instead of starting the task
    const claims = [];
    if (GUARD_CLAIMS[dis.badge]) claims.push(GUARD_CLAIMS[dis.badge]);
    claims.push(...refusalClaims(tag));
    return `<button type="button" class="task off${ext ? ' ext' : ''}" aria-disabled="true"
      data-task="${tag}" data-off-claims="${claims.join(',')}" title="${esc(dis.note)}">${esc(it)}
      <span class="${ext ? 'gbx' : (dis.badge === '—' ? 'gb dim' : 'gb')}">${esc(dis.badge === '—' ? dis.note || '—' : dis.badge)}</span></button>`;
  }
  return `<button type="button" class="task${ext ? ' ext' : ''}" data-task="${tag}"
    title=".${tag}">${esc(it)}${ext ? ' <span class="gbx">VOTO NON MODELLATO</span>' : ''}</button>`;
}

function drawScene() {
  const svg = $('scene');
  layout = { world: { x: 705, y: 52 } };
  const CX = 380, CY = 302, R = 178;
  const parts = [];
  parts.push(`<circle class="ringc" cx="${CX}" cy="${CY}" r="${R}"/>`);
  parts.push(`<text class="hintc" x="705" y="34">fuori</text>` +
    `<text x="705" y="56" style="font-size:17px;text-anchor:middle">🛒</text>`);

  const ghosts = candidates();
  ghosts.forEach((gid, i) => {
    const x = 62 + i * 92, y = 50;
    layout['ghost:' + gid] = { x, y };
    parts.push(`<g class="ghostn" data-obj="ghost" data-id="${gid}" data-key="ghost:${gid}"
      role="button" tabindex="0" aria-label="candidato ${esc(nm(gid))}" transform="translate(${x},${y})">
      <circle class="avatar" r="21"/>
      <text class="init" y="6">${esc(nm(gid)[0])}</text>
      <text class="nm" y="38">${esc(nm(gid))}</text>
    </g>`);
  });

  const n = state.users.length;
  const memberPos = {};
  state.users.forEach((u, i) => {
    const ang = -Math.PI / 2 + i * 2 * Math.PI / Math.max(n, 1);
    const x = CX + R * Math.cos(ang), y = CY + R * Math.sin(ang);
    memberPos[u] = { x, y };
    layout['member:' + u] = { x, y };
    layout['conto:' + u] = { x, y: y + 58 };
    if (resp(u)) layout['cassa:' + u] = { x, y: y + 84 };
  });

  const k = state.collections.length;
  state.collections.forEach((c, i) => {
    let x = CX, y = CY - 8;
    if (k > 1) {
      const ang = -Math.PI / 2 + i * 2 * Math.PI / k;
      x = CX + 78 * Math.cos(ang); y = CY - 8 + 78 * Math.sin(ang);
    }
    layout['pile:' + c.id] = { x, y };
    const rp = memberPos[c.referente];
    if (rp) parts.push(`<path class="reflink" d="M ${x} ${y} L ${rp.x} ${rp.y}"/>`);
  });
  state.collections.forEach(c => {
    const { x, y } = layout['pile:' + c.id];
    const rr = 30 + Math.min(22, escrowOf(c) / 8);
    parts.push(`<g class="pileg" data-obj="pile" data-id="${c.id}" data-key="pile:${c.id}"
      role="button" tabindex="0" aria-label="acquisto ${esc(lbl(c.id))}: impegni ${escrowOf(c)}"
      transform="translate(${x},${y})">
      <circle class="pc" r="${rr}"/>
      <text class="plbl" y="-8">«${esc(lbl(c.id))}»</text>
      <text class="pamt" y="10">${escrowOf(c)}</text>
      <text class="pmeta" y="${rr + 13}">${c.permitted ? '⇣ L2 ✓ · ' : ''}ref. ${esc(nm(c.referente))}${c.pending.length ? ` · ${c.pending.length} pend.` : ''}</text>
    </g>`);
  });
  if (!k) parts.push(`<text class="hintc" x="${CX}" y="${CY - 4}">nessun acquisto aperto</text>`);

  state.users.forEach(u => {
    const { x, y } = memberPos[u];
    parts.push(`<g class="${resp(u) ? 'noderesp' : ''}" data-obj="member" data-id="${u}"
      data-key="member:${u}" role="button" tabindex="0"
      aria-label="${esc(nm(u))}${resp(u) ? ' responsabile' : ''}" transform="translate(${x},${y})">
      <circle class="avatar" r="25"/>
      <text class="init" y="6">${esc(nm(u)[0])}</text>
      ${resp(u) ? '<text class="star" x="20" y="-16">★</text>' : ''}
      <text class="nm" y="42">${esc(nm(u))}</text>
    </g>`);
    const cv = bal(state.conti, u);
    parts.push(`<g class="chipg" data-obj="conto" data-id="${u}" data-key="conto:${u}"
      role="button" tabindex="0" aria-label="conto di ${esc(nm(u))}: ${cv}"
      transform="translate(${x},${y + 58})">
      <rect x="-36" y="-11" width="72" height="22" rx="6"/>
      <text y="4">conto ${cv}</text>
    </g>`);
    if (resp(u)) {
      const kv = bal(state.casse, u);
      parts.push(`<g class="cassag" data-obj="cassa" data-id="${u}" data-key="cassa:${u}"
        role="button" tabindex="0" aria-label="cassa di ${esc(nm(u))}: ${kv}"
        transform="translate(${x},${y + 84})">
        <rect x="-36" y="-11" width="72" height="22" rx="6"/>
        <text y="4">cassa ${kv}</text>
      </g>`);
    }
  });

  parts.push('<g id="fx"></g>');
  svg.innerHTML = parts.join('');
}

/* --- Session log popover --------------------------------------------------- */

function logMsg(m) { const el = $('log-msg'); if (el) el.innerHTML = `<span style="color:var(--bad)">${esc(m)}</span>`; }

function importText(t) {
  let wrap;
  try { wrap = JSON.parse(t); } catch (e) { return logMsg('JSON non valido'); }
  const env = wrap && wrap.format === 'reactivegas-sim-session' ? wrap.trace : wrap;
  try { enterPresentation(env, wrap && wrap.labels); }
  catch (e) { return logMsg('traccia rifiutata — ' + e.message); }
}

function openLogPop(x, y) {
  const n = sessionSteps.length;
  const html = `<div class="pt">log della sessione
      <button type="button" class="xbtn2" data-x="1">✕</button></div>
    <div class="tiny">${n} eventi applicati · salvati solo in questo browser (localStorage) —
      nessun server, nessuna rete · formato <span class="mono">reactivegas.trace v1</span></div>
    <div class="tasks" style="margin:6px 0">
      <button type="button" class="linkchip" id="log-show">mostra JSON</button>
      <button type="button" class="linkchip" id="log-dl">scarica file</button>
      <button type="button" class="linkchip" id="log-copy">copia</button>
      <button type="button" class="linkchip" id="log-pres"${n ? '' : ' disabled'}>presenta</button>
      <button type="button" class="linkchip" id="log-new">nuova sessione</button>
    </div>
    <textarea id="log-ta" class="logta" placeholder="incolla qui una traccia JSON da importare…"></textarea>
    <div class="ar2"><button type="button" class="primary" id="log-import">importa e presenta</button>
      <input type="file" id="log-file" accept="application/json,.json" style="font-size:.7rem"></div>
    <div class="tiny" id="log-msg"></div>`;
  popAt(x, y, html);
  $('log-show').addEventListener('click', () => { $('log-ta').value = buildExport(); });
  $('log-dl').addEventListener('click', () => {
    const blob = new Blob([buildExport()], { type: 'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'reactivegas-sessione.trace.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
  $('log-copy').addEventListener('click', () => {
    const data = buildExport();
    if (navigator.clipboard && navigator.clipboard.writeText)
      navigator.clipboard.writeText(data).then(
        () => logMsg('copiato negli appunti'),
        () => { $('log-ta').value = data; logMsg('copia manualmente dal riquadro'); });
    else { $('log-ta').value = data; logMsg('copia manualmente dal riquadro'); }
  });
  $('log-pres').addEventListener('click', () => {
    if (!sessionSteps.length) return;
    enterPresentation(sessionEnvelope(), colLabels);
  });
  $('log-new').addEventListener('click', () => { closePop(); newSession(); });
  $('log-import').addEventListener('click', () => importText($('log-ta').value));
  $('log-file').addEventListener('change', ev => {
    const f = ev.target.files && ev.target.files[0];
