/* --- Base governance channel: the INTEGRATED substrate channel -----------
   Admission is a direct command of a responsabile; election, revocation and
   departure are the restricted proposals; a committed change runs the sealed
   base hook in the same transition. The economic consequences are recorded
   as base-change steps of the economic stream, and the vote recompute
   (sweepClosures over the POST view) rides the same hook. */

/* @@CORE:base-a@@ */
/* The ONE aggregate-side base store of the toy: members + the pending base
   mutations awaiting their threshold (the integrated pendingBase, typed by
   the restricted vocabulary that cannot express admission). The app payload
   lives beside it and is touched ONLY by the sealed hook. */
const bgEmpty = () => ({ members: [], pendingBase: [] });
/* @@CORE:base-a:END@@ */

/* @@CORE:base-b@@ */
/* State.lean (merged): counts, majority, membership — one store */
const bgAdminCount = gs => gs.members.reduce((n, [, m]) => n + (hasAdmin(m.roles) ? 1 : 0), 0);
const bgMajority = gs => Math.floor((bgAdminCount(gs) + 1) / 2);   // KelGroups.majority
const bgIsAdmin = (k, gs) => isAdminView(k, { members: gs.members });
const bgIsMember = (k, gs) => isMemberView(k, { members: gs.members });

/* a Proposal is exactly one of the two restricted constructors
   (Reactivegas.Proposal, T6221: no admission — voted admission is not
   representable) */
const bgPropKind = p => 'departure' in p ? 'departure' : 'changeRoles';

/* proposalDigest is a machine PARAMETER (Step.lean): departure →
   'depart:<key>', changeRoles → 'roles:<key>'. Re-proposing the same digest
   replaces the pending entry (assocInsert), exactly as the substrate does. */
const bgDigest = p => 'departure' in p
  ? 'depart:' + p.departure
  : 'roles:' + p.changeRoles.key;

/* validateDirectAdmission: the sole member-insertion validator, three guards
   in a fixed order (admin signer; reserved key; already a member) */
function bgValidateAdmission(gs, signer, target) {
  if (!bgIsAdmin(signer, gs)) return 'notAnAdmin';
  if (target === COMUNE_KEY) return 'reservedKey';
  if (bgIsMember(target, gs)) return 'memberAlreadyExists';
  return null;
}
/* validateBaseMutation: admissibility of the two voted mutations */
function bgValidateMutation(gs, signer, p) {
  if (!bgIsAdmin(signer, gs)) return 'notAnAdmin';
  const key = 'departure' in p ? p.departure : p.changeRoles.key;
  return bgIsMember(key, gs) ? null : 'memberNotFound';
}
/* validateBaseApproval: an admin, a pending proposal, no prior assent */
function bgValidateApproval(gs, signer, pid) {
  if (!bgIsAdmin(signer, gs)) return 'notAnAdmin';
  const pend = vtLookup(pid, gs.pendingBase);
  if (!pend) return 'proposalNotFound';
  return pend.approvals.includes(signer) ? 'alreadyApproved' : null;
}

/* enactMutation: neither arm can introduce a key */
function bgEnactMutation(gs, p) {
  if ('departure' in p)
    return { ...gs, members: vtErase(p.departure, gs.members) };
  const { key, roles } = p.changeRoles;
  return { ...gs, members: vtAdjust(key, m => ({ ...m, roles }), gs.members) };
}
/* mutationChange: the observable BaseChange a mutation commits */
function bgMutationChange(p) {
  return 'departure' in p ? { memberRemoved: p.departure }
    : { rolesChanged: p.changeRoles.key };
}

/* commitBaseChange: the sealed hook sees the exact pre/post canonical views
   and the pre-transition payload; its output IS the payload the caller
   observes. A hook refusal rejects the whole transition with it. */
function bgCommitBaseChange(pre, post, change, payload) {
  const hooked = baseHook(change, { members: pre.members }, { members: post.members }, payload);
  if (hooked === null) return { refused: 'rejected' };
  return { gs: post, payload: hooked, change };
}

/* tryEnactBase: enact a pending mutation once its approvals reach the
   majority of the current franchise (read on the state that already holds
   the pending entry); otherwise leave it pending, no change */
function bgTryEnact(gs, pid, payload) {
  const pend = vtLookup(pid, gs.pendingBase);
  if (!pend) return { gs, payload, change: null };
  if (pend.approvals.length >= bgMajority(gs)) {
    const proposal = pend.proposal;
    const mutated = bgEnactMutation({ ...gs, pendingBase: vtErase(pid, gs.pendingBase) }, proposal);
    return bgCommitBaseChange(gs, mutated, bgMutationChange(proposal), payload);
  }
  return { gs, payload, change: null };
}

/* applyIntegratedEvent, base routes (direct admission + propose + approve):
   validation dominates the effect on every route. `payload` is the app
   payload the sealed hook runs over. */
function bgApply(gs, signer, ev, payload) {
  if ('direct' in ev) {
    const adm = ev.direct.admitMember;
    const verr = bgValidateAdmission(gs, signer, adm.key);
    if (verr) return { gs, payload, refused: verr };
    const post = { ...gs,
      members: vtInsert(adm.key, { key: adm.key, email: adm.email, roles: adm.roles }, gs.members) };
    const done = bgCommitBaseChange(gs, post, { memberAdmitted: adm.key }, payload);
    if (done.refused) return { gs, payload, refused: done.refused };
    return { ...done, enacted: true };
  }
  if ('propose' in ev) {
    const p = ev.propose.proposal;
    const verr = bgValidateMutation(gs, signer, p);
    if (verr) return { gs, payload, refused: verr };
    const pid = bgDigest(p);
    const proposed = { ...gs, pendingBase: vtInsert(pid,
      { proposal: p, proposer: signer, approvals: [signer] }, gs.pendingBase) };
    return bgTryEnact(proposed, pid, payload);
  }
  const pid = ev.approve.proposalId;
  const verr = bgValidateApproval(gs, signer, pid);
  if (verr) return { gs, payload, refused: verr };
  const pend = vtLookup(pid, gs.pendingBase);
  const approved = { ...pend, approvals: vtSetInsert(signer, pend.approvals) };
  return bgTryEnact({ ...gs, pendingBase: vtInsert(pid, approved, gs.pendingBase) }, pid, payload);
}

const bgCanonProposal = p => 'departure' in p
  ? { departure: { key: p.departure } }
  : { changeRoles: { key: p.changeRoles.key,
      roles: p.changeRoles.roles.map(vtCanonRole) } };
const canonBaseState = gs => JSON.stringify({
  members: gs.members.map(([k, m]) => [k,
    { key: m.key, email: m.email, roles: m.roles.map(vtCanonRole) }]),
  pendingBase: gs.pendingBase.map(([pid, pp]) => [pid,
    { proposal: bgCanonProposal(pp.proposal), proposer: pp.proposer,
      approvals: pp.approvals.slice() }]) });

/* Crude-drift net for the base channel: approvals_nodup and
   proposer_mem_approvals, transcribed and asserted after every applied
   event. A violation means this transcription diverged from the substrate. */
/* @@CORE:base-b:END@@ */
let bgLawBreaches = [];
/* @@CORE:base-c@@ */
function bgLawViolations(gs) {
  const out = [];
  for (const [pid, pp] of gs.pendingBase) {
    if (new Set(pp.approvals).size !== pp.approvals.length)
      out.push(`approvals_nodup: «${pid}»`);
    if (!pp.approvals.includes(pp.proposer))
      out.push(`proposer_mem_approvals: «${pid}»`);
  }
  return out;
}

/* v1 consumer for the base stream (local schema kelgroups-base.trace):
   replay + verify each stored step against this transcription. The hook's
   payload consequences are verified by the ECONOMIC stream (its base-change
   steps); this stream verifies admissibility, membership and enactment. */
function verifyBaseTraceV1(env, opts) {
  opts = opts || {};
  const fail = m => { throw new Error('base: ' + m); };
  if (!env || typeof env !== 'object') fail('non è un oggetto');
  if (env.schema !== 'kelgroups-base.trace') fail('schema sconosciuto');
  if (env.version !== 1) fail('versione non supportata');
  if (!env.initial || !Array.isArray(env.steps)) fail('forma non valida');
  let s = env.initial;
  // the initial base state is the toy's GUARDED FOUNDING AGGREGATE
  // (Reactivegas.boot/productionWellFormed): the reserved comune is no
  // member, and every member entry names itself
  const badMember = s.members.some(([k, m]) => m.key !== k);
  if (badMember || bgIsMember(COMUNE_KEY, s))
    fail('stato iniziale non è un aggregato fondato ben formato');
  const states = [JSON.parse(canonBaseState(s))];
  env.steps.forEach((st, i) => {
    if (!st || !st.input || !st.event || !st.result || !st.signer)
      fail(`passo ${i}: forma non valida`);
    if (canonBaseState(st.input) !== canonBaseState(s))
      fail(`passo ${i}: input discontinuo`);
    const verr = ('direct' in st.event)
      ? bgValidateAdmission(s, st.signer, st.event.direct.admitMember.key)
      : ('propose' in st.event)
        ? bgValidateMutation(s, st.signer, st.event.propose.proposal)
        : bgValidateApproval(s, st.signer, st.event.approve.proposalId);
    if (st.result.tag === 'applied') {
      if (verr) fail(`passo ${i}: registrato applicato, la validazione rifiuta (${verr})`);
      const det = bgApply(s, st.signer, st.event, emptyState());
      if (det.refused) fail(`passo ${i}: registrato applicato, la transizione rifiuta (${det.refused})`);
      if (canonBaseState(det.gs) !== canonBaseState(st.result.state))
        fail(`passo ${i}: post-stato divergente`);
      if (!!st.result.change !== !!det.change)
        fail(`passo ${i}: presenza del cambiamento divergente`);
      s = det.gs;
    } else if (st.result.tag === 'refused') {
      if (opts.appliedOnly) fail(`passo ${i}: rifiuto in un log di sessione`);
      if (!verr) fail(`passo ${i}: registrato rifiutato, la validazione applica`);
      if (st.result.error !== verr)
        fail(`passo ${i}: errore divergente — atteso=${st.result.error} osservato=${verr}`);
    } else fail(`passo ${i}: result.tag sconosciuto`);
    states.push(JSON.parse(canonBaseState(s)));
  });
  return { steps: env.steps.length, states };
}

/* --- Composition routing (merged surface) ---------------------------------
   The 14-constructor route table of Composition.lean at the accepted pin:
   11 direct + 3 appDecided + 0 baseEnacted. The committed claim gate
   re-derives this table by parsing the pinned source fresh on every run and
   REDs on any divergence (route-list drift), so this literal cannot silently
   drift from the accepted classifier. */
const EVENT_ROUTES = {
  openPurchase: 'direct', grantPermission: 'appDecided',
  denyPermission: 'appDecided', deposit: 'direct', withdraw: 'direct',
  transferCassa: 'direct', donate: 'direct', backdonate: 'appDecided',
  pledge: 'direct', acceptPledge: 'direct', refusePledge: 'direct',
  correctPledge: 'direct', closePurchase: 'direct', failPurchase: 'direct',
};

const voteDerivedTag = tag => EVENT_ROUTES[tag] !== undefined && EVENT_ROUTES[tag] !== 'direct';

/* --- Governance walk over the combined seq (model-level, also on
   import/restore). The base credits are GONE: no economic event routes
   baseEnacted any more, so there is nothing for an enactment to authorize —
   promotion, demotion and departure ride the sealed hook inside their own
   transition. What remains governable: an appDecided economic event carries
   a closed verdict of the vote machine (the join stays NON PROVATO and is
   marked), and backdonate is refused outright. The walk also cross-checks
   ONE membership: every recorded step view must equal the walk's own
   membership at that point of the sequence. */
const canonMembers = members => JSON.stringify(members.map(([k, m]) => [k,
  { key: m.key, email: m.email, roles: m.roles.map(vtCanonRole) }]));

function verifyGovernedSeq(n) {
  let gs = n.baseEnv.initial || bgEmpty(), kgs = vtEmpty();
  let ei = 0, ki = 0, bi = 0;
  const checkView = (st, what) => {
    if (st.view !== undefined &&
        canonMembers(st.view) !== canonMembers(gs.members))
      throw new Error(`governo: ${what} registra una membership che non è quella del gruppo — una sola store esiste`);
  };
  for (const m of n.seq) {
    if (m === 'b') {
      const st = n.baseEnv.steps[bi++];
      const det = bgApply(gs, st.signer, st.event, emptyState());
      if (det.refused) throw new Error(`governo: evento di base rifiutato (${det.refused})`);
      gs = det.gs;
    } else if (m === 'k') {
      const st = n.kelEnv.steps[ki++];
      checkView(st, 'un passo di voto');
      kgs = vtApply({ members: gs.members }, kgs, st.signer, st.event).state;
    } else {
      const st = n.env.steps[ei++];
      const e = leanEventOf(st.event);
      if (e.tag === 'baseChange') {
        // a continuation of the preceding base transition: the POST view it
        // records must be exactly the walk's membership at this point
        if (st.postView !== undefined &&
            canonMembers(st.postView) !== canonMembers(gs.members))
          throw new Error('governo: un cambio di base registra una membership post che non è quella del gruppo — una sola store esiste');
        continue;
      }
      checkView(st, 'un evento economico');
      if (!voteDerivedTag(e.tag)) continue;
      if (e.tag === 'grantPermission' || e.tag === 'denyPermission') {
        const want = e.tag === 'grantPermission' ? 'positive' : 'negative';
        const rec = kgs.closed.find(r => r.questionId === permQid(e.c));
        if (!rec || rec.verdict !== want)
          throw new Error(`governo: ${e.tag} senza verdetto ${want === 'positive' ? 'positivo' : 'negativo'} chiuso`);
      } else if (e.tag === 'backdonate') {
        throw new Error('governo: backdonate senza ponte evento-voto provato (NON PROVATO)');
      } else {
        throw new Error(`governo: ${e.tag} appDecided senza evidenza di canale`);
      }
    }
  }
}

/* --- The integrated transition (ONE aggregate, ONE step) ------------------
   Transcription of KelGroups.applyIntegratedEvent over the toy aggregate
   {members, pendingBase, appFold}: validation dominates the effect on every
   route, and a committed base change runs the sealed hook EXACTLY ONCE —
   economic cleanup and the vote recompute inside the same transition, so
   there is no window in which the group has moved and its consequences have
   not, and no separately replayable hook step a log could forge, omit,
   duplicate or reorder. */

const permQid = c => 'permesso:' + c;

const canonAggregate = agg => {
  const gs = agg.payload !== undefined && agg.appFold === undefined
    ? { ...agg, appFold: agg.payload } : agg;
  return JSON.stringify({
    members: gs.members.map(([k, m]) => [k,
      { key: m.key, email: m.email, roles: m.roles.map(vtCanonRole) }]),
    pendingBase: (gs.pendingBase || []).map(([pid, pp]) => [pid,
      { proposer: pp.proposer, approvals: (pp.approvals || []).slice() }]),
    payload: { conti: gs.appFold.conti, casse: gs.appFold.casse,
      collections: gs.appFold.collections.map(c => ({ id: c.id,
        referente: c.referente, permitted: c.permitted,
        accepted: c.accepted.map(p => ({ user: p.user, amount: p.amount })),
        pending: c.pending.map(p => ({ user: p.user, amount: p.amount })) })),
      votes: JSON.parse(canonVoteState(gs.appFold.votes)) }
    });
};

const VOTE_TAGS = { openQuestion: 1, cast: 1, renounce: 1 };

/* INV-3 actor binding (F-01 class): event arguments never carry the actor.
   Agreement control against actual Lean source, two sides: (1) imported
   application-event args ↔ AppEvent (lean/Reactivegas/Types.lean:75 — no
   ctor declares `author`, so one inside payload args is foreign); (2)
   constructed machine event ↔ legacy Event (Types.lean:43 — every ctor
   declares `author`, and the signer is its only source, supplied
   separately: appFold takes signer apart from the event,
   lean/Reactivegas/Step.lean:181). payloadAuthorOf reports a payload
   author for the mismatch refusal; stripAuthor drops it so such a field
   can neither override the recorded signer at a merge site nor leak into
   stored events. Equal-author payloads are stripped, not refused: every
   honest pre-fix page export carries author==signer (old leanEventJson
   kept all fields, commitFlow always set args.author, pushIntegratedStep
   used it as the step signer), so refusal there would break roundtrip
   without privilege delta. Honest traffic never carries a mismatching one. */
const payloadAuthorOf = a =>
  (a && typeof a === 'object' &&
    Object.prototype.hasOwnProperty.call(a, 'author')) ? a.author : undefined;
const stripAuthor = a => {
  if (!a || typeof a !== 'object' || Array.isArray(a) ||
    !Object.prototype.hasOwnProperty.call(a, 'author')) return a;
  const { author: _dropped, ...rest } = a;
  return rest;
};

/* the integrated event of the toy aggregate, from the LEAN event JSON:
   {direct:{admitMember}} | {propose:{proposal}} | {approve:{proposalId}}
   | {app:{<AppEvent ctor>}} — the vote constructors openQuestion/cast/
   renounce ride the app route exactly as Reactivegas.appFold routes them. */
function applyIntegrated(gs, signer, ev) {
  if ('direct' in ev) {
    const adm = ev.direct.admitMember;
    const verr = bgValidateAdmission(gs, signer, adm.key);
    if (verr) return { refused: verr };
    const det = bgApply(gs, signer, ev, gs.appFold);
    if (det.refused) return { refused: det.refused };
    return { gs: { ...det.gs, appFold: det.payload }, payload: det.payload,
      change: det.change || null };
  }
  if ('propose' in ev || 'approve' in ev) {
    const verr = ('propose' in ev)
      ? bgValidateMutation(gs, signer, ev.propose.proposal)
      : bgValidateApproval(gs, signer, ev.approve.proposalId);
    if (verr) return { refused: verr };
    const det = bgApply(gs, signer, ev, gs.appFold);
    if (det.refused) return { refused: det.refused };
    return { gs: { ...det.gs, appFold: det.payload }, payload: det.payload,
      change: det.change || null };
  }
  if ('app' in ev) {
    const ae = ev.app;
    const tag = Object.keys(ae)[0];
    // a payload `author` mismatching the recorded signer is refused here,
    // at verification and replay alike (both run through applyIntegrated);
    // the merge below then only ever sees authorless args.
    const smuggled = payloadAuthorOf(ae[tag]);
    if (smuggled !== undefined && smuggled !== signer)
      return { refused: 'author-mismatch' };
    const args = stripAuthor(ae[tag]);
    const pre = { members: gs.members };
    if (!isMemberView(signer, pre)) return { refused: 'notAMember' };
    if (VOTE_TAGS[tag]) {
      const verr = vtValidate(pre, gs.appFold.votes, signer, ae);
      if (verr) return { refused: verr };
      const det = vtApply(pre, gs.appFold.votes, signer, ae);
      return { gs: { ...gs, appFold: { ...gs.appFold, votes: det.state } },
        payload: { ...gs.appFold, votes: det.state }, change: null };
    }
    const res = attempt(pre, gs.appFold, { tag, author: signer, ...args });
    if (!res.ok) return { refused: 'rejected', failed: res.failed };
    return { gs: { ...gs, appFold: res.state }, payload: res.state, change: null };
  }
  throw new Error('evento integrato sconosciuto: ' + JSON.stringify(ev));
}

/* the toy's founded aggregate (Reactivegas.boot): the founding admin arrives
   through the guarded initial aggregate, never by a self-admitting event */
const bootAggregate = () => {
  const anna = { key: 'anna', email: 'anna@toy.example',
    roles: [{ adminRole: { admin: 'publicAdmin' } }] };
  return { members: [['anna', anna]], pendingBase: [],
    appFold: emptyState() };
};

/* v1 consumer for the INTEGRATED stream: replay + verify each stored step
   against this transcription. The whole aggregate is the continuity
   contract: members, pending base and payload — votes included — must match
   step for step, and every accepted step is the result of a signed event.
   There is no hook-only event to accept. */
function verifyIntegratedV1(env, opts) {
  opts = opts || {};
  const short = x => { const j = typeof x === 'string' ? x : JSON.stringify(x);
    return j.length > 200 ? j.slice(0, 200) + '…' : j; };
  const fail = m => { throw new Error('integrato: ' + m); };
  if (!env || typeof env !== 'object') fail('non è un oggetto');
  if (env.schema !== 'reactivegas-integrated.trace') fail('schema sconosciuto');
  if (env.version !== 1) fail('versione non supportata: ' + env.version);
  if (!env.initial || !Array.isArray(env.steps)) fail('forma non valida');
  let gs = env.initial;
  if (gs.payload !== undefined && gs.appFold === undefined)
    gs = { ...gs, appFold: gs.payload };
  for (const req of ['members', 'pendingBase', 'appFold'])
    if (gs[req] === undefined) fail('aggregato iniziale senza ' + req);
  if (canonAggregate(gs) !== canonAggregate(bootAggregate()))
    fail('aggregato iniziale non è l’aggregato fondato — atteso=' +
      short(canonAggregate(bootAggregate())) + ' osservato=' + short(canonAggregate(gs)));
  const states = [JSON.parse(canonAggregate(gs))];
  env.steps.forEach((st, i) => {
    if (!st || !st.input || !st.event || !st.result || typeof st.signer !== 'string')
      fail(`passo ${i}: forma non valida (input, signer, event, result)`);
    for (const k of ['direct', 'propose', 'approve', 'app'])
      if (st.event[k] !== undefined && Object.keys(st.event).length !== 1)
        fail(`passo ${i}: più di un costruttore nell'evento integrato`);
    if (st.event.baseChange !== undefined)
      fail(`passo ${i}: un effetto del gancio non è un evento: deve nascere da una transizione firmata`);
    const stIn = st.input.payload !== undefined && st.input.appFold === undefined
      ? { ...st.input, appFold: st.input.payload } : st.input;
    if (canonAggregate(stIn) !== canonAggregate(gs))
      fail(`passo ${i}: input discontinuo — derivato=${short(canonAggregate(gs))} memorizzato=${short(canonAggregate(st.input))}`);
    if (st.result.tag !== 'applied')
      fail(`passo ${i}: rifiuto in un corpus di soli applicati`);
    const det = applyIntegrated(gs, st.signer, st.event);
    if (det.refused)
      fail(`passo ${i}: registrato applicato, la transizione rifiuta (${det.refused})`);
    if (canonAggregate(det.gs) !== canonAggregate(st.result.aggregate))
      fail(`passo ${i}: post-aggregato divergente — atteso=${short(canonAggregate(st.result.aggregate))} osservato=${short(canonAggregate(det.gs))}`);
    gs = det.gs;
    states.push(JSON.parse(canonAggregate(gs)));
  });
  return { steps: env.steps.length, states, final: gs };
}

/* governance over the integrated stream: an appDecided economic event
   carries its closed verdict from the SAME aggregate (the join stays NON
   PROVATO and is marked); backdonate is refused outright. The replay itself
   binds every hook effect to its signed base transition — there is no
   standalone cleanup event to accept, so forged/omitted/duplicated/
   reordered consequences cannot pass verification at all. */
function verifyGovernedIntegrated(env) {
  let gs = env.initial;
  if (gs.payload !== undefined && gs.appFold === undefined)
    gs = { ...gs, appFold: gs.payload };
  let ei = 0;
  for (const m of env.steps) {
    const st = env.steps[ei++];
    const stIn = st.input && st.input.payload !== undefined && st.input.appFold === undefined
      ? { ...st.input, appFold: st.input.payload } : st.input;
    const det = applyIntegrated(gs, st.signer, st.event);
    if (det.refused) throw new Error(`governo: evento integrato rifiutato (${det.refused})`);
    if ('app' in st.event) {
      const tag = Object.keys(st.event.app)[0];
      if (tag === 'grantPermission' || tag === 'denyPermission') {
        const want = tag === 'grantPermission' ? 'positive' : 'negative';
        const rec = gs.appFold.votes.closed.find(r => r.questionId === permQid(st.event.app[tag].c));
        if (!rec || rec.verdict !== want)
          throw new Error(`governo: ${tag} senza verdetto ${want === 'positive' ? 'positivo' : 'negativo'} chiuso`);
      } else if (tag === 'backdonate') {
        throw new Error('governo: backdonate senza ponte evento-voto provato (NON PROVATO)');
      }
    }
    gs = det.gs;
  }
}

function integratedTraceConformance() {
  const names = Object.keys(LEAN_TRACES_V1);
  let steps = 0;
  for (const name of names) {
    try { steps += verifyIntegratedV1(LEAN_TRACES_V1[name]).steps; }
    catch (e) { throw new Error(name + ' — ' + e.message); }
  }
  if (!names.length || steps === 0)
    throw new Error('corpus integrato vuoto: nessuna traccia, nessuna prova');
  return { steps, corpus: 'seme-locale-integrato-produzione' };
}
/* @@CORE:base-c:END@@ */

/* --- Vote journey (toy-side wiring of the required Vote machine) ----------
   Names/keys and question phrasing are decoration; the machine sees keys,
   question ids, kinds and ballots. The permesso question for an acquisto is
   the collective question id 'permesso:<CollId>'. The economic↔vote JOIN is
   NOT proved: every bridge point carries claim 'join-vote-econ'. */

const vtVerdictFor = c => {
  const rec = state.votes.closed.find(r => r.questionId === permQid(c));
  return rec ? rec.verdict : (vtLookup(permQid(c), state.votes.openQuestions) ? 'pending' : null);
};
/* the LOCAL unproved bridges: positive verdict → grant, negative → deny */
const bridgeReady = col => vtVerdictFor(col.id) === 'positive';
const bridgeDenyReady = col => vtVerdictFor(col.id) === 'negative';

function descrVote(signer, ev, closedNow) {
  const who = nm(signer);
  let base;
  if ('openQuestion' in ev) {
    const { questionId, kind } = ev.openQuestion;
    const perm = vtPermKind(kind);
    base = `${who} apre la domanda «${questionId}»` +
      (perm ? ` (per-persona: ${nm(perm.designee)})` : '');
  } else if ('cast' in ev) {
    base = `${who} vota ${ev.cast.ballot === 'assent' ? 'sì' : 'no'} su «${ev.cast.questionId}»`;
  } else if ('renounce' in ev) {
    base = `${who} rinuncia a «${ev.renounce.questionId}» (no-op in slice A)`;
  }
  return base + (closedNow ? ' — CHIUSA una domanda' : '');
}

const VOTE_TAG_CLAIMS = {
  openQuestion: ['vote-open-empty', 'vote-validate'],
  cast: ['vote-place', 'vote-verdict', 'vote-sweep'],
  renounce: ['vote-validate'],
};

function voteEvKind(ev) {
  return 'openQuestion' in ev ? 'openQuestion' : 'cast' in ev ? 'cast' : 'renounce';
}

function recordKelApplied(signer, ev, det) {
  teachOffClick = false;
  const view = curView();
  const viol = kgLawViolations(view, det.state);
  if (viol.length) kgLawAlarm(viol, descrVote(signer, ev, false));
  const kind = voteEvKind(ev);
  const closedNow = det.closedDelta > 0;
  const claims = [...VOTE_TAG_CLAIMS[kind],
    ...(closedNow ? ['vote-nostale', 'vote-partition', 'vote-threshold-exhibit'] : [])];
  const lastClosed = closedNow ? det.state.closed[det.state.closed.length - 1] : null;
  const flow = closedNow
    ? `chiusa «${lastClosed.questionId}»: ${lastClosed.verdict === 'positive' ? 'POSITIVA' : 'NEGATIVA'}` +
      ` (causa: ${lastClosed.cause === 'tally' ? 'soglia' : 'cambio di elettorato'})` +
      ` · sì ${lastClosed.question.assents.length} / no ${lastClosed.question.dissents.length}` +
      ` · soglia ${vtTheta(vtFranchiseSize(view))}`
    : (kind === 'cast'
      ? `una posizione per persona: cambiare voto sposta, ripetere non conta doppio`
      : 'aperta con conteggi VUOTI: chi propone non è contato come sì');
  history.unshift({ kind: 'acc', mk: 'kel', tag: kind,
    descr: descrVote(signer, ev, closedNow), flow, claims,
    enacted: closedNow, inv: invSnapshot() });
  invNote = `dopo voto: ${kind} ✓`;
}

/* one attempted vote event through validate + apply, journaled as ONE
   integrated step (R62-11: the franchise is a parameter read from the
   canonical view) */
function runVoteEvent(signer, ev) {
  const view = curView();
  const verr = vtValidate(view, state.votes, signer, ev);
  if (verr) {
    history.unshift({ kind: 'rej', mk: 'kel', tag: 'voto',
      descr: descrVote(signer, ev, false),
      failed: [{ code: 'KelGroups.Vote.validateVoteEvent = .error .' + verr,
        why: 'validazione del voto: ' + verr, law: null }],
      ext: false, inv: invSnapshot() });
    invNote = 'dopo voto ✗ — stato invariato';
    return { ok: false, error: verr };
  }
  const preAgg = snapshotAggregate();
  const det = vtApply(view, state.votes, signer, ev);
  state = { ...state, votes: det.state };
  recordKelApplied(signer, ev, det);
  pushIntegratedStep(preAgg, signer, { app: JSON.parse(JSON.stringify(ev)) }, null);
  teachLearn('benvenuto');
  return { ok: true, closedDelta: det.closedDelta };
}

/* --- Base journey (toy-side wiring of the base proposal channel) --------- */

const BG_ADMIN_ROLES = [{ adminRole: { admin: 'publicAdmin' } }];
const BG_APP_ROLES = [{ appRole: { name: 'user' } }];

function descrProposal(p) {
  if (!p) return 'una proposta';
  if ('departure' in p)
    return `l'uscita di ${nm(p.departure)} dal gruppo`;
  const name = nm(p.changeRoles.key);
  return p.changeRoles.roles.some(r => 'adminRole' in r)
    ? `eleggere ${name} responsabile`
    : `revocare ${name} da responsabile`;
}
function pendingProposalOf(gs, pid) {
  if (!pid || !gs || !gs.pendingBase) return null;
  const hit = gs.pendingBase.find(([id]) => id === pid);
  return hit ? hit[1].proposal : null;
}
function flowBase(p, kind, enacted) {
  if (!enacted)
    return kind === 'propose'
      ? 'in attesa: chi propone ha già detto sì; servono gli altri'
      : 'sì registrato; non si conta due volte';
  if (!p) return 'i responsabili hanno deciso.';
  if ('departure' in p)
    return `${nm(p.departure)} è uscito. Il suo credito è andato al comune, nello stesso passo.`;
  const name = nm(p.changeRoles.key);
  const demoted = !p.changeRoles.roles.some(r => 'adminRole' in r);
  return demoted
    ? `${name} non è più responsabile. I suoi acquisti aperti sono stati chiusi con i rimborsi, nello stesso passo.`
    : `${name} è responsabile. La sua cassa compare ora, a zero.`;
}
function descrBase(signer, ev, enacted, proposal) {
  const who = nm(signer);
  const p = ('propose' in ev) ? ev.propose.proposal : proposal;
  if ('direct' in ev)
    return `${who} fa entrare ${nm(ev.direct.admitMember.key)} nel gruppo` + (enacted ? ' — subito, senza voti' : '');
  if ('propose' in ev)
    return `${who} propone ${descrProposal(p)}` + (enacted ? ' — deciso' : '');
  const what = descrProposal(p);
  return enacted ? `${who} conferma: ${what}` : `${who} dice sì: ${what}`;
}

const BG_TAG_CLAIMS = {
  propose: ['kg-apply', 'kg-proposer', 'kg-validate'],
  approve: ['kg-approve-guard', 'kg-nodup'],
};

function recordBaseApplied(signer, ev, det) {
  teachOffClick = false;
  const viol = bgLawViolations(bg);
  if (viol.length) {
    bgLawBreaches.push({ viol, what: descrBase(signer, ev, false) });
    toast(`<b>⚠ disallineamento</b> <span class="tiny">${esc(viol.join(' · '))} —
      trascrizione divergente dal substrato</span>`, innerWidth / 2, 80);
  }
  const kind = 'direct' in ev ? 'admit' : ('propose' in ev ? 'propose' : 'approve');
  const enacted = !!det.change;
  const claims = [...(kind === 'admit' ? ['vote-admit-plain'] : BG_TAG_CLAIMS[kind]),
    ...(enacted ? ['kg-threshold', 'kg-enact-effect'] : [])];
  const p = det.proposal || null;
  history.unshift({ kind: 'acc', mk: 'bg', tag: kind,
    descr: descrBase(signer, ev, enacted, p), flow: flowBase(p, kind, enacted), claims,
    enacted, inv: invSnapshot() });
  invNote = kind === 'admit' ? `dopo l'ingresso nel gruppo ✓`
    : `dopo una decisione sul gruppo ✓`;
}

/* one attempted INTEGRATED base event (direct admission, propose, approve):
   validation dominates the effect, and a committed change runs the sealed
   hook inside the same transition — the whole aggregate (hook and vote
   sweep included) is journaled as ONE integrated step. A hook refusal
   (stall) rejects the whole event with it. */
function runBaseEvent(signer, ev) {
  const preAgg = snapshotAggregate();
  const verr = ('direct' in ev)
    ? bgValidateAdmission(bg, signer, ev.direct.admitMember.key)
    : ('propose' in ev)
      ? bgValidateMutation(bg, signer, ev.propose.proposal)
      : bgValidateApproval(bg, signer, ev.approve.proposalId);
  if (verr) {
    history.unshift({ kind: 'rej', mk: 'bg', tag: 'base',
      descr: descrBase(signer, ev, false, ('propose' in ev) ? ev.propose.proposal
        : pendingProposalOf(bg, ev.approve && ev.approve.proposalId)),
      failed: [{ code: 'validate = .error .' + verr,
        why: 'la proposta non è andata a buon fine: ' + verr, law: null }],
      ext: false, inv: invSnapshot() });
    invNote = 'dopo proposta ✗ — stato invariato';
    return { ok: false, error: verr };
  }
  const proposal = ('propose' in ev) ? ev.propose.proposal
    : pendingProposalOf(bg, ev.approve && ev.approve.proposalId);
  const det = bgApply(bg, signer, ev, state);
  det.proposal = proposal;
  if (det.refused) {
    history.unshift({ kind: 'rej', mk: 'bg', tag: 'base',
      descr: descrBase(signer, ev, false, proposal),
      failed: [{ code: 'baseHook = .error .rejected',
        why: 'il comune è in stallo — una donazione lo cura prima dell’uscita', law: 'STALL' }],
      ext: false, inv: invSnapshot() });
    invNote = 'dopo proposta ✗ — il gancio sigillato ha rifiutato';
    return { ok: false, error: det.refused };
  }
  bg = det.gs;
  state = det.payload;
  recordBaseApplied(signer, ev, det);
  pushIntegratedStep(preAgg, signer, ev, det.change === undefined ? null : det.change);
  teachLearn('benvenuto');
  return { ok: true, change: det.change };
}

/* the base task flows: direct admission (one act), and the two restricted
   proposals — role change and departure. Every step is a REAL integrated
   base event in the durable log; with more admins than the threshold the
   proposal stays pending and the gov card's approve buttons carry it. */
function runBaseTask(tag, args) {
  const signer = args.author;
  if (tag === 'admitMember') {
    if (userLabels[args.target] === undefined) userLabels[args.target] = args._label;
    return runBaseEvent(signer, { direct: { admitMember: {
      key: args.target, email: args.target + '@toy.example',
      roles: [{ appRole: { name: 'socio' } }] } } });
  }
  if (tag === 'departure')
    return runBaseEvent(signer, { propose: { proposal: { departure: args.target } } });
  const toAdmin = tag === 'elect';
  return runBaseEvent(signer, { propose: { proposal: { changeRoles: {
    key: args.target, roles: toAdmin
      ? [{ adminRole: { admin: 'publicAdmin' } }]
      : [{ appRole: { name: 'socio' } }] } } } });
}


/* --- Session log (persist the LOG, not the state) -------------------------
   The durable artifact is ONE chronological stream of applied integrated
   events over the whole aggregate (membership, pending base, payload with
   votes): each sealed hook effect rides its signed base transition, exactly
   once, so export → verify → adopt → reload round-trips the aggregate.
   State is derived by replay and verified step by step. Everything stays in
   this browser's localStorage — no server, no network. Export/share/
   presentation all consume the same envelope the conformance corpus uses. */

const LOG_KEY_BASE = 'rg-sim-log-v1';
const TEACH_KEY_BASE = 'rg-teach-v1';
const storeNS = () => window.__RG_NS || '';
const logKey = () => LOG_KEY_BASE + storeNS();
const teachKey = () => TEACH_KEY_BASE + storeNS();

let sessionSteps = [];   // reactivegas-integrated.trace applied steps of the live session

function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

/* the live aggregate as ONE snapshot: membership + pending base + payload */
function snapshotAggregate() {
  return JSON.parse(JSON.stringify(
    { members: bg.members, pendingBase: bg.pendingBase, appFold: state }));
}
const curAggregate = () => ({ members: bg.members, pendingBase: bg.pendingBase, appFold: state });

/* append ONE integrated step, riverified against the production transition:
   the replay the importer runs must accept what the live session logged —
   a divergence fails loudly here, never as an unimportable log */
function pushIntegratedStep(pre, signer, ev, change) {
  const event = JSON.parse(JSON.stringify(ev));
  const post = snapshotAggregate();
  const chk = applyIntegrated(pre, signer, event);
  if (chk.refused)
    throw new Error('passo integrato rifiutato alla riverifica: ' + chk.refused);
  if (canonAggregate(chk.gs) !== canonAggregate(post))
    throw new Error('divergenza del passo integrato fra macchina e aggregato');
  sessionSteps.push({ input: pre, signer, event,
    result: { tag: 'applied', aggregate: post,
      change: change === undefined ? null : change } });
  persistSession();
}

function sessionEnvelope() {
  return { schema: 'reactivegas-integrated.trace', version: 1,
    initial: bootAggregate(), steps: sessionSteps };
}
function buildExport() {
  return JSON.stringify({ format: 'reactivegas-sim-session', v: 3,
    labels: { ...colLabels }, names: { ...userLabels }, piles: dumpPiles(),
    integrated: sessionEnvelope() });
}
function persistSession() { lsSet(logKey(), buildExport()); }

/* rebuild toy-side decoration + history from a VERIFIED integrated envelope:
   every step replays through the production transition (hook exactly once,
   vote sweep included); decoration mirrors the live paths entry for entry,
   so export → verify → adopt → reload preserves the whole aggregate */
function adoptSession(env, labels) {
  state = emptyState();
  bg = bootGroup();
  history = []; completed = []; collSeq = 1;
  colLabels = { ...(labels || {}) };
  let gs = env.initial;
  if (gs.payload !== undefined && gs.appFold === undefined)
    gs = { ...gs, appFold: gs.payload };
  env.steps.forEach((st, i) => {
    const pre = gs;
    const prePayload = pre.appFold !== undefined ? pre.appFold : pre.payload;
    const det = applyIntegrated(pre, st.signer, st.event);
    if (det.refused)
      throw new Error(`adozione: passo ${i} rifiutato (${det.refused})`);
    if (canonAggregate(det.gs) !== canonAggregate(st.result.aggregate))
      throw new Error(`adozione: passo ${i} post-aggregato divergente`);
    const postPayload = det.gs.appFold !== undefined ? det.gs.appFold : det.gs.payload;
    bg = { members: det.gs.members, pendingBase: det.gs.pendingBase };
    const ev = st.event;
    if ('direct' in ev || 'propose' in ev || 'approve' in ev) {
      state = postPayload;
      const proposal = ('propose' in ev) ? ev.propose.proposal
        : ((('approve' in ev) && ev.approve) ? pendingProposalOf(pre, ev.approve.proposalId) : null);
      recordBaseApplied(st.signer, ev, { change: det.change, proposal });
    } else if ('app' in ev) {
      const ae = ev.app;
      const atag = Object.keys(ae)[0];
      if (VOTE_TAGS[atag]) {
        state = postPayload;
        const closedDelta = postPayload.votes.closed.length - prePayload.votes.closed.length;
        recordKelApplied(st.signer, ae, { state: postPayload.votes, closedDelta });
      } else {
        // INV-3 (F-01 class): the recorded signer is the only actor. A
        // payload `author` mismatching it refuses the step (as in
        // applyIntegrated); matching or absent is stripped regardless.
        const rawArgs = ae[atag];
        const smuggled = payloadAuthorOf(rawArgs);
        if (smuggled !== undefined && smuggled !== st.signer)
          throw new Error(`adozione: passo ${i} ${atag} rifiutato — autore incorporato diverso dal firmatario`);
        const args = { author: st.signer, ...stripAuthor(rawArgs) };
        const res = attempt({ members: pre.members }, prePayload, { tag: atag, ...args });
        if (!res.ok)
          throw new Error(`adozione: passo ${i} ${atag} rifiutato dalla macchina`);
        if (atag === 'openPurchase' && colLabels[args.c] === undefined) {
          const used = new Set(Object.values(colLabels));
          colLabels[args.c] = PRESETS.find(p => !used.has(p)) || ('acquisto ' + collSeq);
        }
        // recordApplied snapshots the closing collection from the pre-state
        // and installs the post-state itself, exactly as the live path does
        state = prePayload;
        recordApplied(atag, args, res);
        if (voteDerivedTag(atag)) {
          history[0].route = EVENT_ROUTES[atag];
          history[0].evid = permQid(args.c);
        }
      }
    } else {
      throw new Error(`adozione: passo ${i} evento integrato sconosciuto`);
    }
    gs = det.gs;
  });
  sessionSteps = env.steps.slice();
  invNote = `sessione ripristinata: ${env.steps.length} eventi integrati`;
}

/* normalize an accepted import shape into {env, labels, names, piles}.
   ONLY the integrated v3 session is accepted: the old three-stream v2
   (trace/kel/base+seq) is EXPLICITLY REFUSED — no fallback may silently
   accept the imports F1/F2/F3 forbid. A bare integrated envelope (the
   conformance corpus shape) is accepted as the same canonical stream. */
function normalizeWrap(wrap) {
  if (wrap && wrap.schema === 'reactivegas-integrated.trace')
    return { env: wrap, labels: {}, names: {}, piles: loadPiles(undefined) };
  if (!wrap || typeof wrap !== 'object')
    throw new Error('traccia non è un oggetto');
  if (wrap.format !== 'reactivegas-sim-session')
    throw new Error('formato della sessione sconosciuto');
  if (wrap.v !== 3 || !wrap.integrated) {
    if (wrap.v === 2 || (wrap.trace && wrap.kel))
      throw new Error('formato precedente a tre flussi non più accettato: riesporta dalla sessione');
    throw new Error('involucro integrato assente');
  }
  return { env: wrap.integrated,
    labels: wrap.labels || {},
    names: wrap.names || {},
    piles: loadPiles(wrap.piles) };
}

function verifySessionShape(n) {
  verifyIntegratedV1(n.env);
  verifyGovernedIntegrated(n.env);
}

/* boot-time restore: never trust the stored final state — replay and verify */
function restoreSession() {
  const raw = lsGet(logKey());
  if (!raw) return null;
  let wrap;
  try { wrap = JSON.parse(raw); } catch (e) { return quarantineLog('log locale illeggibile'); }
  const n = normalizeWrap(wrap);
  try { verifySessionShape(n); }
  catch (e) { return quarantineLog(e.message); }
  userLabels = {};
  if (n.names && typeof n.names === 'object')
    for (const [k, name] of Object.entries(n.names)) {
      if (typeof k === 'string' && k.trim() && typeof name === 'string' && name.trim())
        userLabels[k] = name.trim();
    }
  adoptSession(n.env, n.labels);
  pilePose = n.piles || {};
  return n.env.steps.length;
}

function quarantineLog(reason) {
  const raw = lsGet(logKey());
  if (raw) lsSet(logKey() + '-corrotto', raw);
  lsDel(logKey());
  toast(`<b>log locale rifiutato</b> <span class="tiny">${esc(reason)} — nuova sessione; il log rifiutato è conservato</span>`,
    innerWidth / 2, 80);
  return null;
}

function newSession() {
  lsDel(logKey());
  state = emptyState();
  bg = bootGroup();
  history = []; completed = []; collSeq = 1; colLabels = {};
  userLabels = {};
  pilePose = {}; pileDrag = null; skipPileClick = false;
  sessionSteps = [];
  invNote = 'nuova sessione → State.empty con il gruppo fondato';
  navStack = [{ view: 'group' }];
  cancelFlow();
  renderAll();
}

/* --- Presentation mode: replay a trace one applied event at a time -------- */

let pres = null;   // combined three-machine presentation over the toy seq

function enterPresentation(n) {
  // n = { env, labels, names, piles } — the integrated envelope, verified
  // as a whole (replay + governance), then stepped aggregate by aggregate
  const ver = verifyIntegratedV1(n.env);
  verifyGovernedIntegrated(n.env);
  pres = { n, states: ver.states, idx: 0,
    saved: { state, bg, nav: navStack, labels: colLabels, names: { ...userLabels },
      piles: { ...pilePose }, note: invNote, hist: history, comp: completed, seq: collSeq } };
  colLabels = { ...(n.labels || {}) };
  userLabels = { ...(n.names || {}) };
  pilePose = loadPiles(n.piles);
  n.env.steps.forEach(st => {
    if ('app' in st.event && Object.keys(st.event.app).length === 1 && st.event.app.openPurchase) {
      const c = st.event.app.openPurchase.c;
      if (colLabels[c] === undefined) {
        const used = new Set(Object.values(colLabels));
        colLabels[c] = PRESETS.find(p => !used.has(p)) || ('acquisto ' + c);
      }
    }
  });
  navStack = [{ view: 'group' }];
  closePop();
  presSet(0);
}

function presSet(i) {
  pres.idx = Math.max(0, Math.min(pres.n.env.steps.length, i));
  const agg = JSON.parse(JSON.stringify(pres.states[pres.idx]));
  const pay = agg.appFold !== undefined ? agg.appFold : agg.payload;
  state = pay;
  bg = { members: agg.members, pendingBase: agg.pendingBase };
  renderAll();
}

function exitPresentation() {
  const s = pres.saved;
  pres = null;
  state = s.state; bg = s.bg; navStack = s.nav; colLabels = s.labels; invNote = s.note;
  userLabels = s.names || {};
  pilePose = s.piles || {};
  history = s.hist; completed = s.comp; collSeq = s.seq;
  renderAll();
}

function presWhat() {
  const i = pres.idx;
  if (i === 0) return 'stato iniziale';
  const st = pres.n.env.steps[i - 1];
  const ev = st.event;
  if ('direct' in ev || 'propose' in ev || 'approve' in ev) {
    return descrBase(st.signer, ev,
      !!(st.result && st.result.tag === 'applied' && st.result.change),
      ('propose' in ev) ? ev.propose.proposal
        : (((('approve' in ev) && ev.approve) ? pendingProposalOf(st.input, ev.approve.proposalId) : null)));
  }
  const ae = ev.app;
  const atag = Object.keys(ae)[0];
  if (VOTE_TAGS[atag]) {
    const payIn = st.input.appFold !== undefined ? st.input.appFold : st.input.payload;
    const aggOut = st.result.aggregate;
    const payOut = aggOut.appFold !== undefined ? aggOut.appFold : aggOut.payload;
    return descrVote(st.signer, ae,
      !!(st.result && st.result.tag === 'applied' &&
         payOut.votes.closed.length > payIn.votes.closed.length));
  }
  // presented steps show the RECORDED signer; payload args never carry one
  const d = { tag: atag, author: st.signer, ...stripAuthor(ae[atag]) };
  return descr(d.tag, d);
}

function renderPresBar() {
  const bar = $('presbar');
  if (!pres) { bar.hidden = true; bar.innerHTML = ''; return; }
  const n = pres.n.env.steps.length;
  const i = pres.idx;
  const what = presWhat();
  bar.hidden = false;
  bar.innerHTML = `<b>presentazione</b> <span>${i}/${n}</span>
    <span style="opacity:.85">${esc(what)}</span>
    <span style="margin-left:auto;display:flex;gap:6px">
    <button type="button" id="pres-restart" ${i === 0 ? 'disabled' : ''}>⏮</button>
    <button type="button" id="pres-prev" ${i === 0 ? 'disabled' : ''}>‹ prec</button>
    <button type="button" id="pres-next" ${i >= n ? 'disabled' : ''}>succ ›</button>
    <button type="button" id="pres-exit">✕ esci</button></span>`;
  $('pres-restart').addEventListener('click', () => presSet(0));
  $('pres-prev').addEventListener('click', () => presSet(pres.idx - 1));
  $('pres-next').addEventListener('click', () => presSet(pres.idx + 1));
  $('pres-exit').addEventListener('click', exitPresentation);
}

/* --- Teaching that recedes (NOTE-032 + NOTE-033) --------------------------
   Each strip's surface sentence is written for Giuseppe, the buyer: it says
   what just happened in his world or what he can do now — never machine
   mechanics, which stay complete behind the ⊢ glyph (claims unchanged).
   Visibility is driven by the strip's REAL CONDITION, computed from live
   session state on every render — never by which tab is open. Leaving the
   condition hides the strip without marking it understood; returning shows
   it again; only the explicit ✕ dismisses it permanently (persisted).
   The ONE exception is `benvenuto`: it applies only on arrival, so it is
   view-triggered and retires automatically at the first meaningful use
   (first applied event of any machine). No other strip auto-retires. */

// set when Giuseppe meets a spent (off) affordance — the page's refusal
// surface, which refuses BEFORE the machine; cleared by any applied event
let teachOffClick = false;

const TEACH_ITEMS = {
  benvenuto: {
    text: "Benvenuto! Questo è un gruppo d'acquisto da provare: clicca una persona, un saldo o un acquisto e fai qualche mossa. Il segno ⊢ accanto alle frasi apre il dettaglio, se ti incuriosisce il perché.",
    claims: ['js-transcription'],
    cond: () => true,   // arrival exception: gated only by the learned flag
  },
  impegno: {
    text: 'Hai dei soldi da parte per un acquisto: sono già usciti dal conto e restano lì finché il referente decide. Se l’impegno viene rifiutato o l’acquisto non va in porto, tornano sul conto.',
    claims: ['impegno-escrow'],
    cond: () => state.collections.some(c => escrowOf(c) > 0),
  },
  guardie: {
    text: 'Quell’azione per ora non si può fare, e infatti non è successo niente: conti e acquisti sono come prima. Accanto all’azione c’è scritto cosa manca: sistemalo e riprova.',
    claims: ['auth', 'covered'],
    cond: () => teachOffClick || (history.length > 0 && history[0].kind === 'rej'),
  },
  cassa: {
    text: () => {
      const neg = state.casse.filter(([, v]) => v < 0).map(([u]) => nm(u));
      return `La cassa di ${neg.join(' e ') || '—'} è sotto zero perché ha pagato il fornitore: non è un errore. Si riequilibra con i prossimi versamenti e giri di cassa.`;
    },
    claims: ['cassa-negativa', 'close-payout'],
    cond: () => state.casse.some(([, v]) => v < 0),
  },
  chiusa: {
    text: 'L’acquisto si è concluso e non è più tra quelli aperti. Se è andato in porto lo trovi tra i completati; se no, i soldi impegnati sono tornati sui conti.',
    claims: ['close-gone'],
    cond: () => {
      const e = history.find(en => en.kind === 'acc' && !en.mk);
      return !!e && ['closePurchase', 'failPurchase', 'denyPurchase', 'denyPermission'].includes(e.tag);
    },
  },
  voto: {
    text: 'C’è una domanda aperta nel gruppo: puoi rispondere sì oppure no, e cambiare risposta finché resta aperta. Si chiude da sola quando una delle due risposte ha abbastanza voti.',
    claims: ['vote-threshold-exhibit', 'vote-verdict', 'vote-open-empty', 'vote-place'],
    cond: () => state.votes.openQuestions.length > 0,
  },
};

function loadTeach() {
  try { return JSON.parse(lsGet(teachKey())) || {}; } catch (e) { return {}; }
}
let teach = loadTeach();
function saveTeach() { lsSet(teachKey(), JSON.stringify(teach)); }
/* the explicit ✕: the ONLY permanent retirement for condition strips */
function teachDismiss(id) {
  if (!TEACH_ITEMS[id] || teach[id]) return;
  teach[id] = true; saveTeach();
}
/* automatic retirement is allowed ONLY for the benvenuto arrival exception */
function teachLearn(id) {
  if (id !== 'benvenuto') return;
  teachDismiss(id);
}
/* the condition — not the view — decides what is on screen */
function teachBarHtml() {
  if (pres) return '';
  return Object.entries(TEACH_ITEMS).map(([id, t]) => {
    if (teach[id] || !t.cond()) return '';
    const tx = typeof t.text === 'function' ? t.text() : t.text;
    return `<div class="teach" data-teach="${id}">${esc(tx)} ${pkGlyph(t.claims)}
      <button type="button" class="tx" data-teachx="${id}" title="ho capito">✕</button></div>`;
  }).join('');
}
function teachReplay() { teach = {}; saveTeach(); renderAll(); }

/* --- Attempt driver ------------------------------------------------------ */

function invSnapshot() {
  const sc = sumBal(state.casse), sn = sumBal(state.conti), se = escrowSum(state.collections);
  return { sc, sn, se, v: sc - sn - se };
}

/* apply an accepted result to toy-side state; shared by live attempts and
   verified-log adoption so replay rebuilds exactly what the session showed */
function recordApplied(tag, args, res) {
  teachOffClick = false;
  // toy-side snapshot of a successful close, taken from the pre-state
  if (tag === 'closePurchase') {
    const [col] = pullCollection(args.c, state.collections);
    completed.unshift({ label: lbl(col.id), referente: col.referente,
      contributors: col.accepted.map(p => ({ user: p.user, amount: p.amount })),
      total: sumPledges(col.accepted) });
  }
  state = res.state;
  if (tag === 'openPurchase') collSeq = Math.max(collSeq, args.c + 1);
  const viol = lawViolations(state);
  if (viol.length) lawAlarm(viol, tag);
  history.unshift({ kind: 'acc', tag, args, descr: descr(tag, args), flow: res.flow,
    ext: !!EV[tag].external, inv: invSnapshot() });
  invNote = `dopo .${tag} ✓`;
}

function runAttempt(tag, args, toyLabel) {
  // Composition gate (accepted pin c8c4dd89…): a vote-derived economic
  // event is applied ONLY against its route-appropriate evidence — a
  // faithful base Enactment or a closed vote verdict. The refusal happens
  // BEFORE the economic machine is consulted: the machine itself has no
  // such guard (that absence is exactly the unproved join), so the model
  // boundary enforces it and says so honestly.
  let evid = null;
  if (voteDerivedTag(tag)) {
    const want = tag === 'grantPermission' ? 'positive' : 'negative';
    if (vtVerdictFor(args.c) !== want) {
      const failed = [{ code: 'Composition.route = .appDecided',
        why: `composizione: evento vote-derived senza verdetto ${want === 'positive' ? 'positivo' : 'negativo'} chiuso`,
        law: null }];
      history.unshift({ kind: 'rej', tag, args, descr: descr(tag, args),
        governance: true, failed, ext: false, inv: invSnapshot() });
      invNote = `dopo .${tag} ✗ — composizione: senza verdetto`;
      return { ok: false, governance: true, failed };
    }
    evid = { kind: tag, qid: permQid(args.c) };
  }
  if (tag === 'openPurchase' && toyLabel) colLabels[args.c] = toyLabel;
  const preAgg = snapshotAggregate();
  const res = attempt(curView(), state, { tag, ...args });
  if (res.ok) {
    recordApplied(tag, args, res);
    if (evid) {
      history[0].route = EVENT_ROUTES[tag];
      history[0].evid = evid.pid || evid.qid;
    }
    // the durable artifact is ONE integrated step: the whole aggregate after
    // the signed event, riverified against the production transition
    pushIntegratedStep(preAgg, args.author, { app: leanEventJson({ tag, ...args }) }, null);
    // teaching recedes as the machine is used
    teachLearn('benvenuto');
  } else {
    if (tag === 'openPurchase') delete colLabels[args.c];
    history.unshift({ kind: 'rej', tag, args, descr: descr(tag, args), failed: res.failed,
      ext: !!EV[tag].external, inv: invSnapshot() });
    invNote = `dopo .${tag} ✗ — stato invariato`;
  }
  return res;
}

/* --- Toy-side helpers ----------------------------------------------------- */

const resp = u => isResponsabile(curView(), u);
const refCols = u => state.collections.filter(c => c.referente === u);
const inCol = (c, u) => c.accepted.some(p => p.user === u) || c.pending.some(p => p.user === u);
const members = () => memberIds();
const admins = () => groupAdmins(curView());
const candidates = () => {
  const taken = new Set(members());
  const out = [];
  for (const n of NAMES) {
    const k = n.toLowerCase();
    if (!taken.has(k) && out.length < 3) out.push(k);
  }
  return out;
};
const pledgesOf = u => {
  const out = [];
  for (const c of state.collections) {
    for (const p of c.pending) if (p.user === u) out.push({ c: c.id, amount: p.amount, st: 'pendente' });
    for (const p of c.accepted) if (p.user === u) out.push({ c: c.id, amount: p.amount, st: 'accettato' });
  }
  return out;
};
const B = (badge, note, claims) => ({ badge, note: note || '', claims: claims || null });

/* Task availability: guards as affordances, computed from live state. */
function taskDis(tag, ctx) {
  ctx = ctx || {};
  const cols = state.collections;
  const mem = members(), adm = admins();
  switch (tag) {
    case 'admitMember':
      if (!adm.length) return B('AUTH', 'nessun responsabile');
      return mem.length >= 12 ? B('—', 'gruppo pieno') : null;
    case 'elect':
      if (!adm.length) return B('AUTH', 'nessun responsabile');
      return mem.some(u => !resp(u)) ? null : B('—', 'tutti già ★');
    case 'revoke':
      return adm.length > 1 ? null : B('—', 'serve un altro responsabile che proponga');
    case 'departure':
      return mem.length > 1 ? null : B('—', 'il gruppo non può restare vuoto');
    case 'openPurchase':
      if (ctx.author !== undefined && !resp(ctx.author)) return B('AUTH', 'non è responsabile');
      return adm.length ? null : B('AUTH', 'nessun responsabile');
    case 'deposit': case 'withdraw': {
      if (ctx.user !== undefined)
        return adm.some(r => r !== ctx.user) ? null : B('AUTH', 'serve un cassiere diverso');
      if (ctx.author !== undefined)
        return mem.some(u => u !== ctx.author) ? null : B('—', 'serve un’altra persona');
      return null;
    }
    case 'transferCassa':
      return adm.some(r => r !== ctx.author) ? null : B('—', 'nessun’altra cassa');
    case 'pledge': {
      if (!cols.length) return B('—', 'nessun acquisto aperto');
      if (!admins().length) return B('AUTH', 'nessun responsabile');
      if (ctx.user !== undefined) {
        if (bal(state.conti, ctx.user) < 1) return B('COVERED (L7)', 'conto insufficiente');
        if (!cols.some(c => !inCol(c, ctx.user))) return B('L8', 'già in ogni acquisto');
        return null;
      }
      if (ctx.c !== undefined) {
        const col = cols.find(x => x.id === ctx.c);
        const cand = members().filter(u => !inCol(col, u));
        if (!cand.length) return B('L8', 'tutti hanno già un impegno');
        if (!cand.some(u => bal(state.conti, u) >= 1)) return B('COVERED (L7)', 'nessun conto capiente');
        return null;
      }
      return null;
    }
    case 'closePurchase': {
      const col = cols.find(x => x.id === ctx.c);
      if (!col.permitted) return B('PERMITTED (L2)', 'serve il permesso del gruppo');
      if (col.pending.length) return B('NO-PENDING (L4)', 'impegni pendenti da risolvere');
      return null;
    }
    case 'failPurchase': {
      const col = cols.find(x => x.id === ctx.c);
      return col.pending.length ? B('NO-PENDING (L4)', 'impegni pendenti da risolvere') : null;
    }
    case 'grantPermission': {
      // the economic permission is reachable only through an ENACTED vote
      // question, and even then the machine-to-machine bridge is an unproved
      // local join
      if (!admins().length) return B('AUTH', 'nessun responsabile');
      const col = cols.find(x => x.id === ctx.c);
      if (col.permitted) return B('—', 'già permesso');
      if (!bridgeReady(col))
        return B('SENZA DELIBERA', 'serve un verdetto positivo del gruppo di voto',
          ['join-vote-econ', 'vote-verdict']);
      return null;
    }
    case 'denyPermission': {
      // symmetric to the grant: the economic denial is reachable only through
      // a NEGATIVE verdict of the vote machine (dissent is modeled), and the
      // machine-to-machine bridge stays an unproved local join
      if (!admins().length) return B('AUTH', 'nessun responsabile');
      const col = cols.find(x => x.id === ctx.c);
      if (!bridgeDenyReady(col))
        return B('SENZA DELIBERA', 'serve un verdetto negativo del gruppo di voto',
          ['join-vote-econ', 'vote-verdict']);
      return null;
    }
  }
  return null;
}

/* Chip candidates for one task step: only existing objects; ineligible
   entries stay visible but disabled with the guard named (affordance). */
function chipsFor(role) {
  const tag = flow.tag, p = flow.params;
  const col = p.c !== undefined ? state.collections.find(x => x.id === p.c) : null;
  const mem = members(), adm = admins();
  const person = k => ({ id: k, label: `${resp(k) ? '★ ' : ''}${nm(k)}` });
  switch (role) {
    case 'author': {
      const refOps = ['acceptPledge', 'refusePledge', 'correctPledge', 'closePurchase', 'failPurchase'];
      return mem.map(k => {
        const ch = person(k);
        if ((tag === 'deposit' || tag === 'withdraw') && p.user === k) ch.dis = 'a ≠ u';
        else if (tag === 'transferCassa' && p.from_ === k) ch.dis = 'a ≠ f';
        else if (!resp(k)) ch.dis = 'AUTH';
        else if (refOps.includes(tag) && col && col.referente !== k) ch.dis = 'REFERENTE';
        return ch;
      });
    }
    case 'user': return mem.map(k => {
      const ch = person(k);
      if (p.author === k) ch.dis = 'a ≠ u';
      else if (tag === 'pledge') {
        if (col && inCol(col, k)) ch.dis = 'L8';
        else if (bal(state.conti, k) < 1) ch.dis = 'COVERED (L7)';
      }
      return ch;
    });
    case 'target': {
      if (tag === 'elect') return mem.map(k => {
        const ch = person(k); if (resp(k)) ch.dis = 'già ★'; return ch;
      });
      if (tag === 'revoke') return adm.map(person);
      if (tag === 'departure') return mem.map(person);
      return [];
    }
    case 'from': return adm.map(k => {
      const ch = { id: k, label: `★ ${nm(k)} · cassa ${eur(bal(state.casse, k))}` };
      if (p.author === k) ch.dis = 'a ≠ f';
      return ch;
    });
    case 'coll': return state.collections.map(c => {
      const ch = { id: c.id, label: `«${lbl(c.id)}» · ${eur(escrowOf(c))}` };
      if (tag === 'pledge' && p.user !== undefined && inCol(c, p.user)) ch.dis = 'L8';
      return ch;
    });
    case 'pendUser': return (col ? col.pending : []).map(q => person(q.user));
    case 'accUser': return (col ? col.accepted : []).map(q => person(q.user));
  }
  return [];
}

/* --- Amount bounds (values constrained by live sources) ------------------ */

const TOYMAX = 500;   // toy-side cap for unbounded-above amounts

function amountSpec(tag, p) {
  switch (tag) {
    case 'deposit':
      return { min: 0, max: TOYMAX, val: 50, what: `accredito: ${nm(p.user)} versa a ${nm(p.author)}` };
    case 'withdraw': {
      const b = Math.max(0, bal(state.conti, p.user));
      return { min: 0, max: b, val: Math.min(b, 20), what: `prelievo di ${nm(p.user)} (conto ${eur(b)})` };
    }
    case 'transferCassa':
      return { min: 1, max: TOYMAX, val: 50, what: `cassa ${nm(p.from_)} → cassa ${nm(p.author)}` };
    case 'pledge': {
      const b = bal(state.conti, p.user);
      return { min: 1, max: b, val: Math.min(b, 20), what: `impegno di ${nm(p.user)} su «${lbl(p.c)}» (conto ${eur(b)})` };
    }
    case 'correctPledge': {
      const col = state.collections.find(x => x.id === p.c);
      const cur = (col.accepted.find(q => q.user === p.user) || { amount: 0 }).amount;
      const mx = cur + Math.max(0, bal(state.conti, p.user));
      return { min: 0, max: mx, val: cur, what: `impegno di ${nm(p.user)}: ora ${eur(cur)}` };
    }
  }
  return null;
}

const BASE_TASKS = {
  admitMember: { it: 'Fai entrare una persona', roles: ['name', 'author'] },
  elect: { it: 'Proponi: nomina responsabile ★', roles: ['target', 'author'] },
  revoke: { it: 'Proponi: revoca un responsabile', roles: ['target', 'author'] },
  departure: { it: 'Proponi l’uscita dal gruppo', roles: ['target', 'author'] },
};
const taskShape = tag => EV[tag] || BASE_TASKS[tag];

function startTask(tag, preset, x, y) {
  flow = { tag, params: { ...preset }, xy: [x || innerWidth / 2, y || 160],
    steps: taskShape(tag).roles.filter(r => preset[ROLEKEY[r]] === undefined) };
  nextStep();
}

function nextStep() {
  if (!flow) return;
  const role = flow.steps[0];
  if (role === 'label') { openLabelPop(); return; }
  if (role === 'name' && flow.tag === 'admitMember') { openUserNamePop(); return; }
  if (role) { openChipPop(role); return; }
  if (taskShape(flow.tag).external) { openExternalConfirm(); return; }
  if (taskShape(flow.tag).amount) { openAmountPop(); return; }
  commitFlow();
}

function cancelFlow() {
  flow = null; closePop();
}

function commitFlow() {
  closePop();
  const { tag, params, xy } = flow;
  flow = null;
  const args = {};
  for (const role of taskShape(tag).roles) {
    const k = ROLEKEY[role];
    if (k !== '_label' && k !== 'name') args[k] = params[k];
  }
  if (tag === 'openPurchase') args.c = params.c;
  if (taskShape(tag).amount) args.v = params.v;
  if (taskShape(tag).external) args.author = params.author;
  // the base tasks run the REAL integrated channel: direct admission is one
  // act; election, revocation and departure are restricted proposals whose
  // consequences ride the sealed hook inside their own transition
  if (BASE_TASKS[tag]) {
    args._label = params._label;
    const preMembers = JSON.stringify(bg.members.map(([k, m]) =>
      [k, { key: m.key, roles: m.roles }]));
    const r = runBaseTask(tag, args);
    renderAll();
    if (r.ok && JSON.stringify(bg.members.map(([k, m]) =>
        [k, { key: m.key, roles: m.roles }])) !== preMembers)
      toast(`<b>🗳 deciso e applicato</b>
        <span class="tiny">il gruppo ha deliberato · il gancio sigillato ha aggiornato i conti nello stesso passo</span>`, xy[0], xy[1], 'ext');
    else if (r.ok)
      toast(`<b>🗳 proposta registrata</b>
        <span class="tiny">in attesa del sì degli altri responsabili</span>`, xy[0], xy[1], 'ext');
    else
      toast(`<b>✗ proposta non accettata</b> <span class="tiny">${esc(r.error || '')} · niente è cambiato</span>`, xy[0], xy[1]);
    return;
  }
  const preState = state;
  const preLayout = { ...layout };
  const res = runAttempt(tag, args, params._label);
  renderAll();
  if (res.ok) {
    if (nav().view === 'group') playFx(tag, args, preState, preLayout);
    if (taskShape(tag).external)
      toast(`<b>⇣ esito esterno applicato</b>
        <span class="tiny">verdetto modellato nel voto; ponte verso l'economia NON PROVATO</span>`, xy[0], xy[1], 'ext');
  } else {
    toast(`<b>✗ ${esc(taskShape(tag).it)}</b> ` +
      res.failed.map(guardChip).join(' ') +
      (refusalProven(tag) ? '' :
        ' <span class="npvbadge" data-claims="refusal-unproved">NON PROVATO</span>') +
      ` <span class="tiny">stato invariato</span>`, xy[0], xy[1]);
  }
}

/* group scene (SVG) */
let layout = {};
let pilePose = {};   // CollId -> { angle, z }  view-only, not machine state
let pileDrag = null;
let skipPileClick = false;

function dumpPiles() {
  const out = {};
  for (const c of state.collections) {
    const p = pilePose[c.id];
    if (!p || !Number.isFinite(p.angle)) continue;
    out[String(c.id)] = {
      angle: Math.round(p.angle * 1e6) / 1e6,
      z: Number.isFinite(p.z) ? Math.trunc(p.z) : 0,
    };
  }
  return out;
}
function loadPiles(raw) {
  const out = {};
  if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return out;
  for (const [id, p] of Object.entries(raw)) {
    const n = Number(id);
    if (!Number.isFinite(n) || !p || !Number.isFinite(p.angle)) continue;
    out[n] = { angle: p.angle, z: Number.isFinite(p.z) ? Math.trunc(p.z) : 0 };
  }
  return out;
}

/* Pure deterministic purchase-ring geometry. Members stay on the outer
   circle in stable user order; open purchases sit on a concentric inner
   ring, clustered angularly around their referente when that fits, else
   packed evenly so glyphs do not overlap. Optional `poses` pins a
   purchase to a user-chosen angle on the same ring. No DOM, storage,
   time, or randomness. */
/* Ruling expand (F-02): BOTH rings grow with the purchase count on a
   pannable canvas — the 92-unit separation and the 42-unit glyph hold for
   every reachable n with no cap and no paging. Member ANGLES keep the exact
   legacy formula (stable for the same membership); only radii move, floored
   so small-n output is byte-identical to legacy. Fixed rings with
   pagination were rejected; shrinking glyphs are forbidden, so the render
   radius is the constant 42 and user-dragged poses stay excluded by
   statement (authored positions, not layout output). */
function purchaseRingLayout(users, collections, poses) {
  const CX = 380, CY = 350;
  const MEMBER_RR = 38, PURCHASE_RR = 42, GAP = 8;
  const MIN_DIST = 2 * PURCHASE_RR + GAP;
  const RING_BASE = 132;
  const n = Math.max(users.length, 1);
  const ncols = collections.length;
  // free variables: the pack ring grows so the angular slot chord always
  // covers two glyphs plus the gap; the member ring stays outside the
  // purchase glyphs (member edge clears purchase edge by 16).
  const R_PACK = ncols < 2 ? RING_BASE
    : Math.max(RING_BASE, MIN_DIST / (2 * Math.sin(Math.PI / ncols)));
  const R_MEM = Math.max(220, R_PACK + PURCHASE_RR + MEMBER_RR + 16);
  const CLUSTER_R = R_PACK, PACK_R = R_PACK;
  const memberAngle = {};
  const memberPos = {};
  users.forEach((u, i) => {
    const ang = -Math.PI / 2 + i * 2 * Math.PI / n;
    memberAngle[u] = ang;
    memberPos[u] = { x: CX + R_MEM * Math.cos(ang), y: CY + R_MEM * Math.sin(ang) };
  });
  // canvas extent floored at the legacy 760x680 so small-n output keeps it
  const halfW = Math.max(380, R_MEM + MEMBER_RR + 24);
  const halfH = Math.max(340, R_MEM + MEMBER_RR + 24);
  const extent = { cx: CX, cy: CY, halfW, halfH, w: 2 * halfW, h: 2 * halfH };
  const rings = { member: R_MEM, pack: R_PACK };
  if (!collections.length) return { memberPos, placements: [], extent, rings };

  const groups = [];
  for (const u of users) {
    const cols = collections.filter(c => c.referente === u);
    if (cols.length) groups.push({ ref: u, cols });
  }
  for (const c of collections) {
    if (groups.some(g => g.cols.includes(c))) continue;
    let g = groups.find(x => x.ref === c.referente);
    if (!g) { g = { ref: c.referente, cols: [] }; groups.push(g); }
    g.cols.push(c);
  }

  const clusterEligible = groups.every(g => g.cols.length <= 5);
  const chordStep = 2 * Math.asin(Math.min(1, MIN_DIST / (2 * CLUSTER_R)));

  const at = (ringR, angle, c, ref) => ({
    purchaseId: c.id, referente: ref,
    x: CX + ringR * Math.cos(angle), y: CY + ringR * Math.sin(angle),
    angle, radius: ringR,
  });

  if (clusterEligible) {
    const clustered = [];
    for (const g of groups) {
      const base = memberAngle[g.ref] != null ? memberAngle[g.ref] : -Math.PI / 2;
      const m = g.cols.length;
      const step = m <= 1 ? 0 : chordStep;
      const start = base - step * (m - 1) / 2;
      g.cols.forEach((c, j) => clustered.push(at(CLUSTER_R, start + j * step, c, g.ref)));
    }
    const separated = clustered.every((p, i) => clustered.slice(i + 1).every(q =>
      Math.hypot(p.x - q.x, p.y - q.y) >= MIN_DIST - 0.5));
    if (separated)
      return { memberPos, placements: applyPilePoses(clustered, poses, at), extent, rings };
  }

  const ordered = groups.flatMap(g => g.cols);
  const k = ordered.length;
  const slot = 2 * Math.PI / k;
  const angDiff = (a, b) => {
    let d = Math.abs(a - b) % (2 * Math.PI);
    if (d > Math.PI) d = 2 * Math.PI - d;
    return d;
  };
  let bestR = 0, bestCost = Infinity, idx = 0;
  for (const g of groups) {
    const mid = idx + (g.cols.length - 1) / 2;
    const target = memberAngle[g.ref] != null ? memberAngle[g.ref] : -Math.PI / 2;
    const r = target - mid * slot;
    let cost = 0, j = 0;
    for (const gg of groups) {
      const gm = j + (gg.cols.length - 1) / 2;
      const want = memberAngle[gg.ref] != null ? memberAngle[gg.ref] : -Math.PI / 2;
      cost += angDiff(r + gm * slot, want) * gg.cols.length;
      j += gg.cols.length;
    }
    if (cost < bestCost) { bestCost = cost; bestR = r; }
    idx += g.cols.length;
  }
  // pack fallback on the grown ring: the slot chord covers two 42-glyphs
  // plus the gap by the R_PACK construction above (strict except fp dust).
  const placements = ordered.map((c, j) => at(PACK_R, bestR + j * slot, c, c.referente));
  return { memberPos, placements: applyPilePoses(placements, poses, at), extent, rings };
}

function applyPilePoses(placements, poses, at) {
  if (!poses) return placements;
  return placements.map(p => {
    const pose = poses[p.purchaseId];
    if (!pose || !Number.isFinite(pose.angle)) return p;
    const col = { id: p.purchaseId };
    const q = at(p.radius, pose.angle, col, p.referente);
    q.z = Number.isFinite(pose.z) ? pose.z : 0;
    return q;
  });
}

function drawScene() {
  const svg = $('scene');
  layout = { world: { x: 705, y: 52 } };
  const CX = 380, CY = 350, R = 220;
  const geo = purchaseRingLayout(members(), state.collections, pilePose);
  svg.setAttribute('width', geo.extent.w);
  svg.setAttribute('height', geo.extent.h);
  svg.setAttribute('viewBox',
    `${geo.extent.cx - geo.extent.halfW} ${geo.extent.cy - geo.extent.halfH} ${geo.extent.w} ${geo.extent.h}`);
  const memberPos = geo.memberPos;
  const parts = [];
  parts.push(`<circle class="ringc" cx="${CX}" cy="${CY}" r="${geo.rings.member}"/>`);
  parts.push(`<circle class="ringc" cx="${CX}" cy="${CY}" r="${geo.rings.pack}"/>`);
  parts.push(`<text class="hintc" x="705" y="34">fuori</text>` +
    `<text x="705" y="56" style="font-size:17px;text-anchor:middle">🛒</text>`);

  members().forEach(u => {
    const { x, y } = memberPos[u];
    const uy = (y - CY) / R;
    const dir = uy >= 0 ? 1 : -1;
    layout['member:' + u] = { x, y };
    layout['conto:' + u] = { x, y: y + dir * 55 };
    if (resp(u)) layout['cassa:' + u] = { x, y: y + dir * 81 };
  });

  for (const p of geo.placements) {
    layout['pile:' + p.purchaseId] = { x: p.x, y: p.y, angle: p.angle, radius: p.radius };
    const rp = memberPos[p.referente];
    if (rp) parts.push(`<path class="reflink" data-reflink="${p.purchaseId}"
      d="M ${p.x} ${p.y} L ${rp.x} ${rp.y}"/>`);
  }
  const k = state.collections.length;
  const pileOrder = state.collections.slice().sort((a, b) => {
    const za = (pilePose[a.id] && pilePose[a.id].z) || 0;
    const zb = (pilePose[b.id] && pilePose[b.id].z) || 0;
    return za - zb || a.id - b.id;
  });
  pileOrder.forEach(c => {
    const { x, y } = layout['pile:' + c.id];
    const rr = 42;
    const st = c.pending.length ? `${c.pending.length} pend.` : (c.permitted ? 'L2 ✓' : 'aperto');
    parts.push(`<g class="pileg" data-obj="pile" data-id="${c.id}" data-key="pile:${c.id}"
      role="button" tabindex="0"
      aria-label="acquisto ${esc(lbl(c.id))}: impegni ${esc(eur(escrowOf(c)))} — trascina sull'anello"
      transform="translate(${x},${y})">
      <title>trascina sull'anello</title>
      <circle class="pc" r="${rr}"/>
      <text class="plbl" y="-12">«${esc(lbl(c.id))}»</text>
      <text class="pamt" y="4">${esc(eur(escrowOf(c)))}</text>
      <text class="pmeta" y="17">${st} · ${esc(nm(c.referente))}</text>
    </g>`);
  });
  if (!k) parts.push(`<text class="hintc" x="${CX}" y="${CY - 4}">nessun acquisto aperto</text>`);

  members().forEach(u => {
    const { x, y } = memberPos[u];
    parts.push(`<g class="${resp(u) ? 'noderesp' : ''}" data-obj="member" data-id="${u}"
      data-key="member:${u}" role="button" tabindex="0"
      aria-label="${esc(nm(u))}${resp(u) ? ' responsabile' : ''}" transform="translate(${x},${y})">
      <circle class="avatar" r="38"/>
      ${resp(u) ? '<text class="star" x="15" y="-16">★</text>' : ''}
      <text class="nm" y="5" style="font-size:${nm(u).length > 8 ? 10 : 13}px">${esc(nm(u))}</text>
    </g>`);
    const cv = bal(state.conti, u);
    const cp = layout['conto:' + u];
    parts.push(`<g class="chipg" data-obj="conto" data-id="${u}" data-key="conto:${u}"
      role="button" tabindex="0" aria-label="conto di ${esc(nm(u))}: ${esc(eur(cv))}"
      transform="translate(${cp.x},${cp.y})">
      <rect x="-44" y="-11" width="88" height="22" rx="6"/>
      <text y="4">conto ${esc(eur(cv))}</text>
    </g>`);
    if (resp(u)) {
      const kv = bal(state.casse, u);
      const kp = layout['cassa:' + u];
      parts.push(`<g class="cassag" data-obj="cassa" data-id="${u}" data-key="cassa:${u}"
        role="button" tabindex="0" aria-label="cassa di ${esc(nm(u))}: ${esc(eur(kv))}"
        transform="translate(${kp.x},${kp.y})">
        <rect x="-44" y="-11" width="88" height="22" rx="6"/>
        <text y="4">cassa ${esc(eur(kv))}</text>
      </g>`);
    }
  });

  parts.push('<g id="fx"></g>');
  svg.innerHTML = parts.join('');
}

/* Reader-facing text of a member or purchase glyph must stay inside its
   circle. Four bbox corners, not just the text origin. */
function sceneCircleContentContained() {
  const groups = $('scene').querySelectorAll('g[data-obj="member"], g[data-obj="pile"]');
  return [...groups].every(group => {
    const circle = group.querySelector('circle');
    if (!circle) return false;
    const radius = Number(circle.getAttribute('r'));
    return [...group.querySelectorAll('text')].every(tx => {
      const b = tx.getBBox();
      return [[b.x, b.y], [b.x + b.width, b.y],
        [b.x, b.y + b.height], [b.x + b.width, b.y + b.height]]
        .every(([x, y]) => Math.hypot(x, y) <= radius + 0.5);
    });
  });
}

/* the per-acquisto vote question: open → cast → verdict → unproved bridge */
function collGovHtml(col) {
  const label = lbl(col.id);
  const qid = permQid(col.id);
  if (col.permitted)
    return `<div class="tiny">permesso già applicato ⇣</div>`;
  const v = vtVerdictFor(col.id);
  if (v === 'positive')
    return `<div class="vq"><div class="qh">🗳 «${esc(qid)}» — CHIUSA POSITIVA
      ${pkGlyph(['vote-nostale', 'vote-partition'])}</div>
      <div class="tiny">la delibera è della macchina di voto; il ponte economico qui sotto resta
        <span class="npvbadge" data-claims="join-vote-econ">NON PROVATO</span></div></div>`;
  if (v === 'negative')
    return `<div class="vq"><div class="qh">🗳 «${esc(qid)}» — CHIUSA NEGATIVA
      ${pkGlyph(['vote-verdict', 'vote-partition'])}</div>
      <div class="tiny">il dissenso ha raggiunto la soglia; l'esito economico negativo qui sotto è un ponte
        <span class="npvbadge" data-claims="join-vote-econ">NON PROVATO</span></div></div>`;
  if (v === 'pending') {
    const q = vtLookup(qid, state.votes.openQuestions);
    return questionHtml(qid, q, `domanda in votazione: «permesso per ${esc(label)}»`);
  }
  const ready = vtFranchiseSize(curView()) > 0;
  return `<div class="vq"><div class="qh">🗳 nessuna domanda di assenso per «${esc(label)}»</div>
    ${ready
      ? `<div class="tasks" style="margin-top:4px">
          <button type="button" class="linkchip" data-kgpropose="${col.id}" title=".openQuestion">
            apri la domanda: permesso per «${esc(label)}»</button></div>
         <div class="tiny">domanda reale: <span class="mono">.openQuestion ${esc(qid)} .collective</span>
           — il legame con questo acquisto è decorazione del toy
           <span class="npvbadge" data-claims="join-vote-econ">NON PROVATO</span></div>`
      : `<div class="tiny">ammetti prima dei responsabili al gruppo di voto (vista Gruppo)</div>`}
  </div>`;
}

/* Visible proof-state sentence, derived from the actual receipt — never
   hardcoded. Counts enunciato entries in the given axioms map (default the
   committed CHECK_RECEIPT.axioms). The shipped gate exercises BOTH states:
   the committed receipt (all provato) and a scratch copy with one entry
   flipped to enunciato, which must flip this sentence. */
function proofSentence(axioms) {
  const ax = axioms || CHECK_RECEIPT.axioms;
  const n = Object.values(ax).filter(s => s === 'enunciato').length;
  const state = n
    ? `le prove del modello sono <b>enunciate, non dimostrate</b> (${n})`
    : `le prove del modello sono <b>provate</b>`;
  return `verdetti sì/no/aperta, dissenso e permessi per-persona sono MODELLATI; ${state}`;
}

/* group-view governance card: the second machine, observable and usable */

  const view = curView();
  const fr = vtFranchise(view);
  const th = vtTheta(fr.length);
  const qs = state.votes.openQuestions.map(([qid, q]) =>
    questionHtml(qid, q, `«${esc(qid)}» (aperta da ${esc(nm(q.proposer))})`)).join('');
  const closedTail = state.votes.closed.slice(-3).map(r =>
    `<div class="tiny">🗳 «${esc(r.questionId)}» — ${r.verdict === 'positive' ? 'POSITIVA' : 'NEGATIVA'}
      (${r.cause === 'tally' ? 'soglia' : 'cambio di elettorato'})
      · sì ${r.question.assents.length} / no ${r.question.dissents.length}</div>`).join('');
  const body = `<div class="tiny">elettorato (responsabili del gruppo): ${fr.length
      ? fr.map(k => esc(nm(k))).join(', ') : '<i>nessuno</i>'}
