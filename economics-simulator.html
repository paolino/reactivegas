    renderAll();
    openClaimPop(offEl.dataset.offClaims.split(','), ev.clientX, ev.clientY);
    return;
  }
  const taskEl = t.closest('[data-task]');
  if (taskEl && !taskEl.disabled) {
    const tag = taskEl.dataset.task;
    const preset = {};
    const d = nav();
    if (d.view === 'person') {
      if (d.hat === 'cassiere') preset.author = d.u;
      else if (tag === 'deposit' || tag === 'withdraw' || tag === 'pledge') preset.user = d.u;
    }
    if (d.view === 'collection') {
      preset.c = d.c;
      // the referente hat is the collection context: closing/failing is the
      // referente's task, exactly as the Lean guard demands
      if (tag === 'closePurchase' || tag === 'failPurchase') {
        const col = state.collections.find(x => x.id === d.c);
        preset.author = col.referente;
      }
    }
    startTask(tag, preset, ev.clientX, ev.clientY);
    return;
  }
  const act = t.closest('[data-act]');
  if (act) {
    const d = nav();
    const c = d.c, u = Number(act.dataset.u);
    const col = state.collections.find(x => x.id === c);
    const author = col.referente;             // the hat is the context
    if (act.dataset.act === 'accept') directAct('acceptPledge', { author, user: u, c }, ev.clientX, ev.clientY);
    else if (act.dataset.act === 'refuse') directAct('refusePledge', { author, user: u, c }, ev.clientX, ev.clientY);
    else directAct('correctPledge', { author, user: u, c }, ev.clientX, ev.clientY);
    return;
  }
  const hat = t.closest('[data-hat]');
  if (hat && !hat.disabled) { nav().hat = hat.dataset.hat; renderAll(); return; }
  const gc = t.closest('[data-goto-coll]');
  if (gc) { go({ view: 'collection', c: Number(gc.dataset.gotoColl) }); return; }
  const gp = t.closest('[data-goto-person]');
  if (gp) { go({ view: 'person', u: Number(gp.dataset.gotoPerson), hat: 'member' }); return; }
  const pr = t.closest('[data-pledge-c]');
  if (pr) { goPledge(Number(pr.dataset.pledgeC), Number(pr.dataset.pledgeU)); return; }
  const obj = t.closest('[data-obj]');
  if (obj) {
    const kind = obj.dataset.obj, id = Number(obj.dataset.id);
    if (kind === 'member' || kind === 'conto') go({ view: 'person', u: id, hat: 'member' });
    else if (kind === 'cassa') go({ view: 'person', u: id, hat: 'cassiere' });
    else if (kind === 'pile') go({ view: 'collection', c: id });
    else if (kind === 'ghost') startTask('addUser', { target: id }, ev.clientX, ev.clientY);
  }
});

/* Diagnostic-vocabulary lint: scans the ENTIRE selftest source (and its own)
   line by line, so no invented term can return in any diagnostic message —
   including branches a session never renders. Machine identifiers are allowed
   only in their known code shapes; lines that must mention the banned
   patterns themselves carry a DIAGLINT-ALLOW marker. */
function diagVocabLint() {
  const banned = /colletta|\bpledge\b/i;                                   // DIAGLINT-ALLOW
  // token-precise: strip the allowed machine-identifier shapes from each
  // line FIRST, then test what remains — prose sharing a line with a legal
  // identifier is still caught
  const stripAllowed = l => l
    .replace(/data-pledge[-a-z]*/g, '')      // row selector attributes       DIAGLINT-ALLOW
    .replace(/data-task="pledge"/g, '')      // task selector (machine tag)   DIAGLINT-ALLOW
    .replace(/'pledge'|"pledge"/g, '')       // exact view/tag token compare  DIAGLINT-ALLOW
    .replace(/\.pledge\b/g, '');             // dotted machine provenance     DIAGLINT-ALLOW
  return (selftest.toString() + '\n' + diagVocabLint.toString())
    .split('\n')
    .filter(l => !/DIAGLINT-ALLOW/.test(l) && !/^\s*\/\//.test(l))
    .filter(l => banned.test(stripAllowed(l)));
}

async function selftest() {
  {
    const dl = diagVocabLint();
    if (dl.length)
      throw new Error('lint diagnostica: termine vietato in ' + dl.length +
        ' riga/e del selftest');
  }
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const expect = (cond, what) => { if (!cond) throw new Error(what); };
  const click = async sel => {
    const el = document.querySelector(sel);
    expect(el, 'elemento mancante: ' + sel);
    const r = el.getBoundingClientRect();
    el.dispatchEvent(new MouseEvent('click', { bubbles: true,
      clientX: r.x + r.width / 2, clientY: r.y + r.height / 2 }));
    await sleep(40);
  };
  const amount = async (v, expMax) => {
    const n = document.getElementById('am-n'), r = document.getElementById('am-r');
    expect(n && r, 'controllo importo assente');
    expect(r.min !== '' && r.max !== '', 'importo senza limiti visibili');
    if (expMax !== undefined)
      expect(Number(r.max) === expMax, `max importo atteso ${expMax}, trovato ${r.max}`);
    if (Number(r.max) === TOYMAX)
      expect(document.querySelector('#pop [data-claims="toy-cap"]'),
        'limite del toy non marcato NON PROVATO');
    n.value = String(v);
    n.dispatchEvent(new Event('input', { bubbles: true }));
    await click('#am-ok');
  };
  const invOk = () => {
    const { v } = { v: sumBal(state.casse) - sumBal(state.conti) - escrowSum(state.collections) };
    expect(v === 0, 'invariante non 0');
    expect(document.getElementById('inv-chip').textContent.includes('✓'), 'chip bilancio non ✓');
  };
  const here = () => nav().view;
  const crumbText = () => document.getElementById('crumbs').innerText.replace(/\n/g, ' ');
  const lastEntry = () => document.querySelector('#log .entry');

  // group view: task-shaped entry points, not the event list
  expect(here() === 'group', 'vista iniziale non è il gruppo');
  expect(document.querySelectorAll('#gtasks [data-task]').length === 4,
    'compiti di gruppo assenti');

  // teaching present on first arrival
  expect(document.querySelector('[data-teach="benvenuto"]'), 'spiegazione iniziale assente');

  // derived refusal status: with only Anna ★ the accredito task is spent and
  // clicking it opens the proof — AUTH theorem plus honest NON PROVATO refusal
  await click('[data-key="member:0"]');
  const depOff = document.querySelector('#hat-member [data-task="deposit"]');
  expect(depOff && depOff.classList.contains('off'), 'accredito non spento con un solo ★');
  await click('#hat-member [data-task="deposit"]');
  const ppop = document.querySelector('#pop .pbox');
  expect(ppop && ppop.innerText.includes('step_authorized'), 'prova AUTH assente dal dettaglio');
  expect(ppop.innerText.includes('NON PROVAT'), 'stato NON PROVATO del rifiuto assente');
  await click('#pop .xbtn2');
  await click('#crumbs [data-crumb="0"]');

  // task: far entrare Bruno ed Elena (candidato → registrante ★)
  for (const gid of [1, 2]) {
    await click(`[data-key="ghost:${gid}"]`);
    await click(`#pop .chip[data-id="0"]`);
    expect(document.querySelector(`[data-key="member:${gid}"]`), 'membro non entrato');
  }
  // task: eleggi Bruno — l'elezione passa SOLO dal canale base: la barra
  // esegue bootstrap → ingresso → proposta fedele changeRoles; con un solo
  // admin ogni passo delibera subito (chi propone è già fra gli assensi)
  await click('#gtasks [data-task="electResponsabile"]');
  await click('#pop .chip[data-id="1"]');
  await click('#pop .chip[data-id="0"]');
  expect(document.querySelector('[data-key="member:1"]').classList.contains('noderesp'),
    'Bruno non eletto');
  expect(RG.bg.members.length === 2, 'canale base non fondato dalla prima elezione');
  const electEn = history.find(en => en.kind === 'acc' && en.tag === 'electResponsabile');
  expect(electEn && electEn.route === 'baseEnacted' && /^ruoli:/.test(electEn.evid || ''),
    'elezione senza provenienza di enactment del canale base');
  expect(document.querySelector('#log .entry .eprov'),
    'provenienza del ponte assente dalla storia');
  // the model boundary itself: a vote-derived event WITHOUT its enactment
  // is refused before the economic machine — electing responsabili with no
  // vote is no longer expressible
  const gr = RG.runAttempt('electResponsabile', { author: 0, target: 2 });
  expect(!gr.ok && gr.governance, 'elezione diretta senza delibera non rifiutata');
  expect(!resp(2), 'elezione diretta ha comunque effetto');
  renderAll();
  expect(lastEntry().innerText.includes('SENZA DELIBERA') &&
    lastEntry().innerText.includes('composizione'),
    'rifiuto di composizione non spiegato nella storia');
  // a refusal just happened: the guardie explanation applies NOW (and only
  // now — it was absent before this refusal)
  expect(document.querySelector('[data-teach="guardie"]'),
    'spiegazione del rifiuto assente subito dopo un rifiuto reale');
  invOk();

  // teaching recedes once the machine has been used
  expect(!document.querySelector('[data-teach="benvenuto"]'), 'spiegazione iniziale non receduta');

  // navigation: person view + hats
  await click('[data-key="member:0"]');
  expect(here() === 'person', 'click sul membro non apre la persona');
  expect(document.getElementById('hat-member'), 'cappello membro non attivo');
  expect(document.getElementById('card-conto'), 'conto assente nel cappello membro');
  expect(crumbText().includes('Gruppo') && crumbText().includes('Anna'), 'briciole errate');
  // referente controls must NOT exist at person level
  expect(!document.querySelector('#view [data-act]') && !document.getElementById('refpanel'),
    'controlli referente fuori dal contesto acquisto');
  await click('[data-hat="cassiere"]');
  expect(document.getElementById('hat-cassiere'), 'cappello cassiere non attivo');
  expect(document.getElementById('card-cassa'), 'cassa assente nel cappello cassiere');

  // cassiere task: incassa 100 da Bruno (bounded 0..500)
  await click('#hat-cassiere [data-task="deposit"]');
  await click('#pop .chip[data-id="1"]');
  await amount(100, 500);
  expect(document.getElementById('card-cassa').innerText.includes('100'),
    'cassa non aggiornata');
  invOk();

  // back to group, then Bruno opens «Olio» from his cassiere hat
  await click('#crumbs [data-crumb="0"]');
  expect(here() === 'group', 'briciola Gruppo non torna al gruppo');
  await click('[data-key="cassa:1"]');
  expect(here() === 'person' && nav().hat === 'cassiere', 'click sulla cassa non apre il cassiere');
  await click('#hat-cassiere [data-task="openPurchase"]');
  await click('#pop [data-l="Olio"]');
  expect(document.querySelector('[data-goto-coll]'), 'sezione referente-di assente');

  // NOTE-033: the impegno strip is CONDITION-driven — no money held yet, so
  // opening the acquisto view alone must NOT show it
  await click('[data-goto-coll]');
  expect(!document.querySelector('[data-teach="impegno"]'),
    'spiegazione impegno mostrata senza denaro impegnato (vista ≠ condizione)');
  await click('#nav-back');

  // Bruno-as-member joins his own purchase? no — member hat: pledge 30 (bounded by conto 100)
  await click('[data-hat="member"]');
  expect(document.getElementById('hat-member'), 'ritorno al cappello membro fallito');
  await click('#hat-member [data-task="pledge"]');
  await click('#pop .chip[data-id]');            // the only collection «Olio»
  await click('#pop .chip[data-id="0"]');        // registered by Anna ★
  await amount(30, 100);
  expect(document.querySelector('#hat-member [data-pledge-c]'), 'impegno non elencato');
  invOk();

  // depth: person → pledge (through collection) and all the way back
  await click('#hat-member [data-pledge-c]');
  expect(here() === 'pledge', 'vista impegno non aperta');

    'briciole senza profondità gruppo→persona→acquisto→impegno');
  await click('#nav-back');
  expect(here() === 'collection', "indietro non torna all'acquisto");
  expect(document.getElementById('refpanel'), "cappello referente assente nell'acquisto");
  // money IS held now: the strip stays visible while the condition holds,
  // and the causing event (the pledge) must NOT have retired it
  expect(document.querySelector('[data-teach="impegno"]'),
    'spiegazione impegno assente mentre il denaro è impegnato');
  await click('#nav-back');
  expect(here() === 'person', 'indietro non torna alla persona');
  await click('#nav-back');
  expect(here() === 'group', 'indietro non torna al gruppo');

  // guard affordance: Elena (conto 0) cannot pledge — COVERED (L7) on the task
  await click('[data-key="member:2"]');
  const pledgeBtn = document.querySelector('#hat-member [data-task="pledge"]');
  expect(pledgeBtn && pledgeBtn.classList.contains('off'), 'task impegno non disabilitato');
  expect(pledgeBtn.innerText.includes('COVERED (L7)'), 'badge COVERED (L7) assente');
  await click('#crumbs [data-crumb="0"]');

  // collection flow: referente queue exists only here; accept Bruno's pledge
  await click('[data-key="pile:1"]');
  expect(here() === 'collection', "click sull'acquisto non lo apre");
  expect(document.getElementById('refpanel'), 'coda referente assente');
  await click('#refpanel [data-act="accept"]');
  expect(lastEntry().innerText.includes("accetta l'impegno di Bruno"), 'accettazione non registrata');
  invOk();

  // NO direct-permission bypass: the grant task is spent until a delibera,
  // and clicking it opens the unproved-join disclosure
  expect(document.querySelector('#view .msec'), 'sezione assenso assente');
  expect(document.querySelector('#view .msec [data-claims="join-vote-econ"]'),
    'sezione assenso senza marcatura PONTE NON PROVATO');
  let grantBtn = document.querySelector('#view [data-task="grantPermission"]');
  expect(grantBtn && grantBtn.classList.contains('off') &&
    grantBtn.innerText.includes('SENZA DELIBERA'),
    'permesso diretto non spento senza delibera del voto');
  await click('#view [data-task="grantPermission"]');
  expect(document.querySelector('#pop .pbox').innerText.includes('PONTE'),
    'dettaglio del ponte non provato assente dal permesso spento');
  await click('#pop .xbtn2');

  // the vote journey: the REQUIRED machine — admission is a plain event
  // (never a question), a question opens with EMPTY tallies, and the first
  // side to reach the threshold closes it
  await click('#crumbs [data-crumb="0"]');
  await click('[data-key="ghost:3"]');                        // Carlo entra (4º utente)
  await click('#pop .chip[data-id="0"]');
  expect(document.getElementById('govcard'), 'scheda del gruppo di voto assente');
  expect(document.querySelector('#gov-status [data-claims="vote-model-status"]') &&
    document.querySelector('#gov-status [data-claims="join-vote-econ"]'),
    'stato del modello di voto non dichiarato nella scheda');
  // NOTE-033: no question is open yet, so the voto strip must NOT show —
  // the gov card being on screen is a view, not the condition
  expect(!document.querySelector('[data-teach="voto"]'),
    'spiegazione del voto mostrata senza una domanda aperta');
  const kgadmit = async id => {
    await click('#govcard [data-kgadmit]');
    await click(`#pop .chip[data-id="${id}"]`);
  };
  await kgadmit(0);                                           // Anna
  expect(RG.kg.members.length === 1, 'prima ammissione non applicata');
  await kgadmit(1); await kgadmit(2); await kgadmit(3);       // Bruno, Elena, Carlo
  expect(RG.kg.members.length === 4 && RG.kg.openQuestions.length === 0,
    'ammettere è un evento semplice: attesi 4 membri e nessuna domanda');
  expect(!document.querySelector('#govcard [data-kgadmit]'),
    'ammissione ancora offerta con tutti dentro');
  expect(lastEntry().innerText.includes('entra nel voto'),
    'ammissione non registrata nella storia');

  // the permesso question on «Olio»: EMPTY tallies at opening; with FOUR
  // voters θ=(4+1)/2=2 — anna sì, bruno no, then bruno SWITCHES position:
  // sì 2 ≥ 2 closes POSITIVE in the same step (sweep)
  await click('[data-key="pile:1"]');
  expect(document.querySelector('#view [data-kgpropose]'), 'proposta della domanda assente');
  await click('#view [data-kgpropose]');
  await click('#pop .chip[data-id="anna"]');
  expect(RG.kg.openQuestions.length === 1, 'domanda permesso non aperta');
  const q0 = RG.kg.openQuestions[0][1];
  expect(q0.assents.length === 0 && q0.dissents.length === 0,
    'la domanda non si apre con conteggi vuoti (auto-sì del proponente?)');
  expect(document.querySelector('#view .vq .qs').innerText.includes('sì 0 · no 0'),
    'conteggi vuoti non mostrati');
  // a REAL question is open now: the voto strip appears, wherever we are
  expect(document.querySelector('[data-teach="voto"]'),
    'spiegazione del voto assente mentre una domanda è aperta');
  const castBtn = (s, b) =>
    `#view [data-kgcast="permesso:1"][data-kgsigner="${s}"][data-kgballot="${b}"]`;
  await click(castBtn('anna', 'assent'));
  await click(castBtn('bruno', 'dissent'));
  expect(document.querySelector('#view .vq .qs').innerText.includes('sì 1 · no 1'),
    'conteggio sì/no non aggiornato');
  // the voter's CURRENT position is spent: repeating never double-counts
  const brunoNo = document.querySelector(castBtn('bruno', 'dissent'));
  expect(brunoNo && brunoNo.disabled, 'posizione corrente non spenta (doppio conteggio?)');
  await click(castBtn('bruno', 'assent'));                    // SWITCH → 2/2
  expect(RG.kg.openQuestions.length === 0 && RG.kg.closed.length === 1
    && RG.kg.closed[0].verdict === 'positive'
    && RG.kg.closed[0].question.dissents.length === 0,
    'il cambio di posizione a soglia non ha chiuso POSITIVA senza dissensi');
  // the question closed: the condition ended, so the strip leaves WITHOUT
  // being marked understood (it must return with the next open question)
  expect(!document.querySelector('[data-teach="voto"]'),
    'spiegazione del voto ancora mostrata a domanda chiusa');
  expect(!JSON.parse(lsGet(teachKey()) || '{}').voto,
    'la chiusura della domanda ha ritirato per sempre la spiegazione del voto');
  expect(document.querySelector('#view .vq .qh').innerText.includes('CHIUSA POSITIVA'),
    'verdetto positivo non mostrato');
  expect(lastEntry().innerText.includes('CHIUSA'), 'chiusura non registrata nella storia');
  // the middle proof state is visible where the user meets it: the closed
  // verdict cites sorry-backed Vote invariants, rendered ◇ not ⊢
  expect(document.querySelector('#view .pk.enun'),
    'stato enunciato invisibile nel punto d’uso');
  // deny stays gated: a POSITIVE verdict never enables the negative bridge
  const denyBtn = document.querySelector('#view [data-task="denyPermission"]');
  expect(denyBtn && denyBtn.classList.contains('off') &&
    denyBtn.innerText.includes('SENZA DELIBERA'),
    'diniego diretto non spento senza verdetto negativo');

  // only now the bridge exists — and it is marked unproved at the point of use
  grantBtn = document.querySelector('#view [data-task="grantPermission"]');
  expect(grantBtn && !grantBtn.classList.contains('off') &&
    grantBtn.innerText.includes('PONTE NON PROVATO'),
    'ponte senza marcatura NON PROVATO al punto d’uso');
  await click('#view [data-task="grantPermission"]');
  const conf = document.querySelector('#pop .pbox');
  expect(conf && conf.innerText.includes('DELIBERATA') && conf.innerText.includes('NON PROVATO'),
    'conferma del ponte senza delibera o senza limite di prova');
  await click('#ext-apply');
  const ge = lastEntry();
  expect(ge.className.includes('ext') && ge.innerText.includes('NON PROVATO'),
    'ponte applicato senza marcatura nel risultato');
  expect(!/Anna|Bruno|Elena|Carlo/.test(ge.querySelector('.eh').innerText),
    'esito attribuito a un officer');
  invOk();

  // close from the referente panel; nav recovers to a still-existing view
  await click('#refpanel [data-task="closePurchase"]');
  expect(document.getElementById('done-body').innerText.includes('Olio'),
    'acquisto completato assente dopo la chiusura');
  expect(here() !== 'collection' && here() !== 'pledge', 'vista su acquisto chiuso non rientrata');
  // NOTE-033, the exact operator regression: the close made Bruno's cassa
  // negative, and the explanation is on screen IN THIS SAME render — the
  // causing event did not retire it
  expect(RG.state.casse.some(([, v]) => v < 0),
    'la chiusura non ha prodotto la cassa negativa attesa');
  expect(document.querySelector('[data-teach="cassa"]'),
    'cassa negativa senza spiegazione a schermo dopo la chiusura');
  expect(document.querySelector('[data-teach="cassa"]').innerText.includes('Bruno'),
    'la spiegazione della cassa non nomina il cassiere rilevante');
  expect(document.querySelector('[data-teach="chiusa"]'),
    'spiegazione della chiusura assente nel contesto post-chiusura');
  invOk();

  // branch coverage: remove-with-no-open-purchases flow copy — and the
  // operator scenario made impossible: with THREE base admins the faithful
  // revoke proposal stays PENDING until a second admin approves; only the
  // enactment applies the economic event
  await click('#crumbs [data-crumb="0"]');
  await click('#gtasks [data-task="electResponsabile"]');
  await click('#pop .chip[data-id="2"]');       // Elena eletta (2 admin: auto-delibera)
  await click('#pop .chip[data-id="0"]');       // registrata da Anna
  expect(resp(2) && RG.bg.members.length === 3, 'Elena non eletta via canale base');
  await click('#gtasks [data-task="removeResponsabile"]');
  await click('#pop .chip[data-id="2"]');       // Elena revocata…
  await click('#pop .chip[data-id="1"]');       // …proposta da Bruno
  expect(resp(2), 'revoca applicata SENZA delibera (3 admin, soglia 2)');
  expect(RG.bg.pendingProposals.length === 1, 'proposta di revoca non pendente');
  const pendQ = document.querySelector('#govcard [data-bgapprove]');
  expect(pendQ && document.querySelector('#govcard .vq .qs').innerText.includes('assensi 1'),
    'proposta pendente non mostrata con i suoi assensi');
  await click('#govcard [data-bgapprove][data-bgsigner="anna"]');   // 2/2 → DELIBERATA
  expect(!resp(2) && RG.bg.pendingProposals.length === 0,
    'la seconda approvazione non ha deliberato e applicato la revoca');
  const re = lastEntry();
  expect(re.innerText.includes('nessun acquisto da chiudere'),
    'ramo revoca-senza-acquisti: copy legacy assente');
  expect(!/colletta/i.test(re.innerText), 'ramo revoca-senza-acquisti: termine vietato');   // DIAGLINT-ALLOW
  expect(RG.bgLawBreaches.length === 0, 'rete del canale base scattata in sessione');

  // branch coverage: every member già impegnato → L8 note; pending → L4 note
  await click('[data-key="conto:0"]');          // Anna: conto 0, serve un accredito
  await click('#hat-member [data-task="deposit"]');
  await click('#pop .chip[data-id="1"]');
  await amount(20, 500);
  await click('#crumbs [data-crumb="0"]');
  await click('[data-key="conto:2"]');          // Elena: conto 0, serve un accredito
  await click('#hat-member [data-task="deposit"]');
  await click('#pop .chip[data-id="1"]');
  await amount(20, 500);
  await click('#crumbs [data-crumb="0"]');
  await click('[data-key="conto:3"]');          // Carlo: conto 0, serve un accredito
  await click('#hat-member [data-task="deposit"]');
  await click('#pop .chip[data-id="1"]');
  await amount(20, 500);
  await click('#crumbs [data-crumb="0"]');
  await click('#gtasks [data-task="openPurchase"]');
  await click('#pop [data-l="Vino"]');
  await click('#pop .chip[data-id="1"]');       // referente Bruno
  await click('[data-key="pile:2"]');
  expect(here() === 'collection', 'acquisto «Vino» non aperto');
  for (const [u, a] of [[0, 1], [1, 0], [2, 1], [3, 0]]) {
    await click('#view [data-task="pledge"]');
    await click(`#pop .chip[data-id="${u}"]`);
    await click(`#pop .chip[data-id="${a}"]`);
    await amount(5);
  }
  const pbtn = document.querySelector('#view [data-task="pledge"]');
  expect(pbtn && pbtn.classList.contains('off'), 'task impegno non disabilitato con tutti impegnati');
  expect(pbtn.getAttribute('title') === 'tutti hanno già un impegno',
    'ramo L8: nota legacy assente (' + pbtn.getAttribute('title') + ')');
  const fbtn = document.querySelector('#refpanel [data-task="failPurchase"]');
  expect(fbtn && fbtn.classList.contains('off') && fbtn.getAttribute('title') === 'impegni pendenti da risolvere',
    'ramo L4 (fallisci): nota legacy assente');
  // the «Vino» permesso also travels through the vote machine, never
  // directly: open (empty tallies), two sì reach θ=2 → POSITIVE → bridge
  await click('#view [data-kgpropose]');
  await click('#pop .chip[data-id="anna"]');
  await click('#view [data-kgcast="permesso:2"][data-kgsigner="anna"][data-kgballot="assent"]');
  await click('#view [data-kgcast="permesso:2"][data-kgsigner="elena"][data-kgballot="assent"]');
  expect(RG.kg.closed.length === 2 && RG.kg.closed[1].verdict === 'positive',
    'seconda domanda non chiusa alla soglia');
  await click('#view [data-task="grantPermission"]');
  await click('#ext-apply');
  const cbtn = document.querySelector('#refpanel [data-task="closePurchase"]');
  expect(cbtn && cbtn.classList.contains('off') && cbtn.getAttribute('title') === 'impegni pendenti da risolvere',
    'ramo L4 (chiudi): nota legacy assente');

  // tooltip sweep: no invented term in any non-provenance title attribute
  const humanTitles = [...document.querySelectorAll('[title]')]
    .map(el => el.getAttribute('title')).filter(t => t && !t.startsWith('.'));
  expect(!humanTitles.some(t => /colletta|\bpledge\b/i.test(t)),   // DIAGLINT-ALLOW
    'vocabolario: termine vietato in un tooltip');
  invOk();

  // no invented vote state or event; machine surface unchanged
  const TAGS = ['addUser', 'electResponsabile', 'removeResponsabile', 'openPurchase',
    'grantPermission', 'denyPermission', 'deposit', 'withdraw', 'transferCassa',
    'pledge', 'acceptPledge', 'refusePledge', 'correctPledge', 'closePurchase',
    'failPurchase'];
  expect(Object.keys(EV).length === 15 && TAGS.every(t => EV[t]),
    'vocabolario eventi alterato');

    JSON.stringify(['casse', 'collections', 'conti', 'responsabili', 'users']),
    'stato macchina esteso oltre Lean');

  // presentation vocabulary: legacy gruppo words in visible copy, never the
  // invented ones; machine identifiers stay only as .mono provenance
  const copy = (() => {
    const c = document.body.cloneNode(true);
    c.querySelectorAll('.mono, script, #pop, .toast').forEach(el => el.remove());
    return c.innerText;
  })();
  expect(!/colletta/i.test(copy), 'vocabolario: termine vietato (it) nel copy visibile');    // DIAGLINT-ALLOW
  expect(!/\bpledge\b/i.test(copy), 'vocabolario: termine vietato (en) nel copy visibile');  // DIAGLINT-ALLOW
  expect(/impegn/i.test(copy) && /acquist/i.test(copy),
    'vocabolario legacy (impegno/acquisto) assente dal copy');
  expect(ge.querySelector('.mono') &&
    ge.querySelector('.mono').textContent.trim().startsWith('.grantPermission'),
    'provenienza macchina assente dalla storia');

  // fidelity nets: crude net silent all session, Lean traces replay clean
  expect(lawBreaches.length === 0, 'rete invarianti Lean scattata in sessione');
  const tc = traceConformance();
  expect(tc.steps === 29, 'copertura tracce Lean inattesa: ' + tc.steps);

  // claim manifest: audit clean, derived inversion inventory coherent
  const ca = claimAudit();
  expect(ca.length === 0, 'manifesto invalido: ' + ca.join('; '));
  const inv2 = refusalInventory();
  expect(inv2.proven.length + inv2.missing.length === inv2.events.length
    && inv2.events.length === Object.keys(EV).length
    && inv2.proven.every(t => refusalProven(t)) && inv2.missing.every(t => !refusalProven(t)),
    'inventario inversioni incoerente');
  const looseGb = [...document.querySelectorAll('.gb')].filter(b =>
    GUARD_CLAIMS[b.textContent.trim()] && !b.dataset.claims && !b.closest('[data-off-claims]'));
  expect(looseGb.length === 0, 'badge guardia senza associazione al manifesto: ' + looseGb.length);
  expect(document.querySelector('#done-card [data-claims="done-list"]'),
    'elenco completati senza marcatura NON PROVATO');

  // vote machine nets: Lean corpus replayed clean, laws silent, labels honest
  const ktc = kelTraceConformance();
  expect(ktc.steps === 23 && ktc.corpus === 'seme-locale-vote-richiesto',
    'copertura tracce voto inattesa: ' + ktc.steps);
  expect(kgLawBreaches.length === 0, 'rete invarianti del voto scattata in sessione');

  // three DERIVED proof states: enunciato exists today (the Vote invariants
  // carry sorry), the economic theorems stay provato, and no sorry-backed
  // citation can ever render as proved
  const enunNow = Object.values(CHECK_RECEIPT.axioms).filter(s => s === 'enunciato');
  expect(enunNow.length > 0, 'nessuno stato enunciato derivato (attese: invarianti del voto)');
  expect(CHECK_RECEIPT.axioms['KelGroups.Vote.ballots_nodup_disjoint'] === 'enunciato',
    'invariante del voto con sorry non classificata enunciato');
  expect(CHECK_RECEIPT.axioms['conservation_preserved'] === 'provato',
    'teorema economico non classificato provato');
  for (const cid of Object.keys(CLAIMS)) {
    const row2 = claimRowHtml(cid);
    if (proofState(cid) === 'enun')
      expect(row2.includes('enunciato, non dimostrato') && !row2.includes('— provato'),
        'citazione con sorry resa come provata: ' + cid);
    if (proofState(cid) === 'ok')
      expect(row2.includes('— provato') && !row2.includes('enunciato'),
        'citazione provata resa in modo ambiguo: ' + cid);
  }
  expect(pkGlyph(['vote-clean']).includes('enun') && pkGlyph(['vote-clean']).includes('◇'),
    'glifo dello stato enunciato assente');
  expect(pkGlyph(['conservation']).includes('⊢') && !pkGlyph(['conservation']).includes('enun'),
    'glifo provato contaminato dallo stato intermedio');
  expect(pkGlyph(['vote-clean', 'join-vote-econ']).includes('npv'),
    'NON PROVATO non prevale sugli altri stati nel glifo composto');

  // composition citations: pinned-commit rows render their pin and derived
  // state; the route table covers exactly the accepted 18 constructors
  expect(Object.keys(EVENT_ROUTES).length === 18, 'instradamento non copre i 18 costruttori');
  const compRow = claimRowHtml('comp-routing');
  expect(compRow.includes('@ pin c8c4dd8903') && compRow.includes('— provato'),
    'riga della composizione senza pin o senza stato derivato');
  expect(claimRowHtml('comp-witness').includes('zeroThreshold'),
    'riga del testimone senza avvertenza zeroThreshold');
  expect(pkGlyph(['comp-routing']).includes('⊢'),
    'glifo del teorema di instradamento non provato');

  // session log: persisted after every event, all three machines, applied-only
  const applied = sessionSteps.length;
  const kelApplied = kelSteps.length;
  const bgApplied = bgSteps.length;
  const seqLen = sessionSeq.length;
  expect(applied >= 15, 'log sessione troppo corto: ' + applied);
  expect(kelApplied >= 10, 'log voto troppo corto: ' + kelApplied);
  expect(bgApplied >= 7, 'log del canale base troppo corto: ' + bgApplied);
  expect(seqLen === applied + kelApplied + bgApplied, 'seq non copre le tre macchine');
  const rawLog = lsGet(logKey());
  expect(rawLog, 'log non persistito');
  const wrap = JSON.parse(rawLog);
  expect(wrap.format === 'reactivegas-sim-session' && wrap.v === 2
    && wrap.trace.schema === 'reactivegas.trace' && wrap.trace.version === 1
    && wrap.trace.steps.length === applied
    && wrap.kel.schema === 'kelgroups-vote.trace' && wrap.kel.version === 1
    && wrap.kel.threshold === 'legacyThreshold'
    && wrap.kel.steps.length === kelApplied
    && wrap.base.schema === 'kelgroups-base.trace' && wrap.base.version === 1
    && wrap.base.steps.length === bgApplied && wrap.seq.length === seqLen,
    'involucro log v2 non conforme');
  expect(wrap.trace.steps.every(st => st.result.tag === 'applied') &&
    wrap.kel.steps.every(st => st.result.tag === 'applied') &&
    wrap.base.steps.every(st => st.result.tag === 'applied'),
    'log di sessione con passi non applicati');
  expect(canonState(state) === canonState(wrap.trace.steps[applied - 1].result.state),
    'stato vivo diverso dal log');
  expect(canonKelState(kg) === canonKelState(wrap.kel.steps[kelApplied - 1].result.state),
    'stato del voto diverso dal log');
  expect(canonBaseState(bg) === canonBaseState(wrap.base.steps[bgApplied - 1].result.state),
    'stato del canale base diverso dal log');

  // restore: replay from initial with per-step verification, never trust the tail
  const liveCanon = canonState(state);
  const liveKelCanon = canonKelState(kg);
  const liveBgCanon = canonBaseState(bg);
  expect(restoreSession() === seqLen, 'ripristino non riuscito');
  expect(canonState(state) === liveCanon, 'replay diverge dallo stato vivo');
  expect(canonKelState(kg) === liveKelCanon, 'replay diverge dallo stato del voto');
  expect(canonBaseState(bg) === liveBgCanon, 'replay diverge dallo stato del canale base');
  expect(history.length === seqLen, 'storia non ricostruita dal replay');

  // corruption: replay refused, log quarantined, then good log restores
  lsSet(logKey(), rawLog.replace('"amount":30', '"amount":31'));
  expect(restoreSession() === null, 'log corrotto accettato');
  expect(!lsGet(logKey()) && lsGet(logKey() + '-corrotto'), 'quarantena assente');
  lsSet(logKey(), rawLog);
  expect(restoreSession() === seqLen && canonState(state) === liveCanon,
    'ripristino del log valido fallito');
  // corruption on the VOTE stream is caught the same way
  expect(rawLog.includes('"assents":["anna"]'), 'sonda del log voto assente');
  lsSet(logKey(), rawLog.replace('"assents":["anna"]', '"assents":["anna","anna"]'));
  expect(restoreSession() === null, 'log voto corrotto accettato');
  lsSet(logKey(), rawLog);
  expect(restoreSession() === seqLen, 'ripristino post-corruzione voto fallito');
  // corruption on the BASE stream is caught the same way
  expect(rawLog.includes('"approvals":["bruno"]'), 'sonda del log base assente');
  lsSet(logKey(), rawLog.replace('"approvals":["bruno"]', '"approvals":["bruno","bruno"]'));
  expect(restoreSession() === null, 'log base corrotto accettato');
  lsSet(logKey(), rawLog);
  expect(restoreSession() === seqLen, 'ripristino post-corruzione base fallito');
  // GOVERNANCE on import: an economic log that elects without any base
  // enactment is REFUSED by the model, not adopted — the operator's exact
  // pre-fix behavior cannot re-enter through the log
  {
    const sab = JSON.parse(rawLog);
    sab.base.steps = []; sab.kel.steps = [];
    sab.seq = sab.seq.replace(/[bk]/g, '');
    lsSet(logKey(), JSON.stringify(sab));
    expect(restoreSession() === null, 'log con elezioni senza delibera accettato');
    lsSet(logKey(), rawLog);
    expect(restoreSession() === seqLen, 'ripristino post-sonda governo fallito');
  }

  // frozen-contract rejection matrix, on the real consumer
  const goodEnv = wrap.trace;
  const tamper = (fn, expectMsg, what) => {
    const cp = JSON.parse(JSON.stringify(goodEnv));
    fn(cp);
    let msg = null;
    try { verifyTraceV1(cp); } catch (e) { msg = e.message; }
    expect(msg && msg.includes(expectMsg), `matrice v1 (${what}): ${msg}`);
  };
  tamper(c => { c.version = 2; }, 'versione non supportata', 'versione');
  tamper(c => { c.schema = 'x'; }, 'schema sconosciuto', 'schema');
  tamper(c => { c.steps[2].input.users.push(9); }, 'discontinuo', 'input discontinuo');
  tamper(c => { delete c.steps[2].input; }, 'forma non valida', 'input omesso');
  tamper(c => { c.steps[1].result.state.conti = [[9, 9]]; }, 'divergente', 'post-stato mutato');
  tamper(c => { c.steps[1].result = { tag: 'refused', guard: { id: 'x', declaration: 'y' } }; },
    'la macchina applica', 'applicato→rifiutato');
  tamper(c => {
    const last = JSON.parse(JSON.stringify(c.steps[c.steps.length - 1].result.state));
    c.steps.push({ input: last, event: { 'pledge': { author: 0, user: 0, c: 2, v: 5 } },
      result: { tag: 'refused', guard: { id: 'x', declaration: 'not_a_theorem' } } });
  }, 'inversione accettato', 'GuardId errato');
  tamper(c => {
    const last = JSON.parse(JSON.stringify(c.steps[c.steps.length - 1].result.state));
    c.steps.push({ input: last, event: { 'pledge': { author: 0, user: 0, c: 2, v: 5 } },
      result: { tag: 'refused' } });
  }, 'guard mancante', 'guard omessa');
  // «entrambi rifiutati» non basta: un rifiuto ben formato resta comunque
  // segnalato come verifica del guard-id NON PROVATA, mai conformità silenziosa
  {
    const cp = JSON.parse(JSON.stringify(goodEnv));
    const last = JSON.parse(JSON.stringify(cp.steps[cp.steps.length - 1].result.state));
    cp.steps.push({ input: last, event: { 'pledge': { author: 0, user: 0, c: 2, v: 5 } },
      result: { tag: 'refused', guard: { id: 'seed', declaration: 'step_pledge_inv' } } });
    const rr = verifyTraceV1(cp);
    expect(rr.refusedUnverified === 1 && rr.refusedNotes[0].includes('NON PROVATO'),
      'rifiuto accettato senza nota NON PROVATO dal verificatore');
  }
  expect(tc.refusedUnverified === 0 && tc.corpus === 'seme-locale-solo-applicati',
    'etichetta del corpus seme assente');

  // export → import round trip and presentation stepping, on real controls
  await click('#btn-log');
  await click('#log-show');
  const exported = document.getElementById('log-ta').value;
  expect(JSON.parse(exported).trace.steps.length === applied, 'export non conforme');
  await click('#log-import');
  expect(pres && pres.n.seq.length === seqLen, 'import non entrato in presentazione');
  expect(!document.getElementById('presbar').hidden, 'barra di presentazione assente');
  expect(pres.idx === 0, 'presentazione non a passo 0');
  await click('#pres-next'); await click('#pres-next');
  expect(pres.idx === 2, 'passo successivo non avanza');
  expect(document.querySelectorAll('[data-key^="member:"]').length === state.users.length,
    'vista di presentazione incoerente con lo stato del passo');
  // step onto the first VOTE event of the seq and check the vote state follows
  const firstK = pres.n.seq.indexOf('k');
  expect(firstK >= 0, 'nessun passo di voto nella presentazione');
  presSet(firstK + 1);
  expect(RG.kg.members.length === 1, 'presentazione non mostra lo stato del voto al passo');
  expect(document.getElementById('presbar').innerText.includes('entra nel voto'),
    'descrizione del passo di voto assente');
  await click('#pres-prev');
  expect(pres.idx === firstK, 'passo precedente non torna');
  await click('#pres-exit');
  expect(!pres, 'uscita dalla presentazione fallita');
  expect(canonState(state) === liveCanon, 'stato vivo mutato dalla presentazione');
  expect(canonKelState(kg) === liveKelCanon, 'stato voto mutato dalla presentazione');
  expect(lsGet(logKey()) === rawLog, 'log mutato dalla presentazione');

  // corrupt import: clear local rejection through the real control
  await click('#btn-log');
  document.getElementById('log-ta').value = exported.replace('"tag":"applied"', '"tag":"refused"');
  await click('#log-import');
  expect(document.getElementById('log-msg').innerText.includes('rifiutata'),
    'import corrotto non rifiutato');
  expect(!pres, 'import corrotto entrato in presentazione');
  await click('#pop .xbtn2');

  // teaching persisted, replayable for demos, and dismissable by hand
  expect(JSON.parse(lsGet(teachKey()) || '{}').benvenuto === true,
    'apprendimento non persistito');
  await click('#crumbs [data-crumb="0"]');
  await click('#btn-teach');
  expect(document.querySelector('[data-teach="benvenuto"]'), 'spiegazioni non ripristinate');
  await click('#view [data-teachx="benvenuto"]');
  expect(!document.querySelector('[data-teach="benvenuto"]'), 'spiegazione non congedabile');
}

if (IS_SELFTEST) {
  selftest()
    .then(() => { document.title = 'SELFTEST PASS — Reactivegas'; })
    .catch(e => { document.title = 'SELFTEST FAIL — ' + e.message; })
    .finally(() => { lsDel(logKey()); lsDel(logKey() + '-corrotto'); lsDel(teachKey()); });
}
</script>
</body>
</html>
