<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">

<title>Reactivegas — simulatore economico</title>

<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --ink: #1c2733;
    --muted: #5b6b7b;
    --line: #dde4ea;
    --accent: #1d5fbf;
    --ok: #1c7c43;
    --ok-bg: #e8f6ee;
    --bad: #b3261e;
    --bad-bg: #fdecea;
    --gold: #b98a1c;
    --chip: #e7eef8;
    font-size: 15px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    line-height: 1.35;
  }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .92em; }

  header {
    position: sticky; top: 0; z-index: 20; background: var(--card);
    border-bottom: 1px solid var(--line); padding: 7px 12px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px;
  }
  header h1 { margin: 0; font-size: .98rem; }
  header h1 small { color: var(--muted); font-weight: 400; font-size: .68rem; }
  #inv-strip { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .inv-term { display: flex; flex-direction: column; line-height: 1.1; }
  .inv-term .lbl { font-size: .62rem; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .inv-term .val { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .98rem; }
  .inv-op { font-size: 1.05rem; color: var(--muted); }
  #inv-badge { padding: 3px 10px; border-radius: 999px; font-weight: 700; font-size: .82rem; }
  #inv-badge.ok { background: var(--ok-bg); color: var(--ok); }
  #inv-badge.bad { background: var(--bad-bg); color: var(--bad); }
  #inv-note { font-size: .7rem; color: var(--muted); }
  .hbtns { margin-left: auto; display: flex; gap: 6px; }
  @keyframes flash { 0% { background: #dcebff; } 100% { background: transparent; } }
  .flash-strip { animation: flash .8s ease-out; }

  #statusline {
    max-width: 1400px; margin: 0 auto; padding: 6px 14px 0;
    font-size: .86rem; min-height: 1.7em; display: flex; align-items: center; gap: 8px;
  }
  #statusline .xbtn {
    border: 1px solid var(--line); background: #fff; border-radius: 6px;
    font: inherit; font-size: .78rem; padding: 0 7px; cursor: pointer; color: var(--bad);
  }
  #statusline b { color: var(--accent); }

  main {
    display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr);
    gap: 12px; padding: 8px 12px 30px; max-width: 1400px; margin: 0 auto;
  }
  @media (max-width: 940px) {
    main { grid-template-columns: 1fr; padding: 6px 6px 30px; }
  }
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; min-width: 0;
  }
  .card h2 { margin: 0 0 6px; font-size: .88rem; }
  .card h2 small { color: var(--muted); font-weight: 400; font-size: .72rem; }
  .empty { color: var(--muted); font-size: .82rem; font-style: italic; margin: 2px 0; }
  #side { display: flex; flex-direction: column; gap: 12px; min-width: 0; }

  #scene-card { padding: 4px; }
  svg#scene { display: block; width: 100%; height: auto; user-select: none; }
  svg text { user-select: none; pointer-events: none; }
  [data-obj] { cursor: pointer; }
  .avatar { fill: #fff; stroke: #8aa3c0; stroke-width: 2; }
  .noderesp .avatar { stroke: var(--gold); stroke-width: 3; fill: #fffaf0; }
  .ghostn .avatar { stroke-dasharray: 4 3; fill: #f7f9fb; stroke: #a9b8c6; }
  .init { font-size: 19px; font-weight: 700; text-anchor: middle; fill: #31465e; }
  .ghostn .init { fill: #93a5b6; }
  .nm { font-size: 14px; text-anchor: middle; fill: var(--ink); font-weight: 600; }
  .ghostn .nm { fill: var(--muted); font-weight: 500; }
  .star { font-size: 15px; text-anchor: middle; }
  .chipg rect { fill: #eaf3ec; stroke: #bcd8c3; }
  .cassag rect { fill: #fdf3dd; stroke: #e3cf9a; }
  .chipg text, .cassag text {
    font-size: 12.5px; text-anchor: middle; fill: var(--ink);
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .chipk { font-size: 9px !important; fill: var(--muted) !important; font-family: inherit !important; }
  .pileg .pc { fill: #f3edfb; stroke: #b599dd; stroke-width: 2.5; }
  .plbl { font-size: 13px; text-anchor: middle; font-weight: 700; fill: #4a3175; }
  .pamt { font-size: 15px; text-anchor: middle; font-family: ui-monospace, Menlo, Consolas, monospace; fill: var(--ink); }
  .pmeta { font-size: 10px; text-anchor: middle; fill: var(--muted); }
  .reflink { stroke: #b599dd; stroke-width: 1.5; stroke-dasharray: 3 4; fill: none; opacity: .6; }
  .ringc { fill: none; stroke: #e3e9ef; stroke-width: 2; }
  .hintc { font-size: 13px; text-anchor: middle; fill: var(--muted); font-style: italic; }

  .sel .avatar, .sel rect, .sel .pc { stroke: var(--accent) !important; stroke-width: 4 !important; }
  .halo { fill: none; stroke: #35b36b; stroke-width: 3.5; animation: halop 1.1s ease-in-out infinite; }
  @keyframes halop { 0%,100% { stroke-opacity: .25; } 50% { stroke-opacity: .9; } }
  .pick-warn { opacity: .55; }
  .pick-off { opacity: .3; pointer-events: none; }
  .mut { opacity: .35; pointer-events: none; }
  .svgb rect { fill: var(--bad-bg); stroke: #e6b8b4; }
  .svgb text { font-size: 10.5px; fill: var(--bad); font-weight: 700; text-anchor: middle; }
  @keyframes nodeflash { 0% { opacity: .15; } 100% { opacity: 1; } }

  .coin { fill: #ffd766; stroke: var(--gold); stroke-width: 1.5; }
  .cointx { font-size: 12px; font-weight: 700; fill: #6b4d05; text-anchor: middle; }
  .floattx { font-size: 13px; font-weight: 700; text-anchor: middle; }

  /* popover */
  #pop { position: fixed; z-index: 50; }
  .pbox {
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: 0 6px 24px rgba(20,40,60,.18); padding: 8px; max-width: min(320px, 92vw);
  }
  .pt { font-size: .82rem; font-weight: 700; margin: 0 2px 6px; display: flex; gap: 8px; align-items: center; }
  .pt .mono { color: var(--muted); font-weight: 400; }

    display: flex; align-items: center; gap: 8px; width: 100%; text-align: left;

    font: inherit; font-size: .86rem; cursor: pointer;

  button.mi:not(:disabled):hover { background: var(--chip); }
  button.mi .tag { margin-left: auto; color: var(--muted); font-size: .68rem; }

    margin-left: auto; border: 1px solid #e6b8b4; background: var(--bad-bg); color: var(--bad);

  }
  .gb.dim { border-color: var(--line); background: var(--bg); color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 2px; }
  .lchip {
    border: 1px solid #c9d8ee; background: var(--chip); border-radius: 8px;
    padding: 4px 10px; font: inherit; font-size: .86rem; cursor: pointer;
  }
  .lchip:hover { background: var(--accent); color: #fff; }
  .ar { display: flex; align-items: center; gap: 8px; padding: 4px 2px; }
  .ar input[type=range] { flex: 1; min-width: 120px; }
  .ar2 { display: flex; align-items: center; gap: 8px; padding: 4px 2px; }
  .ar2 input[type=number] {
    width: 90px; font: inherit; padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px;
  }
  .ar2 input.badv { border-color: var(--bad); background: var(--bad-bg); }
  button.primary {
    background: var(--accent); color: #fff; border: none; border-radius: 7px;
    padding: 5px 14px; font: inherit; font-weight: 600; cursor: pointer;
  }
  button.primary:disabled { background: #9db4d6; cursor: default; }
  button.ghost {
    background: #fff; color: var(--accent); border: 1px solid var(--accent);
    border-radius: 7px; padding: 4px 10px; font: inherit; font-size: .84rem; cursor: pointer;
  }
  button.ghost:hover { background: var(--chip); }
  button.danger { color: var(--bad); border-color: var(--bad); }
  button.danger:hover { background: var(--bad-bg); }
  .tiny { font-size: .7rem; color: var(--muted); margin: 3px 2px 0; }
  .cfline { font-size: .85rem; margin: 4px 2px; }
  .cfline .nz { color: var(--bad); font-weight: 700; }
  .cfline .z { color: var(--ok); font-weight: 700; }

  /* toast */
  .toast {
    position: fixed; z-index: 60; background: var(--bad-bg); border: 1px solid #e6b8b4;
    border-radius: 9px; padding: 6px 10px; font-size: .84rem; box-shadow: 0 4px 16px rgba(20,40,60,.18);
    display: flex; flex-wrap: wrap; align-items: center; gap: 6px; max-width: min(340px, 92vw);
    animation: toastin .18s ease-out;
  }
  @keyframes toastin { 0% { opacity: 0; transform: translateY(6px); } 100% { opacity: 1; } }

  /* history + done */
  #log { display: flex; flex-direction: column; gap: 6px; max-height: 460px; overflow-y: auto; }
  .entry { border-left: 4px solid var(--line); border-radius: 4px; padding: 5px 9px; background: #fafbfc; font-size: .84rem; }
  .entry.acc { border-left-color: var(--ok); background: var(--ok-bg); }
  .entry.rej { border-left-color: var(--bad); background: var(--bad-bg); }
  .entry .eh { font-weight: 600; }
  .entry .eh .mono { font-weight: 400; color: var(--muted); font-size: .74rem; }
  .entry .efl { font-size: .8rem; margin-top: 1px; }
  .entry ul.egs { margin: 3px 0 0; padding: 0; list-style: none; }
  .entry ul.egs li { font-size: .78rem; margin: 2px 0; display: flex; gap: 6px; align-items: baseline; }
  .entry ul.egs .gb { margin-left: 0; }
  .entry .einv { font-size: .72rem; color: var(--muted); margin-top: 2px; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .done { border: 1px solid var(--line); border-radius: 8px; padding: 6px 9px; margin-top: 6px; font-size: .84rem; }
  .done .dh { display: flex; flex-wrap: wrap; gap: 6px; align-items: baseline; font-weight: 600; }
  .done .dh .tot { margin-left: auto; font-family: ui-monospace, Menlo, Consolas, monospace; }
  .done ul { margin: 2px 0 0; padding-left: 0; list-style: none; font-size: .8rem; }
</style>

<body>
<header>
  <h1>Reactivegas <small class="mono">Types.lean · Step.lean — 15 eventi</small></h1>
  <div id="inv-strip">
    <span class="inv-term"><span class="lbl">Σ casse</span><span class="val" id="inv-casse">0</span></span>
    <span class="inv-op">−</span>
    <span class="inv-term"><span class="lbl">Σ conti</span><span class="val" id="inv-conti">0</span></span>
    <span class="inv-op">−</span>
    <span class="inv-term"><span class="lbl">Σ escrow</span><span class="val" id="inv-escrow">0</span></span>
    <span class="inv-op">=</span>
    <span id="inv-badge" class="ok">0</span>
    <span id="inv-note">avvio</span>
  </div>
  <div class="hbtns">
    <button type="button" class="ghost" id="btn-cf" title="mostra l'effetto di una manomissione fuori macchina — lo stato reale non cambia">contro&#8209;fattuale</button>
    <button type="button" class="ghost danger" id="btn-reset" title="State.init 0">Reset</button>
  </div>
</header>

<div id="statusline"></div>

<main>
  <section class="card" id="scene-card">
    <svg id="scene" viewBox="0 0 760 600" role="group" aria-label="scena del gruppo"></svg>
  </section>
  <aside id="side">
    <div class="card" id="done-card">
      <h2>Acquisti completati <small>solo <span class="mono">closePurchase</span></small></h2>
      <div id="done-body"><p class="empty">nessuno</p></div>
    </div>
    <div class="card" id="history-card">
      <h2>Storia <small>✓ accettati · ✗ respinti</small></h2>
      <div id="log"><p class="empty">nessun tentativo</p></div>
    </div>
  </aside>
</main>

<div id="pop" hidden></div>

<script>
'use strict';
/* =====================================================================
   Machine core: faithful transcription of
   lean/Reactivegas/{Types,State,Step}.lean.
   State: { users:[Nat], responsabili:[Nat],
            conti:[[u,v]], casse:[[u,v]],
            collections:[{id, referente, permitted, accepted:[{user,amount}],
                          pending:[{user,amount}]}] }
   Toy-side decoration (names, purchase labels, snapshots, UI modes) never
   enters machine state or events; UserId/CollId stay numeric inside.
   ===================================================================== */

const FOUNDER = 0;

/* --- Toy-side fixed name/label pools (decoration, outside the machine) -- */

const NAMES = ['Anna', 'Bruno', 'Elena', 'Carlo', 'Dora', 'Enzo',
               'Febe', 'Gaia', 'Hugo', 'Irma', 'Luca', 'Mara'];
const nm = u => NAMES[u] !== undefined ? NAMES[u] : '?';
const PRESETS = ['Olio', 'Vino', 'Farina', 'Caffè', 'Miele', 'Pasta', 'Riso', 'Sale'];
let colLabels = {};                       // CollId -> toy label
const lbl = c => colLabels[c] !== undefined ? colLabels[c] : '?';

/* --- State.lean helpers ------------------------------------------------ */

// State.init r := ⟨[r], [r], [], [], []⟩
function initState(r) {
  return { users: [r], responsabili: [r], conti: [], casse: [], collections: [] };
}

// bal: first matching entry, absent means zero
function bal(m, u) {
  for (const [k, v] of m) if (k === u) return v;
  return 0;
}

// bump: add d to the first entry of u, appending a fresh entry when absent
function bump(m, u, d) {
  const out = [];
  let done = false;
  for (const [k, v] of m) {
    if (!done && k === u) { out.push([k, v + d]); done = true; }
    else out.push([k, v]);
  }
  if (!done) out.push([u, d]);
  return out;
}

function sumBal(m) { return m.reduce((a, [, v]) => a + v, 0); }
function sumPledges(l) { return l.reduce((a, p) => a + p.amount, 0); }
function escrowOf(c) { return sumPledges(c.accepted) + sumPledges(c.pending); }
function escrowSum(cols) { return cols.reduce((a, c) => a + escrowOf(c), 0); }

// splitUser: first pledge of u, and the list without it; null when absent
function splitUser(u, l) {
  const i = l.findIndex(p => p.user === u);
  if (i < 0) return null;
  return [l[i].amount, l.slice(0, i).concat(l.slice(i + 1))];
}

// refundAll: foldl bump
function refundAll(m, l) {
  return l.reduce((acc, p) => bump(acc, p.user, p.amount), m);
}

// pullCollection: the collection with id c, and the list without it
function pullCollection(c, cols) {
  const i = cols.findIndex(x => x.id === c);
  if (i < 0) return null;
  return [cols[i], cols.slice(0, i).concat(cols.slice(i + 1))];
}

// stripCollections: remove collections whose referente is r; collect their
// pledges (accepted ++ pending, in list order) for refunding
function stripCollections(r, cols) {
  const rest = [], ps = [];
  for (const c of cols) {
    if (c.referente === r) { ps.push(...c.accepted, ...c.pending); }
    else rest.push(c);
  }
  return [rest, ps];
}

function isResponsabile(s, u) { return s.responsabili.includes(u); }

/* --- Guard labels (canonical Lean code + toy-side why text) ------------ */

const g = (code, why, law) => ({ code, why, law: law || null });
const AUTH = a => g('isResponsabile s a', `${nm(a)} non è responsabile`, 'AUTH');
const PULL = c => g('pullCollection c = none', `nessuna colletta aperta «${lbl(c)}»`);

/* --- Step.lean: the rejecting transition, with named guards ------------
   attempt(s,e) → {ok:true, state, flow} | {ok:false, failed:[guard]}
   The accept/reject decision is exactly the Lean conjunction; `failed`
   lists every failing guard that is evaluable (guards depending on a
   failed pullCollection/splitUser cannot be evaluated and are skipped). */

function attempt(s, e) {
  const fails = [];
  const need = (cond, guard) => { if (!cond) fails.push(guard); return cond; };
  const rej = () => ({ ok: false, failed: fails });

  switch (e.tag) {

    case 'addUser': {
      need(isResponsabile(s, e.author), AUTH(e.author));
      need(!s.users.includes(e.target),
        g('!s.users.contains u', `${nm(e.target)} è già nel gruppo`));
      if (fails.length) return rej();
      return { ok: true, flow: `${nm(e.target)} entra nel gruppo`,
        state: { ...s, users: [...s.users, e.target] } };
    }

    case 'electResponsabile': {
      need(isResponsabile(s, e.author), AUTH(e.author));
      need(s.users.includes(e.target),
        g('s.users.contains u', `${nm(e.target)} non è nel gruppo`));
      need(!isResponsabile(s, e.target),
        g('!isResponsabile s u', `${nm(e.target)} è già responsabile`));
      if (fails.length) return rej();
      return { ok: true, flow: `★ ${nm(e.target)} è responsabile`,
        state: { ...s, responsabili: [e.target, ...s.responsabili] } };
    }

    case 'removeResponsabile': {
      need(isResponsabile(s, e.author), AUTH(e.author));
      need(isResponsabile(s, e.target),
        g('isResponsabile s u', `${nm(e.target)} non è responsabile`));
      if (fails.length) return rej();
      const [rest, ps] = stripCollections(e.target, s.collections);
      const i = s.responsabili.indexOf(e.target);
      const resps = s.responsabili.slice(0, i).concat(s.responsabili.slice(i + 1));
      const flow = ps.length
        ? `★✕ ${nm(e.target)} · collette chiuse, rimborsi: ` +
          ps.map(p => `conto ${nm(p.user)} +${p.amount}`).join(', ')
        : `★✕ ${nm(e.target)} · nessuna colletta da chiudere`;
      return { ok: true, flow,
        state: { ...s, responsabili: resps, conti: refundAll(s.conti, ps), collections: rest } };
    }

    case 'openPurchase': {
      need(isResponsabile(s, e.author), AUTH(e.author));
      need(!s.collections.some(x => x.id === e.c),
        g('!(s.collections.any (x.id == c))', `colletta «${lbl(e.c)}» già aperta`));
      if (fails.length) return rej();
      return { ok: true,
        flow: `apre «${lbl(e.c)}» — referente ${nm(e.author)}, permesso: no, escrow 0`,
        state: { ...s, collections:
          [{ id: e.c, referente: e.author, permitted: false, accepted: [], pending: [] },
           ...s.collections] } };
    }

    case 'grantPermission': {
      const pulled = pullCollection(e.c, s.collections);
      need(pulled !== null, PULL(e.c));
      need(isResponsabile(s, e.author), AUTH(e.author));
      if (fails.length) return rej();
      const [col, rest] = pulled;
      return { ok: true, flow: `«${lbl(e.c)}»: permesso di chiusura concesso (L2 ✓)`,
        state: { ...s, collections: [{ ...col, permitted: true }, ...rest] } };
    }

    case 'denyPermission': {
      const pulled = pullCollection(e.c, s.collections);
      need(pulled !== null, PULL(e.c));
      need(isResponsabile(s, e.author), AUTH(e.author));
      if (fails.length) return rej();
      const [col, rest] = pulled;
      const ps = [...col.accepted, ...col.pending];
      return { ok: true,
        flow: `«${lbl(e.c)}» negata e chiusa · rimborsi: ` +
          (ps.length ? ps.map(p => `conto ${nm(p.user)} +${p.amount}`).join(', ') : 'nessuno'),
        state: { ...s, conti: refundAll(s.conti, ps), collections: rest } };
    }

    case 'deposit': {
      need(isResponsabile(s, e.author), AUTH(e.author));
      need(s.users.includes(e.user),
        g('s.users.contains u', `${nm(e.user)} non è nel gruppo`));
      need(e.author !== e.user,
        g('a != u', 'autore e utente devono essere diversi'));
      need(0 <= e.v, g('0 ≤ v', `importo negativo (${e.v})`));
      if (fails.length) return rej();
      return { ok: true, flow: `conto ${nm(e.user)} +${e.v} · cassa ${nm(e.author)} +${e.v}`,
        state: { ...s, conti: bump(s.conti, e.user, e.v), casse: bump(s.casse, e.author, e.v) } };
    }

    case 'withdraw': {
      need(isResponsabile(s, e.author), AUTH(e.author));
      need(s.users.includes(e.user),
        g('s.users.contains u', `${nm(e.user)} non è nel gruppo`));
      need(e.author !== e.user,
        g('a != u', 'autore e utente devono essere diversi'));
      need(bal(s.conti, e.user) >= e.v,
        g('bal s.conti u ≥ v',
          `credito insufficiente: conto ${nm(e.user)} = ${bal(s.conti, e.user)} < ${e.v}`,
          'COVERED (L7)'));
      if (fails.length) return rej();
      return { ok: true, flow: `conto ${nm(e.user)} −${e.v} · cassa ${nm(e.author)} −${e.v}`,
        state: { ...s, conti: bump(s.conti, e.user, -e.v), casse: bump(s.casse, e.author, -e.v) } };
    }

    case 'transferCassa': {
      need(isResponsabile(s, e.author), AUTH(e.author));
      need(isResponsabile(s, e.from_),
        g('isResponsabile s f', `${nm(e.from_)} non è responsabile`, 'AUTH'));
      need(e.author !== e.from_,
        g('a != f', 'autore e mittente devono essere diversi'));
      need(e.v > 0, g('v > 0', `l'importo deve essere positivo (${e.v})`));
      if (fails.length) return rej();
      return { ok: true, flow: `cassa ${nm(e.from_)} −${e.v} → cassa ${nm(e.author)} +${e.v}`,
        state: { ...s, casse: bump(bump(s.casse, e.from_, -e.v), e.author, e.v) } };
    }

    case 'pledge': {
      const pulled = pullCollection(e.c, s.collections);
      need(pulled !== null, PULL(e.c));
      need(isResponsabile(s, e.author), AUTH(e.author));
      need(s.users.includes(e.user),
        g('s.users.contains u', `${nm(e.user)} non è nel gruppo`));
      if (pulled) {
        const [col] = pulled;
        need(!col.accepted.some(p => p.user === e.user),
          g('!(col.accepted.any (p.user == u))',
            `${nm(e.user)} ha già un pledge accettato in «${lbl(e.c)}»`, 'L8'));
        need(!col.pending.some(p => p.user === e.user),
          g('!(col.pending.any (p.user == u))',
            `${nm(e.user)} ha già un pledge pendente in «${lbl(e.c)}»`, 'L8'));
      }
      need(0 < e.v, g('0 < v', `il pledge deve essere positivo (${e.v})`, 'COVERED (L7)'));
      need(bal(s.conti, e.user) >= e.v,
        g('bal s.conti u ≥ v',
          `credito insufficiente: conto ${nm(e.user)} = ${bal(s.conti, e.user)} < ${e.v}`,
          'COVERED (L7)'));
      if (fails.length) return rej();
      const [col, rest] = pulled;
      return { ok: true,
        flow: `conto ${nm(e.user)} −${e.v} → escrow «${lbl(e.c)}» (pendente)`,
        state: { ...s, conti: bump(s.conti, e.user, -e.v),
          collections: [{ ...col, pending: [{ user: e.user, amount: e.v }, ...col.pending] },
                        ...rest] } };
    }

    case 'acceptPledge': {
      const pulled = pullCollection(e.c, s.collections);
      need(pulled !== null, PULL(e.c));
      let split = null;
      if (pulled) {
        split = splitUser(e.user, pulled[0].pending);
        need(split !== null,
          g('splitUser u col.pending = none',
            `${nm(e.user)} non ha un pledge pendente in «${lbl(e.c)}»`));
        need(pulled[0].referente === e.author,
          g('col.referente == a',
            `solo il referente (${nm(pulled[0].referente)}) può accettare`, 'REFERENTE'));
      }
      need(isResponsabile(s, e.author), AUTH(e.author));
      if (fails.length) return rej();
      const [col, rest] = pulled;
      const [v, pend2] = split;
      return { ok: true,
        flow: `«${lbl(e.c)}»: pledge di ${nm(e.user)} (${v}) pendente → accettato`,
        state: { ...s, collections:
          [{ ...col, pending: pend2, accepted: [{ user: e.user, amount: v }, ...col.accepted] },
           ...rest] } };
    }

    case 'refusePledge': {
      const pulled = pullCollection(e.c, s.collections);
      need(pulled !== null, PULL(e.c));
      let split = null;
      if (pulled) {
        split = splitUser(e.user, pulled[0].pending);
        need(split !== null,
          g('splitUser u col.pending = none',
            `${nm(e.user)} non ha un pledge pendente in «${lbl(e.c)}»`));
        need(pulled[0].referente === e.author,
          g('col.referente == a',
            `solo il referente (${nm(pulled[0].referente)}) può rifiutare`, 'REFERENTE'));
      }
      need(isResponsabile(s, e.author), AUTH(e.author));
      if (fails.length) return rej();
      const [col, rest] = pulled;
      const [v, pend2] = split;
      return { ok: true,
        flow: `rimborso: escrow «${lbl(e.c)}» −${v} → conto ${nm(e.user)} +${v}`,
        state: { ...s, conti: bump(s.conti, e.user, v),
          collections: [{ ...col, pending: pend2 }, ...rest] } };
    }

    case 'correctPledge': {
      const pulled = pullCollection(e.c, s.collections);
      need(pulled !== null, PULL(e.c));
      let split = null;
      if (pulled) {
        split = splitUser(e.user, pulled[0].accepted);
        need(split !== null,
          g('splitUser u col.accepted = none',
            `${nm(e.user)} non ha un pledge accettato in «${lbl(e.c)}»`));
        need(pulled[0].referente === e.author,
          g('col.referente == a',
            `solo il referente (${nm(pulled[0].referente)}) può correggere`, 'REFERENTE'));
      }
      need(isResponsabile(s, e.author), AUTH(e.author));
      need(0 <= e.v, g("0 ≤ v'", `il nuovo importo non può essere negativo (${e.v})`, 'COVERED (L7)'));
      if (split) {
        const v = split[0];
        need(bal(s.conti, e.user) + (v - e.v) >= 0,
          g("bal s.conti u + (v − v') ≥ 0",
            `il conguaglio manderebbe conto ${nm(e.user)} a ${bal(s.conti, e.user) + (v - e.v)} < 0`,
            'COVERED (L7)'));
      }
      if (fails.length) return rej();
      const [col, rest] = pulled;
      const [v, acc2] = split;
      const d = v - e.v;
      return { ok: true,
        flow: `pledge di ${nm(e.user)}: ${v} → ${e.v} · conto ${nm(e.user)} ` +
          (d >= 0 ? `+${d}` : `${d}`),
        state: { ...s, conti: bump(s.conti, e.user, d),
          collections: [{ ...col, accepted: [{ user: e.user, amount: e.v }, ...acc2] },
                        ...rest] } };
    }

    case 'closePurchase': {
      const pulled = pullCollection(e.c, s.collections);
      need(pulled !== null, PULL(e.c));
      need(isResponsabile(s, e.author), AUTH(e.author));
      if (pulled) {
        const [col] = pulled;
        need(col.referente === e.author,
          g('col.referente == a',
            `solo il referente (${nm(col.referente)}) può chiudere`, 'REFERENTE'));
        need(col.permitted,
          g('col.permitted', 'il gruppo non ha concesso il permesso di chiusura', 'PERMITTED (L2)'));
        need(col.pending.length === 0,
          g('col.pending.isEmpty',
            `restano ${col.pending.length} pledge pendenti`, 'NO-PENDING (L4)'));
      }
      if (fails.length) return rej();
      const [col, rest] = pulled;
      const tot = sumPledges(col.accepted);
      return { ok: true,
        flow: `acquisto «${lbl(e.c)}» chiuso: cassa ${nm(col.referente)} −${tot} · escrow −${tot} (spesi)`,
        state: { ...s, casse: bump(s.casse, col.referente, -tot), collections: rest } };
    }

    case 'failPurchase': {
      const pulled = pullCollection(e.c, s.collections);
      need(pulled !== null, PULL(e.c));
      need(isResponsabile(s, e.author), AUTH(e.author));
      if (pulled) {
        const [col] = pulled;
        need(col.referente === e.author,
          g('col.referente == a',
            `solo il referente (${nm(col.referente)}) può farla fallire`, 'REFERENTE'));
        need(col.pending.length === 0,
          g('col.pending.isEmpty',
            `restano ${col.pending.length} pledge pendenti`, 'NO-PENDING (L4)'));
      }
      if (fails.length) return rej();
      const [col, rest] = pulled;
      const ps = [...col.accepted, ...col.pending];
      return { ok: true,
        flow: `«${lbl(e.c)}» fallita · rimborsi: ` +
          (ps.length ? ps.map(p => `conto ${nm(p.user)} +${p.amount}`).join(', ') : 'nessuno'),
        state: { ...s, conti: refundAll(s.conti, ps), collections: rest } };
    }
  }
  throw new Error('unknown event tag: ' + e.tag);
}

function descr(tag, a) {
  switch (tag) {
    case 'addUser': return `${nm(a.author)} aggiunge ${nm(a.target)}`;
    case 'electResponsabile': return `${nm(a.author)} elegge ${nm(a.target)}`;
    case 'removeResponsabile': return `${nm(a.author)} revoca ${nm(a.target)}`;
    case 'openPurchase': return `${nm(a.author)} apre «${lbl(a.c)}»`;
    case 'grantPermission': return `${nm(a.author)} concede a «${lbl(a.c)}»`;
    case 'denyPermission': return `${nm(a.author)} nega «${lbl(a.c)}»`;
    case 'deposit': return `${nm(a.author)} deposita ${a.v} per ${nm(a.user)}`;
    case 'withdraw': return `${nm(a.author)} preleva ${a.v} per ${nm(a.user)}`;
    case 'transferCassa': return `${nm(a.author)} riceve ${a.v} dalla cassa di ${nm(a.from_)}`;
    case 'pledge': return `${nm(a.author)} impegna ${a.v} di ${nm(a.user)} su «${lbl(a.c)}»`;
    case 'acceptPledge': return `${nm(a.author)} accetta il pledge di ${nm(a.user)} («${lbl(a.c)}»)`;
    case 'refusePledge': return `${nm(a.author)} rifiuta il pledge di ${nm(a.user)} («${lbl(a.c)}»)`;
    case 'correctPledge': return `${nm(a.author)} corregge il pledge di ${nm(a.user)} a ${a.v} («${lbl(a.c)}»)`;
    case 'closePurchase': return `${nm(a.author)} chiude «${lbl(a.c)}»`;
    case 'failPurchase': return `${nm(a.author)} fallisce «${lbl(a.c)}»`;
  }
  return tag;
}

/* --- Attempt driver ------------------------------------------------------ */

function invSnapshot() {
  const sc = sumBal(state.casse), sn = sumBal(state.conti), se = escrowSum(state.collections);
  return { sc, sn, se, v: sc - sn - se };
}

function runAttempt(tag, args, toyLabel) {
  attemptNo += 1;
  if (tag === 'openPurchase' && toyLabel) colLabels[args.c] = toyLabel;
  const res = attempt(state, { tag, ...args });
  const d = descr(tag, args);
  if (res.ok) {
    // toy-side snapshot of a successful close, taken from the pre-state
    if (tag === 'closePurchase') {
      const [col] = pullCollection(args.c, state.collections);
      completed.unshift({ label: lbl(col.id), referente: col.referente,
        contributors: col.accepted.map(p => ({ user: p.user, amount: p.amount })),
        total: sumPledges(col.accepted) });
    }
    state = res.state;
    if (tag === 'openPurchase') collSeq = Math.max(collSeq, args.c + 1);
    history.unshift({ kind: 'acc', tag, args, descr: d, flow: res.flow, inv: invSnapshot() });
    invNote = `dopo .${tag} ✓`;
  } else {
    if (tag === 'openPurchase') delete colLabels[args.c];
    history.unshift({ kind: 'rej', tag, args, descr: d, failed: res.failed, inv: invSnapshot() });
    invNote = `dopo .${tag} ✗ — stato invariato`;
  }
  return res;
}

/* --- Menu construction --------------------------------------------------- */

const resp = u => isResponsabile(state, u);
const othersOf = u => state.users.filter(x => x !== u);
const refCols = u => state.collections.filter(c => c.referente === u);
const inCol = (c, u) => c.accepted.some(p => p.user === u) || c.pending.some(p => p.user === u);
const candidates = () => {
  const out = [];
  for (let i = 0; i < NAMES.length && out.length < 3; i++)
    if (!state.users.includes(i)) out.push(i);
  return out;
};
const B = (badge, note) => ({ badge, note: note || '' });

function closeDisFor(M) {
  const rc = refCols(M);
  if (!rc.length) return B('REFERENTE', 'referente di nessuna colletta');
  if (rc.some(c => c.permitted && !c.pending.length)) return null;
  if (rc.some(c => c.permitted)) return B('NO-PENDING (L4)', 'pledge pendenti da risolvere');
  return B('PERMITTED (L2)', 'serve il permesso del gruppo');
}

function pledgeDisForCol(col) {
  const cand = state.users.filter(u => !inCol(col, u));
  if (!cand.length) return B('L8', 'tutti hanno già un pledge');
  if (!cand.some(u => bal(state.conti, u) >= 1)) return B('COVERED (L7)', 'nessun conto capiente');
  return null;
}

function itemsForMember(M) {
  const A = resp(M) ? null : B('AUTH', 'non è responsabile');
  const cols = state.collections;
  const rc = refCols(M);
  const maxOther = Math.max(0, ...state.users.map(u => bal(state.conti, u)));
  return [
    { tag: 'addUser', pre: { author: M },
      dis: A || (candidates().length ? null : B('—', 'nessun candidato')) },
    { tag: 'electResponsabile', pre: { author: M },
      dis: A || (state.users.some(u => !resp(u)) ? null : B('—', 'tutti già ★')) },
    { tag: 'removeResponsabile', pre: { author: M }, dis: A },
    { tag: 'openPurchase', pre: { author: M }, dis: A },
    { tag: 'grantPermission', pre: { author: M },
      dis: A || (cols.some(c => !c.permitted) ? null
        : B('—', cols.length ? 'già permesso' : 'nessuna colletta')) },
    { tag: 'denyPermission', pre: { author: M },
      dis: A || (cols.length ? null : B('—', 'nessuna colletta')) },
    { tag: 'deposit', pre: { author: M },
      dis: A || (othersOf(M).length ? null : B('—', 'serve un’altra persona')) },
    { tag: 'withdraw', pre: { author: M },
      dis: A || (othersOf(M).length ? null : B('—', 'serve un’altra persona')) },
    { tag: 'transferCassa', pre: { author: M },
      dis: A || (state.responsabili.some(r => r !== M) ? null : B('—', 'nessun’altra cassa')) },
    { tag: 'pledge', pre: { author: M },
      dis: A || (!cols.length ? B('—', 'nessuna colletta')
        : (maxOther >= 1 ? null : B('COVERED (L7)', 'nessun conto capiente'))) },
    { tag: 'acceptPledge', pre: { author: M },
      dis: A || (!rc.length ? B('REFERENTE', 'referente di nessuna colletta')
        : (rc.some(c => c.pending.length) ? null : B('—', 'nessun pledge pendente'))) },
    { tag: 'refusePledge', pre: { author: M },
      dis: A || (!rc.length ? B('REFERENTE', 'referente di nessuna colletta')
        : (rc.some(c => c.pending.length) ? null : B('—', 'nessun pledge pendente'))) },
    { tag: 'correctPledge', pre: { author: M },
      dis: A || (!rc.length ? B('REFERENTE', 'referente di nessuna colletta')
        : (rc.some(c => c.accepted.length) ? null : B('—', 'nessun pledge accettato'))) },
    { tag: 'closePurchase', pre: { author: M }, dis: A || closeDisFor(M) },
    { tag: 'failPurchase', pre: { author: M },
      dis: A || (!rc.length ? B('REFERENTE', 'referente di nessuna colletta')
        : (rc.some(c => !c.pending.length) ? null : B('NO-PENDING (L4)', 'pledge pendenti'))) },
  ];
}

function itemsForGhost(G) {
  return [{ tag: 'addUser', pre: { target: G },
    dis: state.responsabili.length ? null : B('AUTH', 'nessun responsabile') }];
}

function itemsForConto(U) {
  const eligAuthors = state.responsabili.filter(r => r !== U);
  const noA = eligAuthors.length ? null : B('AUTH', 'serve un responsabile diverso');
  const cols = state.collections;
  return [
    { tag: 'deposit', pre: { user: U }, dis: noA },
    { tag: 'withdraw', pre: { user: U }, dis: noA },
    { tag: 'pledge', pre: { user: U },
      dis: !cols.length ? B('—', 'nessuna colletta')
        : (bal(state.conti, U) < 1 ? B('COVERED (L7)', 'conto insufficiente')
        : (cols.some(c => !inCol(c, U)) ? null : B('L8', 'già in ogni colletta'))) },
  ];
}

function itemsForCassa(R) {
  return [
    { tag: 'deposit', pre: { author: R },
      dis: othersOf(R).length ? null : B('—', 'serve un’altra persona') },
    { tag: 'withdraw', pre: { author: R },
      dis: othersOf(R).length ? null : B('—', 'serve un’altra persona') },
    { tag: 'transferCassa', pre: { author: R },
      dis: state.responsabili.some(r => r !== R) ? null : B('—', 'nessun’altra cassa') },
    { tag: 'closePurchase', pre: { author: R }, dis: closeDisFor(R) },
  ];
}

function itemsForPile(c) {
  const col = state.collections.find(x => x.id === c);
  return [
    { tag: 'pledge', pre: { c }, dis: pledgeDisForCol(col) },
    { tag: 'acceptPledge', pre: { c },
      dis: col.pending.length ? null : B('—', 'nessun pledge pendente') },
    { tag: 'refusePledge', pre: { c },
      dis: col.pending.length ? null : B('—', 'nessun pledge pendente') },
    { tag: 'correctPledge', pre: { c },
      dis: col.accepted.length ? null : B('—', 'nessun pledge accettato') },
    { tag: 'grantPermission', pre: { c },
      dis: col.permitted ? B('—', 'già permesso') : null },
    { tag: 'denyPermission', pre: { c }, dis: null },
    { tag: 'closePurchase', pre: { c },
      dis: !col.permitted ? B('PERMITTED (L2)', 'serve il permesso del gruppo')
        : (col.pending.length ? B('NO-PENDING (L4)', 'pledge pendenti da risolvere') : null) },
    { tag: 'failPurchase', pre: { c },
      dis: col.pending.length ? B('NO-PENDING (L4)', 'pledge pendenti da risolvere') : null },
  ];
}

function menuItems(sub) {
  if (sub.type === 'member') return itemsForMember(sub.id);
  if (sub.type === 'ghost') return itemsForGhost(sub.id);
  if (sub.type === 'conto') return itemsForConto(sub.id);
  if (sub.type === 'cassa') return itemsForCassa(sub.id);
  if (sub.type === 'pile') return itemsForPile(sub.id);
  return [];
}

function subTitle(sub) {
  if (sub.type === 'member') return `${nm(sub.id)}${resp(sub.id) ? ' ★' : ''}`;
  if (sub.type === 'ghost') return `${nm(sub.id)} (fuori dal gruppo)`;
  if (sub.type === 'conto') return `conto di ${nm(sub.id)}`;
  if (sub.type === 'cassa') return `cassa di ${nm(sub.id)}`;
  if (sub.type === 'pile') return `colletta «${lbl(sub.id)}»`;
  return '';
}

/* --- Pick eligibility ----------------------------------------------------
   Party choices come from clicking live objects only. A click that the
   machine would reject on an identity guard stays possible (dimmed, with
   its guard badge): the rejecting step function remains the arbiter.
   Amounts are bounded before the attempt (NOTE-001). ------------------- */

function pickSpec(role) {
  const p = ui.params, tag = ui.ev;
  const col = p.c !== undefined ? state.collections.find(x => x.id === p.c) : null;
  const refOps = ['acceptPledge', 'refusePledge', 'correctPledge', 'closePurchase', 'failPurchase'];
  switch (role) {
    case 'author': return { type: 'member', test: m => {
      if ((tag === 'deposit' || tag === 'withdraw') && p.user === m) return { lvl: 'off', badge: 'a ≠ u' };
      if (tag === 'transferCassa' && p.from_ === m) return { lvl: 'off', badge: 'a ≠ f' };
      if (!resp(m)) return { lvl: 'warn', badge: 'AUTH' };
      if (refOps.includes(tag) && col && col.referente !== m)
        return { lvl: 'warn', badge: 'REFERENTE' };
      return { lvl: 'ok' };
    } };
    case 'user': return { type: 'member', test: m => {
      if (p.author === m) return { lvl: 'off', badge: 'a ≠ u' };
      if (tag === 'pledge') {
        if (bal(state.conti, m) < 1) return { lvl: 'off', badge: 'COVERED (L7)' };
        if (col && inCol(col, m)) return { lvl: 'off', badge: 'L8' };
      }
      return { lvl: 'ok' };
    } };
    case 'targetGhost': return { type: 'ghost', test: () => ({ lvl: 'ok' }) };
    case 'targetMember': return { type: 'member', test: m =>
      resp(m) ? { lvl: 'off', badge: 'già ★' } : { lvl: 'ok' } };
    case 'targetResp': return { type: 'member', test: m =>
      resp(m) ? { lvl: 'ok' } : { lvl: 'off', badge: 'non ★' } };
    case 'from': return { type: 'cassa', test: m =>
      p.author === m ? { lvl: 'off', badge: 'a ≠ f' } : { lvl: 'ok' } };
    case 'coll': return { type: 'pile', test: cid => {
      const x = state.collections.find(k => k.id === cid);
      if (tag === 'pledge' && p.user !== undefined && inCol(x, p.user))
        return { lvl: 'off', badge: 'L8' };
      if (tag === 'acceptPledge' || tag === 'refusePledge')
        return x.pending.length ? refWarn(x) : { lvl: 'off', badge: '—' };
      if (tag === 'correctPledge')
        return x.accepted.length ? refWarn(x) : { lvl: 'off', badge: '—' };
      if (tag === 'closePurchase') {
        if (!x.permitted) return { lvl: 'warn', badge: 'PERMITTED (L2)' };
        if (x.pending.length) return { lvl: 'warn', badge: 'NO-PENDING (L4)' };
        return refWarn(x);
      }
      if (tag === 'failPurchase')
        return x.pending.length ? { lvl: 'warn', badge: 'NO-PENDING (L4)' } : refWarn(x);
      return { lvl: 'ok' };
    } };
    case 'pendUser': return { type: 'member', test: m =>
      col && col.pending.some(q => q.user === m) ? { lvl: 'ok' } : { lvl: 'off', badge: '—' } };
    case 'accUser': return { type: 'member', test: m =>
      col && col.accepted.some(q => q.user === m) ? { lvl: 'ok' } : { lvl: 'off', badge: '—' } };
  }
  function refWarn(x) {
    return (p.author !== undefined && x.referente !== p.author)
      ? { lvl: 'warn', badge: 'REFERENTE' } : { lvl: 'ok' };
  }
  return null;
}

/* --- Amount bounds (NOTE-001: values constrained before the attempt) ----- */

const TOYMAX = 500;   // toy-side cap for unbounded-above amounts

function amountSpec(tag, p) {
  switch (tag) {
    case 'deposit':
      return { min: 0, max: TOYMAX, val: 50, what: `deposito per ${nm(p.user)}` };
    case 'withdraw': {
      const b = Math.max(0, bal(state.conti, p.user));
      return { min: 0, max: b, val: Math.min(b, 20), what: `prelievo di ${nm(p.user)} (conto ${b})` };
    }
    case 'transferCassa':
      return { min: 1, max: TOYMAX, val: 50, what: `cassa ${nm(p.from_)} → cassa ${nm(p.author)}` };
    case 'pledge': {
      const b = bal(state.conti, p.user);
      return { min: 1, max: b, val: Math.min(b, 20), what: `pledge di ${nm(p.user)} su «${lbl(p.c)}» (conto ${b})` };
    }
    case 'correctPledge': {
      const col = state.collections.find(x => x.id === p.c);
      const cur = (col.accepted.find(q => q.user === p.user) || { amount: 0 }).amount;
      const mx = cur + Math.max(0, bal(state.conti, p.user));
      return { min: 0, max: mx, val: cur, what: `pledge di ${nm(p.user)}: ora ${cur}` };
    }
  }
  return null;
}

let layout = {};   // element key -> {x, y} in viewBox coordinates

function svgBadge(x, y, txt) {
  const w = txt.length * 6.6 + 10;
  return `<g class="svgb"><rect x="${x - w / 2}" y="${y - 9}" width="${w}" height="17" rx="4"/>` +
    `<text x="${x}" y="${y + 4}">${esc(txt)}</text></g>`;
}

function pickClassAndBadge(type, id) {
  // returns [cssClass, badgeText|null]
  if (cfMode) {
    return (type === 'conto' || type === 'cassa' || type === 'pile')
      ? ['pick-target', null] : ['mut', null];
  }
  if (ui.mode !== 'pick') return ['', null];
  const spec = pickSpec(ui.needs[0]);
  if (!spec) return ['', null];
  if (spec.type !== type) return ['mut', null];
  const t = spec.test(id);
  if (t.lvl === 'ok') return ['pick-target', null];
  if (t.lvl === 'warn') return ['pick-warn', t.badge || null];
  return ['pick-off', t.badge || null];
}

function isSubject(type, id) {
  return ui.subject && ui.subject.type === type && ui.subject.id === id;
}

/* --- FX: coins, floats, flashes ------------------------------------------ */

const SVGNS = 'http://www.w3.org/2000/svg';

function fxLayer() { return $('scene').querySelector('#fx'); }

function fly(fk, tk, txt, delay, pre) {
  delay = delay || 0;
  const f = layout[fk] || (pre && pre[fk]) || layout.world;
  const t = layout[tk] || (pre && pre[tk]) || layout.world;
  const gEl = document.createElementNS(SVGNS, 'g');
  const c = document.createElementNS(SVGNS, 'circle');
  c.setAttribute('class', 'coin'); c.setAttribute('r', '8');
  const tx = document.createElementNS(SVGNS, 'text');
  tx.setAttribute('class', 'cointx'); tx.setAttribute('y', '-13');
  tx.textContent = txt;
  gEl.appendChild(c); gEl.appendChild(tx);
  const start = performance.now() + delay;
  const dur = 700;
  function frame(now) {
    const layer = fxLayer();
    if (!layer) return;
    if (!gEl.parentNode && now >= start - 20) layer.appendChild(gEl);
    const u = Math.min(1, Math.max(0, (now - start) / dur));
    const e = u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    const x = f.x + (t.x - f.x) * e;
    const y = f.y + (t.y - f.y) * e - 46 * Math.sin(Math.PI * u);
    gEl.setAttribute('transform', `translate(${x},${y})`);
    if (u < 1) requestAnimationFrame(frame);
    else gEl.remove();
  }
  requestAnimationFrame(frame);
}

function floatTx(k, txt, color, delay, pre) {
  const p = layout[k] || (pre && pre[k]);
  if (!p) return;
  const tx = document.createElementNS(SVGNS, 'text');
  tx.setAttribute('class', 'floattx');
  tx.setAttribute('fill', color || '#1c7c43');
  tx.textContent = txt;
  const start = performance.now() + (delay || 0);
  const dur = 1000;
  function frame(now) {
    const layer = fxLayer();
    if (!layer) return;
    if (!tx.parentNode && now >= start - 20) layer.appendChild(tx);
    const u = Math.min(1, Math.max(0, (now - start) / dur));
    tx.setAttribute('x', p.x); tx.setAttribute('y', p.y - 20 - 26 * u);
    tx.setAttribute('opacity', String(1 - u * u));
    if (u < 1) requestAnimationFrame(frame);
    else tx.remove();
  }
  requestAnimationFrame(frame);
}

function flashKeys(keys) {
  for (const k of keys) {
    const el = $('scene').querySelector(`[data-key="${k}"]`);
    if (el) el.classList.add('nflash');
  }
}

function playFx(tag, a, preState, pre) {
  const preCol = c => preState.collections.find(x => x.id === c);
  switch (tag) {
    case 'addUser': flashKeys([`member:${a.target}`, `conto:${a.target}`]); break;
    case 'electResponsabile':
      floatTx(`member:${a.target}`, '★', '#b98a1c'); flashKeys([`cassa:${a.target}`]); break;
    case 'removeResponsabile': {
      floatTx(`member:${a.target}`, '★✕', '#b3261e', 0, pre);
      const [, ps] = stripCollections(a.target, preState.collections);
      ps.forEach((p, i) => floatTx(`conto:${p.user}`, `+${p.amount}`, '#1c7c43', 150 + i * 130, pre));
      break;
    }
    case 'openPurchase': flashKeys([`pile:${a.c}`]); break;
    case 'grantPermission': floatTx(`pile:${a.c}`, 'L2 ✓', '#1c7c43'); break;
    case 'denyPermission': {
      const col = preCol(a.c);
      [...col.accepted, ...col.pending].forEach((p, i) =>
        fly(`pile:${a.c}`, `conto:${p.user}`, `+${p.amount}`, i * 140, pre));
      break;
    }
    case 'deposit':
      fly(`member:${a.user}`, `cassa:${a.author}`, String(a.v));
      floatTx(`conto:${a.user}`, `+${a.v}`, '#1c7c43', 250);
      flashKeys([`conto:${a.user}`, `cassa:${a.author}`]);
      break;
    case 'withdraw':
      fly(`cassa:${a.author}`, `member:${a.user}`, String(a.v));
      floatTx(`conto:${a.user}`, `−${a.v}`, '#b3261e', 250);
      flashKeys([`conto:${a.user}`, `cassa:${a.author}`]);
      break;
    case 'transferCassa':
      fly(`cassa:${a.from_}`, `cassa:${a.author}`, String(a.v));
      flashKeys([`cassa:${a.from_}`, `cassa:${a.author}`]);
      break;
    case 'pledge':
      fly(`conto:${a.user}`, `pile:${a.c}`, String(a.v));
      flashKeys([`conto:${a.user}`, `pile:${a.c}`]);
      break;
    case 'acceptPledge':
      floatTx(`pile:${a.c}`, `✓ ${nm(a.user)}`, '#1c7c43'); flashKeys([`pile:${a.c}`]); break;
    case 'refusePledge': {
      const sp = splitUser(a.user, preCol(a.c).pending);
      fly(`pile:${a.c}`, `conto:${a.user}`, `+${sp ? sp[0] : ''}`, 0, pre);
      break;
    }
    case 'correctPledge': {
      const sp = splitUser(a.user, preCol(a.c).accepted);
      const d = (sp ? sp[0] : 0) - a.v;
      if (d > 0) fly(`pile:${a.c}`, `conto:${a.user}`, `+${d}`, 0, pre);
      else if (d < 0) fly(`conto:${a.user}`, `pile:${a.c}`, String(-d), 0, pre);
      else floatTx(`pile:${a.c}`, '=', '#5b6b7b', 0, pre);
      break;
    }
    case 'closePurchase': {
      const tot = sumPledges(preCol(a.c).accepted);
      fly(`pile:${a.c}`, 'world', String(tot), 0, pre);
      fly(`cassa:${preCol(a.c).referente}`, 'world', String(tot), 160, pre);
      flashKeys([`cassa:${preCol(a.c).referente}`]);
      break;
    }
    case 'failPurchase': {
      const col = preCol(a.c);
      [...col.accepted, ...col.pending].forEach((p, i) =>
        fly(`pile:${a.c}`, `conto:${p.user}`, `+${p.amount}`, i * 140, pre));
      break;
    }
  }
}

function toast(html, x, y) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = html;
  document.body.appendChild(t);
  const w = t.offsetWidth, h = t.offsetHeight;
  t.style.left = Math.max(6, Math.min(x - w / 2, innerWidth - w - 6)) + 'px';
  t.style.top = Math.max(6, Math.min(y - h - 16, innerHeight - h - 6)) + 'px';
  setTimeout(() => t.remove(), 3600);
}

/* --- Popover plumbing ----------------------------------------------------- */

function popAt(x, y, html) {
  const pop = $('pop');
  pop.hidden = false;
  pop.innerHTML = `<div class="pbox">${html}</div>`;
  pop.style.left = '0px'; pop.style.top = '0px';
  const box = pop.firstElementChild;
  const w = box.offsetWidth, h = box.offsetHeight;
  pop.style.left = Math.max(6, Math.min(x + 10, innerWidth - w - 8)) + 'px';
  pop.style.top = Math.max(6, Math.min(y + 10, innerHeight - h - 8)) + 'px';
}

function closePop() { const p = $('pop'); p.hidden = true; p.innerHTML = ''; }

/* --- Interaction flow ------------------------------------------------------ */

function cancelAll() {
  ui = { mode: 'idle', subject: null, ev: null, params: {}, needs: [], xy: ui.xy };
  cfMode = false;
  closePop();
  renderScene(); renderStatus();
}

function selectSubject(sub, x, y) {
  ui = { mode: 'menu', subject: sub, ev: null, params: {}, needs: [], xy: [x, y] };
  renderScene(); renderStatus();
  const items = menuItems(sub);
  const html = `<div class="pt">${esc(subTitle(sub))}
      <button type="button" class="xbtn2" data-x="1">✕</button></div>
    <div class="menu">` + items.map((it, i) => it.dis
      ? `<button class="mi" disabled title="${esc(it.dis.note)}"><span>${esc(EV[it.tag].it)}</span>
           <span class="gb${it.dis.badge === '—' ? ' dim' : ''}">${esc(it.dis.badge === '—' ? it.dis.note || '—' : it.dis.badge)}</span></button>`
      : `<button class="mi" data-i="${i}" title=".${it.tag}"><span>${esc(EV[it.tag].it)}</span>
           <span class="tag mono">.${it.tag}</span></button>`).join('') + '</div>';
  popAt(x, y, html);
  $('pop').querySelectorAll('[data-i]').forEach(b =>
    b.addEventListener('click', () => startEvent(items[Number(b.dataset.i)])));
  const xb = $('pop').querySelector('[data-x]');
  if (xb) xb.addEventListener('click', cancelAll);
}

function startEvent(item) {
  closePop();
  const params = { ...item.pre };
  const needs = EV[item.tag].roles.filter(r => params[ROLEKEY[r]] === undefined);
  ui = { mode: 'pick', subject: ui.subject, ev: item.tag, params, needs, xy: ui.xy };
  advance();
}

function advance() {
  while (ui.needs.length && ui.needs[0] === 'label') {
    openLabelPop(); return;
  }
  if (ui.needs.length) { renderScene(); renderStatus(); return; }
  if (EV[ui.ev].amount) { openAmountPop(); return; }
  commitAttempt();
}

function openLabelPop() {
  renderScene(); renderStatus();
  const open = new Set(state.collections.map(c => lbl(c.id)));
  let opts = PRESETS.filter(p => !open.has(p));
  if (!opts.length) opts = PRESETS;
  const html = `<div class="pt">${esc(EV[ui.ev].it)} — etichetta
      <button type="button" class="xbtn2" data-x="1">✕</button></div>
    <div class="chips">` +
    opts.map(p => `<button type="button" class="lchip" data-l="${esc(p)}">${esc(p)}</button>`).join('') +
    `</div><div class="tiny">decorazione toy — il CollId Lean resta un Nat interno</div>`;
  popAt(ui.xy[0], ui.xy[1], html);
  $('pop').querySelectorAll('[data-l]').forEach(b => b.addEventListener('click', () => {
    ui.params._label = b.dataset.l;
    ui.params.c = collSeq;
    ui.needs = ui.needs.filter(r => r !== 'label');
    closePop();
    advance();
  }));
  const xb = $('pop').querySelector('[data-x]');
  if (xb) xb.addEventListener('click', cancelAll);
}

function openAmountPop() {
  renderScene(); renderStatus();
  const sp = amountSpec(ui.ev, ui.params);
  const html = `<div class="pt">${esc(EV[ui.ev].it)} — importo
      <button type="button" class="xbtn2" data-x="1">✕</button></div>
    <div class="tiny">${esc(sp.what)}</div>
    <div class="ar"><span class="mono">${sp.min}</span>
      <input id="am-r" type="range" min="${sp.min}" max="${sp.max}" step="1" value="${sp.val}">
      <span class="mono">${sp.max}</span></div>
    <div class="ar2"><input id="am-n" type="number" min="${sp.min}" max="${sp.max}" step="1"
        inputmode="numeric" value="${sp.val}">
      <button type="button" class="primary" id="am-ok">OK</button></div>`;
  popAt(ui.xy[0], ui.xy[1], html);
  const r = $('am-r'), n = $('am-n'), ok = $('am-ok');
  const valid = () => {
    const v = Number(n.value);
    return Number.isInteger(v) && v >= sp.min && v <= sp.max;
  };
  const sync = () => { ok.disabled = !valid(); n.classList.toggle('badv', !valid()); };
  r.addEventListener('input', () => { n.value = r.value; sync(); });
  n.addEventListener('input', () => { if (valid()) r.value = n.value; sync(); });
  n.addEventListener('change', () => {
    let v = Math.round(Number(n.value));
    if (!Number.isFinite(v)) v = sp.min;
    n.value = String(Math.max(sp.min, Math.min(sp.max, v)));
    r.value = n.value; sync();
  });
  ok.addEventListener('click', () => {
    if (!valid()) return;
    ui.params.v = Number(n.value);
    commitAttempt();
  });
  const xb = $('pop').querySelector('[data-x]');
  if (xb) xb.addEventListener('click', cancelAll);
  sync();
  n.focus();
}

function commitAttempt() {
  closePop();
  const tag = ui.ev;
  const args = {};
  for (const role of EV[tag].roles) {
    const k = ROLEKEY[role];
    if (k !== '_label') args[k] = ui.params[k];
  }
  if (tag === 'openPurchase') args.c = ui.params.c;
  if (EV[tag].amount) args.v = ui.params.v;
  const label = ui.params._label;
  const preState = state;
  const preLayout = { ...layout };
  const [px, py] = ui.xy;
  const res = runAttempt(tag, args, label);
  ui = { mode: 'idle', subject: null, ev: null, params: {}, needs: [], xy: [px, py] };
  renderAll();
  if (res.ok) {
    playFx(tag, args, preState, preLayout);
  } else {
    toast(`<b>✗ ${esc(EV[tag].it)}</b> ` +
      res.failed.map(guardChip).join(' ') +
      ` <span class="tiny">stato invariato</span>`, px, py);
  }
}

/* --- Counterfactual (outside the machine; real state never touched) ------- */

function openCfPop(sub, x, y) {
  const what = sub.type === 'pile' ? `escrow «${lbl(sub.id)}»`
    : `${sub.type} di ${nm(sub.id)}`;
  const html = `<div class="pt">contro-fattuale — ${esc(what)}
      <button type="button" class="xbtn2" data-x="1">✕</button></div>
    <div class="ar"><span class="mono">−100</span>
      <input id="cf-r" type="range" min="-100" max="100" step="1" value="10">
      <span class="mono">100</span></div>
    <div class="ar2"><input id="cf-n" type="number" min="-100" max="100" step="1"
      inputmode="numeric" value="10"></div>
    <div class="cfline" id="cf-line"></div>
    <div class="tiny">fuori macchina · nessun costruttore di <span class="mono">Event</span> lo produce · stato reale intatto</div>`;
  popAt(x, y, html);
  const r = $('cf-r'), n = $('cf-n');
  const upd = () => {
    const d = Math.max(-100, Math.min(100, Math.round(Number(n.value) || 0)));
    let { sc, sn, se } = invSnapshot();
    if (sub.type === 'conto') sn += d;
    else if (sub.type === 'cassa') sc += d;
    else se += d;
    const inv = sc - sn - se;
    $('cf-line').innerHTML = `<span class="mono">${sc} − ${sn} − ${se} =</span>
      <span class="${inv === 0 ? 'z' : 'nz'}">${inv}${inv === 0 ? ' ✓' : ' ✗'}</span>`;
  };
  r.addEventListener('input', () => { n.value = r.value; upd(); });
  n.addEventListener('input', () => { r.value = n.value; upd(); });
  const xb = $('pop').querySelector('[data-x]');
  if (xb) xb.addEventListener('click', cancelAll);
  upd();
}

/* --- Wiring ---------------------------------------------------------------- */

$('scene').addEventListener('click', ev => {
  const gEl = ev.target.closest('[data-obj]');
  const x = ev.clientX, y = ev.clientY;
  if (cfMode) {
    if (gEl && ['conto', 'cassa', 'pile'].includes(gEl.dataset.obj))
      openCfPop({ type: gEl.dataset.obj, id: Number(gEl.dataset.id) }, x, y);
    return;
  }
  if (ui.mode === 'pick') {
    if (!gEl) { cancelAll(); return; }
    const role = ui.needs[0];
    const spec = pickSpec(role);
    if (!spec || gEl.dataset.obj !== spec.type) return;
    const id = Number(gEl.dataset.id);
    const t = spec.test(id);
    if (t.lvl === 'off') return;
    ui.params[ROLEKEY[role]] = id;
    ui.needs = ui.needs.slice(1);
    ui.xy = [x, y];
    advance();
    return;
  }
  closePop();
  if (!gEl) { cancelAll(); return; }
  const type = gEl.dataset.obj, id = Number(gEl.dataset.id);
  selectSubject({ type, id }, x, y);
});

document.addEventListener('keydown', ev => { if (ev.key === 'Escape') cancelAll(); });

$('btn-cf').addEventListener('click', () => {
  cancelAll();
  cfMode = true;
  renderScene(); renderStatus();
});

$('btn-reset').addEventListener('click', () => {
  state = initState(FOUNDER);
  history = [];
  attemptNo = 0;
  collSeq = 1;
  completed = [];
  colLabels = {};
  invNote = 'reset → State.init 0';
  cancelAll();
  renderAll();
});

/* --- Boot ------------------------------------------------------------------ */

renderAll();

// Exposed for scripted verification (harmless in normal use).
window.RG = { attempt, initState, sumBal, escrowSum, bal,
  get state() { return state; }, runAttempt, renderAll: () => renderAll() };

/* --- ?selftest=1: drives the real visible controls, verdict in title ------ */

async function selftest() {
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const expect = (cond, what) => { if (!cond) throw new Error(what); };
  const click = async sel => {
    const el = document.querySelector(sel);
    expect(el, 'elemento mancante: ' + sel);
    const r = el.getBoundingClientRect();
    el.dispatchEvent(new MouseEvent('click', { bubbles: true,
      clientX: r.x + r.width / 2, clientY: r.y + r.height / 2 }));
    await sleep(40);
  };
  const amount = async (v, expMax) => {
    const n = document.getElementById('am-n'), r = document.getElementById('am-r');
    expect(n && r, 'controllo importo assente');
    expect(r.min !== '' && r.max !== '', 'importo senza limiti visibili');
    if (expMax !== undefined)
      expect(Number(r.max) === expMax, `max importo atteso ${expMax}, trovato ${r.max}`);
    n.value = String(v);
    n.dispatchEvent(new Event('input', { bubbles: true }));
    await click('#am-ok');
  };
  const invOk = () =>
    expect(document.getElementById('inv-badge').textContent === '0 ✓', 'invariante non 0');
  const lastEntry = () => document.querySelector('#log .entry');

  expect(document.querySelector('[data-key="member:0"]'), 'fondatrice assente');
  invOk();

  // addUser Bruno ed Elena: candidato → menu → autrice Anna
  for (const gid of [1, 2]) {
    await click(`[data-key="ghost:${gid}"]`);
    await click('#pop [title=".addUser"]');
    await click('[data-key="member:0"]');
    expect(document.querySelector(`[data-key="member:${gid}"]`), 'membro non entrato');
  }
  expect(lastEntry().className.includes('acc'), 'addUser non accettato');

  // elezione di Bruno
  await click('[data-key="member:0"]');
  await click('#pop [title=".electResponsabile"]');
  await click('[data-key="member:1"]');
  expect(document.querySelector('[data-key="member:1"]').classList.contains('noderesp'),
    'Bruno non eletto');

  // evento disabilitato con badge guardia: Elena non è responsabile → AUTH
  await click('[data-key="member:2"]');
  const badges = [...document.querySelectorAll('#pop .mi:disabled .gb')].map(b => b.textContent);
  expect(badges.includes('AUTH'), 'badge AUTH assente sul menu di Elena');
  await click('#scene');

  // deposito 100 per Bruno, autrice Anna; importo limitato e visibile
  await click('[data-key="conto:1"]');
  await click('#pop [title=".deposit"]');
  await click('[data-key="member:0"]');
  await amount(100, 500);
  expect(document.querySelector('[data-key="conto:1"] text').textContent.includes('100'),
    'conto Bruno non aggiornato');
  invOk();

  // Bruno apre «Olio»
  await click('[data-key="member:1"]');
  await click('#pop [title=".openPurchase"]');
  await click('#pop [data-l="Olio"]');
  expect((document.querySelector('[data-key="pile:1"]') || {}).getAttribute &&
    document.querySelector('[data-key="pile:1"]').getAttribute('aria-label').includes('Olio'),
    'colletta «Olio» non visibile');

  // pledge 30 di Bruno su «Olio», autrice Anna; max = conto di Bruno
  await click('[data-key="conto:1"]');
  await click('#pop [title=".pledge"]');
  await click('[data-key="member:0"]');
  await click('[data-key="pile:1"]');
  await amount(30, 100);
  expect(document.querySelector('[data-key="pile:1"] .pamt').textContent === '30',
    'escrow non aggiornato');
  invOk();

  // tentativo respinto: Anna (non referente) prova ad accettare il pledge
  const before = JSON.stringify(state);
  await click('[data-key="pile:1"]');
  await click('#pop [title=".acceptPledge"]');
  await click('[data-key="member:1"]');
  await click('[data-key="member:0"]');
  const en = lastEntry();
  expect(en.className.includes('rej'), 'tentativo non respinto');
  expect([...en.querySelectorAll('.gb')].some(b => b.textContent === 'REFERENTE'),
    'guardia REFERENTE non nominata');
  expect(en.innerText.includes('stato invariato'), 'esito non mostrato');
  expect(JSON.stringify(state) === before, 'stato mutato da un rifiuto');
  invOk();
}

if (/[?&]selftest=1/.test(location.search)) {
  selftest()
    .then(() => { document.title = 'SELFTEST PASS — Reactivegas'; })
    .catch(e => { document.title = 'SELFTEST FAIL — ' + e.message; });
}
