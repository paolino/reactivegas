name: Deploy documentation

on:
  push:
    branches:
      - master
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'economics-simulator.html'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            accept-flake-config = true
      - uses: cachix/cachix-action@v15
        with:
          name: paolino
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
      - name: Build docs
        run: nix --quiet develop --command mkdocs build
      - name: Copy the tracked simulator and bind the bytes
        run: |
          set -euo pipefail
          mkdir -p site/simulator
          cp economics-simulator.html site/simulator/index.html
          src=$(sha256sum economics-simulator.html | cut -d" " -f1)
          dst=$(sha256sum site/simulator/index.html | cut -d" " -f1)
          printf "tracked source sha256 %s\n" "$src"
          printf "copied asset   sha256 %s\n" "$dst"
          test "$src" = "$dst"
          cmp economics-simulator.html site/simulator/index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
