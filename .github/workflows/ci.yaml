name: CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - run: sudo rm -rf /opt&
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            trusted-public-keys = hydra.iohk.io:f/Ea+s+dFdN+3Y/G+FDgSq+a5NEWhJGzdjvKNGv0/EQ= cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
            substituters = https://cache.iog.io https://cache.nixos.org/
            accept-flake-config = true

      - uses: cachix/cachix-action@v15
        with:
          name: paolino
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      # Cheap release-line assertions first: version drift or a mis-wired
      # release workflow should not cost a full build to discover.
      - name: Check the manifest/Cabal version seam
        run: |
          scripts/release/check-release-version \
            .release-please-manifest.json reactivegas.cabal

      - name: Check the release wiring
        run: |
          scripts/release/check-release-wiring
          scripts/release/check-release-wiring --self-test

      # R010: the dev shell is a surface of its own, separate from every
      # packaged Nix output, so it keeps a representative Cabal build.
      - name: Build all
        run: nix --quiet develop --command cabal build all

      - name: Check formatting
        run: |
          # The inner script is single-quoted on purpose: `$hs_files` and the
          # command substitution are expanded by the dev-shell bash, not by the
          # runner shell that launches it.
          # shellcheck disable=SC2016
          nix --quiet develop --command bash -c '
            hs_files=$(find . -name "*.hs" \
              -not -path "./dist-newstyle/*" \
              -not -path "./.direnv/*" \
              -not -name "FileSystem.hs" \
              -not -name "Valuta.hs" \
              -not -path "./Core/Aggiornamento.hs")
            fourmolu -m check $hs_files
          '

      - name: Run hlint
        run: |
          nix --quiet develop --command bash -c '
            find . -name "*.hs" \
              -not -path "./dist-newstyle/*" \
              -not -path "./.direnv/*" \
              -not -name "FileSystem.hs" \
              -not -name "Valuta.hs" \
              -not -path "./Core/Aggiornamento.hs" \
              | xargs hlint
          '

      # S90: the permanent money custody economic suite is part of the
      # committed CI path, the same recipe `just ci` invokes additively.
      - name: Run money custody economic suite
        run: nix --quiet develop --command just economic-test

      # The compiler accepting the Lean proofs is part of the proof trust
      # boundary: reject declared/running toolchain drift before building.
      - name: Check the Lean toolchain contract
        run: nix --quiet develop --command just lean-toolchain-contract

      - name: Build lean specification
        run: nix --quiet develop --command just lean

      # S86: the committed CI path runs corpus verification additively.
      # `just lean` above stays intact (dependency direction, inversion
      # coverage ± negative control, trace agreement, `lake build`).
      - name: Verify corpus emission
        run: nix --quiet develop --command just lean-corpus-verify
